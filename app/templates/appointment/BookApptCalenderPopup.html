
<div class="asc-header-panel p-10 bg-white">
    <div class="form-group">
        <label>{{ 'SELECTDOCTOR' | translate}}</label>
        <ui-select ng-model="selectApptDocObj" theme="bootstrap" on-select="changeApptDoctor(selectApptDocObj)" class="uiselect-custom">
            <ui-select-match placeholder="{{ 'SELECT' | translate}}">{{selectApptDocObj.SecondUserFullName?selectApptDocObj.SecondUserFullName:"Select Doctors"}}</ui-select-match>
            <ui-select-choices repeat="item in ClinicDoctorList | filter: $select.search" null-option="EmptySelect" loose-null>
                <span ng-bind-html="item.SecondUserFullName | highlight: $select.search"></span>
            </ui-select-choices>
        </ui-select>
    </div>
    <div class="dis-flex m-l-auto">
        <button class="btn btn-crm-close" ng-click="ClosePopup();">{{ 'CLOSE' | translate}}</button>
    </div>
</div>

<div class="wrapper" id="new-calenderas">
    <div class="row">
        <div class="col-lg-12">
            <div class="h-scroll" resize ng-style="heightAAD()">
                <div id='calendarFull'></div>
            </div>
        </div>
    </div>
</div>
