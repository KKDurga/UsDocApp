<div class="row">
    <div class="col-lg-12">
        <section class="tile text-shadow">
            <div class="tile-header mb-0">
                <h1>Referral Report</h1>
                <div class="pull-right">
                    <label> Total Records :  <strong>{{ReferrlReportData.count}}</strong> </label>
                </div>
            </div>
            <div class="tile-body">
                <div class="row">
                    <div class="col-lg-12" ng-if="ReferrlReportData.ReferrlReport.length > 0">
                        <div class="table-responsive patient-table">
                            <table class="table patient-listtable mb-0">
                            <thead>
                                <tr>
                                    <th>SNO</th>
                                    <th>Referral Source Name</th>
                                    <th>Branch Name</th>
                                    <th>Referral Count</th>                                    
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="data in ReferrlReportData.ReferrlReport">
                                    <td ng-bind="data.SNO"></td>
                                    <td ng-bind="data.RefSourceName"></td>
                                    <td ng-bind="data.BranchName"></td>
                                    <td ng-bind="data.ReferralCount"></td>
                                </tr>
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
                <!-- /row -->
               
                <div class="row" ng-show="ReferrlReportData.ReferrlReport.length == 0 || ReferrlReportData.ReferrlReport==undefined">
                    <div class="col-lg-12 text-center">
                        <div class="billing-cominsoon">
                            <img src="img/no-data/no-reports.png">
                            <div class="msg">
                                <p class="goback-text">No Referral Reports to display</p>
                                <p class="no-records-txt-line2">
                                    No Referral Reports availble with selected dates !!
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 text-center EH-pagination">
        <uib-pagination total-items="ReferrlReportData.count" max-size="maxSize" class="" boundary-link-numbers="true" rotate="false" ng-model="pagination.currentPage" ng-change="pageChanged(pagination.currentPage,viewtype)" on-select-page="setPage(page)" ng-if="ReferrlReportData.ReferrlReport.length > 0"></uib-pagination>
    </div>
</div>
