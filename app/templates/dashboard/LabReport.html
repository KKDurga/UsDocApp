    <div class="row">
        <div class="col-lg-12">
            <section class="tile text-shadow">
                <div class="tile-header mb-0">
                    <h1>Lab Information</h1>
                    <div class="pull-right">
                        <label> Total Records :  <strong>{{labData.count}}</strong> </label>
                    </div>
                </div>
                <div class="tile-body">
                    <div class="row">
                        <div class="col-lg-12" ng-if="labData.Labreport.length > 0">
                            <div class="table-responsive patient-table">
                                <table class="table patient-listtable">
                                <thead>
                                    <tr>
                                        <th>Branch</th>
                                        <th>Testname</th>
                                        <th>Count</th>

                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="data in labData.Labreport">
                                        <td ng-bind="data.name"></td>
                                        <td ng-bind="data.Testname"></td>
                                        <td ng-bind="data.labCount"></td>

                                    </tr>
                                </tbody>
                            </table>
                            </div>
                        </div>
                    </div>
                    <!-- /row -->

                    <div class="row" ng-show="labData.Labreport.length == 0">
                        <div class="col-lg-12 text-center">
                            <div class="billing-cominsoon">
                                <img src="img/no-data/no-reports.png">
                                <div class="msg">
                                    <p class="goback-text">No reports to display</p>
                                    <p class="no-records-txt-line2">
                                        There is no data to display. Please try changing the time span, clinic or doctor
                                        <br> to view detailed reports.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12 text-right">
            <uib-pagination total-items="labData.count" max-size="maxSize" class="pull-right pagination-sm" boundary-link-numbers="true" rotate="false" ng-model="pagination.currentPage" ng-change="pageChanged(pagination.currentPage,viewtype)" on-select-page="setPage(page)" ng-if="labData.Labreport.length > 0"></uib-pagination>
        </div>
    </div>
