<div class="row">
    <div class="col-lg-12">
        <section class="tile text-shadow">
            <div class="tile-header mb-0">
                <h1>Patient Information</h1>
                <div class="pull-right">
                    <label> Total Records :  <strong>{{patientData.count}}</strong> </label>
                </div>
            </div>
            <div class="tile-body">
                <div class="row">
                    <div class="col-lg-12" ng-if="patientData.PatientDetails.length > 0">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>SNO</th>
                                    <th>ConsultationDate</th>
                                    <th>PatientDisplayId</th>
                                    <th>PatientName</th>
                                    <th>Gender</th>
                                    <th>Age</th>
                                    <th>Contact</th>
                                    <th>Email</th>
                                    <th>DoctorName</th>
                                    <th>Hospital Name</th>

                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="data in patientData.PatientDetails">
                                    <td ng-bind="data.SNO"></td>
                                    <td ng-bind="data.ConsultationDate | date:'dd-MMM-yyyy'"></td>
                                    <td ng-bind="data.PatientDisplayId"></td>
                                    <td ng-bind="data.PatientName"></td>
                                    <td ng-bind="data.Gender"></td>
                                    <td ng-bind="data.Age"></td>
                                    <td ng-bind="data.Contact"></td>
                                    <td ng-bind="data.EmailId"></td>
                                    <td ng-bind="data.DoctorName"></td>
                                    <td ng-bind="data.Hospital"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- /row -->

                <div class="row" ng-show="patientData.PatientDetails.length == 0">
                    <div class="col-lg-12 text-center">
                        <div class="billing-cominsoon">
                            <img src="img/no-data/no-reports.png">
                            <div class="msg">
                                <p class="goback-text">No reports to display</p>
                                <p class="no-records-txt-line2">
                                    There is no data to display. Please try changing the time span, clinic or doctor
                                    <br> to view detailed reports.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 text-right">
        <uib-pagination total-items="patientData.count" max-size="maxSize" class="pull-right pagination-sm" boundary-link-numbers="true" rotate="false" ng-model="pagination.currentPage" ng-change="pageChanged(pagination.currentPage,viewtype)" on-select-page="setPage(page)" ng-if="patientData.PatientDetails.length > 0"></uib-pagination>
    </div>
</div>
