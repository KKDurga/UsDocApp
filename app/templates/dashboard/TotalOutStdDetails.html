<div class="row">
            <div class="col-lg-12">
                <section class="tile text-shadow">
                    <div class="tile-header mb-0">
                        <h1>Outstanding Stats</h1>
                        <div class="pull-right">
                            <label> Total Records :  <strong>{{outstandingData.count}}</strong> </label>
                        </div>
                    </div>
                    <div class="tile-body">
                        <div class="row">
                    <div class="col-lg-12" ng-if="outstandingData.Outstanding.length > 0">
                    <div class="table-responsive patient-table">
                        <table class="table patient-listtable">
                      <thead>
                          <tr>
                              <th>SNO</th>
                              <th>Consultation Date</th>
                              <th>MR No</th>
                              <th>Patient Name</th>
                              <th>Doctor Name</th>
                              <th>Branch Name</th>
                              <th ng-bind="'Outstanding Amount (' + currencyType + ')'"></th>
                          </tr>
                      </thead>
                    <tbody>
                        <tr ng-repeat="data in outstandingData.Outstanding">
                            <!--<td ng-bind="data.SNO"></td>-->
                            <td class="text-center p-l-0 pos-relative">
                                <span class="ptnt-catappt-circle" title="{{data.PatientType}}" style="background: {{data.ColorCode}}"></span>
                                <!--<span class="ptnt-catappt-circle" ng-show="data.PatientTypeId === 1" style="background: #2196F3"></span>
                                <span class="ptnt-catappt-circle" ng-show="data.PatientTypeId === 2" style="background: #4CAF50"></span>
                                <span class="ptnt-catappt-circle" ng-show="data.PatientTypeId === 3" style="background: #E53935"></span>
                                <span class="ptnt-catappt-circle" ng-show="data.PatientTypeId === 4" style="background: #FB8C00"></span>-->
                                <span class="p-l-10">{{data.SNO}}</span>
                            </td>
                            <td ng-bind="data.AppointmentDate | date:'dd-MMMM-yyyy'"></td>
                            <td ng-bind="data.PatientDisplayId"></td>
                            <td ng-bind="data.PatientName"></td>
                            <td ng-bind="data.Doctor"></td>
                            <td ng-bind="data.Branch"></td>
                            <td ng-bind="data.outstanding"></td>
                        </tr>
                  </tbody>
                    <tbody>
                        <tr ng-if="outstandingData.Outstanding.length > 0">
                            <th colspan="4" class="text-right valign-middle" ng-bind="currencyType"></th>
                            <td ng-bind="pagewisetotal | number" class="valign-middle"></td>
                            <!--<td class="text-right"><label>Total: </label> 50.00</td>-->
                        </tr>
                    </tbody>
                </table>
                    </div>
                    </div>
                </div>  
                              <!-- /row -->
                   
                <div class="row" ng-show="outstandingData.Outstanding.length == 0">
                    <div class="col-lg-12 text-center">
                            <div class="billing-cominsoon">
                                <img src="img/no-data/no-reports.png">
                                <div class="msg">
                                    <p class="goback-text">No Outstanding data display</p>
                                    <p class="no-records-txt-line2">                                        
                                        No Outstanding data availble with selected dates !!
                                    </p>
                                </div>
                            </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 text-center EH-pagination">
        <uib-pagination 
        total-items="outstandingData.count" 
        max-size="maxSize" 
        class="" 
        boundary-link-numbers="true" 
        rotate="false" 
        ng-model="pagination.currentPage" 
        ng-change="pageChanged(pagination.currentPage,viewtype)" 
        on-select-page="setPage(page)" 
        ng-if="outstandingData.Outstanding.length > 0"></uib-pagination>
    </div>
    </div>
