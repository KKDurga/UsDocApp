<div class="d__f-- fd__c-- height__100-- p__8-- gap__y--8 bg__FFFFFF--">

    <div class="p__3-- bg__F7981C1A-- border__E4E4E4-- br__4-- mb__10--">
        <table class="table m-0 tableno-bordered tableno-padding table-layout-fix">
            <tbody>
                <tr>

                    <td>
                        <div class="form__group">
                            <label>Date</label>
                            <select ng-model="ODReportsObj.DateRangeId" id="select_od_daterange"
                                    ng-options="item.Id as item.Name for item in (ODSubTab === 'daily' ? DailyReportDateRangeArray : PaymentDateRangeArray)"
                                    ng-change="setODReportDateRange(ODReportsObj.DateRangeId)">
                                <option value="">Select</option>
                            </select>
                        </div>
                    </td>

                    <td ng-if="ODReportsObj.DateRangeId == 11">
                        <div class="form__group">
                            <label>From Date</label>
                            <input placeholder="MM/DD/YYYY"
                                   class="icons-calendar"
                                   ng-model="ODReportsObj.PaymentFromDate"
                                   date-range-one-year="ODReportsObj.PaymentToDate"
                                   readonly>
                        </div>
                    </td>

                    <td ng-if="ODReportsObj.DateRangeId == 11">
                        <div class="form__group">
                            <label>To Date</label>
                            <input placeholder="MM/DD/YYYY"
                                   class="icons-calendar"
                                   ng-model="ODReportsObj.PaymentToDate"
                                   date-range-one-year
                                   readonly>
                        </div>
                    </td>

                    <td width="15%">
                        <div class="form__group">
                            <label>Location</label>
                            <div class="dropdown cstm-dropdown width-100">
                                <button class="form__control text-left pr__20--" id="dropdownMenuODLocation" data-toggle="dropdown" title="{{ODReportsObj.SelectLocationString}}">
                                    {{ODReportsObj.SelectLocationString}}
                                    <i class="icons__w16-- arrowdown__w16--l pos-absolute right__6-- fs-11 top-8"></i>
                                </button>
                                <div class="dropdown-menu dr-drop-app overflow-hidden" role="menu" aria-labelledby="dropdownMenuODLocation" ng-click="stopClosingDropDown($event)">
                                    <div class="p-5">
                                        <input type="text" class="form-control input-sm bg-inputy" placeholder="{{ 'SEARCH' | translate}}" ng-model="searchODLocation.txt1" />
                                    </div>
                                    <div class="drop-menu-Scroll apptsearchdroplist">
                                        <ul>
                                            <li ng-repeat="item in ODReportsObj.AllBranchesList | filter:{'BranchName':searchODLocation.txt1} track by $index">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-od-loc" type="checkbox" ng-model="item.IsChecked" ng-click="changeODReportBranch(item)">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small ng-bind="item.BranchName"></small>
                                                    </label>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>

                    <td width="15%">
                        <div class="form__group ">
                            <label>{{ 'DOCTORS' | translate}}</label>
                            <div class="dropdown cstm-dropdown width-100">
                                <button class="form__control text-left" id="dropdownMenuODDoctor" data-toggle="dropdown" title="{{ODReportsObj.SelectDoctorString}}">
                                    {{ODReportsObj.SelectDoctorString}}
                                    <i class="icons__w16-- arrowdown__w16--l pos-absolute right__6-- fs-11 top-8"></i>
                                </button>
                                <div class="dropdown-menu dr-drop-app right-0 overflow-hidden" role="menu" aria-labelledby="dropdownMenuODDoctor" ng-click="stopClosingDropDown($event)">
                                    <div class="p-5">
                                        <input type="text" class="form-control input-sm bg-inputy" placeholder="{{ 'SEARCH' | translate}}" ng-model="searchODDoctor.txt1" />
                                    </div>
                                    <div class="drop-menu-Scroll apptsearchdroplist">
                                        <ul>
                                            <li class="border-right">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-od-doc" type="checkbox" ng-model="ODReportsObj.AllDoctorCheck" ng-click="ODcheckAllDoctors(ODReportsObj.AllDoctorCheck)">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small>All Doctors</small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li ng-repeat="item in ODReportsObj.AllDoctorList | filter:{'FullName':searchODDoctor.txt1}">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-od-doc" type="checkbox" ng-model="item.isChecked" ng-click="ODDoctorToggle(item);">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small ng-bind="item.SecondUserFullName + '-' + item.NPI"></small>
                                                    </label>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>

                    <td width="15%">
                        <div class="form__group ">
                            <label>{{ 'VISITREASON' | translate}}</label>
                            <div class="dropdown cstm-dropdown width-100">
                                <button class="form__control text-left" id="dropdownMenuODVisitReason" data-toggle="dropdown" title="{{ODReportsObj.SelectVisitReasonString}}">
                                    {{ODReportsObj.SelectVisitReasonString}}
                                    <i class="icons__w16-- arrowdown__w16--l pos-absolute right__6-- fs-11 top-8"></i>
                                </button>
                                <div class="dropdown-menu dr-drop-app right-0 overflow-hidden" role="menu" aria-labelledby="dropdownMenuODVisitReason" ng-click="stopClosingDropDown($event)">
                                    <div class="p-5">
                                        <input type="text" class="form-control input-sm bg-inputy" placeholder="{{ 'SEARCH' | translate}}" ng-model="searchODVisitReason.txt1" />
                                    </div>
                                    <div class="drop-menu-Scroll apptsearchdroplist">
                                        <ul>
                                            <li class="border-right">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-od-vr" type="checkbox" ng-model="ODReportsObj.AllVisitReasonCheck" ng-click="ODcheckAllVisitReasons(ODReportsObj.AllVisitReasonCheck)">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small>All Visit Reasons</small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li ng-repeat="item in ODReportsObj.VisitReasonList | filter:{'Reason':searchODVisitReason.txt1}">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-od-vr" type="checkbox" ng-model="item.isChecked" ng-click="ODVisitReasonToggle(item);">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small ng-bind="item.Reason"></small>
                                                    </label>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>

                    <td>
                        <div class="d__f-- ai__c-- gap__5-- mt__20--">
                            <button class="btn__lg-- btn__2D2D47--f" ng-click="ClickForODFilteredData()">Apply</button>
                            <button class=" b-0" id="btn_od_clear" ng-click="ClearODFilters()">
                                <i class="reload-icon"></i>
                            </button>
                        </div>
                    </td>

                    <td>
                        <div class="d__f-- ai__c-- gap__10--x mt__20-- jc__fe--">
                            <div class="position__relative-- p__2--">
                                <a class="border__1D5558-- p__7-- bradius__4-- bg__F5F5F5-- d__b--" ng-click="ODExcelStatus()" tooltip-placement="top" uib-tooltip="Excel exports">
                                    <i svg-icon="icon__download--" size="14" style="color: #6A7282"></i>
                                </a>
                            </div>
                            <button class="btn__lg-- btn__1d5558--f" ng-click="ClickForODExcelExport()">Export Excel</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="position__relative-- height__100--">
        <div class="p__10-- adjustable-position" id="ODReportGridContainer">

            <div id="ODReportAgGrid" dragScroll
                 class="ag-theme-alpine"
                 style="height:100%;width:100%">
            </div>

        </div>
    </div>

</div>
