     <div class="row">
        <div class="col-lg-12">
            <section class="section-ehnote">
                <div class="ehnote-header dis-flex" style="justify-content: space-between;">
                    <h1>New Patient Report Graph</h1>
                    <button class="btn btn-link text-danger fs-20" ng-click="closeuibPopup()"><i class="fas fa-times"></i></button>
                </div>
                <div class="ehnote-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div fusioncharts
                                 width="100%"
                                 height="500"
                                 type="mscolumn2d"
                                 dataSource="{{NewPatientReportGraphforEachDoctor}}"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
     <div class="table-responsive overflow-x-scroll" >
         <table class="table table-bordered m-b-0">
             <thead>
                 <tr>
                     <th width="28%"><b>Doctor Name</b></th>
                     <th width="5%"><b>Exp Max</b></th>
                     <th ng-repeat="Dates in Datecontainer | limitTo : 31"><b>{{Dates | date:'MM/dd'}}</b></th>
                 </tr>
             </thead>
             <tbody ng-repeat="item in NewPatientDashBoardReport">
                 <tr class="border-row">
                     <td>
                         <span> {{item.DoctorName}}</span>
                     </td>
                     <td>
                         <span> {{item.ExpectedMaximum != null ?item.ExpectedMaximum:'NA'}}</span>
                     </td>
                     <td ng-repeat="ApptCount in item.AppointmentDatesList track by $index">
                         <span> {{ApptCount.AppointmentCount}}</span>
                     </td>
                 </tr>
             </tbody>
         </table>
     </div>
