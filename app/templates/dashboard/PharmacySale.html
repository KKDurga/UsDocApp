<div class="row">
    <div class="col-lg-12">
        <section class="tile text-shadow">
            <div class="tile-header mb-0">
                <h1>Pharmacy Sale</h1>
                <div class="pull-right">
                    <label> Total Records :  <strong>{{PharmacySaleData.count}}</strong> </label>
                </div>
            </div>
            <div class="tile-body">
                <div class="row">
                    <div class="col-lg-12" ng-if="PharmacySaleData.PharmacySale.length > 0">
                        <div class="table-responsive patient-table">
                            <table class="table patient-listtable mb-0">
                                <thead>
                                    <tr>
                                        <th>MR NO</th>
                                        <th>PATIENT NAME</th>
                                        <th>BRANCH NAME</th>
                                        <th>TotalAmount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="data in PharmacySaleData.PharmacySale">
                                        <td ng-if="data.PatientDisplayId==''">OutPatient</td>
                                        <td ng-if="data.PatientDisplayId!=''">{{data.PatientDisplayId}}</td>
                                        <td ng-bind="data.PatientName"></td>
                                        <td ng-bind="data.Branch"></td>
                                        <td ng-bind="data.TotalAmount"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <!-- /row -->
                <div class="row" ng-show="PharmacySaleData.PharmacySale.length == 0 || PharmacySaleData.PharmacySale == undefined">
                    <div class="col-lg-12 text-center">
                        <div class="billing-cominsoon">
                            <img src="img/no-data/no-reports.png">
                            <div class="msg">
                                <p class="goback-text">No Pharmacy Sale to display</p>
                                <p class="no-records-txt-line2">
                                    No Pharmacy Sale  availble with selected dates !!
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 text-center EH-pagination">
        <uib-pagination total-items="PharmacySaleData.count" max-size="maxSize" class="" boundary-link-numbers="true" rotate="false" ng-model="pagination.currentPage" ng-change="pageChanged(pagination.currentPage,viewtype)" on-select-page="setPage(page)" ng-if="PharmacySaleData.PharmacySale.length > 0"></uib-pagination>
    </div>
</div>
