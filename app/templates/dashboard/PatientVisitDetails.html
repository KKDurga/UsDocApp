<div class="row">
    <div class="col-lg-12">
        <section class="tile text-shadow">
            <div class="tile-header mb-0">
                <h1>Patient Stats</h1>
                <ul class="controls">
                    <li>
                        <label>Total Patient Visited :</label>
                        <strong> <span ng-bind="patientVisitData.count"></span></strong>
                    </li>
                </ul>
            </div>
            <div class="tile-body">
                <div class="row">
                    <div class="col-lg-12" ng-show="patientVisitData.PatientVisits.length > 0">
                        <div class="table-responsive patient-table">
                            <table class="table patient-listtable mb-0">
                                <thead>
                                    <tr>
                                        <th>SNO</th>
                                        <th>Consultation Date</th>
                                        <th>MR No</th>
                                        <th>Patient Name</th>
                                        <th>Gender</th>
                                        <th>DOB</th>
                                        <th>Doctor Name</th>
                                        <th>Branch Name</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="data in patientVisitData.PatientVisits">
                                        <td ng-bind="data.SNO"></td>
                                        <td ng-bind="data.ConsultationDate | date:'dd-MMM-yyyy'"></td>
                                        <td ng-bind="data.PatientDisplayId"></td>
                                        <td ng-bind="data.PatientName"></td>
                                        <td ng-bind="(data.Sex == 'Male')?'Male':'Female'"></td>
                                        <td ng-bind="data.DOB | date:'dd-MMM-yyyy'"></td>
                                        <td ng-bind="data.DoctorName"></td>
                                        <td ng-bind="data.Branch"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <!-- /row -->

                <div class="row" ng-show="patientVisitData.PatientVisits.length == 0">
                    <div class="col-lg-12 text-center">
                        <div class="billing-cominsoon">
                            <img src="img/no-data/no-reports.png">
                            <div class="msg">
                                <p class="goback-text">No Patient Stats to display</p>
                                <p class="no-records-txt-line2">
                                    No Patient Stats availble with selected dates !!
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 text-center EH-pagination">
        <uib-pagination total-items="patientVisitData.count" max-size="maxSize" class="" boundary-link-numbers="true" rotate="false" ng-model="pagination.currentPage" ng-change="pageChanged(pagination.currentPage,viewtype)" on-select-page="setPage(page)" ng-if="patientVisitData.PatientVisits.length > 0"></uib-pagination>
    </div>
</div>
