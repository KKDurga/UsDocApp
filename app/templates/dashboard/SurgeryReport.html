<div class="row">
    <div class="col-lg-12">
        <section class="tile text-shadow">
            <div class="tile-header mb-0">
                <h1>Paid Followup Report</h1>
                <div class="pull-right">
                    <label> Total Records :  <strong>{{SurgeryReportData.count}}</strong> </label>
                </div>
            </div>
            <div class="tile-body">
                <div class="row">
                    <div class="col-lg-12" ng-if="SurgeryReportData.SurgeryReport.length > 0">
                        <div class="table-responsive patient-table">
                            <table class="table patient-listtable mb-0">
                            <thead>
                                <tr>
                                    <th>Appointment Date</th>
                                    <th>MR No</th>
                                    <th>Appointment Time</th>
                                    <th>Doctor Name</th>
                                    <th>Patient Name</th>
                                    <th>Branch Name</th>
                                    <th>Appointment Type</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="data in SurgeryReportData.SurgeryReport">
                                    <td ng-bind="data.AppointmentDate | date:'dd-MMM-yyyy'"></td>
                                    <td ng-bind="data.PatientDisplayId"></td>
                                    <td ng-bind="data.AppointmentStartTime"></td>
                                    <td ng-bind="data.DoctorName"></td>
                                    <td ng-bind="data.PatientName"></td>
                                    <td ng-bind="data.Branch"></td>
                                    <td ng-bind="data.AppointmentType"></td>
                                    <td ng-bind="data.Status"></td>
                                </tr>
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
                <!-- /row -->
                <div class="row" ng-show="SurgeryReportData.SurgeryReport.length == 0||SurgeryReportData.SurgeryReport == undefined">
                    <div class="col-lg-12 text-center">
                        <div class="billing-cominsoon">
                            <img src="img/no-data/no-reports.png">
                            <div class="msg">
                                <p class="goback-text">No Surgery Report display</p>
                                <p class="no-records-txt-line2">
                                    No Surgery Report availble with selected dates !!
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 text-center EH-pagination">
        <uib-pagination total-items="SurgeryReportData.count" max-size="maxSize" class="" boundary-link-numbers="true" rotate="false" ng-model="pagination.currentPage" ng-change="pageChanged(pagination.currentPage,viewtype)" on-select-page="setPage(page)" ng-if="SurgeryReportData.SurgeryReport.length > 0"></uib-pagination>
    </div>
</div>
