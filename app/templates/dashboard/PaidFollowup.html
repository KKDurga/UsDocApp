<div class="row">
    <div class="col-lg-12">
        <section class="tile text-shadow">
            <div class="tile-header mb-0">
                <h1>Paid Followup</h1>
                <ul class="controls">
                    <li>
                        <label>Total Paid Followup :</label>
                        <strong> <span ng-bind="PaidFollowupAppointmentsData.count"></span></strong>
                    </li>
                </ul>
            </div>
            <div class="tile-body">
                <div class="row">
                    <div class="col-lg-12" ng-show="PaidFollowupAppointmentsData.PaidFollowupAppointments.length > 0">
                        <div class="table-responsive patient-table">
                            <table class="table patient-listtable mb-0">
                                <thead>
                                    <tr>
                                        <th>SNO</th>
                                        <th>APPOINTMENT DATE</th>
                                        <th>MR No</th>
                                        <th>APPOINTMENT TIME</th>
                                        <th>PATIENT NAME</th>
                                        <th>DOCTOR NAME</th>
                                        <th>BRANCH NAME</th>
                                        <th>APPOINTMENT TYPE</th>
                                        <th>Category</th>
                                        <th>STATUS</th>
                                    </tr>
                                </thead>
                                <tbody>                          
                                    <tr ng-repeat="data in PaidFollowupAppointmentsData.PaidFollowupAppointments">
                                        <!--<td ng-bind="data.SNO"></td>-->
                                        <td class="text-center p-l-0 pos-relative">
                                            <span class="ptnt-catappt-circle" ng-show="data.PatientTypeId === 1" style="background: #2196F3"></span>
                                            <span class="ptnt-catappt-circle" ng-show="data.PatientTypeId === 2" style="background: #4CAF50"></span>
                                            <span class="ptnt-catappt-circle" ng-show="data.PatientTypeId === 3" style="background: #E53935"></span>
                                            <span class="ptnt-catappt-circle" ng-show="data.PatientTypeId === 4" style="background: #FB8C00"></span>
                                            <span class="p-l-10">{{data.SNO}}</span>
                                        </td>
                                        <td ng-bind="data.AppointmentDate | date:'dd-MMM-yyyy'"></td>
                                        <td ng-bind="data.PatientDisplayId"></td>
                                        <td ng-bind="data.AppointmentStartTime"></td>
                                        <td ng-bind="data.PatientName"></td>
                                        <td ng-bind="data.DoctorName"></td>
                                        <td ng-bind="data.Branch"></td>
                                        <td ng-bind="data.AppointmentType"></td>
                                        <td ng-bind="data.PatientTypeName"></td>
                                        <td ng-bind="data.Status"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <!-- /row -->

                <div class="row" ng-show="PaidFollowupAppointmentsData.PaidFollowupAppointments.length == 0">
                    <div class="col-lg-12 text-center">
                        <div class="billing-cominsoon">
                            <img src="img/no-data/no-reports.png">
                            <div class="msg">
                                <p class="goback-text">No Paid Followup Stats to display</p>
                                <p class="no-records-txt-line2">
                                    No Paid Followup Stats availble with selected dates !!
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 text-center EH-pagination">
        <uib-pagination total-items="PaidFollowupAppointmentsData.count" max-size="maxSize" class="" boundary-link-numbers="true" rotate="false" ng-model="pagination.currentPage" ng-change="pageChanged(pagination.currentPage,viewtype)" on-select-page="setPage(page)" ng-if="PaidFollowupAppointmentsData.PaidFollowupAppointments.length > 0"></uib-pagination>
    </div>
</div>
