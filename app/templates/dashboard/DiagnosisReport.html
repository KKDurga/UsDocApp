<div class="row">
    <div class="col-lg-12">
        <section class="tile text-shadow">
            <div class="tile-header mb-0">
                <h1>Diagnosis Report</h1>
                <div class="pull-right">
                    <label> Total Records :  <strong>{{DiagnosisReportData.count}}</strong> </label>
                </div>
            </div>
            <div class="tile-body">
                <div class="row">
                    <div class="col-lg-12" ng-if="DiagnosisReportData.DiagnosisReport.length > 0">
                        <div class="table-responsive patient-table">
                            <table class="table patient-listtable mb-0">
                            <thead>
                                <tr>
                                    <th>SNO</th>
                                    <th>Diagnosis Name</th>
                                    <th>Branch Name</th>
                                    <th>Diagnosis Count</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="data in DiagnosisReportData.DiagnosisReport">
                                    <td ng-bind="data.SNO"></td>
                                    <td ng-bind="data.TemplateTitle"></td>
                                    <td ng-bind="data.Name"></td>
                                    <td ng-bind="data.DiagnosisCount"></td>
                                </tr>
                            </tbody>
                        </table>
                        </div>                        
                    </div>
                </div>
                <!-- /row -->                
                <div class="row" ng-show="DiagnosisReportData.DiagnosisReport.length == 0||DiagnosisReportData.DiagnosisReport == undefined">
                    <div class="col-lg-12 text-center">
                        <div class="billing-cominsoon">
                            <img src="img/no-data/no-reports.png">
                            <div class="msg">
                                <p class="goback-text">No Diagnosis Report to display</p>
                                <p class="no-records-txt-line2">
                                    No Diagnosis Report availble with selected dates !!
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 text-center EH-pagination">
        <uib-pagination total-items="DiagnosisReportData.count" max-size="maxSize" class="" boundary-link-numbers="true" rotate="false" ng-model="pagination.currentPage" ng-change="pageChanged(pagination.currentPage,viewtype)" on-select-page="setPage(page)" ng-if="DiagnosisReportData.DiagnosisReport.length > 0"></uib-pagination>
    </div>
</div>
