    <div class="row">
        <div class="col-lg-12">
            <section class="tile text-shadow">
                <div class="tile-header mb-0">
                    <h1>Treatment Information</h1>
                    <div class="pull-right">
                        <label> Total Records :  <strong>{{treatmentRevenueData.count}}</strong> </label>
                    </div>
                </div>
                <div class="tile-body">
                    <div class="row">
                    <div class="col-lg-12 p-0" ng-if="treatmentRevenueData.TreatmentRevenue.length > 0">
                            <div class="table-responsive patient-table">
                                <table class="table patient-listtable">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Patient Name</th>
                                        <th>GST No</th>
                                        <th>Treatment Name</th>
                                        <th>Procedure Cost</th>
                                        <th>Units</th>
                                        <th>CGST(%)</th>
                                        <th>SGST(%)</th>
                                        <th>Tax Amount</th>
                                        <th>Discout Amount</th>
                                        <th>Total Amount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="data in treatmentRevenueData.TreatmentRevenue">
                                        <td ng-bind="data.AppointmentDate | date:'dd-MMM-yyyy'"></td>
                                        <td ng-bind="data.FirstName"></td>
                                        <td ng-bind="data.PatientGSTNo"></td>
                                        <td ng-bind="data.TreatmentName"></td>
                                        <!--<td ng-bind="data.ProcedureCost"></td>-->
                                        <td>
                                            <div class="text-left">
                                                <span ng-bind="data.ProcedureCost"></span>
                                            </div>
                                        </td>
                                        <td ng-bind="data.Multiplyfactor"></td>
                                        <!--<td ng-bind="data.Cgst"></td>
                                        <td ng-bind="data.Sgst"></td>
                                        <td ng-bind="data.Tax |number"></td>
                                        <td ng-bind="data.DiscountAmount"></td>
                                        <td ng-bind="data.Total"></td>-->
                                        <td>
                                            <div class="text-left">
                                                <span ng-bind="data.Cgst"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="text-left">
                                                <span ng-bind="data.Sgst"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="text-left">
                                                <span ng-bind="data.Tax"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="text-left">
                                                <span ng-bind="data.DiscountAmount"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="text-left">
                                                <span ng-bind="data.Total"></span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                                <tbody>
                                    <tr ng-if="treatmentRevenueData.TreatmentRevenue.length > 0">
                                        <th colspan="10" class="text-right" ng-bind="currencyType"></th>
                                        <td ng-bind="pagewisetotal"></td>
                                        <!--<td class="text-right"><label>Total: </label> 50.00</td>-->
                                    </tr>
                                </tbody>
                            </table>
                            </div>
                        </div>
                    </div>
                    <!-- /row -->

                    <div class="row" ng-show="treatmentRevenueData.TreatmentRevenue.length == 0">
                        <div class="col-lg-12 text-center">
                            <div class="">
                                <div class="billing-cominsoon">
                                    <img src="img/no-data/no-reports.png">
                                    <div class="msg">
                                        <p class="goback-text">No reports to display</p>
                                        <p class="no-records-txt-line2">
                                            There is no data to display. Please try changing the time span, clinic or doctor
                                            <br> to view detailed reports.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12 text-right">
            <uib-pagination total-items="treatmentRevenueData.count" max-size="maxSize" class="pull-right pagination-sm" boundary-link-numbers="true" rotate="false" ng-model="pagination.currentPage" ng-change="pageChanged(pagination.currentPage,viewtype)" on-select-page="setPage(page)" ng-if="treatmentRevenueData.TreatmentRevenue.length > 0"></uib-pagination>
        </div>
    </div>
