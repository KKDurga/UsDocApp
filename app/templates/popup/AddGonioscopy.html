
    <div class="modal-header">
        <h4 class="modal-title">Add Gonioscopy</h4>
        <button type="button" class="btn btn-link" ng-click="cancel()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
        <div class="row">
            <div class="col-lg-12">
                <div class="form-group text-left">
                    <label>Gonioscopy Value<span class="error">*</span></label>
                    <input type="text" ng-model="GonioscopeObj.Name" class="form-control" maxlength="8" />
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-danger p-l-25 p-r-25" type="button" ng-click="cancel()">Close</button>
        <button class="btn btn-success p-l-50 p-r-50" ng-click="SaveGonioscopy(GonioscopeObj.Name)" ng-disabled="">Add</button>
    </div>
