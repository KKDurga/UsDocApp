    <div class="modal-header">
        <h4 class="modal-title">Upload Files</h4>
        <button type="button" class="btn btn-link" ng-click="closeUploadFilesnewquickconslt()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
        <div class="row">
            <fieldset class="text-left m-l-15 m-b-5">
                <span>
                    <input type="radio" class="radio-custom" id="gfile" name="SelectedFile" value=1 ng-model="SelectedFile" required />
                    <label for="gfile" class="radio-custom-label cur-poiter mb-0">General</label>
                </span>
                <span>
                    <input type="radio" class="radio-custom" id="prefile" name="SelectedFile" value=2 ng-model="SelectedFile" required />
                    <label for="prefile" class="radio-custom-label cur-poiter mb-0">Pre Treatment</label>
                </span>
                <span>
                    <input type="radio" class="radio-custom" id="postfile" name="SelectedFile" value=3 ng-model="SelectedFile" required />
                    <label for="postfile" class="radio-custom-label cur-poiter mb-0">Post Treatment</label>
                </span>
                <!--<span>
                    <input type="radio" class="radio-custom" id="postfile" name="SelectedFile" value=4 />
                    <label for="postfile" class="radio-custom-label cur-poiter mb-0">Investigations</label>
                </span>-->
            </fieldset>
        </div>
        <div class="row">
            <div class="col-lg-9">
                <div class="file-upload">
                    <div class="file-select">
                        <div class="file-select-button" id="fileName">Choose File</div>
                        <div class="file-select-name" id="noFile">No file chosen...</div>
                        <!--<input type="file" name="chooseFile" id="chooseFile">-->
                        <input type="file" name="upload" class="upload"
                               ngf-select="onSelectFilesUpload($files)"
                               ngf-pattern="'image/*,application/pdf'"
                               ngf-accept="'image/*,application/pdf'"
                               id="chooseFile"
                               multiple="multiple"
                               title="Choose a file to upload">
                    </div>
                </div>
                <span style="display: block;">Upload only .png, .jpg, .jpeg, .pdf files &amp; Max individual file size : 5 mb</span>
            </div>
            <div class="col-lg-3">
                <button type="button" class="btn btn-primary-green btn-block" style="height: 26px; border-radius:0;" ng-click="fileUploadMain(SelectedFile)">Upload</button>
            </div>
        </div>
        <!-- /row -->
        <div class="panel m-t-10 panel-ehnote" ng-if="generalPdfUploads.length > 0 || generalImgUploads.length > 0 ">
            <div class="panel-heading">

            <div class="panel-body">

                    <div class="col-lg-12">
                        <div class="table-responsive">
                            <table class="table table-consultation" image-viewer isarraychanged="PreTreatmentArrayChangedCount">
                                <tbody ng-repeat="genimgitem in generalImgUploads">
                                    <tr>
                                        <td class="cover-fileimg">
                                            <img ng-src="{{genimgitem.DocURL}}" class="img-thumbnail" width="50" height="50" />
                                        </td>
                                        <td width="80%">
                                            <label ng-bind="genimgitem.docNameDisplay"></label>
                                            <p class="mb-0" ng-hide="genimgitem.IsRemarksinEdit" ng-bind="genimgitem.Remarks">

                                            </p>
                                        </td>
                                        <td width="10%" class="text-right p-t-0 p-b-0 action-icons">
                                            <a href="javascript:void(0);" ng-click="genimgitem.IsRemarksinEdit = !genimgitem.IsRemarksinEdit;focusFileUpload('genimgitem',$index)">
                                                <i class="edit-action"></i>
                                            </a>
                                            <a href="javascript:void(0);" ng-click="PreDeleteUploadFile(genimgitem,2)">
                                                <i class="delete-action"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr ng-show="genimgitem.IsRemarksinEdit">
                                        <td colspan="3">
                                            <div class="dis-flex">

                                                </div>
                                                <div class="width-20">

                                                </div>
                                            </div>
                                        </td>
                                    </tr>

                                </tbody>

                                <tbody ng-repeat="genpdfitem in generalPdfUploads">
                                    <tr>

                                        </td>
                                        <td width="80%">
                                            <label ng-bind="genpdfitem.docNameDisplay">

                                            <p class="mb-0" ng-hide="genpdfitem.IsRemarksinEdit" ng-bind="genpdfitem.Remarks">

                                            </p>

                                                <div class="width-20">

                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
