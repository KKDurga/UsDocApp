
    <div class="modal-body">
        <div class="row">
            <div class="col-lg-12">
                <div class="well well-sm bg-success"> <h3 class="m-t-0">Create customised consultation Template:</h3>Please choose the option you frequently use for consultation below</div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-5">
                <div class="form-group">
                    <label>Template Name</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Template Name"
                           ng-model="obj.TemplateName" />
                </div>
            </div>
            <div class="col-lg-4 m-t-25">
                <div class="checkbox cn">
                    <label>
                        <input name="checkbox-11" type="checkbox" ng-model="obj.IssetasDefaultTemplete">
                        <span class="checkbox-material">
                            <span class="check"></span>
                        </span>
                        <small>Set as Default Templete</small>
                    </label>
                </div>
            </div>
            <div class="col-lg-3" ng-show="obj.IssetasDefaultTemplete ===false && TemplateId !==0">
                <button class="btn btn-danger" ng-click="DeleteDefaultTemplate()"><i class="fas fa-trash-alt"></i> Delete Template</button>
                <small class="fs-10 dis-block">Please make sure template will delete permanently</small>
            </div>
        </div>
        <div class="row" ng-if="cacheStorageItem.DefaultTemplateArray.length>0">
            <div class="col-lg-12" ng-repeat="mitem in cacheStorageItem.DefaultTemplateArray" ng-if="mitem.CategoryId===1 || mitem.CategoryId===2">
                <div class="panel panel-ehnote" ng-if="mitem.CategoryId===1">
                    <div class="panel-heading">{{mitem.CategoryName}}</div>
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-lg-12">
                                <ul class="new-consul-seletempl">
                                    <li>
                                        <div class="checkbox cn">
                                            <label>
                                                <input name="checkbox-11" type="checkbox" ng-change="CheckCategory(mitem)" ng-model="mitem.IsCategoryChecked">
                                                <span class="checkbox-material">
                                                    <span class="check"></span>
                                                </span>
                                                <small>Select All</small>
                                            </label>
                                        </div>
                                    </li>
                                    <li ng-repeat="nitem in mitem.CategoryDetails">
                                        <div class="checkbox cn">
                                            <label>
                                                <input name="checkbox-1" type="checkbox" ng-change="CheckSubCategory(mitem,nitem)" ng-model="nitem.IsSubCategoryChecked">
                                                <span class="checkbox-material">
                                                    <span class="check"></span>
                                                </span>
                                                <small>{{nitem.SubCategoryName}}</small>
                                            </label>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="panel panel-ehnote" ng-if="mitem.CategoryId===2">
                    <div class="panel-heading">{{mitem.CategoryName}}</div>
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-lg-12">
                                <ul class="new-consul-seletempl">
                                    <li>
                                        <div class="checkbox cn">
                                            <label>
                                                <input name="checkbox-11" type="checkbox" ng-change="CheckCategory(mitem)" ng-model="mitem.IsCategoryChecked">
                                                <span class="checkbox-material">
                                                    <span class="check"></span>
                                                </span>
                                                <small>Select All</small>
                                            </label>
                                        </div>
                                    </li>
                                    <li ng-repeat="nitem in mitem.CategoryDetails">
                                        <div class="checkbox cn">
                                            <label>
                                                <input name="checkbox-1" type="checkbox" ng-change="CheckSubCategory(mitem,nitem)" ng-model="nitem.IsSubCategoryChecked">
                                                <span class="checkbox-material">
                                                    <span class="check"></span>
                                                </span>
                                                <small>{{nitem.SubCategoryName}}</small>
                                            </label>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- / -->
            <div class="col-lg-12" ng-repeat="mitem in cacheStorageItem.DefaultTemplateArray" ng-if="mitem.CategoryId===3">
                <div class="panel panel-ehnote" ng-if="mitem.CategoryId===3">
                    <div class="panel-heading">{{mitem.CategoryName}}</div>

                        <ul class="new-consul-seletempl">

                                <div class="checkbox cn">

                            </li>
                            <li ng-repeat="nitem in mitem.CategoryDetails | orderBy : 'Id'">
                                <div class="checkbox cn">
                                    <label>
                                        <input name="checkbox-1" type="checkbox" ng-change="CheckSubCategory(mitem,nitem)" ng-model="nitem.IsSubCategoryChecked">

                                        </span>
                                        <small>{{nitem.SubCategoryName}}</small>

                    <div class="col-lg-12" ng-repeat="nitem in mitem.CategoryDetails">
                        <div class="panel panel-ehnote">
                            <div class="panel-heading">{{nitem.SubCategoryName}}</div>
                            <div class="panel-body">
                                <ul class="new-consul-seletempl" ng-if="nitem.SubCategoryId===22 || nitem.SubCategoryId===23 || nitem.SubCategoryId===24 || nitem.SubCategoryId===25 || nitem.SubCategoryId===26 || nitem.SubCategoryId===35 ||nitem.SubCategoryId===38 || nitem.SubCategoryId===41 || nitem.SubCategoryId===43">
                                    <!--<li class="list-group-item">

                                                                <small>Select All</small>
                                                            </label>

            <div class="col-lg-12" ng-repeat="mitem in cacheStorageItem.DefaultTemplateArray" ng-if="mitem.CategoryId===5">
                <div class="panel panel-ehnote" ng-if="mitem.CategoryId===5">
                    <div class="panel-heading">{{mitem.CategoryName}}</div>
                    <div class="panel-body">
                        <ul class="new-consul-seletempl">

                                <div class="checkbox cn">

                                        <input name="checkbox-1" type="checkbox" ng-change="CheckSubCategory(mitem,nitem)" ng-model="nitem.IsSubCategoryChecked">
                                        <span class="checkbox-material">
                                            <span class="check"></span>

    <div class="modal-footer">
        <div class="row">
            <div class="col-lg-12 text-right">
                <!--ng-if="TemplateId!=0"-->
                <button class="btn btn-danger p-l-50 p-r-50" ng-show="showDefaultTemplatebutton ==true" ng-click="CloseDefaultTemplate()">Close</button>
                <button class="btn btn-warning p-l-50 p-r-50" ng-click="ClearDefaultTemplate()">Clear</button>
                <!--<button class="btn btn-success p-l-50 p-r-50" ng-click="SaveDefaultTemplate()">Save Template</button>-->
                <button class="btn btn-success p-l-50 p-r-50" ng-click="SaveDefaultTemplate()" ng-class="AddDefaultTemplate==='Save' ?'btn-success':'btn-primary'">{{AddDefaultTemplate}}</button>
            </div>
        </div>
