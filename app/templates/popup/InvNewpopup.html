
    <div class="modal-header">
        <h4 class="modal-title">Add New</h4>
        <button type="button" class="btn btn-link" ng-click="cancel1()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">

        <div class="modal-body pb-0 pt-10">
            <div class="row">
                <div class="col-lg-4">
                    <div class="form-group">
                        <label>Select Speciality<em>*</em></label>
                        <select class="form-control" ng-model="newInvReqObject.InvSpecialityId" ng-options="item.LabSpecialityId as item.LabSpecialityName for item in masterLabSpecializationArray" ng-change="ChangeInvSpeciality1(newInvReqObject.InvSpecialityId,newInvReqObject)">
                            <option value="" ng-disabled="true">select</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="form-group">
                        <label>Group <em>*</em></label>
                        <div class="form-group m-b-0">

                            <input type="text"
                                   class="form-control"
                                   placeholder="Others"
                                   ng-model="newInvReqObject.InvGroupObj"
                                   typeahead-min-length="1"
                                   uib-typeahead="item as item.LabGroupName for item in getallLabTestGroups($viewValue,newInvReqObject.InvGroupObj,newInvReqObject)"
                                   typeahead-on-select="InvGroupsChange(newInvReqObject)"
                                   ng-change="changeInvGroupSearch(newInvReqObject)"
                                   ng-disabled="newInvReqObject.InvSpecialityId===3 || newInvReqObject.OrgInvestigationId!==0" />
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="form-group">
                        <label>Investigation Name<em>*</em></label>
                        <div class="form-group m-b-0">

                            <input type="text"
                                   class="form-control" ng-model="newInvReqObject.InvestigationName" />
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
    <div class="modal-footer">
        <button class="btn btn-danger" ng-click="cancel1()">Close</button>
        <button type="button" class="btn primary-btn" ng-click="addUpdateOrgInvestigation();">Ok</button>
    </div>
