<div class="modal__style--1 height__100--">
    <div class="modal__header--">
        <h1>Password Required</h1>
        <ul class="us-controls">
            <li>
                <a class="btn__close--" ng-click="CanclsignoffPopup()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body--">
        <div class="row" ng-show="OverallSignOffPasswordObj.Screen == 'ASCOverallSignoff'">
            <div class="col-lg-4">
                <div class="form__group">
                    <label>Admit-Reviewed By</label>
                    <select ng-model="FinalReviewbyobj.AdmitReviewBy"
                            ng-options="Eitem.DoctorID as Eitem.FullName for Eitem in AdmitUserList"
                            class=" " ng-change="ChangeUser(Eitem)">
                        <option value="">Select</option>
                    </select>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form__group">
                    <label>PreOP-Reviewed By</label>
                    <select ng-model="FinalReviewbyobj.PreOPOverallReviewedBy"
                            ng-options="Eitem.DoctorID as Eitem.FullName for Eitem in PreOPUserList"
                            class=" " ng-change="ChangeUser(Eitem)">
                        <option value="">Select</option>
                    </select>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form__group">
                    <label>Discharge-Reviewed By</label>
                    <select ng-model="FinalReviewbyobj.PostOpDischargeReviewedBy"
                            ng-options="Eitem.DoctorID as Eitem.FullName for Eitem in PreOPUserList"
                            class=" " ng-change="ChangeUser(Eitem)">
                        <option value="">Select</option>
                    </select>
                </div>
            </div>
            <div class="col-lg-12">
                <div class="asc-panel">
                    <div class="asc-panel-header">
                        <h6>Intraop-Reviewedby</h6>
                    </div>
                    <div class="asc-panel-body">
                        <div class="row nocolpad">
                            <div class="col-lg-3">
                                <div class="form__group">
                                    <label>Doctor:</label>
                                    <select class="" ng-model="FinalReviewbyobj.IntraOPReviewDoctorId" ng-options="item.DoctorID as item.FullName for item in SurgeonArray">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="form__group">
                                    <label>Nurse:</label>
                                    <select class="" ng-model="FinalReviewbyobj.IntraOPReviewNurseId" ng-options="item.DoctorID as item.FullName for item in NurseArray">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="form__group">
                                    <label>Anesthetist :</label>
                                    <select class="" ng-model="FinalReviewbyobj.IntraOPReviewAnesthetistId" ng-options="item.DoctorID as item.FullName for item in AnesthetistArray">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-3">
                                <div class="form__group">
                                    <label>Technician:</label>
                                    <select class="" ng-model="FinalReviewbyobj.IntraOpTechnicianId" ng-options="item.DoctorID as item.FullName for item in TechnicianArray">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="asc-panel-header">
                        <h6>Post-OP Reviewed by</h6>
                    </div>
                    <div class="asc-panel-body">
                        <div class="row">
                            <div class="col-lg-4 col-sm-6">
                                <div class="form__group">
                                    <label class="text-s12w400C000">Doctor :</label>
                                    <select class="" ng-model="FinalReviewbyobj.PostOpReviewDoctorId" ng-options="item.DoctorID as item.FullName for item in SurgeonArray">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-4 col-sm-6">
                                <div class="form__group">
                                    <label class="text-s12w400C000">Nurse :</label>
                                    <select class="" ng-model="FinalReviewbyobj.PostOpReviewNurseId" ng-options="item.DoctorID as item.FullName for item in NurseArray">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-4 col-sm-6">
                                <div class="form__group">
                                    <label class="text-s12w400C000">Anesthetist  :</label>
                                    <select class="" ng-model="FinalReviewbyobj.PostOpReviewAnesthetistId" ng-options="item.DoctorID as item.FullName for item in AnesthetistArray">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <!--<div class="form__group">
                <label>Remarks</label>
                <textarea class="register-input msd-elastic: \n;"
                          quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                          ng-model="SignOffPasswordObj.Remarks" maxlength="500"></textarea>
            </div>-->
                <div class="form__group">
                    <label>Password</label>
                    <input type="password" class="" ng-model="SignOffPasswordObj.SignOffPassword" placeholder="Enter Sign Off Password" maxlength="30">
                </div>

            </div>
            <div class="col-lg-4">
                <div class="form__group">
                    <button class="btn__xl-- btn__2D2D47--o mt__24--" ng-click="Signoffoverallasc()">Validate</button>
                </div>
            </div>
        </div>


        <div class="row nocolpad" ng-show="OverallSignOffPasswordObj.Screen == 'PreAdmOverallSignoff'">

            <div class="col-lg-4">
                <div class="form__group">
                    <label>Anesthetist</label>
                    <select class="" ng-model="FinalReviewbyobj.AnesthesiaPreAdmReviewedBy"
                            ng-options="item.DoctorID as item.FullName for item in AllAnesthetistList">
                        <option value="">Select</option>
                    </select>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form__group">
                    <label>Cardiology</label>
                    <select class="" ng-model="FinalReviewbyobj.CardiologistPreAdmReviewedBy"
                            ng-options="item.DoctorID as item.FullName for item in AllCardiologistList">
                        <option value="">Select</option>
                    </select>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="form__group">
                    <label>Password</label>
                    <input type="password" class="" ng-model="SignOffPasswordObj.SignOffPassword" placeholder="Enter Sign Off Password" maxlength="30">
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form__group text-right">
                    <button class="btn__xl-- btn__2D2D47--o mt__24--" ng-click="SignoffoverallPreAdm()">Validate</button>
                </div>
            </div>
        </div>



         

        <div class="d__f-- fd__c-- gap__15-- p__20--" ng-show="OverallSignOffPasswordObj.Screen != 'ASCOverallSignoff' && OverallSignOffPasswordObj.Screen != 'PreAdmOverallSignoff'">

            <div class="form__group" ng-show="SignOffPasswordObj.Type == 'VisitReason'">
                <label>User</label>
                <select ng-model="SignOffPasswordObj.DoctorId"
                        ng-options="Eitem.UserId as Eitem.FullName for Eitem in AccessUserlist"
                        class=" " ng-change="ChangeUser(Eitem)">
                    <option value="">Select</option>
                </select>
            </div>

            <div class="form__group" ng-show="SignOffPasswordObj.Type !== 'VisitReason'">
                <label>User</label>
                <select ng-model="SignOffPasswordObj.DoctorId" disabled
                        ng-options="Eitem.DoctorID as Eitem.FullName for Eitem in SurgeonArray"
                        class=" ">
                    <option value="">Select</option>
                </select>
            </div>

            <div class="form__group">
                <label>Password</label>
                <input type="password" ng-model="SignOffPasswordObj.SignOffPassword" ng-change="ChangeSignOffpwd(SignOffPasswordObj.SignOffPassword)" placeholder="Enter Sign Off Password" maxlength="30">
            </div>

            <div class="form__group" ng-show="SignOffPasswordObj.Type == 'Unsign'">
                <label>Remarks</label>
                <textarea class="msd-elastic: \n;"
                          quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                          ng-model="SignOffPasswordObj.Remarks" maxlength="500"></textarea>
            </div>

            <div class="form__group mt__10--">
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateSignOffPassword()">Validate</button>
                <button type="button" ng-show="SignOffPasswordObj.ContinueSignOff" class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ContinueSignOffRequired()">Continue</button>
            </div>


        </div>
    </div>
</div>
