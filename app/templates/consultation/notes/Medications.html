<div ng-controller="EhnoteMedicalCtrl" class="notes">
    <div class="pagecontent">
        <div class="row">
            <div class="col-lg-12">
                <section class="tile tile-shadow">
                    <div class="tile-body pt-0 pb-0">
                        <div class="row">
                            <div class="col-lg-12">
                                <form role="form" ng-submit="$event.preventDefault()" name="searchForm">
                                    <div class="form-group visitReason-form">
                                        <label>Visit Reason <em>*</em></label>
                                        <input type="text"
                                               placeholder="Enter Visit Reason"
                                               class="form-control"
                                               ng-model="cacheStorageItem.VisitReason" />
                                    </div>
                                    <div class="form-group visitR-form" ng-show="ConsultDtshow == true">
                                        <label>Date <em>&nbsp</em></label>
                                        <input class="text-section form-control popup-icon-calendar" ng-model='curDate.ConsultationDate' ng-click="ctrl.openCalendarPane($event)" ng-change='chngdate(curDate.ConsultationDate)' jqdatepickerformv name="dateField" datepickersearchall readonly />
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <div class="cboth"></div>
    <div class="tabs-header new-tabs ul-border">
        <ul>
            <li ng-class="MedicalActiveMenu(1)">
                <a class="h-a-txt-black" href="javascript:;" ng-click="SwitchMedicalPage(1)">
                    Medical History
                </a>
            </li>
            <li ng-class="MedicalActiveMenu(2)">
                <a class="h-a-txt-black" href="javascript:;" ng-click="SwitchMedicalPage(2)">
                    Parameters
                </a>
            </li>
            <li ng-class="MedicalActiveMenu(3)">
                <a class="h-a-txt-black" href="javascript:;" ng-click="SwitchMedicalPage(3)">
                    Past Medical History
                </a>
            </li>
        </ul>
    </div>
    <div class="topSpacealgin">
        <div ng-show="Medicalpageno==1" ng-include="'templates/consultation/notes/MedicalConditions.html'"></div>
        <div ng-show="Medicalpageno==2" class="pat-vitals" ng-include="'templates/consultation/notes/VitalParameters.html'"></div>
        <div ng-show="Medicalpageno==3" class="pmh-box" ng-include="'templates/consultation/notes/MedicalHistory.html'"></div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <button  class="pull-right btn blue-btn" id='first' ng-click="NextClickFromMedical()">Next</button>
        </div>
    </div>
    <script type="text/ng-template" id="customTemplateMedHistory.html">
        <a class="searchByResultTEst">
            <span ng-bind-html="match.model.VisitReason | uibTypeaheadHighlight:query" class="width-100"></span>
        </a>
    </script>
</div>
