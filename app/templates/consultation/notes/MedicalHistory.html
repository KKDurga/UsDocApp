<div class="pagecontent">
<div class="row">
    <div class="col-lg-12">
      <section class="tile text-shadow">
        <div class="tile-header mb-0">
          <h1>Medical History</h1>
        </div>
        <div class="tile-body">
          <div class="row">
          <div class="col-lg-12">
              <div class="form-group text-right" ng-repeat="visit in cacheStorageItem.PatientPastMedicalHistory track by $index">
        <div class="d-notes-box clearfix">
            <div class="col-lg-6 p-0">
                <textarea type="text" placeholder="Enter past medical history" class="msd-elastic" 
                ng-model="cacheStorageItem.PatientPastMedicalHistory[$index]" aw-limit-length="600"></textarea>
                <a href="javascript:void(0);" class="tbox-clear" ng-hide="cacheStorageItem.PatientPastMedicalHistory[$index] == ''" value="Clear All" ng-click="clearPastMedicalHistory($index)">
                <i class="fa fa-times" aria-hidden="true"></i>
                </a>
            </div>
            <div class="col-lg-1">
                <button class="btn mt-10 danger-btn text-right" ng-hide="$last" ng-click="removePastHistory($index)"><i class="fa fa-trash" aria-hidden="true"></i>  &nbsp  Delete</button>
                <button href="javascript:;" ng-show="$last" ng-click="addEmptyRecordMedicalHistory()" class="text-right btn primary-btn mt-10"><i class="fa fa-plus" aria-hidden="true"></i>&nbsp Add</button>
            </div>
        </div>
    </div>
          </div>
          </div>
          </div>
          </section>
          </div>
          </div>
          </div>
