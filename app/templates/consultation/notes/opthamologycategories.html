<div class="pagecontent">
    <div class="row" ng-show="(cacheStorageItem.AdditionalInvCatItems | filter :{'ShowStamp':'Y'}).length == 0">
        <div class="col-lg-12">
            <section class="tile tile-shadow">
                <div class="tile-body">
                    <!--<div class="row">
                        <div class="summary-reports norecords-found text-center medicine-text">
                            <img src="img/no-data/no-doctor-care.png">
                            <p>
                                Add Investigations From DropDown..!
                            </p>
                        </div>
                    </div>-->
                    <div class="row">
                        <div class="col-lg-12  text-center">
                            <div class="billing-cominsoon">
                                <img src="img/no-data/No-condition selected_treatment.png">
                                <div class="msg m-b-10">
                                    <p class="goback-text">Add Investigations From DropDown..!</p>
                                    <p class="no-records-txt-line2">
                                        No Investigations availble with selected dates !!
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            
            <ul class="opthainvest">
                <li ng-repeat="item in cacheStorageItem.AdditionalInvCatItems | filter :{'ShowStamp':'Y'}">
                    <a>
                        <span>
                            <span ng-bind="item.CategoryName" ng-click="showCategoryDiv(item)"></span>
                            <i class="fas fa-times-circle" ng-click="removeCategory(item)"></i>
                        </span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <section class="tile text-shadow">
                <div ng-repeat="item in cacheStorageItem.AdditionalInvCatItems" ng-show="item.ShowDiv == 'Y'">
                    <div class="pagecontent">
                        <div class="col-lg-12">
                            <span ng-bind="item.CategoryName"></span>
                        </div>
                        <div class="row">
                            <div class="col-lg-12">
                                <section class="tile tile-shadow">
                                    <div class="tile-body">
                                        <div class="row">
                                            <div class="col-lg-3">
                                                <div class="InvestiSelect">
                                                    <select ng-change="changeInvestigation(cacheStorageItem.selectedAdditionalInv)"
                                                            ng-model="cacheStorageItem.selectedAdditionalInv"
                                                            ng-options="option as option.Investigation for option in FilteredInvestigations | filter:{'IsSelected':'N'}"
                                                            class="form-control">
                                                        <option value="">Select Investigation</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-9 InvestiSelect">
                                                <ul>
                                                    <li ng-repeat="item2 in cacheStorageItem.AdditionalInvArray | filter:{'IsSelected':'Y'} | filter:{'CategoryId':item.CategoryId}">
                                                        <span ng-bind="item2.Investigation"></span>
                                                        <i class="fa fa-times" ng-click="removeInvestigation(item2,'Additional')"></i>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        </div>
                       
                        <div class="row" ng-repeat="item1 in cacheStorageItem.AdditionalInvArray |  filter:{'IsSelected':'Y'}  | filter:{'CategoryId':item.CategoryId}">
                            <div class="col-lg-12">
                                <section class="tile tile-shadow">
                                    <div class="tile-header">
                                        <h1 ng-bind="item1.Investigation"></h1>
                                    </div>
                                    <div class="tile-body">
                                        <div class="row eye_lids">
                                            <div class="col-lg-6">
                                                <div class="br-1 col-lg-12 pt-15">
                                                    <label class="customLabel">OD</label>
                                                    <label class="mt-5 pull-right cursorp">
                                                        <input type="checkbox" class="checkbox" value="Recommanded For Surgary" ng-model="item1.IsNormalR">
                                                        <span class="lbl"></span>
                                                        <span class="list-opt-text-new ng-binding">Normal</span>
                                                    </label>
                                                    <textarea ng-show="item1.RemarksInd == 'Y'" class="form-control mt-10" rows="2" placeholder="Findings" ng-model="item1.RightEyeRemarks" ng-focus="item1.IsSelected == 'Y' ? FindFocusAdditionalInv= true : ''" ng-focus-lost="LostFocusAdditionalInv()"></textarea>
                                                    <div class="col-lg-12 p-0 mt-10">
                                                        <div class="col-lg-7 p-0" ng-show="item1.ImageUploadInd == 'Y'">
                                                            <div class="form-group">
                                                                <div class="input-group">
                                                                    <label class="input-group-btn">
                                                                        <span class="btn btn-primary">
                                                                            Select File<input type="file"
                                                                                              class="file dis-none"
                                                                                              onchange="angular.element(this).scope().FileChange(this.files, 'Right', angular.element(this).scope().item1)" />
                                                                        </span>
                                                                    </label>
                                                                    <input type="text" class="form-control height-33" readonly ng-model="item1.RightEyefileName" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="col-lg-5 pr-0 text-right">
                                                            <button ng-show="item1.SyncImageInd == 'Y'" class="btn warning-btn" ng-click="syncImages('Right',item1)">Sync</button>
                                                            <button ng-show="item1.GetTemplateInd == 'Y'" class="btn blue-btn" ng-click="GetTemplateImgSrc('Right',item1)">Get Template</button>
                                                        </div>
                                                        <div class="col-lg-12 mb-10 p-0" ng-show="item1.CdRatioValuesInd == 'Y'">
                                                            <div class="col-lg-5 pl-0 CupInput">
                                                                <label for="Cup">CD ratio :</label>
                                                                <input type="text" id="Cup" placeholder="0" ng-model="item1.RightEyeCdRatio" numbers-slash-only="" maxlength="3" class="w-100" />
                                                            </div>
                                                        </div>
                                                        <div class="col-lg-12 mb-10 p-0" ng-show="item1.FrequencyValuesInd == 'Y'">
                                                            <div class="col-lg-2 pl-0 CupInput CupLabel">
                                                                <label for="Cup">FR+</label>
                                                                <input type="radio" ng-model="item1.RightEyeFreq" id="Cup" name="PerimetryRightEye_{{$index}}" value="positive" />
                                                            </div>
                                                            <div class="col-lg-3 CupInput CupLabel">
                                                                <label for="Disk">FR-</label>
                                                                <input type="radio" id="Disk" ng-model="item1.RightEyeFreq" name="PerimetryRightEye_{{$index}}" value="negative" />
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-lg-12 p-0">
                                                        <div ng-show="item1.RightEyediv">
                                                            <div pw-canvas
                                                                 version="item1.RightEyeUndoCount"
                                                                 undoclicked="item1.IsUndoClicked" options="{undo:true,color:selectedColor,lineWidth:selectedLineWidth,imageSrc:item1.thumbnailRightEye,customCanvasId:item1.RightPwCanvas}">
                                                                <div class="pwCanvasPaint"></div>
                                                            </div>
                                                            <div class="col-lg-12">
                                                                <div pw-color-selector="['#000', '#FF0000', '#FFFF00', '#00FF00', '#00FFFF']" color="selectedColor" class="canvas_color col-lg-6">
                                                                </div>
                                                                <div class="col-lg-6 text-left p-0 mt-5 mb-5 undo">
                                                                    <button ng-click="undoEyeCount(item1,'Right')" ng-disabled="item1.RightEyeUndoCount < 1">
                                                                        Undo ( <span ng-bind="item1.RightEyeUndoCount"></span>)
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-lg-12 p-0 mt-10 mb-10" ng-show="item1.RightEyeArray.length  >0">
                                                        <div class="col-lg-2 EyeThumb" ng-repeat="item2 in item1.RightEyeArray">
                                                            <i class="fa fa-times" ng-click="removeImage(item2,'Right',0,item1)" role="button" tabindex="0"></i>
                                                            <img class="img-responsive br-1" ng-src="{{item2.DocURL}}" ng-click="EditImage(item1,item2,'Right')" />
                                                        </div>
                                                    </div>
                                                    <div class="col-lg-12 text-right p-0 mt-5 mb-5 save_canvas">
                                                        <button class="btn primary-btn" ng-show="!item1.RightEyeEdit && item1.ImageUploadInd == 'Y'" ng-click="savecanvas('Right',item1)" ng-disabled="!item1.RightEyediv">
                                                            Save Image
                                                        </button>
                                                        <button class="btn primary-btn" ng-show="item1.RightEyeEdit && item1.ImageUploadInd == 'Y'" ng-click="updatecanvas('Right',item1)">
                                                            Update Image
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-6">
                                                <div class="br-1 col-lg-12 pt-15">
                                                    <label class="customLabel">OS</label>
                                                    <label class="mt-5 pull-right cursorp">
                                                        <input type="checkbox" class="checkbox" value="Recommanded For Surgary" ng-model="item1.IsNormalL">
                                                        <span class="lbl"></span>
                                                        <span class="list-opt-text-new ng-binding"> Normal</span>
                                                    </label>
                                                    <textarea ng-show="item1.RemarksInd == 'Y'" class="form-control mt-10" rows="2" placeholder="Findings" ng-model="item1.LeftEyeRemarks"></textarea>
                                                    <div class="col-lg-12 p-0 mt-10">
                                                        <div class="col-lg-7 p-0" ng-show="item1.ImageUploadInd == 'Y'">
                                                            <div class="form-group">
                                                                <div class="input-group">
                                                                    <label class="input-group-btn">
                                                                        <span class="btn btn-primary">
                                                                            Select File<input type="file"
                                                                                              class="file dis-none"
                                                                                              onchange="angular.element(this).scope().FileChange(this.files, 'Left', angular.element(this).scope().item1)" />
                                                                        </span>
                                                                    </label>
                                                                    <input type="text" class="form-control height-33" readonly ng-model="item1.LeftEyefileName" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="col-lg-5 pr-0 text-right">
                                                            <button ng-show="item1.SyncImageInd == 'Y'" class="btn warning-btn" ng-click="syncImages('Left',item1)">Sync</button>
                                                            <button ng-show="item1.GetTemplateInd == 'Y'" class="btn blue-btn" ng-disabled="item1.GetTemplateInd != 'Y'" ng-click="GetTemplateImgSrc('Left',item1)">Get Template</button>
                                                        </div>
                                                        <!-- <div class="col-lg-3 pr-0 text-right">
                                                        </div> -->
                                                        <div class="col-lg-12 mb-10 p-0" ng-show="item1.CdRatioValuesInd == 'Y'">
                                                            <div class="col-lg-5 pl-0 CupInput">
                                                                <label for="Cup">CD ratio :</label>
                                                                <input type="text" id="Cup" placeholder="0" ng-model="item1.LeftEyeCdRatio" class="w-100" numbers-slash-only="" maxlength="3" />
                                                            </div>
                                                        </div>
                                                        <div class="col-lg-12 mb-10 p-0" ng-show="item1.FrequencyValuesInd == 'Y'">
                                                            <div class="col-lg-2 pl-0 CupInput CupLabel">
                                                                <label for="Cup">FR+</label>
                                                                <input type="radio" ng-model="item1.LeftEyeFreq" id="Cup" name="PerimetryLeftEye_{{$index}}" value="positive" />
                                                            </div>
                                                            <div class="col-lg-3 CupInput CupLabel">
                                                                <label for="Disk">FR-</label>
                                                                <input type="radio" id="Disk" ng-model="item1.LeftEyeFreq" name="PerimetryLeftEye_{{$index}}" value="negative" />
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-lg-12 p-0">
                                                        <div ng-show="item1.LeftEyediv">
                                                            <div pw-canvas
                                                                 version="item1.LeftEyeUndoCount"
                                                                 undoclicked="item1.IsUndoClicked" options="{undo:true,color:selectedColor,lineWidth:selectedLineWidth,imageSrc:item1.thumbnailLeftEye,customCanvasId:item1.LeftPwCanvas}">
                                                                <div class="pwCanvasPaint"></div>
                                                            </div>
                                                            <div class="col-lg-12">
                                                                <div pw-color-selector="['#000', '#FF0000', '#FFFF00', '#00FF00', '#00FFFF']" color="selectedColor" class="canvas_color col-lg-6">
                                                                </div>
                                                                <div class="col-lg-6 text-left p-0 mt-5 mb-5 undo">
                                                                    <button ng-click="undoEyeCount(item1,'Left')" ng-disabled="item1.LeftEyeUndoCount < 1">
                                                                        Undo  (<span ng-bind="item1.LeftEyeUndoCount"></span>)
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div class="col-lg-12 p-0 mt-10 mb-10" ng-show="item1.LeftEyeArray.length  >0">
                                                        <div class="col-lg-2 EyeThumb" ng-repeat="item3 in item1.LeftEyeArray">
                                                            <i class="fa fa-times" ng-click="removeImage(item3,'Left',0,item1)" role="button" tabindex="0"></i>
                                                            <img class="img-responsive br-1" ng-src="{{item3.DocURL}}" ng-click="EditImage(item1,item3,'Left')" />
                                                        </div>
                                                    </div>
                                                    <div class="col-lg-12 text-right p-0 mt-5 mb-5 save_canvas">
                                                        <button class="btn primary-btn" ng-show="!item1.LeftEyeEdit && item1.ImageUploadInd == 'Y'" ng-click="savecanvas('Left',item1)" ng-disabled="!item1.LeftEyediv">
                                                            Save Image
                                                        </button>
                                                        <button class="btn primary-btn" ng-show="item1.LeftEyeEdit && item1.ImageUploadInd == 'Y'" ng-click="updatecanvas('Left',item1)">
                                                            Update Image
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
