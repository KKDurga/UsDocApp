<div ng-repeat="item in InvestigationDetails.AllInvestigationCategory">
    <div ng-show="item.Opthalmologypageno == Opthalmologypageno">
        <div class="pagecontent">
            <div class="row">
                <div class="col-lg-12">
                    <section class="tile tile-shadow">
                        <div class="tile-body">
                            <div class="row">
                                <div class="col-lg-3">
                                    <div class="InvestiSelect">
                                        <select ng-init="selectedInevstigation  = (InvestigationDetails.AllInvestigations | filter:{'CategoryId':item.CategoryId})[0]"
                                                ng-change="changeInvestigation(selectedInevstigation)"
                                                ng-model="selectedInevstigation"
                                                ng-options="option.Investigation for option in InvestigationDetails.AllInvestigations | filter:{'CategoryId':item.CategoryId}"
                                                class="form-control"></select>
                                    </div>
                                </div>
                                <div class="col-lg-9 InvestiSelect">
                                    <ul>
                                        <li ng-repeat="item in InvestigationDetails.AllInvestigations | filter:{'ActiveInd':'Y'} | filter:{'CategoryId':item.CategoryId}">
                                            <span ng-bind="item.Investigation"></span>
                                            <i class="fa fa-times" ng-click="removeInvestigation(item)"></i>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
            <div class="row" ng-repeat="item in InvestigationDetails.AllInvestigations |  filter:{'ActiveInd':'Y'}  | filter:{'CategoryId':item.CategoryId}">
                <div class="col-lg-12">
                    <section class="tile tile-shadow">
                        <div class="tile-header mb-0">
                            <h1 ng-bind="item.Investigation"></h1>
                        </div>
                        <div class="tile-body pt-0">
                            <div class="row eye_lids">
                                <div class="col-lg-6">
                                    <div class="br-1 col-lg-12 pt-15">
                                        <label class="customLabel">OD</label>
                                        <div class="col-lg-12 p-0">
                                            <div class="col-lg-7 p-0" ng-show="item.ImageUploadInd == 'Y'">
                                                <div class="form-group mt-10">
                                                    <input type="file" name="img[]" class="file"
                                                           onchange="angular.element(this).scope().FileChange(this.files, 'Right', angular.element(this).scope().item)" />
                                                    <div class="input-group">
                                                        <span class="input-group-btn">
                                                            <button class="browse btn btn-browse input-lg">
                                                                <i class="fa fa-picture-o pr-5"></i> Select File
                                                            </button>
                                                        </span>
                                                        <input type="text" class="form-control input-lg CustomBrowse" disabled />
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-2 pr-0 text-right">
                                                <button class="btn warning-btn mt-10" ng-disabled="item.SyncImageInd != 'Y'" ng-click="syncImages('Right',item)">Sync</button>
                                            </div>
                                            <div class="col-lg-3 pr-0 text-right">
                                                <button class="btn blue-btn mt-10" ng-disabled="true" ng-click="GetTemplate('Right',item)">Get Template</button>
                                            </div>
                                            <div class="col-lg-12 mb-10 p-0" ng-show="item.CdRatioValuesInd == 'Y'">
                                                <div class="col-lg-5 pl-0 CupInput">
                                                    <label for="Cup">CD ratio :</label>
                                                    <input type="text" id="Cup" placeholder="0" ng-model="item.RightEyeCdRatio" />
                                                </div>
                                            </div>
                                            <div class="col-lg-12 mb-10 p-0" ng-show="item.FrequencyValuesInd == 'Y'">
                                                <div class="col-lg-2 pl-0 CupInput CupLabel">
                                                    <label for="Cup">FR+</label>
                                                    <input type="radio" ng-model="item.RightEyeFreq" id="Cup" name="PerimetryRightEye_{{$index}}" value="positive" />
                                                </div>
                                                <div class="col-lg-3 CupInput CupLabel">
                                                    <label for="Disk">FR-</label>
                                                    <input type="radio" id="Disk" ng-model="item.RightEyeFreq" name="PerimetryRightEye_{{$index}}" value="negative" />
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-12 p-0">
                                            <div ng-show="item.RightEyediv">
                                                <!--<div pw-canvas
                                                     versionright="item.RightEyeUndoCount"
                                                     options="{undo:true,color:selectedColor,lineWidth:selectedLineWidth,imageSrc:item.thumbnailRightEye,customCanvasId:item.RightPwCanvas}">
                                                    <div class="pwCanvasPaint"></div>
                                                </div>-->
                                                <div class="col-lg-12">
                                                    <div pw-color-selector="['#000', '#FF0000', '#FFFF00', '#00FF00', '#00FFFF']" color="selectedColor" class="canvas_color col-lg-6">
                                                    </div>
                                                    <div class="col-lg-6 text-left p-0 mt-5 mb-5 undo">
                                                        <button ng-click="undoEyeCount(item,'Right')" ng-disabled="item.RightEyeUndoCount < 1">
                                                            Undo ( <span ng-bind="item.RightEyeUndoCount"></span>)
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-12 p-0 mt-10 mb-10" ng-show="item.RightEyeArray.length  >0">
                                            <div class="col-lg-2 EyeThumb" ng-repeat="item1 in item.RightEyeArray">
                                                <i class="fa fa-times" ng-click="removeImage(item1.DocumentId,'Right',0)" role="button" tabindex="0"></i>
                                                <img class="img-responsive br-1" ng-src="{{item1.DocURL}}" ng-click="EditImage(item,item1,'Right')" />
                                            </div>
                                        </div>
                                        <textarea ng-show="item.RemarksInd == 'Y'" class="form-control mt-10" rows="2" placeholder="Remarks" ng-model="item.RightEyeRemarks"></textarea>
                                        <div class="col-lg-12 text-right p-0 mt-5 mb-5 save_canvas">
                                            <button class="btn primary-btn" ng-show="!item.RightEyeEdit && item.ImageUploadInd == 'Y'" ng-click="savecanvas('Right',item)" ng-disabled="!item.RightEyediv">
                                                Save Image
                                            </button>
                                            <button class="btn primary-btn" ng-show="item.RightEyeEdit && item.ImageUploadInd == 'Y'" ng-click="updatecanvas('Right',item)">
                                                Update Image
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="br-1 col-lg-12 pt-15">
                                        <label class="customLabel">OS</label>
                                        <div class="col-lg-12 p-0">
                                            <div class="col-lg-7 p-0" ng-show="item.ImageUploadInd == 'Y'">
                                                <div class="form-group mt-10">
                                                    <input type="file" name="img[]" class="file"
                                                           onchange="angular.element(this).scope().FileChange(this.files, 'Left', angular.element(this).scope().item)" />
                                                    <div class="input-group">
                                                        <span class="input-group-btn">
                                                            <button class="browse btn btn-browse input-lg"><i class="fa fa-picture-o pr-5"></i> Select File</button>
                                                        </span>
                                                        <input type="text" class="form-control input-lg CustomBrowse" disabled />
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-2 pr-0 text-right">
                                                <button class="btn warning-btn mt-10" ng-disabled="item.SyncImageInd != 'Y'" ng-click="syncImages('Left',item)">Sync</button>
                                            </div>
                                            <div class="col-lg-3 pr-0 text-right">
                                                <button class="btn blue-btn mt-10" ng-disabled="true" ng-click="GetTemplate('Left',item)">Get Template</button>
                                            </div>
                                            <div class="col-lg-12 mb-10 p-0" ng-show="item.CdRatioValuesInd == 'Y'">
                                                <div class="col-lg-5 pl-0 CupInput">
                                                    <label for="Cup">CD ratio :</label>
                                                    <input type="text" id="Cup" placeholder="0" ng-model="item.LeftEyeCdRatio" />
                                                </div>
                                            </div>
                                            <div class="col-lg-12 mb-10 p-0" ng-show="item.FrequencyValuesInd == 'Y'">
                                                <div class="col-lg-2 pl-0 CupInput CupLabel">
                                                    <label for="Cup">FR+</label>
                                                    <input type="radio" ng-model="item.LeftEyeFreq" id="Cup" name="PerimetryLeftEye_{{$index}}" value="positive" />
                                                </div>
                                                <div class="col-lg-3 CupInput CupLabel">
                                                    <label for="Disk">FR-</label>
                                                    <input type="radio" id="Disk" ng-model="item.LeftEyeFreq" name="PerimetryLeftEye_{{$index}}" value="negative" />
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-12 p-0">
                                            <div ng-show="item.LeftEyediv">
                                                <!--<div pw-canvas
                                                     versionright="item.LeftEyeUndoCount"
                                                     options="{undo:true,color:selectedColor,lineWidth:selectedLineWidth,imageSrc:item.thumbnailLeftEye,customCanvasId:item.LeftPwCanvas}">
                                                    <div class="pwCanvasPaint"></div>
                                                </div>-->
                                                <div class="col-lg-12">
                                                    <div pw-color-selector="['#000', '#FF0000', '#FFFF00', '#00FF00', '#00FFFF']" color="selectedColor" class="canvas_color col-lg-6">
                                                    </div>
                                                    <div class="col-lg-6 text-left p-0 mt-5 mb-5 undo">
                                                        <button ng-click="undoEyeCount(item,'Left')" ng-disabled="item.LeftEyeUndoCount < 1">
                                                            Undo  (<span ng-bind="item.LeftEyeUndoCount"></span>)
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-12 p-0 mt-10 mb-10" ng-show="item.LeftEyeArray.length  >0">
                                            <div class="col-lg-2 EyeThumb" ng-repeat="item1 in item.LeftEyeArray">
                                                <i class="fa fa-times" ng-click="removeImage(item1.DocumentId,'Left',0)" role="button" tabindex="0"></i>
                                                <img class="img-responsive br-1" ng-src="{{item1.DocURL}}" ng-click="EditImage(item,item1,'Left')" />
                                            </div>
                                        </div>
                                        <textarea ng-show="item.RemarksInd == 'Y'" class="form-control mt-10" rows="2" placeholder="Remarks" ng-model="item.LeftEyeRemarks"></textarea>
                                        <div class="col-lg-12 text-right p-0 mt-5 mb-5 save_canvas">
                                            <button class="btn primary-btn" ng-show="!item.LeftEyeEdit && item.ImageUploadInd == 'Y'" ng-click="savecanvas('Left',item)" ng-disabled="!item.LeftEyediv">
                                                Save Image
                                            </button>
                                            <button class="btn primary-btn" ng-show="item.LeftEyeEdit && item.ImageUploadInd == 'Y'" ng-click="updatecanvas('Left',item)">
                                                Update Image
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>
