<div class="col-lg-12">
    <div class="row">
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[10].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-bar">
                        <img src="img/vitals/icon-temp-black.png" />
                    </div>
                    <div class="count">
                        <h4>Temperature (F)</h4>
                        <input type="text" placeholder="0" class="vital-input-box" ng-model="cacheStorageItem.Vitals[10].Value" maxlength="5" numbers-only-temp="numbers-only-temp">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[3].ActiveIND == 'Y' || cacheStorageItem.Vitals[4].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-bar-2">
                        <img src="img/vitals/icon-bp-black.png" />
                    </div>
                    <div class="count">
                        <h4>BP (Mm/Hg)</h4>
                        <input placeholder="Systolic" ng-show="cacheStorageItem.Vitals[4].ActiveIND == 'Y'" type="text" class="form-control vital-input-box width-37 dis-inline-block" ng-model="cacheStorageItem.Vitals[4].Value" ng-change="focusNext(cacheStorageItem.Vitals[4].Value)" maxlength="3" onpaste="return false" numbers-only="numbers-only" id="bplow">
                        <input placeholder="Diastolic" ng-show="cacheStorageItem.Vitals[3].ActiveIND == 'Y'" type="text" class="form-control vital-input-box width-40 m-l-10 dis-inline-block" maxlength="3" ng-model="cacheStorageItem.Vitals[3].Value" numbers-only="numbers-only">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[11].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-bar"><img src="img/vitals/pulse-vitals.png"></div>
                    <div class="count">
                        <h4>Pulse Rate (Bpm)</h4>
                        <input type="text" placeholder="0" class="vital-input-box" ng-model="cacheStorageItem.Vitals[11].Value" maxlength="3" numbers-only="numbers-only">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[1].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-line-2"><img src="img/vitals/icon-height-black.png" /></div>
                    <div class="count">
                        <h4>Height (Cm)</h4>
                        <input type="text" placeholder="0" ng-change="bmiValueCal(cacheStorageItem.Vitals[1].Value,cacheStorageItem.Vitals[0].Value)" class="vital-input-box" ng-model="cacheStorageItem.Vitals[1].Value" maxlength="6" numbersdots-only="numbersdots-only">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[0].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-line-2">
                        <img src="img/vitals/icon-weight-black.png" />
                    </div>
                    <div class="count">
                        <h4>Weight (Kg)</h4>
                        <input type="text" placeholder="0" class="vital-input-box" ng-change="bmiValueCal(cacheStorageItem.Vitals[1].Value,cacheStorageItem.Vitals[0].Value)" ng-model="cacheStorageItem.Vitals[0].Value" maxlength="6" numbersdots-only="numbersdots-only">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[1].ActiveIND == 'Y' && cacheStorageItem.Vitals[0].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-line-2"><img src="img/vitals/bmi.png" /></div>
                    <div class="count">
                        <h4>BMI</h4>
                        <input type="text" placeholder="0" class="vital-input-box w-120" ng-model="cacheStorageItem.Bmivalue" readonly>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[2].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-line-2"><img src="img/vitals/icon-bloodgroup-black.png" /></div>
                    <div class="count">
                        <h4>Blood Group</h4>
                        <select class="vital-input-box select-dropdown p-0-5 fs-14 text-light" ng-model="cacheStorageItem.Vitals[2].Value">
                            <option value="">Select</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[6].ActiveIND == 'Y' || cacheStorageItem.Vitals[7].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-line"><img src="img/vitals/icon-sugar-black.png" /></div>
                    <div class="count">
                        <h4>Fasting &amp; PP</h4>
                        <input ng-show="cacheStorageItem.Vitals[6].ActiveIND == 'Y'" type="text" placeholder="0" class="form-control vital-input-box width-35 dis-inline-block" maxlength="3" ng-model="cacheStorageItem.Vitals[6].Value" ng-change="focusNext(cacheStorageItem.Vitals[6].Value)" numbers-only="numbers-only" onpaste="return false" id="sugarfast">
                        <input ng-show="cacheStorageItem.Vitals[7].ActiveIND == 'Y'" type="text" placeholder="0" class="form-control vital-input-box width-35 m-l-10 dis-inline-block" maxlength="3" ng-model="cacheStorageItem.Vitals[7].Value" numbers-only="numbers-only" id="sugarpp">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[8].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-line"><img src="img/vitals/icon-sugar-black.png" /></div>
                    <div class="count">
                        <h4>Sugar Random</h4>
                        <input type="text" placeholder="0" class="vital-input-box" ng-model="cacheStorageItem.Vitals[8].Value" maxlength="3" numbers-only="numbers-only">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[12].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-line-2"><img src="img/vitals/head_circumference.png" /></div>
                    <div class="count">
                        <h4>Head Circumference (Cm)</h4>
                        <input type="text" placeholder="0" class="form-control vital-input-box" ng-model="cacheStorageItem.Vitals[12].Value" maxlength="6" ng-blur="changeSet()" numbersdots-only="numbersdots-only">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[9].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-line-2"><img src="img/vitals/Serum-creatinine.png" /></div>
                    <div class="count">
                        <h4>Serum creatinine (Mg/DL)</h4>
                        <input type="text" placeholder="0" class="vital-input-box" ng-model="cacheStorageItem.Vitals[9].Value" maxlength="6" numbersdots-only="numbersdots-only">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[5].ActiveIND == 'Y'">
            <div class="mini-charts-item bg-global">
                <div class="clearfix">
                    <div class="chart stats-line-2"><img src="img/vitals/Lipid-Profile.png" /></div>
                    <div class="count">
                        <h4>Lipid Profile (Mg/DL)</h4>
                        <input type="text" placeholder="0" class="vital-input-box" ng-model="cacheStorageItem.Vitals[5].Value" maxlength="6" numbersdots-only="numbersdots-only">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[13].ActiveIND == 'Y'">
            <div class="mini-charts-item custom-item bgm-lightgreen">
                <div class="mini-charts-item bg-global">
                    <div class="clearfix">
                        <div class="chart stats-line-2"><img src="img/vitals/respiratory.png" /></div>
                        <div class="count">
                            <h4>Respiratory Rate (Per Min)</h4>
                            <input type="text" placeholder="0" class="form-control vital-input-box" ng-model="cacheStorageItem.Vitals[13].Value" maxlength="2" numbers-only="numbers-only">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[14].ActiveIND == 'Y'">
            <div class="mini-charts-item custom-item bgm-lightgreen">
                <div class="mini-charts-item bg-global">
                    <div class="clearfix">
                        <div class="chart stats-line-2"><img src="img/vitals/spo2a.png" /></div>
                        <div class="count">
                            <h4>SpO2 (%)</h4>
                            <input type="text" placeholder="0" class="vital-input-box" ng-model="cacheStorageItem.Vitals[14].Value" maxlength="2" numbers-only="numbers-only">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 height-100" ng-show="cacheStorageItem.Vitals[15].ActiveIND == 'Y'">
            <div class="mini-charts-item custom-item bgm-lightgreen">
                <div class="mini-charts-item bg-global">
                    <div class="clearfix">
                        <div class="chart stats-line-2"><img src="img/vitals/flow-rate.png" /></div>
                        <div class="count">
                            <h4>PEFR ( L/Min)</h4>
                            <input type="text" placeholder="0" class="vital-input-box" ng-model="cacheStorageItem.Vitals[15].Value" maxlength="3" numbers-only="numbers-only">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
