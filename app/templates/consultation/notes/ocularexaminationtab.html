<div class="tabs-header tabs_background" ng-controller="EhnoteOcularExamCtrl">
    <div class="pagecontent" id="popupContainer">
        <div class="row">
            <div class="col-lg-12">
                <section class="tile tile-shadow">
                    <div class="tile-header mb-0">
                        <h1>External Examination</h1>
                    </div>
                    <div class="tile-body pt-0">
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="br-1 col-lg-12 pt-15">
                                    <label class="customLabel">OD</label>
                                    <div class="col-lg-12 p-0">
                                        <div class="col-lg-7 p-0">
                                            <div class="form-group mt-10">
                                                <input type="file"  name="file"  class="file"  ngf-accept="'image/*'"  ngf-select="onFileSelectOcular($file,'Right')"
                                                       >
                                                <div class="input-group">
                                                    <span class="input-group-btn">
                                                        <button class="browse btn btn-browse input-lg">
                                                            <i class="fa fa-picture-o pr-5"></i>
                                                            Select File
                                                        </button>
                                                    </span>
                                                    <input type="text" class="form-control input-lg CustomBrowse" disabled />
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-2 pr-0 text-right">
                                            <button class="btn warning-btn mt-10" ng-click="syncImages('Right')">Sync</button>
                                        </div>
                                        <div class="col-lg-3 pr-0 text-right">
                                            <button class="btn blue-btn mt-10" ng-click="GetTemplate('Right')">Get Template</button>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 p-0">
                                        <div ng-show="showCanvasdiv">
                                            <!--<div pw-canvas
                                                 versionright="RightEyeUndoCount" options="{undo:true,color:selectedColor,lineWidth:selectedLineWidth,imageSrc:thumbnail.dataUrl,customCanvasId:'OcularRightEye'}"
                                                 data-image="{{thumbnail.dataUrl}}">
                                                <div class="pwCanvasPaint"></div>
                                            </div>-->
                                            <div class="col-lg-12">
                                                <div pw-color-selector="['#000', '#FF0000', '#FFFF00', '#00FF00', '#00FFFF']" color="selectedColor" class="canvas_color col-lg-6">
                                                </div>
                                                <div class="col-lg-6 text-left p-0 mt-5 mb-5 undo">
                                                    <button ng-click="ocurightundo()"
                                                            ng-disabled="RightEyeUndoCount < 1">
                                                        Undo (<span ng-bind="RightEyeUndoCount"></span>)
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 p-0 mt-10 mb-10 " ng-show="InvestigationDetails.ocularExamRightOrgan.length > 0">
                                        <div class="col-lg-2 EyeThumb" ng-repeat="item in InvestigationDetails.ocularExamRightOrgan">
                                            <i class="fa fa-times" ng-click="removeImage(item.DocumentId,'Right',0)" role="button" tabindex="0" ></i>
                                            <img class="img-responsive br-1" ng-src="{{item.DocURL}}" ng-click="EditOrgan(item,'Right')" />
                                        </div>
                                    </div>
                                    <textarea class="form-control mt-10" rows="2" placeholder="Remarks" ng-model="InvestigationDetails.OcularRightRemarks"></textarea>
                                    <div class="col-lg-12 text-right p-0 mt-5 mb-5 save_canvas">
                                        <button class="btn primary-btn" ng-show="!RightOrganEdit" ng-click="savecanvas('Right')" ng-disabled="!showCanvasdiv">
                                            Save Image
                                        </button>
                                        <button class="btn btn-primary" ng-show="RightOrganEdit" ng-click="UpdateCanvas('Right')">
                                            Update Image
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="br-1 col-lg-12 pt-15">
                                    <label class="customLabel">OS</label>
                                    <div class="col-lg-12 p-0">
                                        <div class="col-lg-7 p-0">
                                            <div class="form-group mt-10">
                                                <input type="file" name="file" class="file" ngf-accept="'image/*'" 
                                                      ngf-select="onFileSelectOcular($file,'Left')"
                                                       >
                                                <div class="input-group">
                                                    <span class="input-group-btn">
                                                        <button class="browse btn btn-browse input-lg"><i class="fa fa-picture-o pr-5"></i> Select File</button>
                                                    </span>
                                                    <input type="text" class="form-control input-lg CustomBrowse" disabled />
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-2 pr-0 text-right">
                                            <button class="btn warning-btn mt-10" ng-click="syncImages('Left')">Sync</button>
                                        </div>
                                        <div class="col-lg-3 pr-0 text-right">
                                            <button class="btn blue-btn mt-10" ng-click="GetTemplate('Left')">Get Template</button>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 p-0">
                                        <div ng-show="showCanvasdivleft">
                                            <!--<div pw-canvas
                                                 versionright="LeftEyeUndoCount" options="{undo:true,color:selectedColor,lineWidth:selectedLineWidth,imageSrc:thumbnailleft.dataUrl,customCanvasId:'OcularLeftEye'}">
                                                <div class="pwCanvasPaint"></div>
                                            </div>-->
                                            <div class="col-lg-12">
                                                <div pw-color-selector="['#000', '#FF0000', '#FFFF00', '#00FF00', '#00FFFF']" color="selectedColor" class="canvas_color col-lg-6">
                                                </div>
                                                <div class="col-lg-6 text-left p-0 mt-5 mb-5 undo">
                                                    <button ng-click="oculeftundo()"
                                                            ng-disabled="LeftEyeUndoCount < 1">
                                                        Undo (<span ng-bind="LeftEyeUndoCount"></span>)
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 p-0 mt-10 mb-10" ng-show="InvestigationDetails.ocularExamLeftOrgan.length > 0">
                                        <div class="col-lg-2 EyeThumb" ng-repeat="item in InvestigationDetails.ocularExamLeftOrgan">
                                            <i class="fa fa-times" ng-click="removeImage(item.DocumentId,'Left',0)" role="button" tabindex="0"></i>
                                            <img class="img-responsive br-1" ng-src="{{item.DocURL}}" ng-click="EditOrgan(item,'Left')" />
                                        </div>
                                    </div>
                                    <textarea class="form-control mt-10" rows="2" placeholder="Remarks" ng-model="InvestigationDetails.OcularLeftRemarks"></textarea>
                                    <div class="col-lg-12 text-right p-0 mt-5 mb-5 save_canvas">
                                        <button class="btn primary-btn" ng-show="!LeftOrganEdit" ng-click="savecanvas('Left')" ng-disabled="!showCanvasdivleft">
                                            Save Image
                                        </button>
                                        <button class="btn btn-primary" ng-show="LeftOrganEdit" ng-click="UpdateCanvas('Left')">
                                            Update Image
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>
</div>
