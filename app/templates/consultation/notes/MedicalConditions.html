<div class="pagecontent">
    <div class="row" ng-show="!cacheStorageItem.IsEasyMode">
        <div class="col-lg-12">
            <section class="tile text-shadow">
                <div class="tile-header mb-0">
                    <h1>Medical Conditions</h1>
                </div>
                <div class="tile-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <ul class="list-group">
                                <li class="list-group-item clearfix" ng-repeat="item in cacheStorageItem.MedicalHistory">
                                    <div class="col-lg-3">
                                        <div class="HistoryName">
                                        <span ng-bind="item.Description"></span>
                                    </div>
                                    </div>
                                    <div class="col-lg-1">
                                        <div class="checkboxcenter">
                                              <label class="checkboxlabel">
                                                <input  class="label__checkbox" type="checkbox"  ng-checked="item.ActiveIND == 'Y'" ng-click="changeStatus(item.ActiveIND,item.MedConditionId)"  />
                                                <span class="label__text">
                                                  <span class="label__check">
                                                    <i class="fa fa-check icon"></i>
                                                  </span>
                                                </span>
                                              </label>
                                              <img class="pull-right" src="img/medicalprescription.svg">
                                            </div>
                                    </div>
                                    <div class="col-lg-8 pl-0">
                                       <div class="Historytextbox">
                                        <textarea rows="1" placeholder="Notes" class="form-control"  ng-model="item.Notes"></textarea>
                                    </div> 
                                    </div>                                    
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <div class="row"></div>
</div>
<div id="myModal" class="modal" role="dialog">
    <div class="modal-common-dialog">
        <div class="modal-content">
            <div class="model-popup-header">
                <h4 class="modal-title" id="myModalLabel">Notes  </h4>
            </div>
            <div class="modal-body">
                <textarea rows="3" cols="50" placeholder="Enter your text" class="form-control"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn danger-btn" data-dismiss="modal">Cancel</button>
                <button class="btn primary-btn" data-dismiss="modal">Update </button>
            </div>
        </div>
    </div>
</div>
