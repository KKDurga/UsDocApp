<div class="tabs-header tabs_background" ng-controller="EhnoteVisualFieldTestCtrl">
    <div class="pagecontent">
        <div class="row">
            <div class="col-lg-12">
                <section class="tile tile-shadow">
                    <div class="tile-header mb-0">
                        <h1>Tangent screen exam</h1>
                    </div>
                    <div class="tile-body pt-0">
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="br-1 col-lg-12 pt-15">
                                    <label class="customLabel">OD</label>
                                    <div class="col-lg-12 p-0">
                                        <div class="col-lg-7 p-0">
                                            <div class="form-group mt-10">
                                                <input type="file" name="img[]" class="file" onchange="angular.element(this).scope().TangentFileChange(this.files,'Right')" />
                                                <div class="input-group">
                                                    <span class="input-group-btn">
                                                        <button class="browse btn btn-browse input-lg">
                                                            <i class="fa fa-picture-o pr-5"></i> Select File
                                                        </button>
                                                    </span>
                                                    <input type="text" class="form-control input-lg CustomBrowse" disabled />
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-2 pr-0 text-right">
                                            <button class="btn warning-btn mt-10" ng-click="syncImages('TangentRight')">Sync</button>
                                        </div>
                                        <div class="col-lg-3 pr-0 text-right">
                                            <button class="btn blue-btn mt-10" ng-click="GetTemplate('Right')">Get Template</button>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 p-0">
                                        <div ng-show="TangentRightdiv">
                                            <!--<div pw-canvas
                                                 versionright="TangentRightEyeUndoCount"
                                                 options="{undo:true,color:selectedColor,lineWidth:selectedLineWidth,imageSrc:thumbnailTangentright,customCanvasId:'TangentRightEye'}">
                                                <div class="pwCanvasPaint"></div>
                                            </div>-->
                                            <div class="col-lg-12">
                                                <div pw-color-selector="['#000', '#FF0000', '#FFFF00', '#00FF00', '#00FFFF']" color="selectedColor" class="canvas_color col-lg-6">
                                                </div>
                                                <div class="col-lg-6 text-left p-0 mt-5 mb-5 undo">
                                                    <button ng-click="undoTangentRightEye()" ng-disabled="TangentRightEyeUndoCount < 1">
                                                        Undo (<span ng-bind="TangentRightEyeUndoCount"></span>)
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 p-0 mt-10 mb-10" ng-show="InvestigationDetails.TangentRightOrgan.length  >0">
                                        <div class="col-lg-2  p-7" ng-repeat="item in InvestigationDetails.TangentRightOrgan">
                                            <i class="fa fa-times" ng-click="removeImage(item.DocumentId,'TangentRight',0)" role="button" tabindex="0"></i>
                                            <img class="img-responsive br-1" ng-src="{{item.DocURL}}" ng-click="EditTangentOrgan(item,'Right')" />
                                        </div>
                                    </div>
                                    <textarea class="form-control mt-10" rows="2" placeholder="Remarks" ng-model="InvestigationDetails.TangentRightRemarks"></textarea>
                                    <div class="col-lg-12 text-right p-0 mt-5 mb-5 save_canvas">
                                        <button class="btn primary-btn" ng-show="!RightTangentOrganEdit" ng-click="savecanvas('Right')" ng-disabled="!TangentRightdiv">
                                            Save Image
                                        </button>
                                        <button class="btn primary-btn" ng-show="RightTangentOrganEdit" ng-click="updatecanvas('Right')">
                                            Update Image
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="br-1 col-lg-12 pt-15">
                                    <label class="customLabel">OS</label>
                                    <div class="col-lg-12 p-0">
                                        <div class="col-lg-7 p-0">
                                            <div class="form-group mt-10">
                                                <input type="file" name="img[]" class="file" onchange="angular.element(this).scope().TangentFileChange(this.files, 'Left')"  />
                                                <div class="input-group">
                                                    <span class="input-group-btn">
                                                        <button class="browse btn btn-browse input-lg"><i class="fa fa-picture-o pr-5"></i> Select File</button>
                                                    </span>
                                                    <input type="text" class="form-control input-lg CustomBrowse" disabled />
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-2 pr-0 text-right">
                                            <button class="btn warning-btn mt-10" ng-click="syncImages('TangentLeft')">Sync</button>
                                        </div>
                                        <div class="col-lg-3 pr-0 text-right">
                                            <button class="btn blue-btn mt-10" ng-click="GetTemplate('Left')">Get Template</button>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 p-0">
                                        <div ng-show="TangentLeftdiv">
                                            <!--<div pw-canvas
                                                 versionright="TangentLeftEyeUndoCount"
                                                 options="{undo:true,color:selectedColor,lineWidth:selectedLineWidth,imageSrc:thumbnailTangentleft,customCanvasId:'TangentLeftEye'}">
                                                <div class="pwCanvasPaint"></div>
                                            </div>-->
                                            <div class="col-lg-12">
                                                <div pw-color-selector="['#000', '#FF0000', '#FFFF00', '#00FF00', '#00FFFF']" color="selectedColor" class="canvas_color col-lg-6">
                                                </div>
                                                <div class="col-lg-6 text-left p-0 mt-5 mb-5 undo">
                                                    <button ng-click="undoTangentLeftEye()" ng-disabled="TangentLeftEyeUndoCount < 1">
                                                        Undo (<span ng-bind="TangentLeftEyeUndoCount"></span>)
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 p-0 mt-10 mb-10" ng-show="InvestigationDetails.TangentLeftOrgan.length > 0">
                                        <div class="col-lg-2 p-7" ng-repeat="item in InvestigationDetails.TangentLeftOrgan">
                                            <i class="fa fa-times" ng-click="removeImage(item.DocumentId,'TangentLeft',0)" role="button" tabindex="0"></i>
                                            <img class="img-responsive br-1" src="{{item.DocURL}}" ng-click="EditTangentOrgan(item,'Left')" />
                                        </div>
                                    </div>
                                    <textarea class="form-control mt-10" rows="2" placeholder="Remarks" ng-model="InvestigationDetails.TangentLeftRemarks"></textarea>
                                    <div class="col-lg-12 text-right p-0 mt-5 mb-5 save_canvas">
                                        <button class="btn primary-btn" ng-show="!LeftTangentOrganEdit" ng-click="savecanvas('Left')" ng-disabled="!TangentLeftdiv">
                                            Save Image
                                        </button>
                                        <button class="btn primary-btn" ng-show="LeftTangentOrganEdit" ng-click="updatecanvas('Left')">
                                            Update Image
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

</div>
