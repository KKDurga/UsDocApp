<div class="modal-header border-rr-lr billing-table-bg p-10">
    <h4 class="modal-title">{{ 'ADDPATIENT' | translate}}</h4>
    <button type="button" class="btn btn-link m-b-10" ng-click="ClosePopup()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body p-15">
    <div class="row">
        <div class="col-lg-12">
            <section class="eh-panel">
                <div class="eh-body">
                    <table class="table tableno-bordered billing-tabledata bg-white m-b-0">
                        <thead>
                            <tr class="table-bg-header">
                                <th class="w-100">{{ 'DATE' | translate}}</th>
                                <th>{{ 'MODE' | translate}}<em>*</em></th>
                                <th>{{ 'TRANCE' | translate}} ID</th>
                                <th class="w-120">{{ 'AMOUNT' | translate}}<em>*</em></th>
                                <th>{{ 'BILLINGPROVIDER' | translate}}</th>
                                <th>{{ 'TOWARDSTO' | translate}}</th>
                                <th ng-show="PatientDepositsObj.DepositTypeId == 1 || PatientDepositsObj.DepositTypeId == '1'">{{ 'TOWARDSAPPOINTMENTS' | translate}} </th>
                                <th>{{ 'DEPOSITEDBY' | translate}}<em>*</em></th>
                            </tr>
                        </thead>
                        <tbody class="billing-tabledata">
                            <tr>
                                <td>
                                    <div class="form-group">
                                        <input type="text" class="register-input" ng-model="PatientDepositsObj.DepositDate" datepickerforusformat placeholder="MM-DD-YYYY" />
                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <select class="register-input" ng-model="PatientDepositsObj.PaymentModeId"
                                                ng-options="list.PaymentModeId as list.PaymentModeName for list in masterPaymentModes"
                                                ng-change="ChangePaymentMode(PatientDepositsObj.PaymentModeId, PatientDepositsObj)">
                                            <option value="" selected>Select</option>
                                        </select>
                                    </div>

                                </td>
                                <td>
                                    <div class="form-group">
                                        <input type="text" class="register-input" ng-model="PatientDepositsObj.TraceId" placeholder="Transaction Number" />
                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <input type="text" class="register-input" ng-model="PatientDepositsObj.DepositAmount" placeholder="Amount" numbers-only="numbers-only" />
                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <select class="register-input"
                                                ng-model="PatientDepositsObj.BillingProviderObj"
                                                ng-options="item as item.BillingProviderName for item in FacilitiesList"> <!--ng-change="ChangeBillingprovider(AddPatientDepositObj.BillingProviderObj);">-->
                                            <option value=""> {{ 'ALL' | translate}}</option>
                                        </select>
                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <select class="register-input" ng-model="PatientDepositsObj.DepositTypeId"
                                                ng-change="ChangeDepositType(PatientDepositsObj.DepositTypeId);">
                                            <option value="1">{{ 'COPAYMENT' | translate}}</option>
                                            <option value="2">{{ 'DEPOSIT' | translate}}</option>
                                        </select>
                                    </div>
                                </td>
                                <td ng-show="PatientDepositsObj.DepositTypeId == 1 || PatientDepositsObj.DepositTypeId == '1'">
                                    <div class="form-group">
                                        <select class="register-input" ng-model="PatientDepositsObj.AppointmentId"
                                                ng-options="list.AppointmentId as list.DoctorName +'-'+list.AppointmentDate for list in PatientDepositsObj.Selectedpatientobj.AppointmentmentsArray">
                                            <option value="">{{ 'SELECT' | translate}}</option>
                                        </select>
                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <input type="text" class="register-input" ng-model="PatientDepositsObj.DepositedBy" placeholder="" />
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <div class="row" ng-show="PatientDepositsObj.PaymentModeId==2">

        <div class="col-lg-6 p-r-0">
            <div class="form-group">
                <label>{{ 'CARDNUMBER' | translate}}</label>
                <input type="text" class="form-control" name="cardNumber" placeholder="Enter card number" ng-model="PatientDepositsObj.CardNumber" numbers-only maxlength="19" ng-change="cardnumberchangeevent(AdvanceBillObj.PaymentInfoObject.CardDetails.CardNumber)">
            </div>
        </div>
        <div class="col-lg-6">
            <div class="form-group">
                <label>{{ 'NAMEONCARD' | translate}}</label>
                <input type="text" class="form-control" name="nameOnCard" placeholder="Enter name on card"
                       ng-model="PatientDepositsObj.CardHolderName" alphabets-only>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="form-group">
                <label title="Payment">{{ 'CARDTYPE' | translate}}</label>
                <select class="form-control"
                        ng-model="PatientDepositsObj.CardTypeId"
                        ng-options="list.Id as list.Name for list in CardTypeDetails">
                    <option value=""> {{ 'SELECT' | translate}}</option>
                </select>

            </div>
        </div>

        <div class="col-lg-6">
            <div class="form-group">
                <label>{{ 'EXPIREDATE' | translate}}</label>
                <input type="text" class="form-control" name="nameOfBank" placeholder="MM/YY"
                       ng-model="PatientDepositsObj.CardExpiry" maxlength="7"
                       ng-keydown="ExpireremoveTagOnBackspace($event,PatientDepositsObj.CardExpiry)">
            </div>
        </div>
    </div>

    <div class="row" ng-show="PatientDepositsObj.PaymentModeId==3">
        <div class="col-lg-6">
            <div class="form-group">
                <label>{{ 'CHEQUENUMBER' | translate}}</label>
                <input type="text" placeholder="Enter Cheque Number" ng-model="PatientDepositsObj.ChequeNo" class="form-control" numbers-only="numbers-only" aria-invalid="false" maxlength="6">
            </div>
        </div>
        <div class="col-lg-6">
            <div class="form-group">
                <label>{{ 'CHEQUEDATE' | translate}}</label>
                <!--<input type="text" class="form-control" name="ChequeDate" placeholder="Enter Cheque Date" ng-model="PatientDepositsObj.ChequeDate">-->
                <input class="form-control icons-calendar"
                       ng-model="PatientDepositsObj.ChequeDate"
                       datepickerapnlus readonly />
            </div>
        </div>

    </div>

    <div class="row">
        <div class="col-lg-12 text-right m-t-10">
            <div class="form-group">
                <button type="button" class="btn btn-save-us w-100" ng-click="AddUpdatePatientDeposit(PatientDepositsObj)">{{ 'SAVE' | translate}}</button>
                <button type="button" class="btn btn-danger w-100" ng-click="ClosePopup()">{{ 'CLOSE' | translate}}</button>
            </div>
        </div>
    </div>
</div>
