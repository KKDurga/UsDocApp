<div>
    <div class="row">
        <div class="col-lg-6">
            <section class="tile tile-shadow">
                <div class="ehnote-header">
                    <h1>Income Analysis</h1>
                </div>
                <div class="ehnote-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div fusioncharts class="hide-trail-logo"
                                 width="100%"
                                 height="315"
                                 type="column2d"
                                 dataSource="{{myDataSource14}}"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <div class="col-lg-6">
            <section class="tile tile-shadow">
                <div class="ehnote-header">
                    <h1>Claims Settlement Speed</h1>(No.Of Claims  : 250, Paid :150)
                </div>
                <div class="ehnote-body">
                    <div class="row">
                        <div class="col-lg-4">

                            <section class="section-ehnote">

                                <div class="ehnote-body p-t-15 p-b-15">
                                    <div class="row">
                                        <div class="col-lg-12 text-center">
                                            <!--<img src="img/dashboard/total-patients.svg" />-->
                                            <label class="text-dashboard-name text-red font-size14" style="color:red">Fastest</label>
                                            <h2 class="count-dashboard">15 Days</h2>
                                        </div>
                                    </div>
                                </div>
                            </section>


                        </div>

                        <div class="col-lg-4">

                            <section class="section-ehnote">

                                <div class="ehnote-body p-t-15 p-b-15">
                                    <div class="row">
                                        <div class="col-lg-12 text-center">
                                            <!--<img src="img/dashboard/total-patients.svg" />-->
                                            <label class="text-dashboard-name text-red font-size14" style="color:red">Slowest</label>
                                            <h2 class="count-dashboard">39 Days</h2>
                                        </div>
                                    </div>
                                </div>
                            </section>


                        </div>
                        <div class="col-lg-4">

                            <section class="section-ehnote">

                                <div class="ehnote-body p-t-15 p-b-15">
                                    <div class="row">
                                        <div class="col-lg-12 text-center">
                                            <!--<img src="img/dashboard/total-patients.svg" />-->
                                            <label class="text-dashboard-name text-red font-size14" style="color:red">Average</label>
                                            <h2 class="count-dashboard">21 Days</h2>
                                        </div>
                                    </div>
                                </div>
                            </section>


                        </div>
                    </div>
                </div>
            </section>


            <section class="tile tile-shadow">
                <div class="ehnote-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-responsive patient-table mt-10">
                                <table class="table patient-listtable m-b-0">
                                    <thead>
                                        <tr>
                                            <th>Procedure Types</th>
                                            <th>Time Period</th>
                                            <th>Last Period</th>
                                            <th>% Last</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in  procedureItemTypesArray">
                                            <td ng-bind="item.ItemType"></td>
                                            <td ng-bind="item.TValue"></td>
                                            <td ng-bind="item.LastPValue"></td>
                                            <td ng-bind="item.LastP"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>



        </div>
    </div>


</div>
