
<div class="modal-header border-rr-lr billing-table-bg p-15">
    <h1 class="modal-title text-black fs-16">
        Add Attachment
    </h1>
    <button type="button" class="close m-r-10 m-b-15 pos-absolute" ng-click="ClosePopup()">
        <i class="fas fa-times"></i>
    </button>
</div>
<div class="modal-body p-15">
    <div class="row">
        <div class="col-lg-4">
            <span><b>Patient Name:</b></span>
            <span> {{selectedInsObj.PatientName}}</span>
        </div>
        <div class="col-lg-4">
            <span><b>Patient MR No:</b></span>
            <span>    {{selectedInsObj.PatientDisplayId}}</span>
        </div>
        <div class="col-lg-4">
            <span><b>Patient Claim No:</b></span>
            <span>  {{selectedInsObj.PatientClaimNo}}</span>
        </div>

    </div>
    <div class="row m-t-5" style="border-top:#000000">
        <div class="col-lg-8">
            <div class="file-upload">
                <div class="file-select">

                    <div class="file-select-button" id="fileName">Choose Files</div>
                    <div class="file-select-name">{{attachfileName}}</div>
                    <input type="file" name="file" class="upload"
                           ngf-select
                           ngf-pattern="'image/*,application/pdf'"
                           ngf-accept="'image/*,application/pdf'"
                           id="chooseFile"
                           ng-model="attachmentFiles"
                           ng-change="changeattachmentFiles(attachmentFiles)"
                           multiple="multiple"
                           title="Choose a file to upload">
                </div>
            </div>
            <span class="dis-block">Upload only .png, .jpg, .jpeg, .pdf files &amp; Max individual file size : 5 mb</span>
        </div>
        <div class="col-lg-4">
            <!--<button class="btn btn-success" ng-click="uploadAttachmentFile(attachmentFiles)">Upload</button>-->
            <button class="btn btn-danger">Clear</button>
        </div>
    </div>
    <div class="row" ng-show="PatientDepositsObj.PaymentModeId==2">

        <div class="col-lg-6 p-r-0">
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" class="form-control" name="cardNumber" placeholder="Enter card number" ng-model="PatientDepositsObj.CardNumber" numbers-only maxlength="19" ng-change="cardnumberchangeevent(AdvanceBillObj.PaymentInfoObject.CardDetails.CardNumber)">
            </div>
        </div>
        <div class="col-lg-6">
            <div class="form-group">
                <label>Name on Card</label>
                <input type="text" class="form-control" name="nameOnCard" placeholder="Enter name on card"
                       ng-model="PatientDepositsObj.CardHolderName" alphabets-only>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="form-group">
                <label title="Payment">Card Type</label>
                <select class="form-control"
                        ng-model="PatientDepositsObj.CardTypeId"
                        ng-options="list.Id as list.Name for list in CardTypeDetails">
                    <option value=""> select</option>
                </select>

            </div>
        </div>

        <div class="col-lg-6">
            <div class="form-group">
                <label>Expire Date</label>
                <input type="text" class="form-control" name="nameOfBank" placeholder="MM/YY"
                       ng-model="PatientDepositsObj.CardExpiry" maxlength="7"
                       ng-keydown="ExpireremoveTagOnBackspace($event,PatientDepositsObj.CardExpiry)">
            </div>
        </div>
    </div>

    <div class="row" ng-show="PatientDepositsObj.PaymentModeId==3">
        <div class="col-lg-6">
            <div class="form-group">
                <label>Cheque Number :</label>
                <input type="text" placeholder="Enter Cheque Number" ng-model="PatientDepositsObj.ChequeNo" class="form-control" numbers-only="numbers-only" aria-invalid="false" maxlength="6">
            </div>
        </div>
        <div class="col-lg-6">
            <div class="form-group">
                <label>Cheque Date :</label>
                <!--<input type="text" class="form-control" name="ChequeDate" placeholder="Enter Cheque Date" ng-model="PatientDepositsObj.ChequeDate">-->
                <input class="form-control icons-calendar"
                       ng-model="PatientDepositsObj.ChequeDate"
                       datepickerapnlus readonly />
            </div>
        </div>

    </div>

    <div class="row">
        <div class="col-lg-12 text-right m-t-10">
            <div class="form-group">
                <button type="button" class="btn btn-save-us w-100" ng-click="AddAttachmentForParticularClaim()">Save</button>
                <button type="button" class="btn btn-danger w-100" ng-click="ClosePopup()">Close</button>
            </div>
        </div>
    </div>
</div>
