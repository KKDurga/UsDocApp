<div class="tab-pane" id="Billing">
    <div class="container-fluid ">
        <div class="global-white-bg billingoutstandbgpayhis">
            <div class="registration-right-side" ng-show="PastBillinghistory.length > 0">
                <div class="row">
                    <div class="col-lg-12 pull-right"> <a href="" class="btn btn-filled pull-right mar10" ng-click="paymentPrint()"> <i class="fa fa-print"></i> Print Bill</a> </div>
                </div>
                <div class="registration-accordion" ng-repeat="item in PastBillinghistory">                                      
                    <div class="first-tab">
                        <input class="registration-radio" name="small-reg-past" id="{{'small-reg-past' + $index}}" ng-checked={{$index==0}} value="small-reg-past" type="radio">
                        <label for="{{'small-reg-past' + $index}}" class="acc-lbl-conadress consul-acc-payhis" ng-click="paymentHistoryTabClick(item)">
                            <div class="row">
                                <div class="col-lg-4">
                                    <span>
                                        <input type="checkbox" class="checkbox" ng-click="paymentHistoryAllClick(item,item.checkvalue)" ng-model="item.checkvalue"  ng-false-value="'N'" ng-true-value="'Y'">
                                        <span class="lbl zindex-9"></span>
                                    </span> <span class="txt-color-grey">Appointment Date:</span> <span class="txt-color-date" ng-bind="item.AppointmentDt | date:'dd-MMM-yyyy'"></span>
                                </div>                                
                                <div class="col-lg-8"> <span class="duebill-new " ng-hide="item.DueAmount == 0" ng-bind="item.DueAmount">DUE:</span> </div>
                            </div>
                        </label>
                        <article>
                            <div class="accordion-content payhiscontent">
                                <div class="accordion-form">
                                    <div class="table-container ">
                                        <table class="table appointmentTableThBg payhistablestyle">
                                            <thead>
                                                <tr>
                                                    <!--<th style="width: 5%"></th>-->
                                                    <th width="10%">Date</th>
                                                    <th width="20%">Treatment</th>
                                                    <th width="10%">Cost</th>
                                                    <th width="5%">Quantity</th>
                                                    <th width="5%" class="white-nowrap">Total Cost</th>
                                                    <th width="10%" ng-hide="Discountsetting == 'Y'">Discount</th>
                                                    <th width="10;">Received</th>
                                                    <th width="5%">Balance</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr class="appointment-row " ng-repeat="billData in item.patientCaseBillingHistoryDetails">
                                                    <!--<td>
                                                        <input type="checkbox" class="checkbox" ng-model="billData.childCheck" ng-false-value="'N'" ng-true-value="'Y'">
                                                        <span class="lbl"></span>
                                                    </td>-->
                                                    <td>
                                                        <span ng-bind="billData.BillDate | date:'dd-MMM-yyyy'"></span>
                                                    </td>
                                                    <td>
                                                        <span ng-show="(billData.ShowRow)" ng-bind="billData.ProcedureName"></span>
                                                        <p ng-show="(billData.ShowRow)" ng-if="billData.notes.length>0">Notes: {{billData.notes}}</p>
                                                    </td>
                                                    <td>
                                                        <span ng-show="(billData.ShowRow)" ng-bind="billData.ProcedureCost"></span>
                                                    </td>
                                                    <td>
                                                        <span ng-show="(billData.ShowRow)" ng-bind="billData.Multiplyfactor"></span>
                                                    </td>
                                                    <td>
                                                        <span ng-show="(billData.ShowRow)" ng-bind="(billData.ProcedureCost)*(billData.Multiplyfactor)"></span>
                                                    </td>
                                                    <td ng-hide="Discountsetting == 'Y'">
                                                        <span ng-show="(billData.ShowRow)" ng-bind="billData.DiscountCost"></span>
                                                        <span ng-show="(billData.ShowRow)">{{(billData.DiscountType == 'AMOUNT')? ' INR': ' %'}}</span>
                                                    </td>
                                                    <td>
                                                        <span ng-bind="billData.BilledCost"></span>
                                                    </td>
                                                    <td>
                                                        <span class="font-size14"><span ng-bind="billData.Balance"></span></span>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </div>
    </div>
 <div class="row"  ng-show="PastBillinghistory.length == 0 || PastBillinghistory.length==undefined">
     <div class="col-lg-12 text-center">
         <div class="billing-cominsoon">
             <img src="img/no-data/no-results.png">
            <div class="msg">
                <p class="goback-text"> There is no Payment History for this Patient </p>
                <p class="no-records-txt-line2">
                    No Payment History availble with selected dates !!
                </p>
            </div>
         </div>
     </div>
 </div>
</div>
