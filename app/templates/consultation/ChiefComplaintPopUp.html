<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Alert!</h1>
        <ul class="list__none-- d__f-- gap__x--8 mb__0--">
            <li>
                <button class="btn__lg-- btn__C71D27--o" ng-click="SaveChiefComplaint('Ignore')">Ignore</button>
            </li>
            <li>
                <button class="btn__lg-- btn__1d5558--f" ng-click="SaveChiefComplaint('Save')" ng-disabled="!IsRegularcheckUp && (newChiefCompaintObjj.ChiefComplaintObj == '' || newChiefCompaintObjj.ChiefComplaintObj == undefined)">Save</button>
            </li>
            <li>
                <a class="btn__close--" ng-click="CancleChiefCompliants()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body--">
        <div class="row">
            <div class="col-lg-12">
                <div class="form__group">
                    <label>Chief Complaint <em>*</em></label>
                    <!--<textarea class="form-control" rows="1" ng-model="ChiefComplaintText"
                    placeholder="Search Chief Complaints"
                    typeahead-on-select="SelectComplaint(ChiefComplaintText)"
                    ng-change="ChiefComplaintChange(ChiefComplaintText)"
                    uib-typeahead="item as item.ChiefComplaintName for item in getComplaints($viewValue)"></textarea>-->
                    <textarea class="form__control" rows="1" ng-model="newChiefCompaintObjj.ChiefComplaintObj"
                              typeahead-min-length="0"
                              maxlength="200"
                              placeholder="Search Chief Complaints"
                              typeahead-on-select="ComplaintsBlurChangenew(newChiefCompaintObjj.ChiefComplaintObj)"
                              ng-blur="changefocusOption();"
                              ng-change="onChiefComplaintChange(newChiefCompaintObjj.ChiefComplaintObj)"
                              uib-typeahead="item as item.ChiefComplaintName for item in getNewComplaints($viewValue)"></textarea>

                </div>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-lg-12">
                <div class="checkbox cn">
                    <label>
                        <input name="checkbox-1" type="checkbox" ng-model="IsRegularcheckUp" ng-change="changeRegularCheckUp(IsRegularcheckUp)">
                        <span class="checkbox-material">
                            <span class="check mr-5"></span>
                            <b class="">Regular Check up</b>
                        </span>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
