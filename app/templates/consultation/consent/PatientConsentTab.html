<div>
    <div class="appintment_view_pane">
        <div class="row">
            <div class="col-md-10">
                <input type="text" class="form-control ng-pristine ng-untouched ng-valid" placeholder="Search signed consent form" data-ng-model="Main.SearchPatientConsert" />
                <i class="fa search-patient-clearfield right-25" ng-hide="Main.SearchPatientConsert == ''||Main.SearchPatientConsert == undefined" data-ng-click="ClearSearchPatientConsert()"></i>
            </div>
            <div class="col-md-2 pull-right text-right">
                <button class="btn btn-primary" data-ng-click="PrintPatientConsertFrom(PatientConsertFromIndex,ConsertFromUrl)">Print</button>
            </div>
        </div>
    </div>
    <br>
    <div class="appintment_view_pane container-fluid row-highlight-alter consent-table">
        <div class="appintment_view_pane container-fluid row-highlight-alter consent-table">
            <div>
                <div class="signChk col-lg-6 pos-relative"  ng-repeat="item in patientSignedConsertFrom">
                    <label class="checkbox-group">
                        <input  type="checkbox" ng-model="PatientConsentCheck[$index]" class="chk DoctorcnsntCheck opacity-0" ng-change="ChkPatientSigned(item.documentID,$index,item.consentFormDocument.FileURL)" />
                        <span class="custom-checkbox"></span>
                    </label>
                    <div class="consent-form-image">
                        <img ng-src="img/consent-form.png" class="cur-poiter" />
                        <label ng-bind="item.consentFormDesc" title="{{item.ConsentFormDesc}}"></label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
