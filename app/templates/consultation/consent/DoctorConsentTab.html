<div data-ng-show="doctorConsentFormList.length !=0">
    <div class="row">
        <div class="col-lg-10">
            <input type="text" class="form-control" data-ng-model="Main.SearchDoctorConsert" placeholder="Search signed consent form" />
            <i class="fa search-patient-clearfield right-25" ng-hide="Main.SearchDoctorConsert == ''||Main.SearchDoctorConsert == undefined" data-ng-click="ClearSearchDoctorConsert()"></i>
        </div>
        <div class="col-lg-2">
            <button class="btn add-dr-btn primary-btn print-dr-btn" data-ng-click="PrintDoctorConsertFrom(DoctorConsertFromIndex,DoctorConsertFromUrl)">Print</button>
        </div>
    </div>
    <br>
    <div class="appintment_view_pane container-fluid row-highlight-alter consent-table">
        <div>
            <div class="signChk col-lg-6 pos-relative" data-ng-repeat="item in doctorConsentFormList  | filter:Main.SearchDoctorConsert as searchcount">
                <label class="checkbox-group">
                    <input type="checkbox" data-ng-model="DoctorConsentCheck[$index]" class="chk DoctorcnsntCheck opacity-0" data-ng-change="ChkDoctorConsertForm(item.documentid,item.DoctorID,$index,item.formUrl)" />
                    <span class="custom-checkbox"></span>
                </label>
                <div class="consent-form-image">
                    <img data-ng-src="img/consent-form.png" data-ng-click="GetDoctorConsentDownload(item.documentid,item.DoctorID,item.formUrl)" class="cur-poiter" />
                    <label data-ng-bind="item.ConsentFormDesc" title="{{item.ConsentFormDesc}}"></label>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="container-fluid" data-ng-show="doctorConsentFormList.length==0 || searchcount.length ==0">
    <div class="row">
        <div class="col-lg-12 text-center">
            <div class="grayImg-size">
                <img src="img/no-data/no-consentforms.png" />
            </div>
            <div>
                <label>
                    No consent forms have been uploaded yet in the settings
                </label>
            </div>
        </div>
        <div class="col-lg-12 text-center p-10-0-10" >
            <a href="" class="btn btn-primary deflt-bill-btn" data-ng-click="gotosettings()" role="button">
                Go To Settings
            </a>
        </div>
    </div>
</div>
