<div class="appintment_view_pane" >
    <form name="drugform" class="css-form" novalidate>
        <div class="form-group">
            <div class="row">
                <div class="col-lg-6">
                    <select class="form-control select-dropdown" data-ng-click="ConsentChange(SelectedConsertFrom)" data-ng-model="SelectedConsertFrom" data-ng-options="item.ConsentFormDesc as item.ConsentFormDesc for item in doctorConsentFormList">
                        <option value="">Select a Consent Form</option>
                    </select>
                    <div class="browse-wrap m-t-10">
                        <div class="title">Select File</div>
                        <input type="file" name="upload" class="upload" ngf-select="onFileSelectConsent($file)" ngf-pattern="'image/*,application/pdf'" ngf-accept="'image/*,application/pdf'" ngf-max-size="5MB" id="signedChooseBtn" title="Choose a file to upload">
                    </div>
                    <div class="files-formats">
                        <span class="dis-block">Upload only .png, .jpg, .jpeg, .pdf files &amp; Max individual file size : 5 mb</span>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="uplo-labco">
                        <label ng-repeat='item in ConsentImageDataArray' class="mr-5 font-sm">
                            <label >
                                <span ng-bind="item.consentFormDesc"></span>
                                <i  class="fa fa-times-circle cur-poiter" ng-click='deleteImageConsent(item)'></i>
                                <div ng-click="openLightboxModal($index)">
                                    <img ng-src="{{item.url}}" class="img-thumbnail height-60">
                                </div>
                            </label>
                        </label>
                        <div class="col-lg-3 m-r-5 font-sm" ng-repeat='item in ConsentPdfDataArray' >
                            <label class="m-l-4 mar-top-6">
                                <span ng-bind="item.consentFormDesc"></span>
                                <i  class="fa fa-times-circle cur-poiter" ng-click='deleteImageConsent(item)'></i>
                                <div class="height-60">
                                    <i class="fa fa-file-pdf-o text-reed fs-40" aria-hidden="true" ng-click="openPdfViewConsent(item.url,$index)" ></i>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="clearfix">
        </div>
    </form>
</div>
