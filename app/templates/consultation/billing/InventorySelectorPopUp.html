<div>

            <ul class="bg-ehnote text-center">

                    <a href="javascript:;">Inventory</a>
                </li>
            </ul>
        </div>
        <div class="tab-content" id="pills-tabContent">
            <div class="row popup_fonts ml-0 mr-0">
                <div class="col-lg-12 model_select_popup">
                    <div class="table-responsive">

                    <div class="col-lg-12 text-right mb-10">
