<div class="modal-header">
    <button class="close" ng-click="CloseBillingSettings('cancel')">&times;</button>
    <h4 class="modal-title">Billing Settings</h4>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <section class="tile tile-shadow mt-10">
                <div class="tile-body">
                    <div class="row">
                        <div class="col-md-12">
                            <ul class="setting-checkb mt-5">
                                <li class="clearfix pl-30 ng-scope" ng-repeat="item in BillingSettings track by $index">
                                    <div class="checkbox cn pull-left">
                                        <label>
                                            <input name="checkbox-2" type="checkbox" ng-model="item.Status" />
                                            <span class="checkbox-material">
                                                <span class="check"></span>
                                            </span>
                                            <small ng-bind="item.Name"></small>
                                        </label>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<div class="modal-footer">
    <button class="btn btn-success btn-block" ng-click="CloseBillingSettings('ok')">Save</button>
</div>
