
    <div class="modal-header">
        <button class="close" data-dismiss="modal" ng-click="cancel(subitem)">&times;</button>
        <!--<h4 class="modal-title">{{Type == 1?'Waved Off Remarks':'Zero Billing Remarks'}}</h4>-->
    <h4 class="modal-title">{{Type == 1 ? "Waved Off Remarks" : Type == 2 ? "Zero Billing Remarks" : Type == 3 ? "Discount Remarks" : Type == 6 ? "Add Gst" :"Discount Remarks"}}</h4>
    </div>
    <div class="modal-body">
        <div class="form-group" ng-if="Type == 1">
            <label>Waive Off Remarks</label>
            <textarea class="form-control" rows="2" ng-model="subitem.WavedOffRemarks"></textarea>
        </div>

        <div class="form-group" ng-if="Type == 4">
            <label>Waive Off Remarks</label>
            <textarea class="form-control" rows="2" ng-model="subitem.WaivedOffRemarks"></textarea>
        </div>
        <div class="form-group" ng-if="Type == 5">
            <label>Waive Off Remarks</label>
            <textarea class="form-control" rows="2" ng-model="subitem.WaivedOffRemarks"></textarea>
        </div>


        <div class="form-group" ng-if="Type == 2">
            <label>Zero Billing Remarks</label>
            <textarea class="form-control" rows="2" ng-model="subitem.ZeroBillingRemarks"></textarea>
        </div>

        <div class="row" ng-if="Type == 3">
            <div class="col-lg-12 m-b-10">
                <label>Add Discount</label>
                <div class="dis-flex">
                    <div class="w-100">
                        <input type="text"
                               ng-disabled="(subitem.ProcedureID == 0 ||subitem.ProcedureTypeId==8) && !subitem.IsSurgeryBilling || mainBillingObject.Mode==='Update' || subitem.IsWaved || item.PromoCodeApplied"
                               ng-model="subitem.DiscountCost"
                               ng-blur="CalculateTotalAmount(subitem,sindex)"
                               maxlength="{{subitem.DiscountType === 'PERCENT'?2:8}}"
                               class="form-control center-block btr-radius bbr-radius"
                               numbers-only="numbers-only" placeholder="0" />
                    </div>
                    <div>
                        <select class="form-control center-block btl-radius bbl-radius"
                                ng-disabled="(subitem.ProcedureID == 0 ||subitem.ProcedureTypeId==8) && !subitem.IsSurgeryBilling || mainBillingObject.Mode==='Update' || subitem.IsWaved"
                                ng-model="subitem.DiscountType"
                                ng-change="discountTypeChange(subitem,sindex)">
                            <option value="PERCENT">%</option>
                            <option value="AMOUNT">INR</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-lg-12">
                <div class="form-group">
                    <label>Remarks</label>
                    <textarea class="form-control" rows="2" ng-model="subitem.WavedOffRemarks"></textarea>
                </div>
            </div>
        </div>
        <div class="row" ng-if="Type == 6">
            <div class="col-lg-12 m-b-10">
                <label>Add Gst</label>
                <div class="dis-flex">
                    <div class="col-lg-12">
                        <input type="radio" id="ExclusiveGst{{sindex}}" title="Total Does Not Contain GST" name="gstTaxType{{sindex}}" ng-model="subitem.isExclusiveTax" ng-value="true" ng-click="changeGstType(subitem,sindex)">Excl
                        <input type="radio" id="InclusiveGst{{sindex}}" title="Total Contain GST" name="gstTaxType{{sindex}}" ng-model="subitem.isExclusiveTax" ng-value="false" ng-click="changeGstType(subitem,sindex)" >Incl
                    </div>
                    <div class="col-lg-12">
                        <select class="form-control" ng-model="subitem.Gst" ng-change="changeGST(subitem,sindex)">
                            <option value="" disabled="disabled"></option>
                            <option value="28">28</option>
                            <option value="18">18</option>
                            <option value="12">12</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    <div class="col-lg-12">
                        <label class="m-b-0 fs-10">CGST : {{subitem.Cgst}}</label> <label class="m-b-0 fs-10">SGST : {{subitem.Sgst}}</label>
                    </div>
                </div>
            </div>
           
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary" ng-disabled="subitem.WavedOffRemarks==''" ng-click="cancel(subitem)" ng-if="Type == 1">Submit</button>
        <button class="btn btn-primary" ng-disabled="subitem.WaivedOffRemarks==''" ng-click="cancel(subitem)" ng-if="Type == 4">Submit</button>
        <button class="btn btn-primary" ng-disabled="subitem.WaivedOffRemarks==''" ng-click="cancel(subitem)" ng-if="Type == 5">Submit</button>
        <button class="btn btn-danger" ng-click="cancel(subitem,'cancel')" ng-if="Type == 6">Clear</button>
        <button class="btn btn-primary" ng-click="cancel(subitem,'save')" ng-if="Type == 6">Add</button>
        <button class="btn btn-primary" ng-disabled="subitem.WavedOffRemarks==''" ng-click="cancel(subitem,'save')" ng-if="Type == 3">Add Discount</button>
        <button class="btn btn-primary" ng-disabled="subitem.ZeroBillingRemarks==''" ng-click="cancel(subitem)" ng-if="Type == 2">Submit</button>
    </div>
