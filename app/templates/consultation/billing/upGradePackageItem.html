<div class="modal-header">
    <button class="close" ng-click="closeupgradePackage('cancel')">&times;</button>
    <h4 class="modal-title">Upgrade Package</h4>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <label style="font-weight: 700;">Actual Package : <span ng-bind="subitem.ProcedureName" style="color:red;"> </span></label>
            <label style="font-weight: 700;">Cost : <span ng-bind="subitem.ProcedureCost" style="color:red;"> </span></label>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table table-bordered m-b-0">
                    <thead>
                        <tr>
                            <td width="50%">Upgrade Package</td>
                            <td width="25%">Package Cost</td>
                            <td width="25%">Upgraded CoPay</td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>

                            <td>
                                <input type="text"
                                       ng-model="newUpgradePackageObj.selectedParticular"
                                       typeahead-min-length="2"
                                       class="form-control pull-left"
                                       uib-typeahead="Predlist as Predlist.ProcedureName for Predlist in getSurgeryProcedures($viewValue,newUpgradePackageObj)"
                                       typeahead-on-select="PreSelectUpgradeProcedure(newUpgradePackageObj.selectedParticular,newUpgradePackageObj,$index)"
                                       placeholder="Search Procedure"
                                       typeahead-editable="false"
                                       typeahead-template-url="CustomBillingItemSearch.html" />
                            </td>
                            <td>
                                <input type="text" class="form-control" ng-disabled="newUpgradePackageObj.UpgradedProcedureId=='' || newUpgradePackageObj.UpgradedProcedureId==0" ng-model="newUpgradePackageObj.UpgradedProcedureCost" ng-change="changeCost(newUpgradePackageObj)"  numbers-only="numbers-only"
                                                                       maxlength="8"/>
                            </td>
                            <td>
                                <label>{{newUpgradePackageObj.UpgradeCost}}</label>
                            </td>


                        </tr>
                        
                       
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

 


<div class="modal-footer">
    <div class="col-lg-10">
        <label class="text-red" ng-show="newUpgradePackageObj.costError">Upgraded Package Cost Should not be Less Than Actual Package Cost *</label>
    </div>
    <div class="col-lg-2" style="float:right">
        <button class="btn btn-success btn-block" ng-click="saveUpgradepackage('ok')" ng-disabled="newUpgradePackageObj.costError">Save</button>
    </div>

</div>
