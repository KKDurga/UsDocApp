    <div class="container-fluid" data-ng-show="HistoryDataArray.length == 0">
        <div class="row">
            <div class="col-lg-12 text-center">
                <label>No History of Transactions</label>
            </div>
        </div>
    </div>
    <div data-ng-show="HistoryDataArray.length > 0">
        <table class="bill-lab-table">
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Bill No.</th>
                <th>Description</th>
                <th>Status</th>
                <th>Amount</th>
            </tr>
            <tr data-ng-repeat="item in HistoryDataArray track by $index">
                <td {{item | json}}></td>
                <td data-ng-bind-template="{{item.transactionDate | date:'dd-MM-yyyy'}}"></td>
                <td data-ng-bind="item.transactionType"></td>
                <td data-ng-bind="item.billNo"></td>
                <td data-ng-bind="item.actions"></td>
                <td data-ng-if="item.currentStatus=='N'">Not Accepted</td>
                <td data-ng-if="item.currentStatus=='Y'">Accepted</td>
                <td data-ng-hide="item.transactionType=='ConsentForm'" data-ng-bind="item.amt"></td>
            </tr>
        </table>
        <div class="bill-no-history text-center" data-ng-show="HistoryDataArray.length==0">
            <label>
                No History Found
            </label>
        </div>
    </div>
