<div class="container-fluid">
    <br>
    <div class="global-white-bg  billingoutstandbgpayhis">
        <!--Main.PatienBillingHistory Replaced  with NewPatientBillHistoryArray-->
        <div class="registration-right-side" ng-show="NewPatientBillHistoryArray.length != 0 || NewPatientBillHistoryArray.length != undefined">
            <div class="row">
                <div class="col-lg-12">
                    <a class="btn btn-filled pull-right mar10" ng-click="paymentPrint()">
                        <i class="fa fa-print"></i> Print Bill
                    </a>
                </div>
            </div>
            <div class="registration-accordion" ng-repeat="item in Main.PatienBillingHistory">
                <div class="first-tab">
                    <input class="registration-radio" name="small-reg" id="{{'small-reg' + $index}}" ng-checked={{$index==0}} value="small-reg" type="radio" />
                    <label for="{{'small-reg' + $index}}" class="acc-lbl-conadress consul-acc-payhis" ng-click="paymentHistoryTabClick(item)">
                        <div class="row">
                            <div class="col-lg-4">
                                <span>
                                    <input type="checkbox" ng-click="paymentHistoryAllClick(item,item.checkvalue)" class="checkbox" ng-model="item.checkvalue" ng-false-value="'N'" ng-true-value="'Y'">
                                    <span class="lbl"></span>
                                </span>
                                <span class="txt-color-grey valign-middle">Appointment Date:</span>
                                <span class="txt-color-date valign-middle" ng-bind="item.AppointmentDt | date:'dd-MMM-yyyy'" ></span>
                            </div>
                            <div class="col-lg-8">
                                <span class="duebill-new" ng-hide="item.DueAmount == 0" ng-bind="item.DueAmount">DUE:</span>
                            </div>
                        </div>
                    </label>
                    <article>
                        <div class="accordion-content payhiscontent">
                            <div class="accordion-form">
                                <div class="table-container ">
                                    <table class="table appointmentTableThBg payhistablestyle">
                                        <thead>
                                            <tr>
                                                <!--<th style="width: 5%"></th>-->
                                                <th width="10%">Date</th>
                                                <th width="20%">Treatment</th>
                                                <th width="10%">Cost</th>
                                                <th width="5%">Quantity</th>
                                                <th width="5%" class="white-nowrap">Total Cost</th>
                                                <th width="10%" ng-hide="Discountsetting == 'Y'">Discount</th>
                                                <th width="10%">Received</th>
                                                <th width="5%">Balance</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr class="appointment-row" ng-repeat="bill in item.patientCaseBillingHistoryDetails">
                                                <!--<td style="vertical-align:top">
                                                    <input type="checkbox" class="checkbox" ng-model="bill.childCheck" ng-false-value="'N'" ng-true-value="'Y'">
                                                    <span class="lbl"></span>
                                                </td>-->
                                                <td class="valign-top">
                                                    <span ng-bind="bill.BillDate | date:'dd-MMM-yyyy'"></span>
                                                </td>
                                                <td class="valign-top">
                                                    <span ng-show="(bill.ShowRow)" ng-bind="bill.ProcedureName"></span>
                                                    <p ng-show="(bill.ShowRow)" ng-if="bill.notes.length>0" class="text-justify">Notes: <span ng-bind="bill.notes"></span></p>
                                                </td>
                                                <td class="valign-top">
                                                    <span ng-show="(bill.ShowRow)" ng-bind="bill.ProcedureCost"></span>
                                                </td>
                                                <td class="valign-top">
                                                    <span ng-show="(bill.ShowRow)" ng-bind="bill.Multiplyfactor"></span>
                                                </td>
                                                <td class="valign-top">
                                                    <span ng-show="(bill.ShowRow)" ng-bind="(bill.ProcedureCost)*(bill.Multiplyfactor)"></span>
                                                </td>
                                                <td ng-hide="Discountsetting == 'Y'" class="valign-top">
                                                    <span ng-show="(bill.ShowRow)" ng-bind="bill.DiscountCost"></span>
                                                    <span ng-show="(bill.ShowRow)" ng-bind="(bill.DiscountType == 'AMOUNT')? ' INR': ' %'"></span>
                                                </td>
                                                <td class="valign-top">
                                                    <span ng-show="(bill.ShowRow)" ng-bind="bill.BilledCost"></span>
                                                </td>
                                                <td class="valign-top">
                                                    <span class="font-size14"><span ng-bind="bill.Balance"></span></span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="billing-cominsoon norecords-found-patients text-center" ng-show="NewPatientBillHistoryArray.length == 0">
    <img src="img/no-data/no_payment_history.png" />
    <div class="msg">
        <p class="goback-text-line1">No payment history for this patient </p>
    </div>
</div>
