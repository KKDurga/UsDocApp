<div class="modal-header">
    <button class="close" ng-click="ClosePayment('cancel')">&times;</button>
    <h4 class="modal-title">Payment</h4>
</div>

<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table tableno-bordered mb-0">
                    <tbody>
                        <tr>
                            <td>Total Amount</td>
                            <td width="20">:</td>
                            <td>
                                <label ng-bind="Sale.TotalAmount | number:2"></label>
                            </td>
                        </tr>
                        <tr>
                            <td>Total Received</td>
                            <td width="20">:</td>
                            <td>
                                <label ng-bind="Sale.TotalReceived | number:2"></label>
                            </td>
                        </tr>
                        <tr>
                            <td>Due</td>
                            <td width="20">:</td>
                            <td>
                                <label ng-bind="Sale.Due | number:2"></label>
                            </td>
                        </tr>
                        <tr>
                            <td>Cash</td>
                            <td width="20">:</td>
                            <td>
                                <input type="number" class="form-control height-25" ng-model="Sale.CashAmount" ng-change="PayBalance()" />
                            </td>
                        </tr>
                        <tr>
                            <td>Card</td>
                            <td width="20">:</td>
                            <td>
                                <input type="number" class="form-control height-25" ng-model="Sale.CardAmount" ng-change="PayBalance()" />
                            </td>
                        </tr>
                        <tr>
                            <td>Cheque</td>
                            <td width="20">:</td>
                            <td>
                                <input type="number" class="form-control height-25" ng-model="Sale.ChequeAmount" ng-change="PayBalance()" />
                            </td>
                        </tr>
                        <tr>
                            <td>Trancation</td>
                            <td width="20">:</td>
                            <td>
                                <input type="number" class="form-control height-25" ng-disabled="true" ng-model="Sale.TrancationNumber" />
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal-footer">
    <button class="btn btn-success btn-block"
            ng-disabled="Sale.TotalReceived > Sale.TotalAmount"
            ng-click="SavePayment('ok')">
        Save
    </button>
</div>
