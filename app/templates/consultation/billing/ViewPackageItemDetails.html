<div class="modal-header">
    <button class="close" ng-click="CloseAddDoctor('cancel')">&times;</button>
    <h4 class="modal-title">{{ItemType}} Details</h4>
</div>
<div class="modal-body" ng-if="isPackageItem">
    <div class="row">
        <div class="col-lg-12">
            <label>Package Name : <span ng-bind="item.ProcedureName"> </span> </label>
        </div>
    </div>
    <div class="row" ng-show="PackageItemDetailsArray.length > 0">
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table table-bordered m-b-0">
                    <thead>
                        <tr>
                            <td width="2%">S No.</td>
                            <td width="48%">Package</td>
                            <td width="15%">Qty</td>
                            <td width="35%">Cost</td>
                            <td width="35%">PackageItemCost</td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="mitem in PackageItemDetailsArray">
                            <td ng-bind="$index+1"> </td>
                            <td ng-bind="mitem.ItemName"></td>
                            <td ng-bind="mitem.Quantity"></td>
                            <td ng-bind="mitem.Cost | number:2"></td>
                            <td>
                                <input type="text"
                                       class="form-control"
                                       placeholder=""
                                       ng-model="mitem.PackageItemCost" valid-number
                                       ng-change="CalculateTempTotal()" />
                            </td>
                        </tr>
                        <tr>
                            <td colspan="4" class="text-right">Total</td>
                            <td colspan="1" ng-bind="TempTotal | number:2"></td>
                        </tr>
                        <tr>
                            <td colspan="4" class="text-right">Package Cost</td>
                            <td colspan="1" ng-bind="item.Total | number:2"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <div class="row" ng-hide="PackageItemDetailsArray.length > 0">
        <div class="col-lg-12 text-center">
            <div class="billing-cominsoon">
                <img src="img/no-data/no-settings.png">
                <div class="msg">
                    <p class="no-records-txt-line2">
                        Package Details Not Added
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-body" ng-if="isInventoryItem">
    <div class="row">
        <div class="col-lg-12">
            <label>Inventory Items </label>
        </div>
    </div>
    <div class="row" ng-show="InventoryItemDetailsArray.length > 0">
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table table-bordered m-b-0">
                    <thead>
                        <tr>
                            <td width="2%">S No.</td>
                            <td width="38%">Item Name</td>
                            <td width="10%">Category</td>
                            <td width="10%">Batch</td>
                            <td width="10%">Mrp</td>
                            <td width="10%">Qty</td>
                            <td width="10%">Discount</td>
                            <td width="10%">Total</td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="mitem in InventoryItemDetailsArray">
                            <td ng-bind="$index+1"></td>
                            <td ng-bind="mitem.ItemName"></td>
                            <td ng-bind="mitem.CategoryName"> </td>
                            <td ng-bind="mitem.BatchNumber"> </td>
                            <td ng-bind="mitem.Cost"> </td>
                            <td ng-bind="mitem.Quantity"> </td>
                            <td ng-bind="mitem.DiscountAmount"> </td>
                            <td ng-bind="mitem.Total"> </td>
                        </tr>
                        <tr>
                            <td colspan="6" class="text-right">Total Cost :</td>
                            <td colspan="2" class="text-right" ng-bind="item.Total"> </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>




    </div>
    <div class="row" ng-hide="InventoryItemDetailsArray.length > 0">
        <div class="col-lg-12 text-center">
            <div class="billing-cominsoon">
                <img src="img/no-data/no-settings.png">
                <div class="msg">
                    <p class="no-records-txt-line2">
                        Package Details Not Added
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="modal-footer">

    <div class="col-lg-2" style="float:right">
        <button class="btn btn-success btn-block" ng-click="SaveDoctor('ok')" ng-bind="isPackageItem ?'Save':'Close'"></button>
    </div>

</div>
