<div class="modal-header">
    <button class="close" ng-click="CloseAddDoctor('cancel')">&times;</button>
    <h4 class="modal-title">Add Doctor</h4>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <div class="form-group">
                <label>Select Treatment Doctor</label>
                <div class="sel-doc-box ml-0 width-100">
                    <div class="dropdown dropdown-scroll width-100">
                        <button class="form-control select-dropdown boxshadowbill text-left" id="dropdownMenu1" data-toggle="dropdown"
                                ng-bind="SelectedTreatmentDoctor.FullName ? SelectedTreatmentDoctor.FullName:'Select Doctor'"></button>

                        <div class="dropdown-menu dr-drop-app" role="menu" aria-labelledby="dropdownMenu1">
                            <div class="input-group droposearch-EH input-group-sm search-control">
                                <span class="input-group-addon">
                                    <span class="mainsearch-App">
                                        <i class="fas fa-search"></i>
                                    </span>
                                </span>
                                <input type="text" class="form-control" placeholder="Search Doctor" ng-model="SearchText" />
                            </div>
                            <div class="drop-menu-Scroll apptsearchdroplist">
                                <ul>
                                    <li role="presentation"
                                        ng-repeat="item in TreatmentAndConversionDoctorList  | filter:{'FullName':SearchText} track by $index"
                                        ng-click="changeAppointmentDoctor(item,1)">
                                        <a href="javascript:;" ng-bind="item.FullName"></a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-12" ng-if="SpecializationId == 2 ||SpecializationId == 16">
            <div class="form-group">


                <label>Select Conversion Doctor <em ng-show="item.selectedParticular.ProcedureTypeId == 1" class="pl-5">*</em> </label>
                <div class="sel-doc-box ml-0 width-100">
                    <div class="dropdown dropdown-scroll width-100">
                        <button class="form-control select-dropdown boxshadowbill text-left" id="dropdownMenu1" data-toggle="dropdown"
                                ng-bind="SelectedConversionDoctor.FullName ? SelectedConversionDoctor.FullName:'Select Doctor'"></button>

                        <div class="dropdown-menu dr-drop-app" role="menu" aria-labelledby="dropdownMenu1">
                            <div class="input-group droposearch-EH input-group-sm search-control">
                                <span class="input-group-addon">
                                    <span class="mainsearch-App">
                                        <i class="fas fa-search"></i>
                                    </span>
                                </span>
                                <input type="text" class="form-control" placeholder="Search Doctor" ng-model="SearchText1" />
                            </div>
                            <div class="drop-menu-Scroll apptsearchdroplist">
                                <ul>
                                    <li role="presentation"
                                        ng-repeat="item in TreatmentAndConversionDoctorList  | filter:{'FullName':SearchText1} track by $index"
                                        ng-click="changeAppointmentDoctor(item,2)">
                                        <a href="javascript:;" ng-bind="item.FullName"></a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-12">
            <div class="form-group">
                <label>Select Consultant Doctor</label>
                <div class="sel-doc-box ml-0 width-100">
                    <div class="dropdown dropdown-scroll width-100">
                        <button class="form-control select-dropdown boxshadowbill text-left" id="dropdownMenu1" data-toggle="dropdown"
                                ng-bind="SelectedConsultantDoctor.FullName ? SelectedConsultantDoctor.FullName:'Select Doctor'"></button>

                        <div class="dropdown-menu dr-drop-app" role="menu" aria-labelledby="dropdownMenu1">
                            <div class="input-group droposearch-EH input-group-sm search-control">
                                <span class="input-group-addon">
                                    <span class="mainsearch-App">
                                        <i class="fas fa-search"></i>
                                    </span>
                                </span>
                                <input type="text" class="form-control" placeholder="Search Doctor" ng-model="SearchText2" />
                            </div>
                            <div class="drop-menu-Scroll apptsearchdroplist">
                                <ul>
                                    <li role="presentation"
                                        ng-repeat="item in ConsultantDoctorList  | filter:{'FullName':SearchText2} track by $index"
                                        ng-click="changeAppointmentDoctor(item,3)">
                                        <a href="javascript:;" ng-bind="item.FullName"></a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="col-lg-12" ng-if="SpecializationId == 16">
            <div class="form-group">
                <label>Select Referral Doctor </label>              
                <div class="sel-doc-box ml-0 width-100">
                    <div class="dropdown dropdown-scroll width-100">
                        <button class="form-control select-dropdown boxshadowbill text-left" id="dropdownMenu1" data-toggle="dropdown"
                                ng-bind="SelectedTherapyst.FullName ? SelectedTherapyst.FullName:'Select Doctor'"></button>

                        <div class="dropdown-menu dr-drop-app" role="menu" aria-labelledby="dropdownMenu1">
                            <div class="input-group droposearch-EH input-group-sm search-control">
                                <span class="input-group-addon">
                                    <span class="mainsearch-App">
                                        <i class="fas fa-search"></i>
                                    </span>
                                </span>
                                <input type="text" class="form-control" placeholder="Search Doctor" ng-model="SearchText4" />
                            </div>
                            <div class="drop-menu-Scroll apptsearchdroplist">
                                <ul>
                                    <li role="presentation"
                                        ng-repeat="item in TherapystDoctorList  | filter:{'FullName':SearchText4} track by $index"
                                        ng-click="changeAppointmentDoctor(item,5)">
                                        <a href="javascript:;" ng-bind="item.FullName"></a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
