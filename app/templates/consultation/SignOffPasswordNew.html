<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Password Required</h1>
        <ul class="us-controls">
            <li>
                <a ng-if="SignOffPasswordObj.Screen!='PostOp-R1'&&SignOffPasswordObj.Screen!='PostOp-R2'" class="btn__close--" ng-click="CanclsignoffPopup()">
                    <i class="close__w32--"></i>
                </a>
                <a ng-if="SignOffPasswordObj.Screen=='PostOp-R1'||SignOffPasswordObj.Screen=='PostOp-R2'" class="btn__close--" ng-click="CanclsignoffPopupForRecoveryScreens()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body--">
        <div class="d__f-- ai__c-- fw__w-- gap__10--" ng-if="SignOffPasswordObj.Type=='bulksignoff'">
            <div ng-repeat="item in SignOffPasswordObj.screenlist">
                <label class="cur-poiter h-20">
                    <!--<input type="checkbox" class="checkbox" ng-model="item.isasctive" ng-disabled="true" ng-if="(RoleId==item.RoleId)"> <span ng-if="(RoleId==item.RoleId)">{{item.Screen}}</span>-->
                    <input type="checkbox" class="checkbox" ng-model="item.isasctive" ng-disabled="true" ng-if="(RoleId==item.RoleId)">
                    <span ng-if="RoleId == item.RoleId">
                        <span ng-if="item.Screen == 'PostOp-R1'">Recovery I</span>
                        <span ng-if="item.Screen == 'PostOp-R2'">Recovery II</span>
                        <span ng-if="item.Screen != 'PostOp-R1'
                         && item.Screen != 'PostOp-R2'">
                            {{ item.Screen }}
                        </span>
                    </span>
                    <span class="lbl"></span>
                </label>
            </div>

        </div>
        <div class="form__group " ng-if="(IsshowBulkSignrefreshButton)&&iSshowconsentalertscreen">
            <div>
                Pending Signatures in Consent forms:  <ul class="flex-flow-ulli-mb0">
                    <li ng-if="signoffUserObj.NurseAccess&&patientsignrequiredcount>0">
                        <button class="custom-button" ng-class="(patientsignrequiredcount>0)?'incomplete':''" title="Patient Sign">P</button>
                    </li>
                    <li ng-if="signoffUserObj.SurgeonAccess&&DoctorSignsignrequiredcount>0">
                        <button class="custom-button" ng-class="(DoctorSignsignrequiredcount>0)?'incomplete':''" title="Doctor Sign">D</button>
                    </li>
                    <li ng-if="signoffUserObj.NurseAccess&&Staffsignrequiredcount>0">
                        <button class="custom-button" ng-class="(Staffsignrequiredcount>0)?'incomplete':''" title="Staff Sign">S</button>
                    </li>
                    <li ng-if="signoffUserObj.AnesthesiaAccess&&Anesthesiasignrequiredcount>0">
                        <button class="custom-button" ng-class="(Anesthesiasignrequiredcount>0)?'incomplete':''" title="Anesthesist Sign">A</button>
                    </li>

                    <li ng-if="signoffUserObj.NurseAccess&&Gaurdiansignrequiredcount>0">
                        <button class="custom-button" ng-class="(Gaurdiansignrequiredcount>0)?'incomplete':''" title="Guardian Sign">G</button>

                    </li>
                    <li><em>*</em></li>
                    <li ng-show="(signoffUserObj.NurseAccess&&Gaurdiansignrequiredcount>0)||(signoffUserObj.AnesthesiaAccess&&Anesthesiasignrequiredcount>0)||(signoffUserObj.NurseAccess&&Staffsignrequiredcount>0)||(signoffUserObj.SurgeonAccess&&DoctorSignsignrequiredcount>0)||(signoffUserObj.NurseAccess&&patientsignrequiredcount>0)">
                        <button type="button"
                                class="btn btn-success btn-sm"
                                ng-click="ApplySignature()"
                                title="Apply Signature to all unsigned consents">

                            <!-- Idle state -->
                            <span>
                                <i class="fa fa-pencil-square-o"></i>&nbsp; Apply Consents Signature
                            </span>



                        </button>
                    </li>
                </ul>
            </div>
        </div>
        <div class="" ng-class="signoffUserObj.NurseAccess && signoffUserObj.AnesthesiaAccess ? 'd__f-- fd__c-- gap__8-- py__10--': ''">
            <div class="row nocolpad" ng-show="signoffUserObj.NurseAccess">
                <div ng-class="signoffUserObj.NurseAccess && !signoffUserObj.AnesthesiaAccess ? 'col-lg-12' : 'col-lg-6'">
                    <div class="form__group">
                        <label>Nurse</label>
                        <select ng-disabled="signoffUserObj.IsNurseUnSign||IsNurseSignValid" ng-model="signoffUserObj.NurseUserId"
                                ng-options="item.DoctorID as item.FullName for item in NurseArray">
                            <option value="">Select</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-12" ng-class="signoffUserObj.NurseAccess && !signoffUserObj.AnesthesiaAccess ? 'col-lg-12' : 'col-lg-6'">
                    <div class="form__group">
                        <label>Password</label>
                        <input type="password"
                               ng-disabled="signoffUserObj.NurseUserId==null||IsNurseSignValid"
                               ng-model="signoffUserObj.NursePassword"
                               placeholder="Enter Sign Off Password" maxlength="30">
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="d__f-- fd__c-- gap__15--" ng-show="signoffUserObj.IsNurseUnSign">
                        <div class="form__group mt__10--">
                            <label>Remarks</label>
                            <textarea class="msd-elastic: \n;"
                                      quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                                      ng-model="signoffUserObj.NurseUnSignRemarks" maxlength="500"></textarea>
                        </div>
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="form__group mt__5--">
                        <label></label>
                        <button class="btn__xl-- btn__2D2D47--f width__100--" ng-if="SignOffPasswordObj.Screen!='PostOp-R1'&&SignOffPasswordObj.Screen!='PostOp-R2'" ng-click="ValidateUserSignOff('Nurse')">Validate & Save</button>
                        <button class="btn__xl-- btn__2D2D47--f width__100--" ng-if="(SignOffPasswordObj.Screen=='PostOp-R1'||SignOffPasswordObj.Screen=='PostOp-R2')&&!IsNurseSignValid" ng-click="ValidateUserSignOff('Nurse')">Validate & Save</button>
                    </div>
                </div>
            </div>

            <!---->

            <div class="row nocolpad" ng-show="signoffUserObj.AnesthesiaAccess">
                <div ng-class="signoffUserObj.AnesthesiaAccess && !signoffUserObj.NurseAccess ? 'col-lg-12' : 'col-lg-6'">
                    <div class="form__group">
                        <label>Anesthetist</label>
                        <select ng-disabled="signoffUserObj.IsAnesthesiaUnSign||IsAnesthesiaSignValid" ng-model="signoffUserObj.AnesthesiaUserId"
                                ng-options="item.DoctorID as item.FullName for item in AllAnesthetistList">
                            <option value="">Select</option>
                        </select>
                    </div>
                </div>
                <div ng-class="signoffUserObj.AnesthesiaAccess && !signoffUserObj.NurseAccess ? 'col-lg-12' : 'col-lg-6'">
                    <div class="form__group">
                        <label>Password</label>
                        <input type="password" ng-disabled="signoffUserObj.AnesthesiaUserId==null||IsAnesthesiaSignValid" ng-model="signoffUserObj.AnesthesiaPassword" placeholder="Enter Sign Off Password" maxlength="30">
                    </div>
                </div>

                <div class="col-lg-12">
                    <div class="d__f-- fd__c-- gap__15--" ng-show="signoffUserObj.IsAnesthesiaUnSign">
                        <div class="form__group mt__10--">
                            <label>Remarks</label>
                            <textarea class="msd-elastic: \n;"
                                      quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                                      ng-model="signoffUserObj.AnesthesiaUnSignRemarks" maxlength="500"></textarea>
                        </div>
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="form__group mt__5--">
                        <label></label>
                        <button class="btn__xl-- btn__2D2D47--f width__100--" ng-if="SignOffPasswordObj.Screen!='PostOp-R1'&&SignOffPasswordObj.Screen!='PostOp-R2'" ng-click="ValidateUserSignOff('Anesthesia')">Validate & Save </button>
                        <button class="btn__xl-- btn__2D2D47--f width__100--" ng-if="(SignOffPasswordObj.Screen=='PostOp-R1'||SignOffPasswordObj.Screen=='PostOp-R2')&&!IsAnesthesiaSignValid" ng-click="ValidateUserSignOff('Anesthesia')">Validate & Save </button>
                    </div>
                </div>
            </div>

        </div>



        <div class="d__f-- fd__c-- gap__15-- p__15--" ng-show="signoffUserObj.SurgeonAccess">
            <div class="form__group">
                <label>Surgeon</label>
                <select ng-disabled="signoffUserObj.IsSurgeonUnSign" ng-model="signoffUserObj.SurgeonUserId"
                        ng-options="item.DoctorID as item.FullName for item in SurgeonArray">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="form__group">
                <label>Password</label>
                <input type="password"
                       ng-disabled="signoffUserObj.SurgeonUserId==null||autosighnoff"
                       ng-model="signoffUserObj.SurgeonPassword"
                       placeholder="Enter Sign Off Password" maxlength="30">
            </div>
            <div class="d__f-- fd__c-- gap__15--" ng-show="signoffUserObj.IsSurgeonUnSign">
                <div class="form__group mt__10--">
                    <label>Remarks</label>
                    <textarea class="msd-elastic: \n;"
                              quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                              ng-model="SignOffPasswordObj.Remarks" maxlength="500"></textarea>
                </div>
                <!--<div class="col-lg-12">
                <div class="form-group pull-right">
                    <button class="btn btn-success m-t-20" ng-click="ContinueSignOffRequired()">Save</button>
                </div>
            </div>-->
            </div>
            <div class="form__group">
                <label></label>
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateUserSignOff('Surgeon')" ng-show="!autosighnoff">Validate & Save</button>
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateUserSignOff('Surgeon')" ng-show="autosighnoff"> Save</button>

            </div>
        </div>




        <div class="d__f-- fd__c-- gap__15-- p__15--" ng-show="signoffUserObj.CardiologistAccess">
            <div class="form__group">
                <label>Cardiology</label>
                <select ng-disabled="signoffUserObj.IsCardiologistUnSign" ng-model="signoffUserObj.CardiologistUserId"
                        ng-options="item.DoctorID as item.FullName for item in AllCardiologistList">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="form__group">
                <label>Password</label>
                <input type="password" ng-disabled="signoffUserObj.CardiologistUserId==null"
                       ng-model="signoffUserObj.CardiologistPassword" placeholder="Enter Sign Off Password" maxlength="30">
            </div>
            <div class="d__f-- fd__c-- gap__15--" ng-show="signoffUserObj.IsCardiologistUnSign">
                <div class="form__group">
                    <label>Remarks</label>
                    <textarea class="msd-elastic: \n;"
                              quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                              ng-model="signoffUserObj.CardiologistUnSignRemarks" maxlength="500"></textarea>
                </div>
            </div>
            <div class="form__group">
                <label></label>
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateUserSignOff('Cardiologist')">Validate & Save</button>
            </div>
        </div>


        <div class="d__f-- fd__c-- gap__15-- p__15--" ng-show="signoffUserObj.CoordinatorAccess">
            <div class="form__group">
                <label>Coordinator</label>
                <select ng-disabled="signoffUserObj.IsCoordinatorUnSign" ng-model="signoffUserObj.CoordinatorId"
                        ng-options="item.DoctorID as item.FullName for item in CoordinatorList">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="form__group">
                <label>Password</label>
                <input type="password" ng-disabled="signoffUserObj.CoordinatorId==null"
                       ng-model="signoffUserObj.CoordinatorPassword" placeholder="Enter Sign Off Password" maxlength="30">
            </div>
            <div class="d__f-- fd__c-- gap__15--" ng-show="signoffUserObj.IsCoordinatorUnSign">
                <div class="form__group">
                    <label>Remarks</label>
                    <textarea class="msd-elastic: \n;"
                              quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                              ng-model="signoffUserObj.CoordinatorUnSignRemarks" maxlength="500"></textarea>
                </div>
            </div>

            <div class="form__group">
                <label></label>
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateUserSignOff('Coordinator')">Validate & Save</button>
            </div>
        </div>
    </div>
</div>
