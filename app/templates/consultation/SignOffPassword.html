<section class="eh-panel mb-0">
    <div class="eh-header bg-white">
        <h1 class="font-weight-700 text-1d5558 fs-20 m-0">Password Required</h1>
        <ul class="us-controls">
            <li>
                <a class="btn__close--" ng-click="CanclsignoffPopup()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="eh-body" ng-show="SignOffPasswordObj.Screen!='Cardiology PreAdmission' && SignOffPasswordObj.Screen != 'OperativeNotes'&& SignOffPasswordObj.Screen != 'Facesheet' ">
        <div class="d__f-- fd__c-- gap__15-- p__15--" ng-show="SignOffPasswordObj.Screen!= 'Anesthesia PreAdmission'">
            <div class="form__group">
                <label>Nurse</label>
                <select ng-disabled="SignOffPasswordObj.Type == 'Unsign'" ng-model="FinalReviewbyobj.NurseId"
                        ng-options="item.DoctorID as item.FullName for item in NurseArray">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="form__group">
                <label>Password</label>
                <input type="password"
                       ng-disabled="FinalReviewbyobj.NurseId==null"
                       ng-model="FinalReviewbyobj.NursePassword"
                       placeholder="Enter Sign Off Password" maxlength="30">
            </div>
            <div class="form__group">
                <label></label>
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateSignOffPassword('Nurse')">Validate</button>
            </div>

        </div>
        <div class="d__f-- fd__c-- gap__15-- p__15--" ng-show="SignOffPasswordObj.Screen!= 'Discharge'">
            <div class="form__group">
                <label>Anesthetist</label>
                <select ng-disabled="SignOffPasswordObj.Type == 'Unsign'" ng-model="FinalReviewbyobj.AnesthetistId"
                        ng-options="item.DoctorID as item.FullName for item in AllAnesthetistList">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="form__group">
                <label>Password</label>
                <input type="password" ng-disabled="FinalReviewbyobj.AnesthetistId==null" ng-model="FinalReviewbyobj.AnesthetistPassword" placeholder="Enter Sign Off Password" maxlength="30">
            </div>
            <div class="form__group">
                <label></label>
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateSignOffPassword('Anesthetist')">Validate</button>
            </div>
        </div>

        <div class="d__f-- fd__c-- gap__15-- p__15--" ng-show="SignOffPasswordObj.Screen!= 'PreOp'&&SignOffPasswordObj.Screen!= 'Anesthesia PreAdmission'">
            <div class="form__group">
                <label>Surgeon</label>
                <select ng-disabled="SignOffPasswordObj.Type == 'Unsign'" ng-model="FinalReviewbyobj.SurgeonId"
                        ng-options="item.DoctorID as item.FullName for item in SurgeonArray">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="form__group">
                <label>Password</label>
                <input type="password"
                       ng-disabled="FinalReviewbyobj.SurgeonId==null"
                       ng-model="FinalReviewbyobj.SurgeonPassword"
                       placeholder="Enter Sign Off Password" maxlength="30">
            </div>
            <div class="form__group">
                <label></label>
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateSignOffPassword('Surgeon')">Validate</button>
            </div>
        </div>
        <div class="d__f-- fd__c-- gap__15-- p__15--">
            <div class="form__group" ng-show="SignOffPasswordObj.Type == 'Unsign'">
                <label>Remarks</label>
                <textarea class=" msd-elastic: \n;"
                          quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                          ng-model="SignOffPasswordObj.Remarks" maxlength="500"></textarea>
            </div>
            <div class="form__group" ng-hide="SignOffPasswordObj.Screen =='Anesthesia PreAdmission'">
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ContinueSignOffRequired()">Save</button>
            </div>
        </div>
    </div>
    <div class="eh-body" ng-show="SignOffPasswordObj.Screen == 'OperativeNotes'||SignOffPasswordObj.Screen == 'Facesheet' ">
        <div class="d__f-- fd__c-- gap__15-- p__15--">
            <div class="form__group">
                <label>Surgeon</label>
                <select ng-disabled="SignOffPasswordObj.Type == 'Unsign'" ng-model="FinalReviewbyobj.SurgeonId"
                        ng-options="item.DoctorID as item.FullName for item in SurgeonArray">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="form__group">
                <label>Password</label>
                <input type="password" ng-disabled="FinalReviewbyobj.SurgeonId==null" ng-model="FinalReviewbyobj.SurgeonPassword" placeholder="Enter Sign Off Password" maxlength="30">
            </div>
            <div class="d__f-- fd__c-- gap__15--">
                <div class="form__group" ng-show="SignOffPasswordObj.Type == 'Unsign'">
                    <label>Remarks</label>
                    <textarea class="msd-elastic: \n;"
                              quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                              ng-model="SignOffPasswordObj.Remarks" maxlength="500"></textarea>
                </div>
                <div class="form__group" ng-hide="SignOffPasswordObj.Screen == 'Facesheet' || SignOffPasswordObj.Screen == 'OperativeNotes' ">
                    <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ContinueSignOffRequired()">Save</button>
                </div>
            </div>
            <div class="form__group">
                <label></label>
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateSignOffPassword('Surgeon')">Validate</button>
            </div>
        </div>

        
    </div>
    <div class="eh-body" ng-show="SignOffPasswordObj.Screen== 'Cardiology PreAdmission'">
        <div class="d__f-- fd__c-- gap__15-- p__15--">
            <div class="form__group">
                <label>Cardiology</label>
                <select ng-disabled="SignOffPasswordObj.Type == 'Unsign'" ng-model="FinalReviewbyobj.CardiologistId"
                        ng-options="item.DoctorID as item.FullName for item in AllCardiologistList">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="form__group">
                <label>Password</label>
                <input type="password" ng-disabled="FinalReviewbyobj.CardiologistId==null" ng-model="FinalReviewbyobj.CardiologistPassword" placeholder="Enter Sign Off Password" maxlength="30">
            </div>
            <div class="form__group">
                <label></label>
                <button class="btn__xl-- btn__2D2D47--f width__100--" ng-click="ValidateSignOffPassword('Cardiologist')">Validate</button>
            </div>
        </div>
        <div class="d__f-- fd__c-- gap__15-- p__15--">
            <div class="form__group" ng-show="SignOffPasswordObj.Type == 'Unsign'">
                <label>Remarks</label>
                <textarea class="msd-elastic: \n;"
                          quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                          ng-model="SignOffPasswordObj.Remarks" maxlength="500"></textarea>
            </div>
        </div>

    </div>

</section>
