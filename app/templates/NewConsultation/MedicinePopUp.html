
<div>
    <form name="appointmentForm" class="css-form" novalidate>
        <div class="modal-header text-left pt-10 pb-10 book-ap_BG">
            <button type="button" class="close" ng-click="ClosePopup();">&times;</button>
            <h4 class="modal-title text-white">Medicine List</h4>
        </div>
        <div class="modal-body pb-0 mb-0 text-left">
            <div class="row" ng-show="medicineList.length>0">
                <div class="col-lg-12">
                    <div class="form-group">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th width="10%"></th>
                                        <th>Product</th>
                                        <th>Available Stock</th>
                                        <th>Price</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in medicineList">
                                        <td class="text-center pr-0 valign-middle" width="100px">
                                            <div class="checkbox cn">
                                                <label>
                                                    <input name="checkbox-1" type="checkbox" ng-model="SelectedMedicine" ng-change="checkboxChange(item,SelectedMedicine)" />
                                                    <span class="checkbox-material">
                                                        <span class="check mr-5"></span>
                                                    </span>
                                                </label>
                                            </div>
                                        </td>
                                        <td>{{item.Name}}</td>
                                        <td class="text-center">{{item.StockIn}}</td>
                                        <td>{{item.Price}}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div ng-show="medicineList.length===0">
                No medicines added to this appointment
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn danger-btn" data-dismiss="modal" ng-click="ClosePopup();">Close</button>
            <button class="btn primary-btn" ng-click="Save()" ng-show="medicineList.length>0">Save</button>
        </div>
    </form>
</div>
