
<div class="modal-header">
    <button type="button" class="btn btn-link" ng-click="CloseInvestigationImagePopUp()"><i class="fas fa-times"></i></button>
    <!--<button class="close" ng-click="CloseInvestigationImagePopUp()">&times;</button>-->
    <h4 class="modal-title">{{IsUpload ? 'Upload Investigation Files':'Investigation Files'}}</h4>
</div>

<div class="modal-body">
    <div class="row" ng-if="IsUpload">
        <div class="col-lg-12">
            <div class="file-upload">
                <div class="file-select">
                    <div class="file-select-button" id="fileName">Choose Files</div>
                    <div class="file-select-name" id="noFile">No file chosen...</div>
                    <input type="file" name="upload" class="upload"
                           ngf-select="UploadInvestigationImages($files)"
                           ngf-pattern="'image/*,application/pdf'"
                           ngf-accept="'image/*,application/pdf'"
                           id="chooseFile"
                           multiple="multiple"
                           title="Choose a file to upload">
                </div>
            </div>
        </div>
    </div>

    <div class="row m-t-10" image-viewer isarraychanged="ImageArrayChanged">
        <div class="col-lg-12 cover-fileimg">
            <ul>
                <li ng-repeat="item in Investigation.ImagesData" class="text-center">
                    <img ng-src="{{item.DocURL}}" class="img-thumbnail">

                    <a ng-if="IsUpload" href="" class="m-0 text-center error cur-pointer" ng-click="PreDeleteUploadFile(item,index)">
                        Delete
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>

<div class="modal-footer">
    <!--<button class="btn btn-success btn-block btn-sm"
                    ng-disabled="Sale.TotalReceived > Sale.TotalAmount"
                    ng-click="SavePayment('ok')">
                    Save
    </button>-->
</div>
