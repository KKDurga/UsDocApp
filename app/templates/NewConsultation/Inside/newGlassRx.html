<div class="history-panel"  ng-show="cat.CategoryId===8 &&((cat.CategoryDetails|filter:{'IsSubCategoryChecked':true,SubCategoryId:67}:true).length != 0)">
    <div class="history-repeat" ng-repeat="item in cat.CategoryDetails" ng-if="item.SubCategoryId===67">
        <div class="history-header">
            <h1><i class="headicon-icn GlassRX-ehcons"></i> Glass RX</h1>
        </div>
        <div class="history-body">            
            <div class="row">
                <div class="col-lg-12">
                    

                    <div class="single-panel">
                        <div class="single-header">
                            <h1>Final Glass Prescription</h1>
                            <div>
                                <ul class="controls-cons" ng-if="inv.InvestigationId===43" ng-repeat="inv in cacheStorageItem.GlassDetails track by $index">
                                    <li>
                                        <div class="checkbox cn">
                                            <label>
                                                <input id="cacheStorageItem" ng-model="cacheStorageItem.chkNewGlassRefraction" ng-click="copyVisionRefractionForNewGlass(cacheStorageItem.chkNewGlassRefraction,inv);" type="checkbox">
                                                <span class="checkbox-material">
                                                    <span class="check"></span>
                                                </span>
                                                <small> Copy from Final Glass Rx</small>
                                            </label>
                                        </div>
                                    </li>
                                    <li>
                                        <a href="javascript:;" uib-tooltip="Auto Fill" ng-click="OpenGlassPopup(inv)">
                                            <i class="auto-fill-icon eh-icon"></i>
                                        </a>
                                    </li>
                                    <!--<li class="">
                                        <a href="javascript:;" uib-tooltip="A6 Print" ng-click="PrintA6GlassPrescription();">
                                            <i class="a6-print-icon eh-icon w-35"></i>
                                        </a>
                                    </li>-->
                                    <!--<li ng-show="!IsPrintA5Required">
                                        <a href="javascript:;" uib-tooltip="A5 Print" ng-click="PrintNewConsultation('Glasses','', 'A5');">
                                            <i class="eh-a5print eh-icon w-35"></i>
                                        </a>
                                    </li>-->
                                    <!--<li>
                                        <a href="javascript:;" uib-tooltip="Print" ng-click="PrintNewConsultation('Glasses','');">
                                            <i class="eh-print eh-icon"></i>
                                        </a>
                                    </li>-->
                                    <li>
                                        <a href="javascript:;" uib-tooltip="History" ng-click="OpenVisionHistoryPopup(inv,7,inv.InvestigationId,inv.InvestigationDesc)">
                                            <i class="eh-history eh-icon"></i>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="single-body" ng-if="inv.InvestigationId === 43" ng-repeat="inv in cacheStorageItem.GlassDetails track by $index">
                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="no-data-text p-b-0" ng-show="FocusObj.showGlassDiv === false">
                                        <span>No Final Glass Prescription added.</span>
                                        <a href="javascript:;" ng-click="FocusObj.showGlassDiv = true;">Click here</a>
                                        <span>or on search box to add Final Glass Prescription.</span>
                                    </div>
                                    <div class="table-responsive" ng-show="FocusObj.showGlassDiv === true">
                                        <table class="table examination-table">
                                            <tbody>
                                                <tr>
                                                    <th class="w-40"></th>
                                                    <th>Sph</th>
                                                    <th>Cyl</th>
                                                    <th>Axis</th>
                                                    <th>BCVA</th>
                                                    <th>Add</th>
                                                    <th>BCNVA</th>
                                                    <th>Prism</th>
                                                    <th>Base</th>
                                                </tr>
                                                <tr class="examination-tr-OD">
                                                    <td class="examination-OD"><span class="spanod">OD</span></td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.RightEyeValues.Spherical" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.RightEyeValues.Cylindrical" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.RightEyeValues.Axis" alpha-numeric-for-vision maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.RightEyeValues.BCVA" glassacceptance-allow maxlength="11">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.RightEyeValues.Adition" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.RightEyeValues.BCNVA" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.RightEyeValues.Prism" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.RightEyeValues.Base" glassacceptance-allow maxlength="7">
                                                    </td>
                                                </tr>
                                                <tr class="examination-tr-OS">
                                                    <td class="examination-OS"><span class="spanos">OS</span></td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.LeftEyeValues.Spherical" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.LeftEyeValues.Cylindrical" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.LeftEyeValues.Axis" alpha-numeric-for-vision maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.LeftEyeValues.BCVA" glassacceptance-allow maxlength="11">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.LeftEyeValues.Adition" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.LeftEyeValues.BCNVA" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.LeftEyeValues.Prism" glassacceptance-allow maxlength="7">
                                                    </td>
                                                    <td>
                                                        <input type="text" class="" ng-model="inv.LeftEyeValues.Base" glassacceptance-allow maxlength="7">
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td colspan="9" class="text-left">
                                                        <div class="dis-flex">
                                                            <div class="flex">
                                                                <label>Type of Lens</label>
                                                                <input type="text" class="form-control glassinputfocus" placeholder="+Add Lens" ng-click="SwichGalssSubTab('TypeofLens');" />
                                                            </div>
                                                            <div class="flex">
                                                                <label>Mode of Wear</label>
                                                                <input type="text" class="form-control glassinputfocus" placeholder="+Add Mode of Wear" ng-click="SwichGalssSubTab('ModeofWear');" />
                                                            </div>
                                                            <div class="flex">
                                                                <label>Lens Coating</label>
                                                                <input type="text" class="form-control glassinputfocus" placeholder="+Add Lens Coating" ng-click="SwichGalssSubTab('LensCoating');" />
                                                            </div>
                                                            <div class="flex">
                                                                <label>Type of Lens Material</label>
                                                                <input type="text" class="form-control glassinputfocus" placeholder="+Add Lens Material" ng-click="SwichGalssSubTab('LensMaterial');" />
                                                            </div>
                                                            <div class="flex">
                                                                <label>Frame Material</label>
                                                                <input type="text" class="form-control glassinputfocus" placeholder="+Add Frame Material" ng-click="SwichGalssSubTab('FrameMaterial');" />
                                                            </div>
                                                        </div>
                                                        
                                                        <div class="bg-f1f1f1 p-8 dis-flex width-100">
                                                            <div class="m-r-10" ng-repeat="item in inv.LensTypeArray" ng-if="GlassType.SubTab === 'TypeofLens'">
                                                                <label class="cur-poiter">
                                                                    <input type="checkbox" id="" class="checkbox" ng-change="CheckGlassLensType(inv, item)" ng-model="item.IsActive">
                                                                    <span class="lbl"></span>
                                                                    <span class="list-opt-text-new">{{item.Name}}</span>
                                                                </label>
                                                            </div>
                                                            <!--//-->
                                                            <div class="m-r-10" ng-repeat="item in inv.LensCoatingArray" ng-if="GlassType.SubTab === 'LensCoating'">
                                                                <label class="cur-poiter">
                                                                    <input type="checkbox" id="" class="checkbox" ng-change="CheckGlassLensCoating(inv, item)" ng-model="item.IsActive">
                                                                    <span class="lbl"></span>
                                                                    <span class="list-opt-text-new">{{item.Name}}</span>
                                                                </label>
                                                            </div>
                                                            <!--//-->
                                                            <div class="m-r-10" ng-repeat="item in LensMaterialarray" ng-if="GlassType.SubTab === 'LensMaterial'">
                                                                <label class="cur-poiter">
                                                                    <input type="checkbox" id="" class="checkbox" ng-change="changeMaterial(item ,inv)" ng-model="item.IsActive">
                                                                    <span class="lbl"></span>
                                                                    <span class="list-opt-text-new">{{item.DropDownValue}}</span>
                                                                </label>
                                                            </div>

                                                            <!--//-->
                                                            <div class="m-r-10" ng-repeat="item in ModeOfWeararray" ng-if="GlassType.SubTab === 'ModeofWear'">
                                                                <label class="cur-poiter">
                                                                    <input type="checkbox" id="" class="checkbox" ng-change="changeModeOfWear(item,inv)" ng-model="item.IsActive">
                                                                    <span class="lbl"></span>
                                                                    <span class="list-opt-text-new">{{item.DropDownValue}}</span>
                                                                </label>
                                                            </div>

                                                            <!--//-->
                                                            <div class="m-r-10" ng-repeat="item in FrameMaterialarray" ng-if="GlassType.SubTab === 'FrameMaterial'">
                                                                <label class="cur-poiter">
                                                                    <input type="checkbox" id="" class="checkbox" ng-change="changeFrameMaterial(item,inv)" ng-model="item.IsActive">
                                                                    <span class="lbl"></span>
                                                                    <span class="list-opt-text-new">{{item.DropDownValue}}</span>
                                                                </label>
                                                            </div>

                                                            <!--//-->
                                                        </div>
                                                        <p class="mb-0" ng-if="GlassType.RemarksEdit">
                                                            <b class="complaint-text">Remarks: </b>
                                                            <!--<span class="complaint-remarks">
                                Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                            </span>-->
                                                            <textarea class="form-control blue-remarks" maxlength="500" placeholder="Remarks" rows="1" ng-model="inv.Remarks" ng-blur="changeGlassEditRemarks();"></textarea>
                                                        </p>
                                                        
                                                        <p class="mb-0" ng-if="!GlassType.RemarksEdit" ng-click="GlassType.RemarksEdit = true;">
                                                            <b class="complaint-text">Remarks: </b>
                                                            <span class="complaint-remarks">
                                                                {{inv.Remarks}}
                                                            </span>
                                                        </p>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>


                    
                </div>
            </div>
        </div>
    </div>
</div>
