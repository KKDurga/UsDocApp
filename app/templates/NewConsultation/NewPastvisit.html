<div class="container-fluid optha-input" ng-controller="EhnoteNewPastVisitCtrl">
   
    <div class="mainDevDiagnosis">
        <ul class="" role="tablist">
            <li ng-if="cacheStorageItem.NavCasehistoryToPatientprofile">
                <div class="tile-header" >
                    <button class="btn btn-link" ng-click="backtoPatientProfile()"><i class="fas fa-arrow-circle-left"></i> Back </button>
                </div>
            </li>
            <!--<li role="presentation" ng-click="switchTab('Profile')" ng-class="Tab == 'Profile'?'active':''">
        <a role="tab"><i class="fas fa-user fa-lg"></i> &nbsp; Profile</a>
    </li>-->
            <li role="presentation" ng-click="switchTab('casehistory')" ng-class="Tab == 'casehistory'?'active':''">
                <a role="tab"><i class="fas fa-history fa-lg"></i> &nbsp; Case History</a>
            </li>
            <li role="presentation" ng-click="switchTab('billing')" ng-class="Tab == 'billing'?'active':''"
                ng-if="UserAccessRights.AllAccessRights.BillingHistory">
                <a role="tab"><i class="far fa-money-bill-alt fa-lg"></i> &nbsp; Billing History</a>
            </li>
            <li role="presentation" ng-click="switchTab('FileUploads')" ng-class="Tab == 'FileUploads'?'active':''">
                <a role="tab"><i class="fas fa-upload fa-lg"></i> &nbsp; File Uploads</a>
            </li>
        </ul>
    </div>
    <div class="tab-content">
        <div class="container-fluid" ng-if="Tab == 'viewedit'">
            <div class="row mt-10">
                <div ng-include="'templates/NewConsultation/viewedit.html'"></div>
            </div>
        </div>
        <div class="container-fluid" ng-if="Tab == 'casehistory'">
            <div class="row mt-10">
                <div ng-include="'templates/NewConsultation/CaseHistory.html'"></div>
            </div>
        </div>

        <div class="container-fluid" ng-if="Tab == 'billing' && showBillinginCasehistory" ng-init="Tab == 'billing'?updateAppointInfo():''">
            <div class="row">
                <billing-directive main-billing-object="currentBillingObject" doctorinfo="doctorinfo"></billing-directive>
            </div>
        </div>
        <div class="container-fluid" ng-if="Tab == 'FileUploads'">
            <div class="row">
                <div ng-include="'templates/NewConsultation/FileUploads.html'"></div>
            </div>
        </div>
        <div class="container-fluid" ng-if="Tab == 'Profile'">
            <div class="row mt-10">
                <div ng-include="'templates/NewConsultation/ProfileScreen.html'"></div>
            </div>
        </div>
    </div>
</div>
