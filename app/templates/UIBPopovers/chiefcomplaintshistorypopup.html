<div class="referal-container">
    <div class="referal-body p-5 overflow-y-auto" style="height: calc(100vh - 90px)">
        <table class="referral-table table-bordered" ng-repeat="item in PreviousInvestigations">
            <tbody>
                <tr>
                    <td colspan="2">
                        <label>{{item.AppointmentDate |date:'MM-dd-yyyy'}}</label>
                    </td>
                </tr>
                <tr ng-repeat="sitem in item.ChiefComplaints" ng-if="item.ChiefComplaints.length !=0">
                    <td>
                        <ul class="referral-summary-list">
                            <li>
                                {{sitem.Description}}
                            </li>
                        </ul>
                    </td>
                    <td width="5%">
                        <a href="javascript:;" title="Copy">
                            <img src="img/ros-chart/copy-clipboard.svg" width="20" role="button" tabindex="0" ng-click="AddChiefComplaintsHistory(sitem)" ng-hide="sitem.iscopied">
                        </a>
                        <b ng-show="sitem.iscopied">Copied</b>
                    </td>
                </tr>

                <tr ng-if="item.ChiefComplaints.length == 0">
                    <td>
                        <ul class="referral-summary-list">
                            <li>
                               <span>No data added</span>
                            </li>
                        </ul>
                    </td>
                    <!--<td width="5%">
                        <a href="javascript:;" title="Copy">
                            <img src="img/ros-chart/copy-clipboard.svg" width="20" role="button" tabindex="0" ng-click="AddChiefComplaintsHistory(sitem)" ng-hide="sitem.iscopied">
                        </a>
                        <b ng-show="sitem.iscopied">Copied</b>
                    </td>-->
                </tr>
            </tbody>
        </table>
    </div>
</div>
