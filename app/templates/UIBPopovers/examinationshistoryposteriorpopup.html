<div class="referal-container">
    <div class="referal-body p-5 overflow-y-auto" style="height: calc(100vh - 150px) ">
        <table class="referral-table table-bordered">
            <thead class="border-1">
                <tr>
                    <th>
                        <label>Posterior Segment</label>
                    </th>
                    <th colspan="2">
                        <label class="eh-od">OD</label>
                    </th>
                    <th colspan="2">
                        <label class="eh-os">OS</label>
                    </th>
                </tr>
            </thead>
            <tbody ng-repeat="Eitem in PreviousEcaminationDetails track by $index">
                <tr>
                    <td colspan="3">
                        <label class="text-068cb0">{{Eitem.AppointmentDate}}</label>
                    </td>
                </tr>
                <tr ng-show="Eitem.PosteriorSegmentDetails.length==0">
                    <td colspan="5">
                        <p>No Data Recorded</p>
                    </td>
                </tr>


                <tr ng-repeat="inv in Eitem.PosteriorSegmentDetails track by $index">
                    <td>
                        <span>
                            {{inv.InvestigationDesc}}
                        </span>
                    </td>
                    <td>
                        <ul class="flex-flow-ulli-mb0 dis-block">
                            <li ng-repeat="alerg in inv.RemarksArray | filter:{'ActiveInd':'Y','OrganId' : 1}  track by $index">
                                <span> {{alerg.FindingValue}}</span>
                            </li>
                          
                        </ul>
                    </td>
                    <td width="5%">
                        <a href="javascript:;" title="Copy">
                            <img src="img/ros-chart/copy-clipboard.svg" width="20" role="button" tabindex="0" ng-click="CopytoPosteriorOD(inv,inv.RemarksArray,'OD')" ng-hide="inv.IsCopied">
                            <b ng-show="inv.IsCopied">Copied</b>
                        </a>
                    </td>
                    <td>
                        <ul class="flex-flow-ulli-mb0 dis-block">
                            <li ng-repeat="alerg in inv.RemarksArray | filter:{'ActiveInd':'Y','OrganId' : 2}  track by $index">
                                <span>{{alerg.FindingValue}}</span>
                            </li>
                           
                        </ul>
                    </td>
                    <td width="5%">
                        <a href="javascript:;" title="Copy">
                            <img src="img/ros-chart/copy-clipboard.svg" width="20" role="button" tabindex="0" ng-click="CopytoPosteriorOS(inv,inv.RemarksArray,'OS')" ng-hide="inv.Copied">
                            <b ng-show="inv.Copied">Copied</b>
                        </a>
                    </td>
                </tr>           
            </tbody>
        </table>

    </div>
</div>
