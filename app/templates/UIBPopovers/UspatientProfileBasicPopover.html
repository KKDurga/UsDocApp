<div class="d__f-- fd__c-- gap__5--y">
    <div class="d__f-- fd__c-- bg__F9F9F9-- p__6-- gap__5--y">
        <div class="d__f-- ai__c-- gap__10--x">
            <img class="bradius__10--" ng-show="popoverData.PatientDetails.S3URL ==''" src="img/sprite-sheet/user-square.svg" width="80" height="80" aria-hidden="false" />
            <img class="bradius__10--" image-viewer ng-show="popoverData.PatientDetails.S3URL !==''" src="{{popoverData.PatientDetails.S3URL}}" width="80" height="80" aria-hidden="false" />
            <div class="d__f-- fd__c-- gap__5--y">
                <h1 class="m__0-- tc__1D1D1D-- fs__xl-- fw__6--" title="{{popoverData.PatientDetails.FullName}}">{{popoverData.PatientDetails.FullName | textUpperCase}}</h1>
                <div class="d__f-- ai__c-- gap__10--x">
                    <span class="tc__4A4A4A-- fw__5-- fs__lg--" ng-if="popoverData.PatientDetails.PatientDisplayId!=''" title="{{popoverData.PatientDetails.PatientDisplayId}}">{{popoverData.PatientDetails.PatientDisplayId}}</span>
                    <span class="tc__656565-- fs__lg-- fw--4--">{{popoverData.PatientDetails.MobileNo}}</span>
                </div>
                <div>
                    <span class="tc__656565-- fs__lg-- fw--4--">{{popoverData.PatientDetails.Gender}}</span>
                </div>
                <div class="d__f-- ai__c-- gap__5-- fd__r--">
                    <label class="fs__lg-- fw__5-- tc__4A4A4A-- lh__normal--">{{popoverData.PatientDetails.DOB |date:'MM-dd-yyyy'}}</label>
                    <ul class="flex-flow-list gap__x--4">
                        <li ng-class="{'patient-tags-custom': item.HospitalEquipmentId == 17 || item.HospitalEquipmentId == 18}" ng-repeat="item in popoverData.PatientTagList track by $index" ng-if="item.HospitalEquipmentId !== 17 && item.HospitalEquipmentId !== 18">
                            <i class="icons__w16-- wheelchair__w16--" ng-if="item.HospitalEquipmentId===1" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- autism__w16--" ng-if="item.HospitalEquipmentId===2" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- hearing__w16--" ng-if="item.HospitalEquipmentId===3" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- oneeye__w16--" ng-if="item.HospitalEquipmentId===4" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- heartdisease__w16--" ng-if="item.HospitalEquipmentId===5" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- anxiety__w16--" ng-if="item.HospitalEquipmentId===6" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- vip__w16--" ng-if="item.HospitalEquipmentId===7" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- epllepsy__w16--" ng-if="item.HospitalEquipmentId===8" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- emotional__w16--" ng-if="item.HospitalEquipmentId===9" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- alzheimer__w16--" ng-if="item.HospitalEquipmentId===10" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- blood__w16--" ng-if="item.HospitalEquipmentId===11" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- supportstick__w16--" ng-if="item.HospitalEquipmentId===12" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- boat__w16--" ng-if="item.HospitalEquipmentId===13" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- newborn__w16--" ng-if="item.HospitalEquipmentId===14" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- oxygenmask__w16--" ng-if="item.HospitalEquipmentId===15" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- publictransport__w16--" ng-if="item.HospitalEquipmentId===16" title="{{item.HospitalEquipmentName}}"></i>
                            <i class="icons__w16-- hiv__w16--" ng-if="item.HospitalEquipmentId===17" title="{{item.HospitalEquipmentName}}">HIV</i>
                            <i class="icons__w16-- hep__w16--" ng-if="item.HospitalEquipmentId===18" title="{{item.HospitalEquipmentName}}">Hep</i>
                            <span class="p__10--x p__4--y br__100-- text-center bg__1D5558-- tc__FFFFFF--" ng-if="item.HospitalEquipmentId===21">ICL</span>
                            <span class="p__10--x p__4--y br__100-- text-center bg__3BAC66-- tc__FFFFFF--" ng-if="item.HospitalEquipmentId===22">Durysta</span>
                            <span class="p__10--x p__4--y br__100-- text-center bg__537ACF-- tc__FFFFFF--" ng-if="item.HospitalEquipmentId===23">LASIK</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
