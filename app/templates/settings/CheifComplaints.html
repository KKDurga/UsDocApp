<div class="pos-relative h-100">
    <div class="adjustable-position slim-scroll">
        <div class="dis-flex flex-direction-column grid-gap-10 mt-5">
            <div class="section__style--2" ng-show="showModifyMasterComplaintsDiv">
                <div class="section__header--">
                    <h1>{{ 'ADDCOMPLAINTS' | translate}}</h1>
                </div>
                <div class="section__body--">
                    <div class="row">
                        <div class="col-lg-6 col-sm-5">
                            <div class="form__group">
                                <label>{{ 'COMPLAINTS' | translate}}</label>
                                <input rows="1" name="diagnosisDescription" id="input_complaints" placeholder="Enter Complaints" maxlength="2000" ng-model="CheifComplaintsObj.complaintsDescription" ng-focus="chiefComplaintsFocus" ng-focus-lost="LostSettingsFocus()" required />
                            </div>
                        </div>
                        <div class="col-lg-2 col-sm-2">
                            <div class="form__group m-t-27">
                                <label class="cur-poiter">
                                    <input type="checkbox" id="3" value="" class="checkbox" ng-model="CheifComplaintsObj.IsFrequent">
                                    <span class="lbl"></span>
                                    <span class="text-right usc-remarks">{{ 'FREQUENT' | translate}}</span>
                                </label>
                            </div>
                        </div>
                        <div class="col-lg-4 col-sm-5">
                            <div class="dis-flex align-items-center grid-gap-10 m-t-23">
                                <button type="submit" class="btn__xl-- btn__1d5558--f" ng-click="AddupdateComplaints1()" id="btn_updatecomplaints"><i ng-class="{'action__icons--1 action__save--': masterComplaintsBtnName === 'Save','action__icons--1 action__update--': masterComplaintsBtnName === 'Update'}"></i>{{masterComplaintsBtnName}}</button>
                                <button type="submit" class="btn__xl-- btn__C71D27--f" ng-click="CancelMasterComplaintsClick()" id="btn_cancel"><i class="action__icons--1 action__cancel--"></i>{{ 'CANCEL' | translate}}</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="section__style--2">
                <div class="section__header--">
                    <h1>{{ 'CHEIFCOMPLAINTSLIST' | translate}}</h1>
                    <button class="btn__lg-- btn__1d5558--f" ng-click="showModifyMasterComplaints()" ng-disabled="showModifyMasterComplaintsDiv" id="btn_addnew"><i class="action__icons--1 action__add--"></i> {{ 'ADDNEW' | translate}}</button>
                </div>
                <div class="section__body--">
                    <div id="tab-Organization" class="tab-pane active fade in">
                        <div class="row" ng-show="MasterComplaintsOrgArray.length > 0">
                            <div class="col-lg-12">
                                <div class="overflow__auto--y">
                                    <table class="table__style--7" id="table_mcomplaintsorg">
                                        <thead>
                                            <tr>
                                                <th class="text-center">{{ 'FREQUENTLY' | translate}}</th>
                                                <th>{{ 'COMPLAINTS' | translate}}</th>
                                                <th class="text-center">{{ 'ACTIONS' | translate}}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr ng-repeat="compitem in MasterComplaintsOrgArray">
                                                <td class="text-center column__sm">
                                                    <input type="checkbox" id="3" value="" title="IsFrequently" class="checkbox" ng-model="compitem.IsFrequentind" ng-click="ChangeCheifComplaintsHistoryFrequentStatus(compitem, compitem.IsFrequentind)">
                                                    <span class="lbl"></span>
                                                </td>
                                                <td>
                                                    <div class="white-space-normal">
                                                        {{compitem.ChiefComplaintName}}
                                                    </div>
                                                </td>
                                                <td class="column__sm">
                                                    <div class="dis-flex align-items-center grid-gap-5 justify-content-center">
                                                        <a class="cur-poiter" tooltip-placement="top" uib-tooltip="Edit" tooltip-append-to-body="true" ng-hide="compitem.OrganizationId == 1" ng-click="editMasterComplaints1(compitem,$index)"><i class="ehr-edit aside-icon-ros"></i></a>
                                                        <a class="cur-poiter" tooltip-placement="top" uib-tooltip="Delete" tooltip-append-to-body="true" ng-hide="compitem.OrganizationId == 1" ng-click="deleteMasterComplaints1(compitem,$index)"><i class="ehr-delete aside-icon-ros"></i></a>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <div class="row m-t-10" ng-show="MasterComplaintsOrgArray.length > 0">
                            <div class="col-lg-12 text-center EH-pagination">
                                <uib-pagination total-items="masterComplaintsItems"
                                                ng-model="masterComplaintsPageNumber"
                                                ng-change="masterComplaintsPagechanged(masterComplaintsPageNumber)"
                                                ng-show="MasterComplaintsOrgArray.length > 0"
                                                max-size="masterComplaintsPageSize"
                                                class=""
                                                boundary-link-numbers="true"
                                                rotate="false"></uib-pagination>
                            </div>
                        </div>
                        <div class="d__f-- fd__c-- jc__c-- ai__c-- gap__10--y height__100--" ng-hide="MasterComplaintsOrgArray.length > 0">
                            <a><i class="nodata__1-- e1__nodata--1"></i></a>
                            <h1 class="fs__2l-- fw__6-- tc__1D1D1D-- m__0--">No complaints Found.</h1>
                            <label class="fs__lg-- fw__5-- tc__4A4A4A--">Add new complaints and they will appear here.</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>    
</div>
