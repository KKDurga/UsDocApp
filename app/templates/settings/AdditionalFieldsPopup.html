

<div class="modal-header bg-white">
    <h1 class="modal-title">Create Fee</h1>
    <button type="button" style=" margin-top: -2px !important;" class="close m-r-10 m-b-3" ng-click="createfeeuibclose()">
        <i class="fas fa-times"></i>
    </button>
</div>

<div class="modal-body">
    <div class="row">
        <div class="col-lg-2">
            <div>
                <div>
                    <div class="ehnote-navigation settings-menu-left leftnavnew css-treeview">

                        <ul class="ul-rightside">

                            <li class="{{ tabno == 1 ? 'active' :''}}">
                                <a href="javascript:;" aria-controls="Settings" ng-click="tabno=1">
                                    Patient
                                </a>
                            </li>
                            <li class="{{ tabno == 2 ? 'active' :''}}">
                                <a href="javascript:;" aria-controls="Settings" ng-click="tabno=2">
                                    Doctor
                                </a>
                            </li>
                            <li class="{{ tabno == 3 ? 'active' :''}}">
                                <a href="javascript:;" aria-controls="Settings" ng-click="tabno=3">
                                    Hospital
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-10">
            <div class="row mt-10" id="PatientSubTab" ng-if="tabno == 1">
                <select class="form-control" ng-model="SelectedFieldItem" ng-options="item.Name as item.Name for item in PatientFieldsArray" ng-change="changeFieldValue(SelectedFieldItem)">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="row mt-10" id="DoctorSubTab" ng-if="tabno == 2">
                <select class="form-control" ng-model="SelectedFieldItem" ng-options="item.Value as item.Name for item in DoctorFieldsArray" ng-change="changeFieldValue(SelectedFieldItem)">
                    <option value="">Select</option>
                </select>
            </div>
            <div class="row mt-10" id="HospitalSubTab" ng-if="tabno == 3">
                <select class="form-control" ng-model="SelectedFieldItem" ng-options="item.Value as item.Name for item in HospitalFieldsArray" ng-change="changeFieldValue(SelectedFieldItem)">
                    <option value="">Select</option>
                </select>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <div class="row">
        <div class="col-lg-12 text-right">
            <button class="btn btn-success p-l-40 p-r-40" ng-click="SaveFieldDetails(SelectedFieldItem)">Save</button>
 
            <button class="btn btn-primary p-l-40 p-r-40" ng-click="ClearDetails()">Clear</button>
        </div>
    </div>
</div>
