<div class="modal__style--1">
    <div class="modal__header--">
        <h1> {{ 'CREATEFEE' | translate}}</h1>
        <a class="btn__close--2" ng-click="createfeeuibclose()">
            <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
        </a>
    </div>
    <div class="modal__body--">
        <div class="position__relative-- height__100--">
            <div class="adjustable-position slim-scroll">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="referal-container-main">
                            <div class="referal-container">
                                <div class="referal-body">
                                    <div class="row">
                                        <div class="col-lg-6 col-sm-6">
                                            <div class="form__group" typehead-dropdown-direction>
                                                <label>{{ 'PAYOR' | translate}} <em>*</em></label>
                                                <input type="text" maxlength="100"
                                                       ng-model="PayorProcedureFeeObj.PayorObj"
                                                       placeholder="Enter Payor"
                                                       typeahead-min-length="0"
                                                       uib-typeahead="item as item.PayorName for item in SearchPayorByText($viewValue)"
                                                       typeahead-on-select="onClickPayor(PayorProcedureFeeObj.PayorObj, PayorProcedureFeeObj)"
                                                       ng-change="ChangePayor(PayorProcedureFeeObj);"
                                                       quotes-restrict enter-directive />
                                            </div>
                                        </div>
                                        <div class="col-lg-6 col-sm-6">
                                            <div class="form__group" typehead-dropdown-direction>
                                                <label>{{ 'PROCEDURE' | translate}}<em>*</em></label>
                                                <input type="text" maxlength="100"
                                                       ng-model="PayorProcedureFeeObj.ProcedureObj"
                                                       placeholder="Enter Procedure"
                                                       typeahead-min-length="0"
                                                       uib-typeahead="item as item.ProcedureCode +'-'+item.ProcedureName for item in GetOrganizationProcedure($viewValue)"
                                                       typeahead-on-select="onClickProcedure(PayorProcedureFeeObj.ProcedureObj, PayorProcedureFeeObj)"
                                                       ng-change="ChangeProcedure(PayorProcedureFeeObj);"
                                                       quotes-restrict enter-directive />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="referal-container">
                                <div class="referal-head referal-head-lb">
                                    <h4>{{ 'GENERALINFO' | translate}}</h4>
                                </div>
                                <div class="referal-body">
                                    <div class="row">
                                        <div class="col-lg-6 col-sm-6">
                                            <div class="form__group" typehead-dropdown-direction>
                                                <label> {{ 'CPTCODE' | translate}} <em>*</em></label>
                                                <input type="text" maxlength="50"
                                                       ng-model="PayorProcedureFeeObj.CptcodeObj"
                                                       placeholder="Enter CPT-Code"
                                                       typeahead-min-length="2"
                                                       uib-typeahead="item as item.CPTCode +'-'+item.ProcedureName for item in GetMasterCPTProcedure($viewValue)"
                                                       typeahead-on-select="onSelectCptCodeProcedure(PayorProcedureFeeObj.CptcodeObj, PayorProcedureFeeObj)"
                                                       ng-change="ChangeCptCodeProcedure(PayorProcedureFeeObj);"
                                                       quotes-restrict enter-directive />
                                            </div>
                                        </div>
                                        <div class="col-lg-6 col-sm-6">
                                            <div class="form__group">
                                                <label>{{ 'MODIFIER' | translate}}</label>
                                                <select ng-model="PayorProcedureFeeObj.ModifierId"
                                                        ng-options="item.MODIFIERID as item.ModifierName for item in ModifierList">
                                                    <option value=""> {{ 'SELECT' | translate}}</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>


                                    <div class="row">
                                        <div class="col-lg-6 col-sm-6">
                                            <div class="form__group">
                                                <label>Start Date </label>
                                                <input type="text" id="input_startdatep" class="icons-calendar"
                                                       ng-model="PayorProcedureFeeObj.StartDate"
                                                       placeholder="MM-DD-YYYY"
                                                       datepickeruniversal readonly />
                                            </div>
                                        </div>
                                        <div class="col-lg-6 col-sm-6">
                                            <div class="form__group">
                                                <label>End Date </label>
                                                <input type="text" id="input_enddatep" class="icons-calendar"
                                                       ng-model="PayorProcedureFeeObj.EndDate"
                                                       placeholder="MM-DD-YYYY"
                                                       datepickeruniversal readonly />

                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-lg-12 col-sm-12">
                                            <div class="form__group">
                                                <label>{{ 'NOTES' | translate}}</label>
                                                <textarea placeholder="Enter Notes" ng-model="PayorProcedureFeeObj.Remarks"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="referal-container">
                                <div class="referal-head referal-head-lb">
                                    <h4>{{ 'RATES' | translate}}</h4>
                                    <div class="col-lg-4 col-sm-4">
                                        <label>$General Cost :{{PayorProcedureFeeObj.GeneralCost}}</label>
                                    </div>
                                </div>
                                <div class="referal-body">
                                    <div class="row">
                                        <div class="col-lg-12 col-sm-12">
                                            <label class="text-s14w800c000">{{ 'USUALCHARGE' | translate}}</label>
                                        </div>
                                        <!--<div class="col-lg-4 col-sm-4">
                                <label>{{PayorProcedureFeeObj.GeneralCost}}</label>
                                <input type="text" class="form-control" placeholder="Usual chargr" ng-model="PayorProcedureFeeObj.GeneralCost" valid-number />
                            </div>-->
                                        <div class="col-lg-4 col-sm-4">
                                            <div class="form__group">
                                                <label>{{ 'ACTUAL' | translate}}<em>*</em></label>
                                                <input type="text" placeholder="Enter Actual" ng-model="PayorProcedureFeeObj.ActualCost" valid-number />
                                            </div>
                                        </div>
                                        <div class="col-lg-4 col-sm-4">
                                            <div class="form__group">
                                                <label> {{ 'PREVIOUSYEAR' | translate}}</label>
                                                <input type="text" placeholder="Enter Previous Year" ng-model="PayorProcedureFeeObj.PreviousYearCost" numbers-only="numbers-only" />
                                            </div>
                                        </div>
                                        <div class="col-lg-4 col-sm-4">
                                            <div class="form__group">
                                                <label> {{ 'UNITVALUE' | translate}}</label>
                                                <input type="text" placeholder="Enter Unit Value" ng-model="PayorProcedureFeeObj.UnitValueCost" valid-number />
                                            </div>
                                        </div>
                                        <div class="col-lg-12">
                                            <label class="text-s14w800c000">{{ 'INFACILITY' | translate}}</label>
                                        </div>
                                        <div class="col-lg-4 col-sm-4">
                                            <div class="form__group">
                                                <label>{{ 'ACTUAL' | translate}}</label><em>*</em>
                                                <input type="text" placeholder="Enter Actual" ng-model="PayorProcedureFeeObj.InFacilityActualCost" valid-number />
                                            </div>
                                        </div>
                                        <div class="col-lg-4 col-sm-4">
                                            <div class="form__group">
                                                <label> {{ 'PREVIOUSYEAR' | translate}}</label>
                                                <input type="text" placeholder="Enter Previous Year" ng-model="PayorProcedureFeeObj.InFacilityPreviousYearCost" numbers-only="numbers-only" />
                                            </div>
                                        </div>
                                        <div class="col-lg-4 col-sm-4">
                                            <div class="form__group">
                                                <label>  {{ 'ANESTHESIABASE' | translate}}</label>
                                                <input type="text" placeholder="Enter Anesthesia Base" ng-model="PayorProcedureFeeObj.AnesthesiaCost" valid-number />
                                            </div>
                                        </div>

                                        <div class="col-lg-12">
                                            <label class="text-s14w800c000">Office</label>
                                        </div>
                                        <div class="col-lg-4 col-sm-4">
                                            <div class="form__group">
                                                <label>Office Actual</label><em>*</em>
                                                <input type="text" placeholder="Enter Actual" ng-model="PayorProcedureFeeObj.OfficeActualCost" valid-number />
                                            </div>
                                        </div>
                                        <div class="col-lg-4 col-sm-4">
                                            <div class="form__group">
                                                <label>Office {{ 'PREVIOUSYEAR' | translate}}</label>
                                                <input type="text" placeholder="Enter Previous Year" ng-model="PayorProcedureFeeObj.OfficePreviousYearCost" numbers-only="numbers-only" />
                                            </div>
                                        </div>
                                        <div class="col-lg-4 col-sm-4">
                                            <div class="form__group">
                                                <label>  {{ 'ANESTHESIABASE' | translate}}</label>
                                                <input type="text" placeholder="Enter Anesthesia Base" ng-model="PayorProcedureFeeObj.OfficeValueCost" valid-number />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-lg-12">
                                <ul class="flex-flow-ulli-mb0">
                                    <li>
                                        <label class="cur-poiter">
                                            <input type="checkbox" class="checkbox" ng-model="PayorProcedureFeeObj.RequirePreAuth">
                                            <span class="lbl"></span>
                                            <span class="text-right usc-remarks"> {{ 'REQUIRESPREAUTHORIZATIONOFPLAN' | translate}}</span>
                                        </label>
                                    </li>
                                    <li>
                                        <label class="cur-poiter">
                                            <input type="checkbox" class="checkbox" ng-model="PayorProcedureFeeObj.ProvedureNotCoveredByInsurance">
                                            <span class="lbl"></span>
                                            <span class="text-right usc-remarks">{{ 'PROCEDURENOTCOVEREDBYPLAN' | translate}}</span>
                                        </label>
                                    </li>
                                    <li>
                                        <label class="cur-poiter">
                                            <input type="checkbox" class="checkbox" ng-model="PayorProcedureFeeObj.CapitatedService">
                                            <span class="lbl"></span>
                                            <span class="text-right usc-remarks">{{ 'CAPITATEDSERVICE' | translate}}</span>
                                        </label>
                                    </li>
                                    <li>
                                        <label class="cur-poiter">
                                            <input type="checkbox" class="checkbox" ng-model="PayorProcedureFeeObj.IsActive">
                                            <span class="lbl"></span>
                                            <span class="text-right usc-remarks"> {{ 'ACTIVE' | translate}}</span>
                                        </label>
                                    </li>
                                    <li>
                                        <label class="cur-poiter">
                                            <input type="checkbox" class="checkbox" ng-model="PayorProcedureFeeObj.IsReferralRequired">
                                            <span class="lbl"></span>
                                            <span class="text-right usc-remarks"> {{ 'REFERRALREQUIRED' | translate}}</span>
                                        </label>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal__footer--">
        <div class="row">
            <div class="col-lg-12">
                <div class="dis-flex align-items-center justify-content-end grid-gap-10">
                    <button class="btn__xl-- btn__C71D27--o" ng-click="ClearDetails()"><i class="action__icons--1 action__clear--"></i>{{ 'CLEAR' | translate}} </button>
                    <button class="btn__xl-- btn__1d5558--f" ng-hide="PayorProcedureFeeObj.OrganizationProcedurePayorId != 0" ng-click="SaveFeeDetails()"><i class="action__icons--1 action__save--"></i>{{ 'SAVE' | translate}}</button>
                    <button class="btn__xl-- btn__1d5558--f" ng-hide="PayorProcedureFeeObj.OrganizationProcedurePayorId == 0" ng-click="SaveFeeDetails()"><i class="action__icons--1 action__update--"></i>{{ 'UPDATE' | translate}}</button>
                </div>
            </div>
        </div>
    </div>
</div>
