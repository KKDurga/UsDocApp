                                                                        </div>
                                                                    </td>

                                                                    <td class="valign-top" width="5%">

                                                                        </a>
                                                                    </td>
                                                                </tr>
                                                                <tr>
                                                                    <th class="valign-top" width="20%">
                                                                        <select class="form-control" ng-model="fitem.FieldTypeId" ng-options="foption.FieldTypeId as foption.FieldName for foption in FieldTypeList" ng-disabled="fitem.FeedBackId !== 0" ng-change="changeFieldType(fitem)" style=" width: 90%;"></select>
                                                                    </th>
                                                                    <td class="fs-20" ng-if="fitem.FieldTypeId === 6">
                                                                        <div class="form-group">
                                                                            <span class="fa fa-star text-danger active"></span>
                                                                            <span class="fa fa-star checked"></span>
                                                                            <span class="fa fa-star checked"></span>
                                                                            <span class="fa fa-star"></span>
                                                                            <span class="fa fa-star"></span>
                                                                        </div>
                                                                    </td>
                                                                    <td class="text-center fs-30" ng-if="fitem.FieldTypeId === 1">
                                                                        <div class="form__group">
                                                                            <input type="text" class="bg-f1f1f1" placeholder="Allow 500 character's only" disabled />
                                                                        </div>
                                                                    </td>
                                                                    <td class="text-center fs-30" ng-if="fitem.FieldTypeId === 5">
                                                                        <div class="form__group">
                                                                            <textarea type="text" class="bg-f1f1f1" placeholder="Allow 3000 character's only" disabled></textarea>
                                                                        </div>
                                                                    </td>
                                                                    <td ng-if="fitem.FieldTypeId === 3">
                                                                        <div class="form__group">
                                                                            <input type="text" class="bg-f1f1f1" placeholder="text1,text2,text3" ng-model="fitem.Values" ng-blur="BlurRadio(fitem)" commasplit ng-disabled="fitem.FeedBackId !== 0" />

                                                                        </div>
                                                                    </td>
                                                                    <td ng-if="fitem.FieldTypeId === 2">
                                                                        <div class="form__group">
                                                                            <input type="text" class="bg-f1f1f1" placeholder="text1,text2,text3" ng-model="fitem.Values" ng-blur="BlurRadio(fitem)" commasplit ng-disabled="fitem.FeedBackId !== 0" />
                                                                        </div>
                                                                    </td>
                                                                    <td class="text-center fs-30" ng-if="fitem.FieldTypeId === 4">
                                                                        <div class="form__group">
                                                                            <input type="text" class="bg-f1f1f1" placeholder="text1,text2,text3" ng-model="fitem.Values" ng-blur="BlurRadio(fitem)" commasplit ng-disabled="fitem.FeedBackId !== 0" />
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </section>
                                            </div>
                                        </div>

                                        <div class="d__f-- fd__c-- jc__c-- ai__c-- gap__10--y  height__100--" ng-show="(FeedBackObj.FeedBackQuestions| filter:{ DeleteInd :'N'}).length == 0">
                                            <a><i class="nodata__1-- e1__nodata--1"></i></a>
                                            <h1 class="fs__2l-- fw__6-- tc__1D1D1D-- m__0--">No Feedback Details  Found</h1>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <!-- / -->
                        <div class="dis-flex justify-content-end">
                            <button class="btn__xl-- btn__1d5558--f" ng-click="AddUpdateFeedBackDetails();" id="btn_save"><i class="action__icons--1 action__save--"></i>{{ 'SAVE' | translate}}</button>
                        </div>
                    </div>
                </div>
            </div>            
        </div>
