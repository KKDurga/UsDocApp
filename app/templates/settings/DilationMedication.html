<div class="setting-content h-100" ng-controller="DilationMedicationCtrl">
    <div class="pos-relative h-100">
        <div class="adjustable-position slim-scroll">
            <div class="dis-flex flex-direction-column grid-gap-10 mt-5">
                <div class="section__style--2" ng-show="addedDilationMedication">
                    <div class="section__header--">
                        <h1>{{ 'DILATIONMEDICATION' | translate}}</h1>
                    </div>
                    <div class="section__body--">
                        <div class="row">
                            <div class="col-lg-6 col-sm-5">
                                <div class="form__group">
                                    <label>{{ 'MEDICINENAME' | translate}}</label>
                                    <input type="text" id="input_madicinename"
                                           placeholder="Enter Medication"
                                           ng-model="DilalationObj.MedicationObj"
                                           typeahead-min-length="2"
                                           uib-typeahead="item as item.MedicationName for item in GetDilationMedication($viewValue,DilalationObj)"
                                           typeahead-on-select="DilationChange(DilalationObj)"
                                           ng-change="changeDilationSearch(DilalationObj)"
                                           ng-disabled="DilalationObj.OrgDilationMedicationId !=''" />
                                </div>
                            </div>
                            <div class="col-lg-2 col-sm-2 m-t-23">
                                <div class="checkbox cn">
                                    <label>
                                        <input name="checkbox-2" type="checkbox" id="input_default" ng-model="DilalationObj.IsDefault">
                                        <span class="checkbox-material">
                                            <span class="check"></span>
                                        </span>
                                        <small>{{ 'DEFAULT' | translate}}</small>
                                    </label>
                                </div>
                            </div>
                            <div class="col-lg-2 col-sm-3">
                                <div class="dis-flex align-items-center grid-gap-10 m-t-23">
                                    <button class="btn__xl-- btn__1d5558--f" ng-click="SaveDilation('Save')" ng-focus="dilationFocus" ng-focus-lost="LostSettingsFocus()" id="btn_save"><i class="action__icons--1 action__save--"></i>{{ 'SAVE' | translate}}</button>
                                    <button class="btn__xl-- btn__C71D27--f" ng-click="closeDilationMedication()" id="btn_cancel"><i class="action__icons--1 action__cancel--"></i>{{ 'CANCEL' | translate}}</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="section__style--2">
                    <div class="section__header--">
                        <h1>{{ 'DILATIONMEDICATION' | translate}}</h1>
                        <button class="btn__lg-- btn__1d5558--f" ng-click="addDilationMedication()" ng-disabled="addedDilationMedication" id="btn_addnew"><i class="action__icons--1 action__add--"></i>Add New</button>
                    </div>
                    <div class="section__body--">
                        <div class="row" ng-show="DilationList.length > 0">
                            <div class="col-lg-12">
                                <div class="overflow__auto--y">
                                    <table class="table__style--7" id="table_dilationlist">
                                        <thead>
                                            <tr>
                                                <th>{{ 'MEDICINENAME' | translate}}</th>
                                                <th>{{ 'DEFAULT' | translate}}</th>
                                                <th class="text-center">{{ 'ACTIONS' | translate}}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr ng-repeat="item in DilationList">
                                                <td ng-bind="item.MedicationName"></td>
                                                <td ng-bind="item.IsDefault?'Yes':'No'"></td>
                                                <td class="column__sm">
                                                    <div class="dis-flex align-items-center grid-gap-5 justify-content-center">
                                                        <a class="cur-poiter" tooltip-placement="top" uib-tooltip="Edit" tooltip-append-to-body="true" ng-click="editMedication(item,'edit')"><i class="ehr-edit aside-icon-ros"></i></a>
                                                        <a class="cur-poiter" tooltip-placement="top" uib-tooltip="Delete" tooltip-append-to-body="true" ng-click="editMedication(item,'delete')"><i class="ehr-delete aside-icon-ros"></i></a>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <!--<div class="row" ng-if="doctorreviewArray.length > 0">
                <div class="col-lg-12 text-right">

                    <uib-pagination total-items="doctorreviewArrayCount"
                                    ng-model="reportSearch.PageNumber"
                                    ng-change="ChangeReportPage(reportSearch.PageNumber)"
                                    items-per-page="reportSearch.PageSize"
                                    class="pull-right pagination-sm mt-0 mb-10"
                                    boundary-link-numbers="true"
                                    boundary-links="true"
                                    max-size="treatrevenuemaxsize"
                                    rotate="false">
                    </uib-pagination>


                </div>
            </div>-->
                            </div>
                        </div>
                        <div class="d__f-- fd__c-- jc__c-- ai__c-- gap__10--y  height__100--" ng-show="DilationList.length == 0">
                            <a><i class="nodata__1-- d3__nodata--1"></i></a>
                            <h1 class="fs__2l-- fw__6-- tc__1D1D1D-- m__0--">No Records Found.</h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
