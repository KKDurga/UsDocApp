<div class="modal__style--1">
    <div class="modal__header--">
        <h1>{{ProviderRow.Name}} ({{ProviderRow.RoleName}}) <span class=" ml__10--  fs__normal-- fs__lg-- fw__5-- tc__FFFFFF-- br__10-- px__5-- bg__1D5558--">{{EhrDetailsCount}}</span></h1>
        <ul class="tab__style--1 pl__5--">
            <li ng-repeat="tab in EhrBucketTabs" ng-class="{'active': ActiveBucket === tab.key}">
                <a ng-click="LoadEhrDetails(tab.key)">{{tab.label}}</a>
            </li>
        </ul>
        <div class="d__f-- ai__c-- gap__10--x">
            <div class="position__relative-- p__2--">
                <a id="button__ASCEhrDetailsExcelStatus--" class="border__1D5558-- p__7-- bradius__4-- bg__F5F5F5-- d__b--" ng-click="ExportEhrDetailsStatus()" tooltip-placement="top" uib-tooltip="Excel exports">
                    <i svg-icon="icon__download--" size="14" style="color: #6A7282"></i>
                </a>
            </div>
            <button id="button__ASCEhrDetailsExcelExport--" class="btn__lg-- btn__1d5558--f" ng-click="ExportEhrDetails()">Export Excel</button>
            <a class="btn__close--2" id="link__ASCEhrDetailsClose--" ng-click="close()">
                <i class="icons__w16-- close__w16--s" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
            </a>
        </div>
    </div>

    <div class="modal__body--">
        <div class="p__10-- adjustable-position">
            <div id="IncompleteEhrDetailsAgGrid" class="ag-theme-alpine" style="height:100%;width:100%"></div>
        </div>
    </div>
</div>
