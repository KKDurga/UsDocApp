                                                                </div>

                                    </table>

</div>

<script type="text/ng-template" id="returnIOLPopup.html">

            <h1 ng-if="returnIOLObj.type == 'Return'">Return IOL</h1>
            <h1 ng-if="returnIOLObj.type == 'Delete'">Delete IOL</h1>
            <ul class="list__none-- d__f-- gap__10--x ai__c-- m__0--">
                <li>
                    <button class="btn__lg-- btn__1d5558--f" ng-click="SaveIolReturn();">Save</button>
                </li>
                <li class="d__f--">
                    <a class="btn__close--2" ng-click="uibIolPopupclose();">

                    </a>
                </li>
            </ul>
        </div>
        <div class="modal__body--">
            <div class="row">
                <div class="col-lg-6">

                        <label>Status <em>*</em></label>
                        <select ng-model="returnIOLObj.StatusId" id="RIOL__Status"
                                ng-change="onStatusChange(returnIOLObj.StatusId)"

                                ng-disabled="returnIOLObj.type == 'Delete'">
                            <option value="">Select</option>
                        </select>

                    <div class="form__group">
                        <label>Status <em>*</em></label>

<script type="text/ng-template" id="AddIolUibPopup.html">
    <div class="section__style--5 d__f-- fd__c-- height__100--">
        <div class="section__header--">
            <h1>Add New IOL Item</h1>

            <div class="d__f-- ai__c-- gap__10--x">
                <a class="btn__close--2" ng-click="uibclose()" id="uibclose">
                    <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
                </a>
            </div>
        </div>
        <div class="section__body-- height__100--">
            <div class="position__relative-- height__100--">
                <div class="adjustable-position slim-scroll">
                    <div class="d__f-- fd__c-- gap__5--y">
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Serial Number <em>*</em></label>
                                    <input id="RIOL__SerialNumber" placeholder="Enter serial number" ng-model="addNewInvenetoryObj.SerialNo" maxlength="20">
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Model Number <em>*</em></label>
                                    <input id="RIOL__ModelNumber" placeholder="Enter model number" ng-model="addNewInvenetoryObj.ModelNumber" ng-disabled="addNewInvenetoryObj.IsEdit">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Lens Type<em>*</em></label>
                                    <select id="RIOL__LensType" ng-model="addNewInvenetoryObj.TypeOfLens"
                                            ng-options="item.LensId as item.LensType for item in GetIolTypeOfLens">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Manufacturer<em>*</em></label>
                                    <select id="RIOL__Manufacture" ng-model="addNewInvenetoryObj.ManufacturerId"
                                            ng-options="item.ManufacturerId as item.Manufacturer for item in GetIolManufacturers">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Power<em>*</em></label>
                                    <select id="RIOL__Power" ng-model="addNewInvenetoryObj.DipoterId"
                                            ng-options="item.Id as item.Power for item in DiopterArray">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Implant Name<em>*</em></label>
                                    <input id="RIOL__ImplantName" placeholder="Enter model number" ng-model="addNewInvenetoryObj.ImplantName">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Manufacturing Date</label>
                                    <input type="text" class="icons-calendar" id="input_ManufacturingDate"
                                           ng-model="addNewInvenetoryObj.ManufacturingDate"
                                           placeholder="MM-DD-YYYY"
                                           datepickerregpatient
                                           mindate="{{addNewInvenetoryObj.ManufacturingDate}}" readonly />
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Shipping Date</label>
                                    <input type="text" class="icons-calendar" id="input_ShippingDate"
                                           ng-model="addNewInvenetoryObj.ShippingDate"
                                           placeholder="MM-DD-YYYY"
                                           datepickerforapplist
                                           mindate="{{addNewInvenetoryObj.ShippingDate}}" readonly />
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Location</label>
                                    <select id="RIOL__Location" ng-model="addNewInvenetoryObj.Location"
                                            ng-options="item.BranchId as item.BranchName for item in BranchesListArray">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-lg-6" ng-if="false">
                                <div class="form__group">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">Status</label>
                                    <select id="RIOL__Status" ng-model="addNewInvenetoryObj.StatusId"
                                            ng-options="item.Id as item.Name for item in IOLStatusArray" ng-disabled="true">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="bg__F8F8F8-- border-top d__f-- ai__c-- py__7-- px__10-- gap__10--x">
            <div class="flex" ng-click="uibclose();">
                <button class="btn__xl-- btn__1d5558--o width__100--" id="RIOL__Cancel">Cancel</button>
            </div>
            <div class="flex">
                <button class="btn__xl-- btn__1d5558--f width__100--" id="RIOL__SaveItem" ng-click="AddNewIOLOrganizationItem();">Save Item</button>
            </div>
        </div>
    </div>
</script>
