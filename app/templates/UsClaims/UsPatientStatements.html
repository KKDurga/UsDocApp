<!--New Design 03/02/2025-->
<div class="d__f-- fd__c-- height__100-- p__8-- gap__y--8 bg__FFFFFF--" ng-controller="UsPatientStatementsCtrl">
    <div class="">
        <ul class="tab__style--7 width-100" id="myTab">
            <li ng-class="(PatientStatementSubTabs == 1)?'active':''">
                <a ng-click="SwitchStatementSubTabs(1)" id="tab_patientbalance"> Patient Balance</a>
            </li>
            <li ng-class="(PatientStatementSubTabs == 3)?'active':''">
                <a ng-click="SwitchStatementSubTabs(3)" id="tab_sepatients">Statement Eligible Patients</a>
            </li>
            <li ng-class="(PatientStatementSubTabs == 4)?'active':''">
                <a ng-click="SwitchStatementSubTabs(4)" id="tab_stahistory">Statement History</a>
            </li>
            <li class="flex d__f--">
                <div class="dis-inline-flex m-l-auto">
                    <div class="form__group dis-flex align-items-center grid-gap-10 w__400--">
                        <label class="white-nowrap">Claim Search</label>
                        <input class="input__style--2 " placeholder="Search Claim No." id="input_claimsearch" ng-model="serchobj.ClaimNumber" ng-enter="SearchPatientwithClaimId(1,'Claims')" />
                    </div>
                </div>
            </li>
        </ul>
    </div>
    <div class="position__relative-- height__100--">
        <div class="adjustable-position">
            <div class="tab-content height__100--">
                <div class="tab-pane in fade active pos-relative height__100--" id="StatementSubTab1" ng-if="PatientStatementSubTabs==1">
                    <div class="height__100--" ng-include="'templates/UsClaims/UsGeneratePatientStatement.html'" ></div>
                </div>
                <div class="tab-pane in fade active pos-relative height__100--" id="StatementSubTab2" ng-if="PatientStatementSubTabs==2">
                    <div class="height__100--" ng-include="'templates/UsClaims/UsTransmissionHistory.html'" ></div>
                </div>
                <div class="tab-pane in fade active pos-relative height__100--" id="StatementSubTab3" ng-if="PatientStatementSubTabs==3">
                    <div class="height__100--" ng-include="'templates/UsClaims/UsPatientStatementQueue.html'" ng-controller="UsPatientStatementQueueCtrl"></div>
                </div>
                <div class="tab-pane in fade active pos-relative height__100--" id="StatementSubTab4" ng-if="PatientStatementSubTabs==4">
                    <div class="height__100--" ng-include="'templates/UsClaims/UsPatientStatementGenerate.html'" ng-controller="UsPatientGenerateCtrl"></div>
                </div>
            </div>
        </div>
    </div>
</div>
