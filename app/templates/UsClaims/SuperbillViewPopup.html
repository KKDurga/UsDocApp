<div class="modal__style--1" >
    <div class="modal__header--">
        <h1>Procedure codes</h1>
        <ul class="list__none-- m__0-- d__f-- ai__c-- gap__10--x">
            <li>

                <button ng-if="ResponsibilityArray.length==0 ||ResponsibilityArray.length==1" class="btn__lg-- btn__1d5558--f" ng-click="CreateClaim(ClaimResponsibilityId)">Create Claim</button>

                <div class="dropdown cstm-dropdown" ng-if="ResponsibilityArray.length>1">
                    <button data-toggle="dropdown" id="button__saveandcreateclaim" class="btn__lg-- btn__1d5558--f">Create Claim <i class="fas fa-chevron-down fs-11"></i></button>
                    <div class="dropdown-menu z-index-eight__one text-left w-200 apptsearchdroplist right-0 left-auto slim-scroll" role="menu" aria-labelledby="dropdownMenu1">
                        <ul>
                            <li role="presentation" ng-repeat="ritem in ResponsibilityArray track by ritem.ResponcibilityId">
                                <a href="javascript:;"
                                   class="dis-block"
                                   ng-click="ClaimResponsibilityId = ritem.ResponcibilityId; CreateClaim(ritem.ResponcibilityId)">
                                    {{ ritem.ResponcibilityName }}
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </li>
            <li class="d__f--">
                <a class="btn__close--2" ng-click="closeuibpopup()">
                    <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body--">
        <div class="position__relative-- height__100--">
            <div class="adjustable-position slim-scroll">
                <div class="d__f-- fd__c-- gap__10--y">
                    <div class="p__12-- border__E4E4E4-- bradius__8-- bg__F9F9F9--">
                        <div class="d__f-- fd__c--">
                            <div class="d__f-- ai__c-- gap__10--x">
                                <div class="d__f-- ai__c-- jc__c--">
                                    <img src="img/sprite-sheet/user-square.svg" class="w__50-- h__50-- br__50--p" />
                                </div>
                                <div class="d__f-- fd__c--">
                                    <h1 class="m__0-- fs__lg-- fw__6-- tc__000--">{{SelectedSuperbillObj.PatientFullName}}</h1>
                                    <ul class="list__none-- m__0-- d__f-- ai__c-- gap__10--x">
                                        <li>
                                            <label class="fs__lg-- fw__4-- tc__656565-- ">MR No: <span class="fw__5-- tc__1D1D1D--"> {{SelectedSuperbillObj.PatientMrNo}}</span></label>
                                        </li>
                                        <li>
                                            <label class="fs__lg-- fw__4-- tc__656565-- ">Gender: <span class="fw__5-- tc__1D1D1D--"> {{SelectedSuperbillObj.PatientGender}}</span></label>
                                        </li>
                                        <!--<li>
                                    <label class="fs__lg-- fw__4-- tc__656565-- ">Age: <span class="fw__5-- tc__1D1D1D--">22Y 08M</span></label>
                                </li>-->
                                        <li>
                                            <label class="fs__lg-- fw__4-- tc__656565-- ">DOB: <span class="fw__5-- tc__1D1D1D--">{{SelectedSuperbillObj.PatientDOB}}</span></label>
                                        </li>
                                        <li>
                                            <label class="fs__lg-- fw__4-- tc__656565-- ">Mobile: <span class="fw__5-- tc__1D1D1D--"> {{SelectedSuperbillObj.PatientMobile}}</span></label>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <ul class="list__none-- m__0-- d__f-- ai__c-- gap__10--x ">
                                <li><label class="fs__lg-- fw__6-- tc__656565--">Available Deposit: <span class="fs__3l-- tc__34B698--"> ${{SelectedSuperbillObj.AvailableDeposit}}</span></label></li>
                                <li><label class="fs__lg-- fw__6-- tc__656565--">Total Patient Due : <span class="fs__3l-- tc__C71D27--"> ${{SelectedSuperbillObj.TotalPatientDue}}</span></label></li>
                                <li><label class="fs__lg-- fw__6-- tc__656565--">Unallocated Amount : <span class="fs__3l-- tc__656565--"> ${{SelectedSuperbillObj.UnallocatedAmount}}</span></label></li>
                                <li><label class="fs__lg-- fw__6-- tc__656565--">Insurance Balance : <span class="fs__3l-- tc__656565--"> ${{SelectedSuperbillObj.InsuranceBalance}}</span></label></li>
                            </ul>
                        </div>
                    </div>

                    <div class="d__f-- fd__c-- border__E4E4E4-- br__4--">
                        <div class="bg__EAEAEA-- px__8-- py__4--">
                            <label class="fs__lg-- fw__7-- lh__18-- tc__1D1D1D--">Service Lines</label>
                        </div>
                        <table class="table__style--22">
                            <thead>
                                <tr>
                                    <!--<th>
                                <label class="d__f-- ai__c-- gap__5--">
                                    <input name="checkbox-1 m__0--" type="checkbox" ng-model="SelectedSuperbillObj.IsCheckAllPayments" ng-click="SelectAllPayments(SelectedSuperbillObj)">
                                    <span class="checkbox-material lh__20--">
                                        <span class="check"></span>
                                    </span>
                                    <small class="fs__md-- fs__normal-- fw__5-- tc__1D1D1D--"></small>
                                </label>
                            </th>-->
                                    <th>
                                        <label>DOS</label>
                                    </th>
                                    <th>
                                        <label>Service</label>
                                    </th>
                                    <!--<th>
                                <label>Revenue Code</label>
                            </th>-->
                                    <th>
                                        <label>Modifiers</label>
                                    </th>
                                    <th>
                                        <label>Diagnosis</label>
                                    </th>
                                    <th>
                                        <label>Units</label>
                                    </th>
                                    <th>
                                        <label>Claim Responsibility</label>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in SelectedSuperbillObj.SuperBillArray track by $index">
                                    <!--<td>
                                <label class="d__f-- ai__c-- gap__5--">
                                    <input name="checkbox-{{$index}} m__0--" type="checkbox" ng-model="item.IsChecked"  ng-click="Changeitem(item)"/>
                                    <span class="checkbox-material lh__20--">
                                        <span class="check"></span>
                                    </span>
                                    <small class="fs__md-- fs__normal-- fw__5-- tc__1D1D1D--"></small>
                                </label>
                            </td>-->
                                    <td>
                                        <label class="fs__lg-- fw__5-- tc__1D1D1D-- lh__20--">{{item.DateOfService|date:'MM-dd-yyyy'}}</label>
                                    </td>
                                    <td>
                                        <label class="fs__lg-- fw__5-- tc__1D1D1D-- lh__20--">{{item.ProcedureCode}}</label>
                                    </td>
                                    <!--<td>
                                <label class="fs__lg-- fw__5-- tc__1D1D1D-- lh__20--">{{item.RevenueBillingCode}}</label>
                            </td>-->
                                    <td>
                                        <label class="fs__lg-- fw__5-- tc__1D1D1D-- lh__20--">{{item.modifierpointer}}</label>
                                    </td>
                                    <td>
                                        <label class="fs__lg-- fw__5-- tc__1D1D1D-- lh__20-- word-brk">{{item.diasisgonpointer}}</label>
                                    </td>
                                    <td>
                                        <label class="fs__lg-- fw__5-- tc__1D1D1D-- lh__20--">{{item.Quantity}}</label>
                                    </td>
                                    <td>
                                        <label class="fs__lg-- fw__5-- tc__1D1D1D-- lh__20--" ng-if="!item.IsChecked">{{item.ResponcibilityName}}</label>
                                        <select class="form__control bg__F5F5F5--" ng-if="item.IsChecked" ng-model="item.ResponcibilityId"
                                                ng-options="ritem.ResponcibilityId as ritem.ResponcibilityName for ritem in ClaimResponsibilities" ng-change="onselectResp(item)">
                                            <option value="" disabled>Select</option>
                                        </select>

                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
