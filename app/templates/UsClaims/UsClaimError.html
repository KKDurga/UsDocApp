<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Edi Errors</h1>
    </div>
    <div class="modal__body--">
        <table class="table__style--15">
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Error Description</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="item in ErrorsList">
                    <td>{{$index+1}}</td>
                    <td class="bold-600">
                        {{item}}
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="modal__footer--">
        <div class="form__group text-right">
            <button type="submit" class="btn__lg-- btn__C71D27--o" ng-click="closeadvisedItems()">Close</button>
        </div>
    </div>
</div>
