<div class="modal__style--1">
    <div class="modal__header--">
        <h1 ng-if="Subtab=='BillingProvider'">Billing Provider List <span class=" ml__10--  fs__normal-- fs__lg-- fw__5-- tc__FFFFFF-- br__10-- px__5-- bg__1D5558--">{{BillingProviderCount}}</span></h1>
        <h1 ng-if="Subtab=='RenderingProvider'" class="fs__normal-- fs__xl-- fw__6-- tc__1D1D1D-- m__0--">Rendering Provider List<span class=" ml__10--  fs__normal-- fs__lg-- fw__5-- tc__FFFFFF-- br__10-- px__5-- bg__1D5558--">{{RenderingProviderCount}}</span></h1>
        <h1 ng-if="Subtab=='UserProvider'" class="fs__normal-- fs__xl-- fw__6-- tc__1D1D1D-- m__0--">User Payments List<span class=" ml__10--  fs__normal-- fs__lg-- fw__5-- tc__FFFFFF-- br__10-- px__5-- bg__1D5558--">{{UserCount}}</span></h1>
        <h1 ng-if="Subtab=='PaymentType'" class="fs__normal-- fs__xl-- fw__6-- tc__1D1D1D-- m__0--"> Payments List<span class=" ml__10--  fs__normal-- fs__lg-- fw__5-- tc__FFFFFF-- br__10-- px__5-- bg__1D5558--">{{PaymentTypeCount}}</span></h1>
        <!--<button popover-trigger="click"
                popover-append-to-body="true"
                popover-class="opfilter-popover m-0"
                popover-placement="bottom-right"
                popover-is-open="isPopoverOpen"
                ng-click="isPopoverOpen =!isPopoverOpen"
                uib-popover-template="ExcelBillingFilterPopover.templateUrl"
                type="button" class="btn__sm-- btn__1d5558--o gap__10--">
            Excel <i class="icons__w16--  filter__w16--o"></i>
        </button>-->

        <div class="d__f-- ai__c-- gap__10--x">
            <div class="position__relative-- p__2--">
                <a class="border__1D5558-- p__7-- bradius__4-- bg__F5F5F5-- d__b--" ng-click="excelExports()"><i svg-icon="icon__download--" size="14" style="color: #6A7282"></i></a>
                <span class="p__3-- top_ bg__C71D27-- bradius__10-- position__absolute-- top__0-- right__0--"></span>
            </div>
            <button class="btn__lg-- btn__1d5558--f" ng-click="ClickForExcelExportData()">Export Excel</button>
            <a class="btn__close--2" id="link__encounterclose" ng-click="close()">
                <i class="icons__w16-- close__w16--s" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'"></i>
            </a>
        </div>
    </div>
    <div class="p__3-- bg__F7981C1A-- border__E4E4E4-- br__4-- mb__10--">
        <table class="table m-0 tableno-bordered tableno-padding table-layout-fix">
            <tbody>
                <tr>
                    <td width="10%" ng-if="false">
                        <div class="form__group select-ui-match custom-select-width ">
                            <label>Location</label>
                            <div class="dropdown cstm-dropdown width-100" button-dropdown-direction>
                                <button class="form__control text-left" id="dropdownMenu2" data-toggle="dropdown">
                                    <i class="icons__w16-- arrowdown__w16--l pos-absolute right__6-- fs-11 top-9"></i>
                                    {{MainPobj.SelectLocationString}}
                                </button>
                                <div class="dropdown-menu dr-drop-app" role="menu" aria-labelledby="dropdownMenu2" ng-click="$event.stopPropagation()">
                                    <div class="input-group droposearch-EH input-group-sm search-control">
                                        <span class="input-group-addon">
                                            <span class="mainsearch-App">
                                                <i class="fas fa-search"></i>
                                            </span>
                                        </span>
                                        <input type="text" class="form-control" placeholder="Search Branch" ng-model="MainPobj.LocationName" />
                                    </div>
                                    <div class="apptsearchdroplist">
                                        <ul>
                                            <li ng-repeat="item in MainPobj.AllBranchesList | filter:{'ClinicName':MainPobj.LocationName}">
                                                <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                                    <input type="checkbox" class="checkbox" ng-model="item.IsChecked" ng-click="ChangeReportsLocation(item)">
                                                    <span class="lbl"></span>
                                                    <span class="fs__lg-- fw__5-- tc__1D1D1D--" ng-bind="item.BranchName"></span>
                                                </label>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td width="10%" ng-if="SubTab !='UserProvider'">
                        <div class="form__group">
                            <label>Billing Provider</label>
                            <div class="dropdown cstm-dropdown width-100" button-dropdown-direction>
                                <button class="form__control text-left" id="dropdownMenu1" data-toggle="dropdown">

                                    {{MainPobj.SelectBillingProviderString}}
                                    <i class="fas fa-chevron-down pos-absolute right-10 fs-11"></i>
                                </button>
                                <div class="dropdown-menu dr-drop-app" role="menu" aria-labelledby="dropdownMenu1" ng-click="$event.stopPropagation()">

                                    <div class="drop-menu-Scroll apptsearchdroplist" ng-click="$event.stopPropagation()">
                                        <ul>
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-all" type="checkbox" class="checkbox" ng-model="MainPobj.AllBillingProviderStatusCheck" ng-change="checkAllBillingProviders(MainPobj.AllBillingProviderStatusCheck)">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small class="text-s14w500c000 pos-relative top-3">All</small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li ng-repeat="item in MainPobj.BillingProviderList track by $index">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-{{item.OrganizationBillingProviderId}}" class="checkbox" type="checkbox" ng-model="item.IsChecked" ng-change="ProviderToggle(item)">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small class="text-s14w500c000 pos-relative top-3">{{item.BillingProviderName}}</small>
                                                    </label>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td width="12%" ng-if="SubTab !='PaymentType'&& SubTab !='UserProvider'">
                        <div class="form__group ">
                            <label>Rendering Provider</label>
                            <div class="dropdown cstm-dropdown width-100" button-dropdown-direction>
                                <button class="form__control text-left" id="dropdownMenu1" data-toggle="dropdown">
                                    {{selectedDoctor}}
                                    <i class="icons__w16-- arrowdown__w16--l pos-absolute right__6-- fs-11 top-9"></i>
                                </button>
                                <div class="dropdown-menu dr-drop-app" role="menu" aria-labelledby="dropdownMenu1" ng-click="$event.stopPropagation()">
                                    <div class="input-group droposearch-EH input-group-sm search-control">
                                        <span class="input-group-addon">
                                            <span class="mainsearch-App">
                                                <i class="fas fa-search"></i>
                                            </span>
                                        </span>
                                        <input type="text" class="form-control" placeholder="Search Doctor" ng-model="searchtxtb.txt1" />
                                    </div>
                                    <div class="apptsearchdroplist">
                                        <ul>
                                            <li>
                                                <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                                    <input type="checkbox" class="checkbox" ng-model="MainPobj.AllDoctorCheck" ng-click="checkAllDoctor(MainPobj.AllDoctorCheck)">
                                                    <span class="lbl"></span>
                                                    <span class="fs__lg-- fw__5-- tc__1D1D1D--">All Doctors</span>
                                                </label>
                                            </li>
                                            <li ng-repeat="item in MainPobj.RenderingProviderDoctorsList | filter:{'FullName':searchtxtb.txt1} track by $index">
                                                <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                                    <input type="checkbox" class="checkbox" ng-model="item.IsChecked" ng-click="DoctorToggle(item);">
                                                    <span class="lbl"></span>
                                                    <span class="fs__lg-- fw__5-- tc__1D1D1D--" ng-bind="item.SecondUserFullName + '-' + item.NPI"></span>
                                                </label>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td width="6%">
                        <div class="form__group">
                            <label for="apptList__bookType">User</label>
                            <div class="dropdown cstm-dropdown width-100 " button-dropdown-direction>
                                <button class="form__control text-left" id="apptList__bookType" data-toggle="dropdown">
                                    <i class="fas fa-chevron-down pos-absolute right-10 fs-11 top-12"></i>
                                    {{MainPobj.SelectUserStatusString}}
                                </button>
                                <div class="dropdown-menu dr-drop-app overflow__hidden--y" role="menu" aria-labelledby="dropdownMenu3" ng-click="$event.stopPropagation()">
                                    <div class="p-5">
                                        <input type="text" class="form-control input-sm bg-inputy" placeholder="{{ 'SEARCH' | translate}}" ng-model="MainPobj.UserFullName" />
                                    </div>
                                    <div class="drop-menu-Scroll apptsearchdroplist">
                                        <ul>
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-11" type="checkbox" ng-model="MainPobj.AllUserStatusCheck" ng-click="CheckReportAllPaymentType(MainPobj.AllUserStatusCheck,'User')">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small>All</small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li ng-repeat="item in MainPobj.ReportUsersList | filter:{'FullName':MainPobj.UserFullName} track by $index">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-11" type="checkbox" ng-model="item.IsChecked" ng-click="ChangeReportsUser(item)">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small ng-bind="item.FullName"></small>
                                                    </label>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>

                    <td width="10%">
                        <div class="form__group">
                            <label>Payment Date</label>
                            <select ng-model="MainPobj.PaymentDateRangeId" id="select_daterange"
                                    ng-options="item.Id as item.Name for item in PaymentDateRangeArray"
                                    ng-change="setPaymentDateRange(MainPobj.PaymentDateRangeId)">
                                <option value="">Select</option>
                            </select>
                        </div>


                    </td>
                    <td ng-if="MainPobj.PaymentDateRangeId == 11" width="11%">
                        <div class="form__group">
                            <label>From Date</label>
                            <input placeholder="MM/DD/YYYY" class="icons-calendar" ng-model="MainPobj.PatientPayFromDate"
                                   datepickerforapplist readonly>
                        </div>
                    </td>
                    <td ng-if="MainPobj.PaymentDateRangeId == 11" width="11%">
                        <div class="form__group">
                            <label>To Date</label>
                            <input placeholder="MM/DD/YYYY" class="icons-calendar" ng-model="MainPobj.PatientPayToDate" datepickerforapplist
                                   mindate="{{MainPobj.PatientPayFromDate}}" readonly>
                        </div>
                    </td>
                    <td width="10%">
                        <div class="form__group">
                            <label for="apptList__bookType">Payment Method</label>
                            <div class="dropdown cstm-dropdown width-100 " button-dropdown-direction>
                                <button class="form__control text-left" id="apptList__bookType" data-toggle="dropdown">
                                    <i class="fas fa-chevron-down pos-absolute right-10 fs-11 top-12"></i>
                                    {{MainPobj.SelectPaymentStatusString}}
                                </button>
                                <div class="dropdown-menu dr-drop-app overflow__hidden--y" role="menu" aria-labelledby="dropdownMenu3" ng-click="$event.stopPropagation()">
                                    <div class="p-5">
                                        <input type="text" class="form-control input-sm bg-inputy" placeholder="{{ 'SEARCH' | translate}}" ng-model="MainPobj.PaymentMethodName" />
                                    </div>
                                    <div class="drop-menu-Scroll apptsearchdroplist">
                                        <ul>
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-11" type="checkbox" ng-model="MainPobj.AllStatusCheck" ng-click="CheckReportAllPaymentType(MainPobj.AllStatusCheck,'Payment')">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small>All</small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li ng-repeat="item in MainPobj.AllMasterPaymentsMethods | filter:{'PaymentModeName':MainPobj.PaymentMethodName} track by $index">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-11" type="checkbox" ng-model="item.IsChecked" ng-click="ChangeReportsPaymentType(item)">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small ng-bind="item.PaymentModeName"></small>
                                                    </label>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </td>
                    <td width="10%" ng-if="SubTab !='PaymentType'">
                        <div class="form__group">
                            <label>Service Date</label>
                            <select ng-model="MainPobj.ServiceDateRangeId" id="select_servicedaterange"
                                    ng-options="item.Id as item.Name for item in ServiceDateRangeArray"
                                    ng-change="setServiceDateRange(MainPobj.ServiceDateRangeId)">
                                <option value="">Select</option>
                            </select>
                        </div>
                    </td>
                    <td ng-if="MainPobj.ServiceDateRangeId == 11" width="11%">
                        <div class="form__group">
                            <label>From Date</label>
                            <input placeholder="MM/DD/YYYY" class="icons-calendar" ng-model="MainPobj.ServiceFromDate"
                                   datepickerforapplist readonly>
                        </div>
                    </td>
                    <td ng-if="MainPobj.ServiceDateRangeId == 11" width="11%">
                        <div class="form__group">
                            <label>To Date</label>
                            <input placeholder="MM/DD/YYYY" class="icons-calendar" ng-model="MainPobj.ServiceToDate" datepickerforapplist
                                   mindate="{{MainPobj.PatientPayFromDate}}" readonly>
                        </div>
                    </td>
                    <td>
                        <div class="d__f-- ai__c-- gap__5-- mt__20--">                            
                            <button class="btn__lg-- btn__2D2D47--f" ng-click="ClickForFilteredData()">Apply</button>
                            <button class=" b-0" id="btn_clear" ng-click="ClearFilters()">
                                <i class="reload-icon"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="modal__body--" ng-if="Subtab=='BillingProvider'">
        <div class="p__10-- adjustable-position" id="myGridContainer">
            <div id="popupAgGrid" dragScroll
                 class="ag-theme-alpine"
                 style="height:100%;width:100%">
            </div>
        </div>
    </div>
    <div class="modal__body--" ng-if="Subtab=='RenderingProvider'">
        <div class="p__10-- adjustable-position" id="myGridContainer">
            <div id="RenderingProviderpopupAgGrid" dragScroll
                 class="ag-theme-alpine"
                 style="height:100%;width:100%">
            </div>

        </div>
    </div>
    <div class="modal__body--" ng-if="Subtab=='UserProvider'">
        <div class="p__10-- adjustable-position" id="myGridContainer">

            <div id="UserpopupAgGrid" dragScroll
                 class="ag-theme-alpine"
                 style="height:100%;width:100%">
            </div>

        </div>
    </div>
    <div class="modal__body--" ng-if="Subtab=='PaymentType'">
        <div class="p__10-- adjustable-position" id="myGridContainer">

            <div id="PaymentspopupAgGrid" dragScroll
                 class="ag-theme-alpine"
                 style="height:100%;width:100%">
            </div>

        </div>
    </div>
</div>





 

<script type="text/ng-template" id="ExcelBillingFilterPopover.html" ng-if="isPopoverOpen">
    <div class="d__f-- fd__c--">
        <div class="d__f-- ai__c-- jc__sb--  bb__DDD-- px__12-- py__8--">
            <h1 class="fs__xl-- fw__5-- tc__1D1D1D-- m__0--">Filter</h1>
            <a ng-click="closeFilterPopover()"><i class="icons__w16-- close__w16--l"></i></a>
        </div>
        <div class="form__group">
            <label>Payment Date</label>
            <select ng-model="ExcelReportsObj.PaymentDateRangeId" id="select_daterange"
                    ng-options="item.Id as item.Name for item in PaymentDateRangeArray"
                    ng-change="setPaymentDateRange(ExcelReportsObj.PaymentDateRangeId)">
                <option value="">Select</option>
            </select>
        </div>
        <div class="d__f-- ai__c-- gap__10-- jc__e-- bt__DDD-- p__5--">
            <button class="btn__lg-- btn__1d5558--f" ng-click="ExporttoExcel('Apply')">{{ 'APPLY' | translate}}</button>
        </div>
    </div>
</script>
