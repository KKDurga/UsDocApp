<div class="d__f-- fd__c-- gap__5-- height__100--">
    <div class="p__3-- bg__F7981C1A-- border__E4E4E4-- br__4-- mb__10--">
        <table class="table m-0 tableno-bordered tableno-padding table-layout-fix">
            <tbody>
                <tr>

                    <td width="7%">
                        <div class="form__group">
                            <label>From Date</label>
                            <input placeholder="MM/DD/YYYY" class="icons-calendar" ng-model="ExcelDetailsObj.FromDate"
                                   datepickerforapplist readonly>
                        </div>
                    </td>
                    <td width="7%">
                        <div class="form__group">
                            <label>To Date</label>
                            <input placeholder="MM/DD/YYYY" class="icons-calendar" ng-model="ExcelDetailsObj.ToDate" datepickerforapplist
                                   mindate="{{ExcelDetailsObj.ToDate}}" readonly>
                        </div>
                    </td>
                    <td width="10%">
                        <div class="form__group">
                            <label>Report Type</label>
                            <select ng-model="ExcelDetailsObj.ReportId" id="select_servicedaterange"
                                    ng-options="item.MasterReportId as item.MasterReportName for item in MasterReportList"
                                    ng-change="changeReportType(ExcelDetailsObj.ReportId)">
                                <option value="">Select</option>
                            </select>
                        </div>
                    </td>
                    <td width="6%">
                        <div class="form__group">
                            <label for="apptList__bookType">User</label>
                            <div class="dropdown cstm-dropdown width-100 " button-dropdown-direction>
                                <button class="form__control text-left" id="apptList__bookType" data-toggle="dropdown">
                                    <i class="fas fa-chevron-down pos-absolute right-10 fs-11 top-12"></i>
                                    {{ExcelDetailsObj.SelectUserStatusString}}
                                </button>
                                <div class="dropdown-menu dr-drop-app overflow__hidden--y" role="menu" aria-labelledby="dropdownMenu3" ng-click="$event.stopPropagation()">
                                    <div class="p-5">
                                        <input type="text" class="form-control input-sm bg-inputy" placeholder="{{ 'SEARCH' | translate}}" ng-model="ExcelDetailsObj.UserFullName" />
                                    </div>
                                    <div class="drop-menu-Scroll apptsearchdroplist">
                                        <ul>
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-11" type="checkbox" ng-model="ExcelDetailsObj.AllUserStatusCheck" ng-click="CheckReportAllPaymentType(ExcelDetailsObj.AllUserStatusCheck,'User')">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small>All</small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li ng-repeat="item in ExcelDetailsObj.AllUsersList | filter:{'FullName':ExcelDetailsObj.UserFullName} track by $index">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-11" type="checkbox" ng-model="item.IsChecked" ng-click="ChangeReportsUser(item)">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small ng-bind="item.FullName"></small>
                                                    </label>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td width="10%">
                        <div class="form__group">
                            <label>Status</label>
                            <select ng-model="ExcelDetailsObj.StatusId" id="select_servicedaterange"
                                    ng-options="item.StatusId as item.StatusName for item in ExportDataStatus"
                                    ng-change="setServiceDateRange(ExcelDetailsObj.StatusId)">
                                <option value="">Select</option>
                            </select>
                        </div>
                    </td>


                    <td width="8%">
                        <div class="d__f-- ai__c-- gap__5-- mt__20--">
                            <button class="btn__lg-- btn__2D2D47--f" ng-click="ClickForFilterExcelData()">Apply</button>
                            <button class=" b-0" id="btn_clear" ng-click="ClearExcelFilters()">
                                <i class="reload-icon"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="position__relative-- height__100--">
        <div class="adjustable-position slim-scroll">
            <table class="table__style--21" id="table_pospaylist" ng-if="ExportSummarylist.length > 0">
                <thead>
                    <tr>
                        <th width="10%">Export Job</th>
                        <th width="18%">User</th>
                        <th>Report Name</th>
                        <th width="13%">Created</th>
                        <th width="12%">Status</th>
                        <th width="11%">S3url</th>
                    </tr>
                </thead>
                <tbody class="border__none--" ng-repeat="item in ExportSummarylist track by $index">
                    <tr class="hover__1D55581A--bg">
                        <td>{{item.ExportJobId}}</td>
                        <td>{{item.RequestedByUserName}}</td>
                        <td>{{item.MasterReportName}}</td>
                        <td>{{item.CreatedDt | date:'MM-dd-yyyy'}}</td>
                        <td>{{item.StatusName}}</td>
                        <td>
                            <a ng-if="item.CSVFileUrl"
                               ng-href="{{item.CSVFileUrl}}"
                               target="_blank"
                               download>
                                Download
                            </a>
                        </td>

                    </tr>

                </tbody>
            </table>
        </div>
    </div>

    <div class="d__f-- fd__c-- jc__c-- ai__c-- gap__10--y  height__100--" ng-if="ExportSummarylist.length == 0">
        <a><i class="nodata__1-- c3__nodata--1"></i></a>
        <h1 class="fs__2l-- fw__6-- tc__1D1D1D-- m__0--">No Data</h1>
        <label class="fs__lg-- fw__5-- tc__4A4A4A--"></label>
    </div>
</div>
