<div class="modal__style--1">
    <div class="modal__header--">
        <h1>
            {{MetricLabel}} - {{CellInfo.doctorName}} ({{BucketLabel}})
            <span class="ml__10-- fs__normal-- fs__lg-- fw__5-- tc__FFFFFF-- br__10-- px__5-- bg__1D5558--">{{ODDetailsCount}}</span>
        </h1>
        <ul class="tab__style--1 pl__5--">
            <!-- the metric key is what the api filters on and what CellInfo
                 holds, so both the highlight and the click use tab.key -->
            <li ng-repeat="tab in MetricTabs" ng-class="{'active': CellInfo.metric === tab.key}">
                <a ng-click="LoadODDetails(tab.key)">{{tab.label}}</a>
            </li>
        </ul>
        <div class="d__f-- ai__c-- gap__10--x">
            <a class="btn__close--2" id="link__odclose" ng-click="close()">
                <i class="icons__w16-- close__w16--s" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'"></i>
            </a>
        </div>
    </div>

    <div class="modal__body--">
        <div class="p__10-- adjustable-position" id="ODDetailsGridContainer">

            <div id="ODDetailsAgGrid" dragScroll
                 class="ag-theme-alpine"
                 style="height:100%;width:100%">
            </div>

        </div>
    </div>
</div>
