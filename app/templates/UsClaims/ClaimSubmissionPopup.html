<div class="col-lg-13">
    <section class="asc-main-panel">
        <div class="asc-header-panel">
            <h1>Claim Submission Details</h1>
            <ul class="us-controls">
                <li>
                    <a>
                        <i class="fas fa-times fa-lg text-danger" ng-click="closeuibpopup();"></i>
                    </a>
                </li>
            </ul>
        </div>
        <div class="asc-body-panel p-15 dis-flex flex-direction-column grid-gap-5">
            <div class="row">
                <div class="col-lg-4">
                    <div class="form__group">
                        <label>Payer</label>
                        <em>*</em>                       
                        <select  ng-model="PatientClaimTransmissionObj.PatientInsuranceDetailId" ng-disabled="item.IsPrimaryDisabled"
                                ng-options="item.PatientInsuranceDetailId as item.PayorName+'-'+item.PlanCode for item in ClaimTransInsuranceList"
                                ng-change="changeInsurancePayorClaim(PatientClaimTransmissionObj)">
                            <option value="" selected>Select</option>
                        </select>
                        <!--<select ng-change="changeInsurancePayorClaim(PatientClaimTransmissionObj)" ng-model="PatientClaimTransmissionObj.PatientInsuranceDetailId">
                            <option value="">Select</option>
                            <option ng-repeat="item in ClaimTransInsuranceList"
                                    value="{{item.PatientInsuranceDetailId}}"
                                    ng-disabled="item.IsPrimaryDisabled">
                                {{item.PayorName | uppercase}} - {{item.PlanCode}}
                                <span>| {{item.InsuranceOrder}}</span>
                            </option>
                        </select>-->
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="form-group">
                        <label>Prior Auth No.</label>
                        <input type="text" class="form-control" ng-model="PatientClaimTransmissionObj.PriorAuthorizationNumber" ng-change="changePriorAuthNumber()" />
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="form__group">
                        <label>Format</label>
                        <em>*</em>
                        <select ng-change="changeTransmissionTypes(PatientClaimTransmissionObj.TransmissionTypeId)" ng-model="PatientClaimTransmissionObj.TransmissionTypeId" ng-options="item.TransmissionMethodId as item.TransmissionMethodCode for item in TransmissionTypes">
                            <option value="">Select</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-4">
                    <div class="form__group">
                        <label>Claim Type</label>
                        <select ng-model="PatientClaimTransmissionObj.TransmissionMethodId" ng-change="changeBillingTransmissionMethod(PatientClaimTransmissionObj.TransmissionMethodId)" ng-options="item.ClaimTypeId as item.ClaimTypename for item in masterBillingFrequencyTypes">
                            <option value="">Select</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-4" ng-show="PatientClaimTransmissionObj.TransmissionMethodId==7 || PatientClaimTransmissionObj.TransmissionMethodId==8">
                    <div class="form-group">
                        <label>Replacement Control Number.</label>
                        <input type="text" class="form-control" ng-model="PatientClaimTransmissionObj.ReplacementControlNumber"
                           ng-disabled="PatientClaimTransmissionObj.PayerClaimControlNumber != null"    />
                    </div>
                </div>
            </div>
            <!--<div class="row">
                <div class="col-lg-12 m-t-10">
                    <div class="row">
                        <div class="col-lg-12 text-right m-b-10">
                            <button class="btn btn-info" ng-click="SavePatientEncounterClaim('Draft')">Save</button>
                            <button class="btn btn-danger" ng-click="clearclaimsubmissiondetails()">Clear</button>
                        </div>
                    </div>
                </div>
            </div>-->
        </div>
        <div class="modal-footer">
            <div class="row">
                <div class="col-lg-12 pull-right">
                    <button type="button" class="etn btn-ehnote-outline p-l-25 p-r-25" ng-click="SaveClaimTransmissionDetails();"> {{ 'SAVE' | translate}}</button>
                    <button type="button" class="etn btn-ehnote-outline p-l-25 p-r-25" ng-click="clearclaimsubmissiondetails();"> {{ 'CLEAR' | translate}}</button>
                </div>
            </div>
        </div>
    </section>
</div>
