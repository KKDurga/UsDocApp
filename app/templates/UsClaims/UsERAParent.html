<div class="height__100-- d__f-- fd__c-- bg__FFFFFF-- p__8-- gap__y--8" ng-controller="UsERAParentCtrl" >
    <div class="d__f-- jc__sb-- ai__c-- gap__10--x">
        <ul class="tab__style--7 width-100" id="myTab">
            <li ng-class="(ERASubTabs == 1)?'active':''">
                <a ng-click="SwitchERASubTabs(1)" id="tab_eralist">ERA List</a>
            </li>
            <li ng-class="(ERASubTabs == 3)?'active':''">
                <a ng-click="SwitchERASubTabs(3)" id="tab_unmatechedclaims">UnMatched Claims</a>
            </li>
            <li ng-class="(ERASubTabs == 2)?'active':''">
                <a ng-click="SwitchERASubTabs(2)" id="tab_eraparsinglogs">ERA Parsing Logs</a>
            </li>

        </ul>
        <div class="d__f-- ai__c-- gap__10--x">
            <div class="position__relative-- p__2--" >
                <a class="border__1D5558-- p__8-- bradius__4-- bg__F5F5F5-- d__b--" ng-click="excelExports()"><i svg-icon="icon__download--" size="14" style="color: #6A7282"></i></a>
                <span class="p__3-- top_ bg__C71D27-- bradius__10-- position__absolute-- top__0-- right__0--"></span>
            </div>
            
            <div class="d__f-- ai__c-- gap__5--x" ng-click="ERAExportToExcelPopup()">
                <button class="btn__lg-- btn__1d5558--o ws__nowrap-- py__8--">Export To Excel</button>
            </div>
        </div>
        <div class="d__f-- ai__c-- gap__10--x width__35--">
            <div class="d__f-- ai__c-- gap__5--x" ng-click="ERAListFilterNewPopup()" ng-if="ERASubTabs==1">
                <button class="btn__lg-- btn__1d5558--o py__8--">Filter <i class="filter__w16--o icons__w16--"></i> </button>
            </div>
            <div class="form__group dis-flex align-items-center grid-gap-10 width__100--">
                <input class="input__style--2" placeholder="Search Claim No." id="input_claim" ng-model="serchobj.ClaimNumber" ng-enter="SearchPatientwithClaimId(1,'Claims')" />
            </div>
        </div>
    </div>
   
    <div class="tab-content height__100--">
        <div class="tab-pane in fade active position__relative-- height__100--" id="ERASubTab1" ng-if="ERASubTabs==1">
            <div class="h-100" ng-include="'templates/UsClaims/UsERAList.html'"></div>
        </div>
        <div class="tab-pane in fade active position__relative-- height__100--" id="ERASubTab2" ng-if="ERASubTabs==2">
            <div class="h-100" ng-include="'templates/UsClaims/UsERAParsingLogs.html'"></div>
        </div>
        <div class="tab-pane in fade active position__relative-- height__100--" id="ERASubTab3" ng-if="ERASubTabs==3">
            <div class="h-100" ng-include="'templates/UsClaims/UsERAErrorclaimsList.html'"></div>
        </div>
    </div>
</div>

<script type="text/ng-template" id="ExporttoExcel.html">
    <div class="modal__style--1">
        <div class="modal__header--">
            <h1>Export to excel</h1>
            <a class="btn__close--2" ng-click="uibclose()">
                <i class="icons__w16-- close__w16--s" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false" style=""></i>
            </a>
        </div>
        <div class="modal__body-- p__23--">
            <div class="d__f-- ai__c-- gap__10-- ">
                <div class="form__group width__80--">
                    <label>Check Range</label>
                    <select id="select_daterange"
                            ng-model="Export.EraDateRange"
                            ng-options="item.Id as item.Name for item in PaymentDateRangeArray"
                            ng-change="setInsuranceCheckDateRange(Export.EraDateRange)">
                        <option value="">Select</option>
                    </select>
                </div>
                <div ng-if="Export.EraDateRange == 11">
                    <div class="form__group">
                        <label>From Date</label>
                        <input placeholder="MM/DD/YYYY" class="icons-calendar" ng-model="ExporttoExcelObj.PaymentFromDate"
                               datepickerforapplist readonly>
                    </div>
                </div>
                <div ng-if="Export.EraDateRange == 11">
                    <div class="form__group">
                        <label>To Date</label>
                        <input placeholder="MM/DD/YYYY" class="icons-calendar" ng-model="ExporttoExcelObj.PaymentToDate" datepickerforapplist
                               mindate="{{MainPobj.PaymentFromDate}}" readonly>
                    </div>
                </div>
                <div class="form__group mt__20--">
                    <button ng-click="ClickForERAExceldData()"
                            class="btn__sm-- btn__1d5558--f">
                        Generate
                    </button>
                </div>
            </div>
        </div>
    </div>
</script>
