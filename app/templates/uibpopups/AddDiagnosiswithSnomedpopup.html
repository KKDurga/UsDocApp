<div class="modal__style--1">
    <div class="modal__header--">
        <h1>ICD10 & Snomed Code</h1>
        <a class="btn__close--2" ng-click="close()">
            <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
        </a>
    </div>
    <div class="modal__body--">
        <div class="dis-flex flex-direction-column grid-gap-10" ng-show="Type=='Diagnosis'">
            <div class="section__style--2">
                <div class="section__body--">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-responsive">
                                <table class="table tableno-bordered m-b-0">
                                    <tbody>
                                        <tr>
                                            <td>
                                                <div class="form__group">
                                                    <label>Diagnosis</label><em>*</em>
                                                    <input type="text" placeholder="Enter Diagnosis" ng-model="obj.Diagnosisobj" disabled />
                                                </div>
                                            </td>
                                            <td>
                                                <div class="form__group">
                                                    <label>Snomed</label>
                                                    <input type="text"
                                                           name="SNOMED"
                                                           placeholder="Enter SNOMED"
                                                           ng-model="obj.SnomedCodeobj"
                                                           maxlength="100"
                                                           typeahead-min-length="0"
                                                           typeahead-focus-on-select="false"
                                                           uib-typeahead="item as item.ConceptId for item in GetSearchSnomedCodes($viewValue)"
                                                           typeahead-on-select="onSelectSystemicHistoryDiagnosis(obj.SnomedCodeobj)" />
                                                </div>
                                            </td>
                                            <td>
                                                <div class="form-group m-t-25">
                                                    <label></label>
                                                    <button class="btn btn-link" ng-click="AddDiagnosis(diagitem,'Diagnosis')">+Add More</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="dis-flex align-items-center grid-gap-10 justify-content-end">
                                <button class="btn__xl-- btn__C71D27--o" ng-click="close();">Close</button>
                                <button class="btn__xl-- btn__1d5558--f" ng-click="Save();"><i class="action__icons--1 action__save--"></i>{{EditSnomed}}</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="section__style--2" ng-show="ICD10SnomedList.length>0">
                <div class="section__body--">
                    <div class="row">
                        <div class="col-lg-12">
                            <table class="table__style--7">
                                <thead>
                                    <tr>
                                        <th>Diagnosis</th>
                                        <th>Snomed</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in ICD10SnomedList track by $index">
                                        <td>{{item.ICD10Code}}</td>
                                        <td>{{item.SnomedCode}}</td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="section__style--2" ng-show="ICD10List.length>0">
                <div class="section__header--">
                    <h1>ICD10 List</h1>
                </div>
                <div class="section__body--">
                    <div class="row">
                        <div class="col-lg-12">
                            <table class="table__style--7">
                                <thead>
                                    <tr>
                                        <th>Diagnosis</th>
                                        <th>Snomed</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in ICD10List track by $index">
                                        <td>{{item.ICD10Code}}</td>
                                        <td>{{item.SnomedCode}}</td>
                                        <td>
                                            <a class="cur-poiter" ng-click="EditSnomedCode(item)"><i class="ehr-edit aside-icon-ros" data-tooltip="Edit"></i></a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="dis-flex flex-direction-column grid-gap-10"  ng-show="Type !=='Diagnosis'">
            <div class="section__style--2">
                <div class="section__body--">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-responsive">
                                <table class="table tableno-bordered m-b-0">
                                    <tbody>
                                        <tr>
                                            <td>
                                                <div class="form__group">
                                                    <label>Snomed</label><em>*</em>
                                                    <input type="text" placeholder="Enter Snomed" ng-model="Snomedobj.SnomedCodeobj" disabled />
                                                </div>
                                            </td>
                                            <td>
                                                <div class="form__group">
                                                    <label>Diagnosis</label>
                                                    <input type="text"
                                                           name="ICD10"
                                                           placeholder="Enter ICD10"
                                                           ng-model="Snomedobj.Diagnosisobj"
                                                           maxlength="100"
                                                           typeahead-min-length="0"
                                                           typeahead-focus-on-select="false"
                                                           uib-typeahead="item as item.ICD10CODE for item in GetSearchICD10Codes($viewValue)"
                                                           typeahead-on-select="onSelectDiagnosis(Snomedobj.Diagnosisobj)" />
                                                </div>
                                            </td>
                                            <td>
                                                <div class="form-group m-t-25">
                                                    <label></label>
                                                    <button class="btn btn-link" ng-click="AddDiagnosis(diagitem,'Diagnosis')">+Add More</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="row" ng-show="ICD10SnomedList.length>0">
                        <div class="col-lg-12">
                            <table class="table__style--7">
                                <thead>
                                    <tr>
                                        <th>Diagnosis</th>
                                        <th>Snomed</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in ICD10SnomedList track by $index">
                                        <td>{{item.ICD10Code}}</td>
                                        <td>{{item.SnomedCode}}</td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="dis-flex align-items-center justify-content-end grid-gap-10">
                                <button class="btn__xl-- btn__C71D27--o" ng-click="close();">Close</button>
                                <button class="btn__xl-- btn__1d5558--f" ng-click="Save();"><i class="action__icons--1 action__save--"></i>Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="section__style--2" ng-show="ICD10List.length>0">
                <div class="section__header--">
                    <h1>ICD10 List</h1>
                </div>
                <div class="section__body--">
                    <div class="row">
                        <div class="col-lg-12">
                            <table class="table__style--7">
                                <thead>
                                    <tr>
                                        <th>Diagnosis</th>
                                        <th>Snomed</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in ICD10List track by $index">
                                        <td>{{item.ICD10Code}}</td>
                                        <td>{{item.SnomedCode}}</td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
