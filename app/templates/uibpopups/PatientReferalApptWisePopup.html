<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Patient Referral </h1>
        <button class="btn__lg-- btn__C71D27--o" ng-click="closeuibpopup();">{{ 'CLOSE' | translate}}</button>
    </div>
    <div class="modal__body-- p__0--">
        <div class="dis-flex flex-direction-column grid-gap-5 h-100">
            <div class="h-100 pos-relative">
                <div class="adjustable-position p-15">
                    <div class="grid-gap-10 dis-flex flex-direction-column h-100">
                        <div class="row p-10 bg-light">
                            <div class="col-lg-12">
                                <div class="dis-flex align-items-center grid-gap-15">
                                    <label class="cur-poiter dis-flex align-items-center grid-gap-5">
                                        <input type="checkbox" class="checkbox" value='1' ng-model="PatientApptPCPInfo.ReferalCheckBox" ng-change='PCPApptReferalDataClick(PatientApptPCPInfo.ReferalCheckBox)'>
                                        <span class="lbl"></span>
                                        <span class="text-s12w500c000 lh-1-0 fs-14">{{ 'REFERRAL' | translate}}</span>
                                    </label>
                                    <label class="cur-poiter dis-flex align-items-center grid-gap-5">
                                        <input type="checkbox" class="checkbox" value='6' ng-model="PatientApptPCPInfo.PCPCheckBox" ng-change='PCPApptPCPDataClick(PatientApptPCPInfo.PCPCheckBox)'>
                                        <span class="lbl"></span>
                                        <span class="text-s12w500c000 lh-1-0 fs-14">{{ 'PCP' | translate}}</span>
                                    </label>

                                    <label class="cur-poiter dis-flex align-items-center grid-gap-5">
                                        <input type="checkbox" class="checkbox" value='1' ng-model="PatientApptPCPInfo.SourceCheckBox" ng-change='PCPApptSourceDataClick(PatientApptPCPInfo.SourceCheckBox)'>
                                        <span class="lbl"></span>
                                        <span class="text-s12w500c000 lh-1-0 fs-14">{{ 'SOURCE' | translate}}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="section__style--1" ng-show="PatientApptPCPInfo.PCPCheckBox">
                            <div class="section__header--">
                                <h1>PCP</h1>
                                <label class="cur-poiter dis-flex align-items-center grid-gap-5">
                                    <input type="checkbox" class="checkbox" name="PatientApptPCPInfo.IsReferalCoManagerInd" value="co-manager" ng-model="PatientApptPCPInfo.IsPCPCoManagerInd">
                                    <span class="lbl"></span>
                                    <span class="text-s12w500c000 lh-1-0 fs-14">{{ 'COMANAGER' | translate}}</span>
                                </label>
                            </div>
                            <div class="section__body--">
                                <table class="tableno-bordered table tableno-padding width-100" id="table_pcp">
                                    <tbody>
                                        <tr>
                                            <td>
                                                <div class="form__group" typehead-dropdown-direction>
                                                    <label>{{ 'PCP' | translate}}</label>
                                                    <input type="text"
                                                           id="input_pcp"
                                                           autocomplete="off"
                                                           name="InsurancePayor"
                                                           ng-model-options="{ debounce: 500 }"
                                                           ng-change="changeApptpcpDoctor(PatientApptPCPInfo)"
                                                           placeholder="{{ 'ENTERPCP' | translate}}"
                                                           ng-model="PatientApptPCPInfo.PCPobj"
                                                           typeahead-min-length="0"
                                                           typeahead-on-select="onSelectApptPcpDoctor(PatientApptPCPInfo.PCPobj,PatientApptPCPInfo)"
                                                           uib-typeahead="item as item.FullName +' - '+item.NPI  for item in searchReferalDoctors($viewValue,1)" />
                                                </div>
                                            </td>
                                            <td>
                                                <div class="form__group">
                                                    <label>{{ 'NPI' | translate}}</label>
                                                    <input type="text" ng-disabled="true" id="input_npi" placeholder="{{ 'ENTERNPI' | translate}}" ng-model="PatientApptPCPInfo.PcpNPI" maxlength="30" />
                                                </div>
                                            </td>
                                            <td>
                                                <div class="form__group">
                                                    <label>{{ 'EMAILID' | translate}}</label>
                                                    <input type="text" ng-disabled="true" id="input_emailid" placeholder="{{ 'ENTEREMAILID' | translate}}" ng-model="PatientApptPCPInfo.PCPEmailId" />
                                                </div>
                                            </td>
                                            <td>
                                                <div class="form__group">
                                                    <label>{{ 'CONTACTNO' | translate}}</label>
                                                    <input type="text" ng-disabled="true" id="input_contactno" placeholder="{{ 'ENTERCONTACTNO' | translate}}" ng-model="PatientApptPCPInfo.PCPContactNo" />
                                                </div>
                                            </td>
                                            <td>
                                                <div class="form__group">
                                                    <label>{{ 'REFFERALNO' | translate}}1</label>
                                                    <input type="text" placeholder="{{ 'ENTERREFFERALNO' | translate}}"
                                                           id="input_referralno1" ng-model="PatientApptPCPInfo.PCPReferenceNumber"
                                                          ng-change="PatientApptPCPInfo.PCPReferenceNumber = PatientApptPCPInfo.PCPReferenceNumber.toUpperCase()"

                                                           maxlength="16" />
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="valign-top">
                                                <div class="form__group">
                                                    <label>{{ 'REFERRALDATE' | translate}}</label>
                                                    <input type="text" placeholder="MM-DD-YYYY" id="input_referraldate" ng-model="PatientApptPCPInfo.PCPReferralDate" datepickerregpatientus readonly />
                                                </div>
                                            </td>
                                            <td class="valign-top">
                                                <div class="form__group">
                                                    <label>{{ 'REFFERALNO' | translate}}2</label>
                                                    <input type="text" placeholder="{{ 'ENTERREFFERALNO' | translate}}"
                                                           id="input_referralno2"
                                                           ng-model="PatientApptPCPInfo.PCPSecondReferenceNumber"
                                                         ng-change="PatientApptPCPInfo.PCPSecondReferenceNumber = PatientApptPCPInfo.PCPSecondReferenceNumber.toUpperCase()"

                                                           maxlength="16" />
                                                </div>
                                            </td>
                                            <td colspan="2" class="valign-top">
                                                <div class="form__group">
                                                    <label>{{ 'NOTES' | translate}}</label>
                                                    <textarea rows="1" class="msd-elastic: \n" id="textarea_notes" placeholder="{{ 'ENTERNOTES' | translate}}" ng-model="PatientApptPCPInfo.PCPNotes" maxlength="500" />
                                                </div>
                                            </td>
                                            <td class="valign-top">
                                                <div class="m-t-22">
                                                    <button class="btn__xl-- btn__3ea6cde5--f" id="button_addpcp" ng-click="DesignedInfoPopUpforPatient(1,Refaraldoctorlist)">{{ 'ADDPCP' | translate}}</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="section__style--1" ng-show="PatientApptPCPInfo.ReferalCheckBox">
                            <div class="section__header--">
                                <h1>{{ 'REFERRAL' | translate}}</h1>
                                <label class="cur-poiter dis-flex align-items-center grid-gap-5">
                                    <input type="checkbox" class="checkbox" id="raju" name="PatientApptPCPInfo.IsReferalCoManagerInd" value="co-manager" ng-model="PatientApptPCPInfo.IsReferalCoManagerInd">
                                    <span class="lbl"></span>
                                    <span class="text-s12w500c000 lh-1-0 fs-14 ng-binding">{{ 'COMANAGER' | translate}}</span>
                                </label>
                            </div>
                            <div class="section__body--">
                                <table class="tableno-bordered table tableno-padding width-100" id="table_referral">
                                    <tr>
                                        <td>
                                            <div class="form__group" typehead-dropdown-direction>
                                                <label>{{ 'REFERRAL' | translate}}</label>
                                                <input type="text"
                                                       id="input_referal"
                                                       autocomplete="off"
                                                       name="InsurancePayor"
                                                       ng-model-options="{ debounce: 500 }"
                                                       ng-change="changeApptReferalDoctornew(PatientApptPCPInfo)"
                                                       placeholder="{{ 'ENTERREFFERAL' | translate}}"
                                                       ng-model="PatientApptPCPInfo.ReferalObj"
                                                       typeahead-min-length="0"
                                                       typeahead-on-select="onSelectApptReferalDoctorNew(PatientApptPCPInfo.ReferalObj,PatientApptPCPInfo)"
                                                       uib-typeahead="item as item.FullName +' - '+item.NPI for item in searchReferalDoctors($viewValue,2)" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form__group">
                                                <label>{{ 'NPI' | translate}}</label>
                                                <input type="text" ng-disabled="true" id="input_referralnpi" placeholder="{{ 'ENTERNPI' | translate}}" ng-model="PatientApptPCPInfo.ReferalNPI" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form__group">
                                                <label>{{ 'EMAILID' | translate}}</label>
                                                <input type="text" id="input_referralemailid" placeholder="{{ 'ENTEREMAILID' | translate}}" ng-disabled="true" ng-model="PatientApptPCPInfo.ReferalEmailId" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form__group">
                                                <label>{{ 'CONTACTNO' | translate}}</label>
                                                <input type="text" id="input_referralcontactno" placeholder="{{ 'ENTERCONTACTNO' | translate}}" ng-disabled="true" ng-model="PatientApptPCPInfo.ReferralContact" maxlength="30" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form__group">
                                                <label>{{ 'REFFERALNO' | translate}}1</label>
                                                <input type="text" id="input_referralrefno1" placeholder="{{ 'ENTERREFFERALNO' | translate}}"
                                                       ng-model="PatientApptPCPInfo.ReferalReferenceNumber"
                                                        ng-change="PatientApptPCPInfo.ReferalReferenceNumber = PatientApptPCPInfo.ReferalReferenceNumber.toUpperCase()"

                                                       maxlength="16" />
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="valign-top">
                                            <div class="form__group">
                                                <label>{{ 'DATE' | translate}}</label>
                                                <input type="text" id="input_referraldate" placeholder="MM-DD-YYYY" ng-model="PatientApptPCPInfo.ReferralDate" datepickerregpatientus readonly />
                                            </div>
                                        </td>
                                        <td class="valign-top">
                                            <div class="form__group">
                                                <label>{{ 'REFFERALNO' | translate}}2</label>
                                                <input type="text" id="input_referralrefno2" 
                                                       placeholder="{{ 'ENTERREFFERALNO' | translate}}" 
                                                       ng-model="PatientApptPCPInfo.ReferalSecondReferenceNumber" 
                                                        ng-change="PatientApptPCPInfo.ReferalSecondReferenceNumber = PatientApptPCPInfo.ReferalSecondReferenceNumber.toUpperCase()"

                                                       maxlength="16" />
                                            </div>
                                        </td>
                                        <td colspan="2" class="valign-top">
                                            <div class="form__group">
                                                <label>{{ 'NOTES' | translate}}</label>
                                                <textarea rows="1" class="msd-elastic: \n" id="input_referralnotes" placeholder="Enter notes" ng-model="PatientApptPCPInfo.ReferalNotes" maxlength="500"></textarea>
                                            </div>
                                        </td>
                                        <td class="valign-top">
                                            <div class="m-t-22">
                                                <button class="btn__xl-- btn__3ea6cde5--f" id="button_referraladdref" ng-click="DesignedInfoPopUpforPatient(2,Refaraldoctorlist)">{{ 'ADDREFFERAL' | translate}}</button>
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                        <div class="section__style--1" ng-show="PatientApptPCPInfo.SourceCheckBox">
                            <div class="section__header--">
                                <h1>{{ 'SOURCE' | translate}}</h1>
                            </div>
                            <div class="section__body--">
                                <div class="row">
                                    <div class="col-lg-12">
                                        <div class="input__group">
                                            <label>{{'REFERRING' | translate}}</label>
                                            <div class="form-group dis-flex">
                                                <div class="flex-50">
                                                    <ui-select class="form__uiselect" id="select_referring1" ng-model="PatientApptPCPInfo.MasterReferralSourceObj" ng-change="ChangeApptRefferalSource()">
                                                        <ui-select-match placeholder="{{ 'SELECT' | translate}}">{{$select.selected.MasterReferralSourceName}}</ui-select-match>
                                                        <ui-select-choices repeat="item in ReferralSouceMaster | filter: $select.search" null-option="EmptySelect" loose-null>
                                                            <span ng-bind-html="item.MasterReferralSourceName | highlight: $select.search"></span>
                                                        </ui-select-choices>
                                                    </ui-select>
                                                </div>
                                                <div class="flex-50 m-l-5">
                                                    <ui-select class="form__uiselect" id="select_referring2" ng-model="PatientApptPCPInfo.ReferralSourceObj" ng-change="changeApptReferral(PatientApptPCPInfo.ReferralSourceObj)">
                                                        <ui-select-match placeholder="{{ 'SELECT' | translate}}">{{$select.selected.ReferralTitle}}</ui-select-match>
                                                        <ui-select-choices repeat="item in ReferralList | filter: $select.search" null-option="EmptySelect" loose-null>
                                                            <span ng-bind-html="item.ReferralTitle | highlight: $select.search"></span>
                                                        </ui-select-choices>
                                                    </ui-select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-9">
                                        <div class="form__group">
                                            <label>{{ 'NOTES' | translate}}</label>
                                            <textarea placeholder="{{ 'ENTERNOTES' | translate}}" id="textarea_sourcenotes" ng-model="PatientApptPCPInfo.SourceDesignatedInfoNotes" maxlength="500"></textarea>
                                        </div>
                                    </div>
                                    <div class="col-lg-3">
                                        <div class="m-t-22">
                                            <button class="btn__xl-- btn__3ea6cde5--f" id="button_addsource" ng-click="AddsourceOnDesignated()">{{ 'ADDSOURCE' | translate}}</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row" ng-show="PatientApptPCPInfo.PCPCheckBox || PatientApptPCPInfo.ReferalCheckBox">
                            <div class="col-lg-5 pr-5">
                                <div class="input__group">

                                            </svg>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-2 p-0">
                                <div class="dis-flex align-items-center m-t-24 grid-gap-5">
                                    <span>-OR-</span>
                                    <button class="btn__lg-- btn__3ea6cde5--f" id="button_scan" ng-click="scanApptReferralImageDocuments()">{{ 'SCAN' | translate}}</button>
                                </div>
                            </div>
                        </div>

                        <div class="row h-100" ng-hide="PatientApptPCPInfo.PCPCheckBox || PatientApptPCPInfo.ReferalCheckBox || PatientApptPCPInfo.SourceCheckBox">
                            <div class="col-lg-12 h-100">
                                <div class="dis-flex flex-direction-column justify-content-center h-100 text-center">
                                    <h5>Please select any referral type....</h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div> 
    <div class="modal__footer--">
        <button class="btn__lg-- btn__C71D27--" id="button_clear" ng-click="ClearDetails();">{{ 'Clear' | translate}}</button>
        <button class="btn__lg-- btn__1d5558--f" id="button_save" ng-click="ApptPCPInfoSave();">{{ 'SAVE' | translate}}</button>
    </div>
</div>
