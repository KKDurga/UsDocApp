<div class="modal__style--1">
    <div class="modal__header--">
        <h1 class="fs__xl-- fw__6-- tc__1D1D1D-- m__0--">Deposits</h1>
        <a class="btn__close--2" ng-click="uibclose()">
            <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
        </a>
    </div>
    <div class="modal__body--">
        <div class="d__f-- fd__c-- gap__5-- height__100--">
            <div class="border__DDD-- bradius__5-- px__10-- py__5-- d__f-- ai__c-- jc__sb--">
                <label class="d__f-- ai__c-- gap__10-- fs__lg-- fw__5-- tc__1D1D1D--">Total Patient Unallocated: <span class="tc__656565--">${{(PatientTotalUnallocated || 0) | number:2}}</span></label>
                <button type="button" class="btn__lg-- btn__1d5558--f" id="button_allocate" ng-click="SelectedDepositslist()">
                    Allocate
                </button>
            </div>

            <div class="position__relative-- height__100--">
                <div class="adjustable-position slim-scroll">
                    <div class="table-responsive m-0 p-0 slim-scroll">

                    </div>
                    <table class="table__style--21" id="table_depositsmain">
                        <thead>
                            <tr>
                                <th width="4%">
                                    <label class="cur-poiter d__f-- ai__c-- gap__x--4 jc__c--">
                                        <input type="checkbox" class="checkbox-1d5558--o m__0--" ng-model="checked" ng-click="IsCheckAllEras(checked)">
                                    </label>
                                </th>
                                <th width="10%">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">
                                        Deposit Date
                                    </label>
                                </th>
                                <th width="10%">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">
                                        Receipt No
                                    </label>
                                </th>  
                                <th width="12%">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">
                                        Location
                                    </label>
                                </th>
                                <th width="22%">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">
                                        Payment Mode & Amt.
                                    </label>
                                </th>
                                <th>
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">
                                        Payment Type
                                    </label>
                                </th>
                                <th>
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">
                                        Paid Amt
                                    </label>
                                </th>
                                <th>
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">
                                        Unallocated Amt
                                    </label>
                                </th>
                                <th width="11%">
                                    <label class="fs__lg-- fw__5-- tc__1D1D1D--">
                                        Reason
                                    </label>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <!--ng-click="SelectPatientPayments(item)"-->
                            <tr ng-repeat="item in PtDepositsDataArray track by $index">
                                <td>
                                    <div ng-if="item.UnBilledAmount > 0">

                                    </div>
                                    <label class="cur-poiter d__f-- ai__c-- gap__x--4 jc__c--">
                                        <input type="checkbox" class="checkbox-1d5558--o m__0--" ng-model="item.IsChecked" ng-click="checkToggle(item)">
                                    </label>
                                </td>
                                <td>
                                    <label class="fs__lg-- fw__4-- tc__1D1D1D--">{{item.DepositDate|date : 'MM-dd-yyyy'}}</label>
                                </td>
                                <td>
                                    <label class="fs__lg-- fw__4-- tc__1D1D1D--">{{item.ReceiptNo}}</label>
                                </td>
                                <td>
                                    <label class="fs__lg-- fw__4-- tc__1D1D1D--" title="{{item.OrganizationName}}">{{item.OrganizationName}}</label>
                                </td>
                                <td>

                                    <table class="table tableno-bordered mb-0 tableno-padding table-layout-fix" id="table_deposits">
                                        <tbody>
                                            <tr ng-repeat="ditem in item.PatientDepositPaymodeList">
                                                <td>
                                                    <span class="fw__4-- tc__1D1D1D--">{{ditem.PaymentMethodName}}</span>
                                                    <span class="fw__4-- tc__1D1D1D--" ng-if="ditem.CardType != ''">({{ditem.CardType}})</span>
                                                </td>
                                                <td width="5%" class="text-center">
                                                    <span class="fw__4-- tc__1D1D1D--">:</span>
                                                </td>
                                                <td width="25%">
                                                    <span class="m__0-- d__f-- ai__c-- gap__x--3 fs__lg-- tc__1D1D1D-- fw__5-- ">
                                                        ${{(ditem.DepositAmount || 0) | number:2}}
                                                    </span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                                <td>
                                    <label class="fs__lg-- fw__4-- tc__1D1D1D--">{{item.DepositTypeName}}</label>
                                </td>
                                <td>
                                    <label class="fs__lg-- fw__4-- tc__1D1D1D--">${{(item.BilledAmount || 0) | number:2}}</label>
                                </td>
                                <td>
                                    <label class="fs__lg-- fw__4-- tc__1D1D1D--">$ {{(item.UnBilledAmount || 0) | number:2}}</label>
                                </td>
                                <td>
                                    <label class="fs__lg-- fw__4-- tc__1D1D1D-- no-wrapappt" title="{{item.DipositeRemarks}}">{{item.DipositeRemarks}}</label>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
