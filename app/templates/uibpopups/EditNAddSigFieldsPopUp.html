<div class="modal-body height-300 p-0 dis-flex flex-direction-column">
    <div class="asc-model-header">
        <h3>{{MedicationObj.MedicationName}}</h3>
        <ul>
            <!--<li>
                <button ng-click="ClearMedicineItem(MedicationObj)" ng-if="MedicationObj.SigFields == true"> Clear</button>
            </li>-->
            <li>
                <button class="btn-d" type="button" ng-click="uibclose()">Close</button>
            </li>
            <li>
                <button class="btn-s" type="button" ng-click="save()" ng-if="adnewsigobj.IsNewSig == false"> Save </button>
            </li>
        </ul>
    </div>
    <div class="asc-model-body h-100">
        <div class="adjustable-position p-8">
            <div class="asc-section">
                <div class="asc-section-body">
                    <div class="row">
                        <div class="col-lg-12">
                            <ul class="asc-list">
                                <li>
                                    <label class="cur-poiter dis-block m-y-10">
                                        <input name="CurrentSystemicMedicationm" ng-model="MedicationObj.SelectedMedicationHistory" value="CurrentEyeMedication" ng-click="Selectedmedic(MedicationObj,MedicationObj.SelectedMedicationHistory)" class="radio-custom width-0" type="radio">
                                        <span class="radio-custom-label cur-poiter mb-0 text-tonometry">Current Eye</span>
                                    </label>
                                    <label class="cur-poiter dis-block m-y-10">
                                        <input name="CurrentSystemicMedicationm" ng-model="MedicationObj.SelectedMedicationHistory" value="CurrentSystemicMedication" ng-click="Selectedmedic(MedicationObj,MedicationObj.SelectedMedicationHistory)" class="radio-custom width-0" type="radio">
                                        <span class="radio-custom-label cur-poiter mb-0 text-tonometry">Current Systemic</span>
                                    </label>
                                </li>
                                <li>
                                    <ul class="asc-list">
                                        <li>
                                            <label>Start Date :</label>
                                        </li>
                                        <li>
                                            <div class="asc-input-group">
                                                <input type="text" class="icons-calendar" ng-model="MedicationObj.StartDate" datepickeruniversaldate readonly>
                                            </div>                                            
                                        </li>
                                    </ul>
                                </li>
                                <li>
                                    <ul class="asc-list">
                                        <li>
                                            <label>Stop Date :</label>
                                        </li>
                                        <li>
                                            <div class="asc-input-group">
                                                <input type="text" class="icons-calendar" ng-model="MedicationObj.StopDate" datepickeruniversaldate readonly>
                                            </div>                                            
                                        </li>
                                    </ul>
                                </li>
                                <li class="flex">
                                    <div class="asc-search">
                                        <input type="text" ng-if="!MedicationObj.IsAllSig" ng-model="MedicationObj.SigObj"
                                               placeholder="Search FastSig"
                                               ng-disabled="MedicationObj.IsMedicationStopped"
                                               typeahead-focus-on-select="false"
                                               typeahead-min-length="0"
                                               typeahead-on-select="ONSigDetailsMedOrders(MedicationObj.SigObj,MedicationObj)"
                                               ng-change="changeSigForMedicine(MedicationObj)"
                                               uib-typeahead="Medlist as Medlist.Sig for Medlist in getParticularSigMedicationitems(MedicationObj.SigObj,MedicationObj)" />
                                        <input type="text" ng-if="MedicationObj.IsAllSig" ng-model="MedicationObj.MedicineObj"
                                               placeholder="Search AllSig"
                                               ng-disabled="MedicationObj.IsMedicationStopped"
                                               typeahead-focus-on-select="false"
                                               typeahead-min-length="0"
                                               typeahead-on-select="ONSigDetailsSig(MedicationObj.MedicineObj,MedicationObj)"
                                               ng-change="changeSigForMedicine(MedicationObj)"
                                               uib-typeahead="Medlist as Medlist.Sig for Medlist in getOrganizationMedicationSigitems(MedicationObj.MedicineObj)" />
                                    </div>
                                </li>
                                <li>
                                    <div class="checkbox cn">
                                        <label>
                                            <input name="checkbox-1" type="checkbox" ng-model="MedicationObj.IsAllSig">
                                            <span class="checkbox-material">
                                                <span class="check"></span>
                                            </span>
                                            <small class="text-s12w700c000">All Sig</small>
                                        </label>
                                    </div>
                                </li>
                                <li>
                                    <button class="asc-instructions-button" ng-class="{ 'bg-72b4a6 text-white':MedicationObj.isAddFocused }" ng-click="AddNewMedicineIdchange(MedicationObj)"><i class="fas fa-plus"></i> Add Sigs</button>
                                    <button class="asc-instructions-button" ng-click="MedicationObj.SigFields = true;adnewsigobj.IsNewSig = false;MedicationObj.SigFormationFields=false;" ><i class="fas fa-plus"></i> Edit</button>
                                </li>
                            </ul>
                        </div>
                        <div class="col-lg-12">
                            <table class="table tableno-bordered m-b-0 tableno-padding">
                                <tbody ng-show="MedicationObj.SigFields == true">
                                    <tr>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Action</label>
                                                <select class="form-outline" ng-model="MedicationObj.ActionId" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescAction(MedicationObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in ActionArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Dose</label>
                                                <select class="form-outline" ng-model="MedicationObj.DoseId" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescDose(MedicationObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in DoseArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Dose unit</label>
                                                <select class="form-outline" ng-model="MedicationObj.DoseUnitId" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescDoseUnit(MedicationObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in DoseUnitArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Route</label>
                                                <select class="form-outline" ng-model="MedicationObj.RouteId" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescRoute(MedicationObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in RouteArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Dose Timing</label>
                                                <select class="form-outline" ng-model="MedicationObj.FrequencyId" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescFrequency(MedicationObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in FrequencyArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Other</label>
                                                <select class="form-outline" ng-model="MedicationObj.DoseOtherId" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescDoseOther(MedicationObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in DoseOtherArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Dose Supply</label>
                                                <select class="form-outline" ng-model="MedicationObj.DaysSupplyId" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescDaysSupply(MedicationObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in DurationArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Quantity</label>
                                                <input type="text" class="form-outline" ng-model="MedicationObj.Quantity" ng-disabled="MedicationObj.IsMedicationStopped" placeholder="1" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Quantity unit</label>
                                                <select class="form-outline" ng-model="MedicationObj.QuantityUnitId" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescQuantityUnit(MedicationObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in QuantityUnitArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Refill</label>
                                                <select class="form-outline" ng-model="MedicationObj.RefillId" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescRefill(MedicationObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in RefillsArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Substitution</label>
                                                <select class="form-outline" ng-model="MedicationObj.SubstitutionPermitted" ng-disabled="MedicationObj.IsMedicationStopped" ng-change="changePrescSubmission(MedicationObj)">
                                                    <option value="y">Yes</option>
                                                    <option value="n">No</option>
                                                </select>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="6">
                                            <div class="form-group">
                                                <label>Medication Instructions</label>
                                                <input type="text" class="form-control bg-dbf6ff" placeholder="Additional directions to Patient" ng-model="MedicationObj.PatientInstructions" ng-disabled="MedicationObj.IsMedicationStopped" maxlength="500" />
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                                <tbody ng-show="adnewsigobj.IsNewSig && MedicationObj.SigFormationFields">
                                    <tr>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Action</label>
                                                <select class="form-outline" ng-model="addNewOrganizationSigObj.ActionId" ng-change="changePopupPrescAction(addNewOrganizationSigObj)"
                                                        ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in ActionArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Dose</label>
                                                <select class="form-outline" ng-model="addNewOrganizationSigObj.DoseId" ng-change="changePopupPrescDose(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in DoseArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Dose unit</label>
                                                <select class="form-outline" ng-model="addNewOrganizationSigObj.DoseUnitId" ng-change="changePopupPrescDoseUnit(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in DoseUnitArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Route</label>
                                                <select class="form-outline" ng-model="addNewOrganizationSigObj.RouteId" ng-change="changePopupPrescRoute(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in RouteArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Dose Timing</label>
                                                <select class="form-outline" ng-model="addNewOrganizationSigObj.FrequencyId" ng-change="changePopupPrescFrequency(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in FrequencyArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Other</label>
                                                <select class="form-outline" ng-model="addNewOrganizationSigObj.DoseOtherId" ng-change="changePopupPrescDoseOther(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in DoseOtherArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Dose Supply</label>
                                                <select class="form-outline" ng-model="addNewOrganizationSigObj.DaysSupplyId" ng-change="changePopupPrescDaysSupply(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in DurationArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Quantity</label>
                                                <input type="text" class="form-outline" ng-model="addNewOrganizationSigObj.Quantity" placeholder="1" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Quantity unit</label>
                                                <select class="form-outline" ng-model="addNewOrganizationSigObj.QuantityUnitId" ng-change="changePopupPrescQuantityUnit(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in QuantityUnitArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Refill</label>
                                                <select class="form-outline" ng-model="addNewOrganizationSigObj.RefillId" ng-change="changePopupPrescRefill(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in RefillsArray">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label class="text-s12w500c000">Substitution</label>
                                                <select class="form-outline" ng-model="MedicationObj.SubstitutionPermitted" ng-change="changePrescSubmission(MedicationObj)">
                                                    <option value="y">Yes</option>
                                                    <option value="n">No</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="m-t-20">
                                                <label class="cur-poiter">
                                                    <input type="checkbox" id="1" value="Latent" class="checkbox ng-pristine ng-valid ng-touched" ng-model="addNewOrganizationSigObj.IsFrequent" aria-invalid="false" style="">
                                                    <span class="lbl"></span>
                                                    <span class="list-opt-text-new">FrequentlyAdded</span>
                                                </label>
                                            </div>
                                        </td>
                                        <td colspan="2">
                                            <div class="form-group text-right m-t-20">
                                                <button type="button" class="betn btn-ehnote-outline p-l-25 p-r-25" ng-click="clearOrganizationSiginput(addNewOrganizationSigObj)">Clear</button>
                                                <button type="button" class="betn btn-ehnote p-l-25 p-r-25" ng-click="SaveOrganizationSig(presc)">Save</button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
