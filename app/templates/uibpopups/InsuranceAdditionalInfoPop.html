<div class="modal-header">
    <h4 class="modal-title">Insurance 1 Additional Info</h4>
    <button type="button" class="btn btn-link" ng-click="CloseInsuranceAdditionalInfoPop()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table tableno-bordered m-b-0 regsiter-tablespan bg-white">
                    <tbody>
                        <tr>
                            <td class="w-100">
                                <span>Group ID</span>
                            </td>
                            <td>
                              <input type="text" class="form-control" ng-model="InsuranceObj.insItem.GroupId"/>
                            </td>
                            <td class="w-100">
                                <span>MSP Trailer Type</span>
                            </td>
                            <td>
                                <input type="text" class="form-control" ng-model="InsuranceObj.insItem.MsnType" />
                            </td>
                        </tr>
                        <tr>
                            <td class="w-100">
                                <span>Group Name</span>
                            </td>
                            <td>
                                <input type="text" class="form-control" ng-model="InsuranceObj.insItem.GroupName" />
                            </td>
                            <td class="w-100">
                                <span>Accept Assign</span>
                            </td>
                            <td>
                                <div class="dis-flex align-items-center">
                                    <div class="flex">
                                        <input type="radio" class="radio-custom" id="Radio_AcceptAssign1" name="AcceptAssign" value="Yes" ng-model="InsuranceObj.insItem.AcceptAssign" />
                                        <label for="Radio_AcceptAssign1" class="radio-custom-label cur-poiter mb-0">Yes</label>
                                    </div>
                                    <div class="flex">
                                        <input type="radio" class="radio-custom" id="Radio_AcceptAssign2" name="AcceptAssign" value="No" ng-model="InsuranceObj.insItem.AcceptAssign" />
                                        <label for="Radio_AcceptAssign2" class="radio-custom-label cur-poiter mb-0">No</label>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="w-100">
                                <span>Relationship</span>
                            </td>
                            <td>

                                <ui-select ng-model="InsuranceObj.insItem.InsuranceRelationShipObj" style="width:100%" ng-change="ChangeInsuranceRelationShipItem(InsuranceObj.insItem)">
                                    <ui-select-match placeholder="Select Relation">{{$select.selected.Name}}</ui-select-match>
                                    <ui-select-choices repeat="item in InsuranceRelationShipList | filter: $select.search" null-option="EmptySelect" loose-null>
                                        <span ng-bind-html="item.Name | highlight: $select.search"></span>
                                    </ui-select-choices>
                                </ui-select>
                            </td>
                            <td class="w-100">
                                <span>Assign Benefits</span>
                            </td>
                            <td>
                                <div class="dis-flex align-items-center">
                                    <div class="flex">
                                        <input type="radio" class="radio-custom" id="Radio_AcceptAssignBenifits1" name="AcceptAssignBenifits" value="Yes" ng-model="InsuranceObj.insItem.AssignBenifits" />
                                        <label for="Radio_AcceptAssignBenifits1" class="radio-custom-label cur-poiter mb-0">Yes</label>
                                    </div>
                                    <div class="flex">
                                        <input type="radio" class="radio-custom" id="Radio_AcceptAssignBenifits2" name="AcceptAssignBenifits" value="No" ng-model="InsuranceObj.insItem.AssignBenifits" />
                                        <label for="Radio_AcceptAssignBenifits2" class="radio-custom-label cur-poiter mb-0">No</label>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="w-100">
                                <span>Policy Holder</span>
                            </td>
                            <td>
                                <input type="text" class="form-control" ng-model="InsuranceObj.insItem.PolicyHolder" />
                            </td>
                            <td class="w-100">
                                <span>Release Info</span>
                            </td>
                            
                            <td>
                                <div class="dis-flex align-items-center">
                                    <div class="flex">
                                        <input type="radio" class="radio-custom" id="Radio_ReleaseInfo1" name="ReleaseInfo" value="Yes" ng-model="InsuranceObj.insItem.ReleaseInfo" />
                                        <label for="Radio_ReleaseInfo1" class="radio-custom-label cur-poiter mb-0">Yes</label>
                                    </div>
                                    <div class="flex">
                                        <input type="radio" class="radio-custom" id="Radio_ReleaseInfo2" name="ReleaseInfo" value="No" ng-model="InsuranceObj.insItem.ReleaseInfo" />
                                        <label for="Radio_ReleaseInfo2" class="radio-custom-label cur-poiter mb-0">No</label>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <!--<tr>
                            <td class="w-100">
                                <span>Employer</span>
                            </td>
                            <td>
                                <input type="text" class="form-control" ng-model="PolicyHolder" />
                            </td>
                            <td class="w-100">
                                <span>Laboratory</span>
                            </td>
                            <td>
                                <select class="form-control">
                                    <option></option>
                                </select>
                            </td>
                        </tr>-->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="row m-t-10">
        <div class="col-lg-12 text-right">
            <button class="btn btn-ehnote radius-100 p-l-25 p-r-25" ng-click="saveAdditonalInsuranceDetails()">Add</button>
        </div>
    </div>
</div>
