<div class="modal-header">
    <h4 class="modal-title">Upload Insurance Card</h4>
    <button type="button" class="btn btn-link" ng-click="CloseInsuranceCard()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body p-t-10 p-b-10">
    <div class="row">
        <div class="col-lg-12">
            <div class="dis-flex">
                <div class="flex">
                    <div class="heading-popcontrols">
                        <label class="text-frontback">Front Side</label>
                        <ul class="control-icons"> 
                            <li>
                                <a href="javascript:;">
                                    <i class="eh-close eh-icon"></i>
                                </a>
                            </li>
                        </ul>
                    </div>
                    <div class="upload-img-card">
                        <input type="file" class="hide" id="selectfileupload" />
                        <label for="selectfileupload" class="cur-poiter">
                            <img src="img/register/upload-icon.svg" width="35" class="m-b-10" />
                            <span class="text-upload-patient dis-block">
                                Upload Patient’s Insurance Card
                                Back Side Image Here
                            </span>
                        </label>
                    </div>
                    
                </div>
                <div class="w-10"></div>
                <div class="flex">
                    <div class="heading-popcontrols">
                        <label class="text-frontback">Back Side</label>
                        <ul class="control-icons">
                             
                            <li>
                                <a href="javascript:;">
                                    <i class="eh-close eh-icon"></i>
                                </a>
                            </li>
                        </ul>
                    </div>
                    <div class="upload-img-card">
                        <input type="file" class="hide" id="selectfileupload" />
                        <label for="selectfileupload" class="cur-poiter">
                            <img src="img/register/upload-icon.svg" width="35" class="m-b-10" />
                            <span class="text-upload-patient dis-block">
                                Upload Patient’s Insurance Card
                                Back Side Image Here
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <div class="row m-t-10">
        <div class="col-lg-12 text-center">
            <button type="button" class="etn btn-ehnote-outline p-l-25 p-r-25" ng-click="ClearPatientProfileImg()">Clear</button>
            <button type="button" class="etn btn-ehnote p-l-25 p-r-25">Save</button>
        </div>
    </div>
</div>
