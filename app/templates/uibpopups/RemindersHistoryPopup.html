<div class="modal__style--1 height__100--">
    <div class="modal__header--">
        <h1>Histroy</h1>
        <a class="btn__close--" ng-click="Uibclose()">
            <i class="close__w32--"></i>
        </a>
    </div>
    <div class="modal__body--">
        <div class="position__relative-- height__100--">
            <div class="adjustable-position p__5--">
                <table class="table__style--5" ng-if="RemindersArray.length > 0">
                    <thead>
                        <tr>
                            <th width="8%"><label>Date</label></th>
                            <th width="16%"><label>Created By</label></th>
                            <th width="18%"><label>Remarks</label></th>
                            <th width="16%"><label>Doctor</label></th>
                            <th><label>Visit Reason</label></th>
                            <th width="12%"><label>Reminder Type</label></th>
                            <th width="12%"><label>Reminder Status</label></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in RemindersArray track by $index">
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{item.Date | date: 'MM-dd-yyyy'}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{item.CreatedBy}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{item.Remarks}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{item.DoctorName}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{item.ReminderVisitReasonName}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{item.ReminderType}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{item.ReminderStatus}}</label></td>
                        </tr>
                    </tbody>
                </table>
                <div class="row height__100-- d__f-- jc__c-- ai__c-- ng-scope" ng-if="RemindersArray.length == 0">
                    <div class="col-lg-12">
                        <div class="m__auto--">
                            <p class="fs__lg-- fw__4-- tc__656565-- m__0-- d__f-- ai__c-- gap__5-- jc__c--">No History found</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div ng-if="false">
    <div class="eh-header p-10">
        <h1>Histroy</h1>
        <ul class="us-controls">
            <li>
                <button class="btn btn-danger" ng-click="Uibclose()">Close</button>
            </li>
        </ul>
    </div>
    <div class="eh-body">
        <div class="height-400 overflow-y-auto p-20">
            <table class="table table-bordered m-b-0 tableno-padding">
                <thead>
                    <tr>
                        <th width="12%"><label>Date</label></th>
                        <th width="18%"><label>Created By</label></th>
                        <th width="20%"><label>Remarks</label></th>
                        <th width="18%"><label>Doctor</label></th>
                        <th><label>Visit Reason</label></th>
                        <th width="15%"><label>Reminder Type</label></th>
                        <th width="15%"><label>Reminder Status</label></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in RemindersArray track by $index">
                        <td>{{item.Date | date: 'MM-dd-yyyy'}}</td>
                        <td>{{item.CreatedBy}}</td>
                        <td>{{item.Remarks}}</td>
                        <td>{{item.DoctorName}}</td>
                        <td>{{item.ReminderVisitReasonName}}</td>
                        <td>{{item.ReminderType}}</td>
                        <td>{{item.ReminderStatus}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
