<div>
    <div class="modal-header">        
        <button type="button" class="close m-t-0" ng-click="close();">
            <i class="fas fa-times text-danger"></i>
        </button>
    </div>
    <div class="modal-body p-10">
        <section class="tile tile-shadow">
            <div class="tile-header">
                <h1>Add New Diagnosis</h1>
            </div>
            <div class="tile-body">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="table-responsive">
                            <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
                                <tbody>
                                    <tr>
                                        <td>
                                            <div class="form-group">
                                                <label>Diagnosis Name <em>*</em></label>
                                                <input type="text" class="form-control" placeholder="Enter Diagnosis Name" ng-model="DiagnosisObj.DiagnosisName" />
                                            </div>
                                        </td>
                                     
                                        <td colspan="3">
                                            <div class="form-group">
                                                <label>Diagnosis Notes</label>
                                                <input type="text" class="form-control" placeholder="Enter Diagnosis Notes" ng-model="DiagnosisObj.DiagnosisNotes" />
                                            </div>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>
                                            <div class="form-group">
                                                <label>ICD9</label>
                                                <input type="text" class="form-control" placeholder="Enter ICD9" ng-model="DiagnosisObj.ICD9Code" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label>ICD10</label>
                                                <input type="text" class="form-control" placeholder="Enter ICD10" ng-model="DiagnosisObj.ICD10Code" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <label>ICD11</label>
                                                <input type="text" class="form-control" placeholder="Enter ICD11" ng-model="DiagnosisObj.ICD11Code" />
                                            </div>
                                        </td>
                                        <td class="valign-bottom w-200">
                                            <div class="form-group dis-flex">
                                                <button class="btn btn-success flex  m-l-5" ng-click="AddupdateMasteDiag()">Save</button>
                                                <button class="btn btn-warning flex  m-l-5" ng-click="CancelMasterDiagClick()">Clear</button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    

</div>
