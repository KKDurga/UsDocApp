<div class="modal__style--1 height__100--">
    <div class="modal__header--">
        <h1>Prints</h1>
        <ul class="list__unstyled-- m__0--">
            <li>
                <a class="btn__close--" ng-click="uibclose()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body-- height__100-- p__0--">
        <div class="row">
            <div class="col-lg-12">                
                <div class="m-b-8 facesheet-Operative-Discharge radius-0 m-0">
                    <table class="table tableno-bordered tableno-padding m-0">
                        <tbody>
                            <!-- A LASIK chart is written in the LASIK template, so its three phases
                                 stand in for Admit / Pre-Op / Intra-Op / Post-Op here. Everything
                                 below - Operative Notes, Discharge Summary, Doctor Notes - is
                                 printed the same way for both. -->
                            <tr ng-if="IsLasikPrintTemplate">
                                <td>
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsLasikPreopPrintInd">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Pre-Op LASIK</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr ng-if="IsLasikPrintTemplate">
                                <td>
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsLasikIntraopPrintInd">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Intra-Op LASIK</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr ng-if="IsLasikPrintTemplate">
                                <td>
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsLasikPostopPrintInd">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Post-Op LASIK</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr ng-if="!IsLasikPrintTemplate">
                                <td>
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsAdmitPrintInd">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Admit</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr ng-if="!IsLasikPrintTemplate">
                                <td>
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsPreopPrintInd" ng-click="SelectPreopPrint()">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Pre-Op:</span>
                                            </label>
                                        </li>
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsPreopAnesthesiaPrintInd" ng-click="OnSubPreopChange()">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000 lh-1-6 fs-12">Pre-op Anesthesia</span>
                                            </label>
                                        </li>
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsPreopChecklistPrintInd" ng-click="OnSubPreopChange()">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000 lh-1-6 fs-12">Pre-op Nurse</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr ng-if="!IsLasikPrintTemplate">
                                <td>
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsIntraopPrintInd" ng-click="SelectIntraopPrint()">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Intra-Op:</span>
                                            </label>
                                        </li>
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsIntraopCheckinChecklistPrintInd"  ng-click="OnSubIntraopChange()" >
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000 lh-1-6 fs-12">Check-in & Time-out checklist</span>
                                            </label>
                                        </li>
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsIntraopAnesthesiaPrintInd"  ng-click="OnSubIntraopChange()">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000 lh-1-6 fs-12">Intra-op Anesthesia</span>
                                            </label>
                                        </li>
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsIntraopChecklistPrintInd"  ng-click="OnSubIntraopChange()">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000 lh-1-6 fs-12">Intra-op Nurse</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr ng-if="!IsLasikPrintTemplate">
                                <td>
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsPostopPrintInd" ng-click="SelectPostopPrint()">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Post-Op:</span>
                                            </label>
                                        </li>
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsPostopChecklistPrintInd" ng-click="OnSubPostopChange()">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000 lh-1-6 fs-12">Recovery I</span>
                                            </label>
                                        </li>
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsPostopAnesthesiaPrintInd" ng-click="OnSubPostopChange()">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000 lh-1-6 fs-12">Recovery II</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr>
                                <td class="b-0  bg-white">
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsOperativeNotesPrintInd">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0"> Operative Notes</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr>
                                <td class="b-0  bg-white">
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsDischargeSummaryPrintInd">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Discharge Summary</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr ng-if="showFemtoTemplate && false">
                                <td class="b-0  bg-white">
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsFemtoPrintInd">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Femto Template</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <tr>
                                <td class="b-0  bg-white">
                                    <ul class="flex-flow-list">
                                        <li>
                                            <label class="cur-poiter">
                                                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsDoctorNotesPrintInd">
                                                <span class="lbl"></span>
                                                <span class="text-s12w500c000  fs-15 font-weight-700 text-068cb0">Doctor Notes</span>
                                            </label>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                        </tbody>
                    </table>                    
                </div>
            </div>
        </div>
    </div>
    <div class="d__f-- jc__sb-- p__10--">
        <div>
            <label class="cur-poiter">
                <input class="checkbox" name="checkbox-1" type="checkbox" ng-model="AllAscPrintObj.IsAllPrintSelected" ng-click="SelectAllPrints()">
                <span class="lbl"></span>
                <span class="text-s12w500c000 lh-1-6 fs-12" >Select All For Prints</span>
            </label>
        </div>
        <div>
            <button class="btn btn-ehnote p-l-25 p-r-25" ng-click="PrintAscDetails()">Take Print</button>
        </div>
    </div>
</div>
