<div class="modal-header">
    <h4 class="modal-title">view</h4>
    <button type="button" class="btn btn-link" ng-click="CloseviewPopup()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table tableno-bordered m-b-0 regsiter-tablespan bg-white">
                    <thead>
                        <tr>
                            <th>SNo</th>
                            <th>ClaimNo</th>
                         
                            <th>Payors</th>
                            <th>status</th>
                            <th>Modified By</th>
                            <th>Modified Date</th>
                          
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in PatientClaimsHistoryDetails track by $index">
                            <td> {{$index+1}}</td>
                            <td>{{item.PatientClaimNo}} </td>
                            
                            <td>{{item.PayorName}} </td>
                            <td>{{item.ClaimStatus}} </td>
                            <td>{{item.ModifiedBy}} </td>
                            <td ng-bind="item.ModifiedDt |date:'dd-MM-yyyy HH:mm'"> </td>
                     
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
<div class="modal-footer">
    <div class="row">
        <div class="col-lg-12 text-right">
            <button type="submit" class="betn btn-light-border" ng-click="CloseviewPopup()">Close</button>

        </div>
    </div>
</div>
