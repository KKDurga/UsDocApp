<div class="modal-body p-0 ng-scope">
    <div class="row p-10">
        <div class="col-lg-12">
            <div class="dis-flex align-items-center justify-space-between border-bottom">
                <div>
                    <h1 class="text-ocularhist">Post Op Call</h1>
                </div>
                <div class="asc-patient-profile">
                    <ul>
                        <li>
                            <img image-viewer ng-if="ParentObject.S3URL != ''" src="{{ParentObject.S3URL}}" />
                            <img ng-if="ParentObject.S3URL == ''" src="img/sprite-sheet/user-square.svg" />
                            <p title="{{ParentObject.FullName}}">{{ParentObject.FullName}}</p>
                        </li>
                        <li>
                            <span>MR No.:</span>
                            <label>{{ParentObject.PatientDisplayId}}</label>
                        </li>
                        <li>
                            <span>Sex:</span>
                            <label>{{ParentObject.Gender}}</label>
                        </li>
                        <li>
                            <span>Age:</span>
                            <label>{{ParentObject.Age}}</label>
                        </li>
                        <li>
                            <span>DOB:</span>
                            <label>{{ParentObject.DOB | date:"MM-dd-yyyy"}}</label>
                        </li>
                    </ul>
                </div>
                <div class="dis-flex align-items-center m-l-10">
                    <button class="btn btn-discard-us m-r-5" ng-click="closeuib()">Close</button>
                    <button class="btn btn-save-us" ng-click="SavePostOpCall()">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-body p-5">
    <div class="row">
        <div class="col-lg-12">
            <!-- Postop -->
            <section class="eh-panel">
                <div class="eh-body b-bottom-1">
                    <div class="row">
                        <div class="col-lg-12">
                            <table class="us-table">
                                <tbody>
                                    <tr>
                                        <td width="15%" class="valign-middle">
                                            <b class="text-068cb0 fs-14">Contact Type</b>
                                        </td>
                                        <td class="valign-middle">
                                            <ul class="ul-Aideret-score flex-flow-ulli">
                                                <li class="flex">
                                                    <button  ng-class="PostOpCallObj.IsConnectedWithPatient ==true?'active':''"
                                    ng-click="IsConnectWithPatient('ConnectWithPatient')">Connect with Patient</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsConnectedWithFamilyOrFriend ==true?'active':''"
                                    ng-click="IsConnectWithPatient('ConnectWithFamily')">Connect with Family/Friend</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsLeftMsgWithPatient ==true?'active':''"
                                    ng-click="IsConnectWithPatient('LeftMsgWithPatient')">Left Message with Patient</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsLeftMsgWithFamilyOrFriend ==true?'active':''"
                                    ng-click="IsConnectWithPatient('LeftMsgWithFamily')">Left Message with Family/Friend</button>
                                                </li>
                                            </ul>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td colspan="2">
                                            <div class="ehr-input">
                                                <textarea rows="2" maxlength="500" ng-model="PostOpCallObj.ContactTypeNotes" placeholder="Enter Notes" spellcheck="false"></textarea>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!--  -->
                        </div>
                    </div>
                </div>
                <div class="eh-body b-bottom-1">
                    <div class="row">
                        <div class="col-lg-12">
                            <table class="us-table">
                                <tbody>
                                    <tr>
                                        <td>
                                            <b class="text-068cb0 fs-14">Instructions Provided to the Patient	</b>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="valign-middle">
                                            <ul class="ul-Aideret-score flex-flow-ulli">
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsContinueMedications ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Continue Medications')">Continue Medications</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsRestTheDayOfSurgery ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Rest the day of Surgery')">Rest the day of Surgery</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsResumeRegularDiet ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Resume regular diet')">Resume regular diet</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsNoAlcoholFor24Hours ==true?'active':''"
                                    ng-click="IsConnectWithPatient('No alcohol for 24 hours')">No alcohol for 24 hours</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsDoNotRubTheEye ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Do not rub the eye')">Do not rub the eye</button>
                                                </li>
                                            </ul>
                                            <ul class="ul-Aideret-score flex-flow-ulli">
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsCallTheClinicForAnyComplications ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Call the clinic for any complications')">Call the clinic for any complications</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsCall911orGoToNearestER ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Call 911 or go to nearest ER')">Call 911 or go to nearest ER</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsOther ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Other')">Other</button>
                                                </li>
                                                <li class="flex"></li>
                                            </ul>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <div class="ehr-input">
                                                <textarea rows="2" maxlength="500" ng-model="PostOpCallObj.InstructionSharedWithPatient" placeholder="Enter Notes" spellcheck="false"></textarea>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="eh-body b-bottom-1">
                    <div class="row">
                        <div class="col-lg-12">
                            <table class="us-table">
                                <tbody>
                                    <tr>
                                        <td>
                                            <b class="text-068cb0 fs-14">Patient Outcome</b>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="valign-middle">
                                            <ul class="ul-Aideret-score flex-flow-ulli">
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsPatientDoingWell ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Doing Well')">Doing Well</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsPatientMildDisComfort ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Mild Discomfort')">Mild Discomfort</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsPatientModerateDisComfort ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Moderate Discomfort')">Moderate Discomfort</button>
                                                </li>
                                                <li class="flex">
                                                    <button ng-class="PostOpCallObj.IsPatientExtensiveDisComfort ==true?'active':''"
                                    ng-click="IsConnectWithPatient('Extensive Discomfort')">Extensive Discomfort</button>
                                                </li>
                                                <li class="flex"></li>
                                            </ul>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <div class="ehr-input">
                                                <textarea rows="2" maxlength="500" ng-model="PostOpCallObj.PatientOutComeNotes" placeholder="Enter Notes" spellcheck="false"></textarea>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
            <!-- /Postop -->

        </div>
    </div>
</div>
