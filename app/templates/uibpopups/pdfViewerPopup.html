<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Pdf Viewer</h1>
        <ul class="flex-flow-list">
            <li>
                <a class="btn__close--" ng-click="closeuibpopup()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="position__relative-- height__100-- px__10-- py__5--">
        <div class="adjustable-position">
            <div class="d__f-- fd__c-- gap__5-- p__10-- bb__DDD--">
                <div class="row">
                    <div class="col-lg-12">
                        <div ng-repeat="pdf in pdfList">
                            <h3>{{ pdf.name }}</h3>

                            <!-- Show image directly -->
                            <div ng-if="isImageFile(pdf.url)">
                                <!--<img ng-src="{{pdf.url}}" width="100%" height="600px" />-->
                                <img class="img-thumbnail w-100 height-100" ng-src="{{pdf.url}}" image-viewer />
                            </div>

                            <!-- Use iframe for non-image files -->
                            <div ng-if="!isImageFile(pdf.url)">
                                <iframe ng-src="{{getTrustedUrl(pdf.url, pdf.openInDocsViewer)}}" width="100%" height="600px"></iframe>
                            </div>
                        </div>


                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
