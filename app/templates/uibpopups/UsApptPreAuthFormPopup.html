<div class="modal-header">
    <h4 class="modal-title"> {{ 'ADDPREAUTHORIZATION' | translate}}</h4>
    <button type="button" class="btn btn-link" ng-click="closeuibpopup();"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body p-10">
    <div class="row">
        <div class="col-lg-12">
            <table class="table tableno-bordered apptFilterTable m-b-0">
                <tbody>
                    <tr>
                        <td width="23%">
                            <div class="form-group">
                                <label>{{ 'PAYOR' | translate}}</label><em>*</em>
                                <input type="text"
                                       autocomplete="off"
                                       class="form-control"
                                       name="InsurancePayor"
                                       placeholder="{{ 'SELECTINSURANCEPAYOR' | translate}}"
                                       ng-model="AddAppointmentPreAuthDataObj.PayorObj"
                                       typeahead-min-length="0"
                                       ng-change="changePreAuthPayor(AddAppointmentPreAuthDataObj)"
                                       typeahead-on-select="onSelectPreAuthInsurancePayor(AddAppointmentPreAuthDataObj.PayorObj)"
                                       uib-typeahead="item as item.OrganizationPayorName for item in GetOrganizationPayorsForPreAuth($viewValue)" />

                            </div>
                        </td>
                        <td>
                            <div class="form-group">
                                <label>{{ 'PLAN' | translate}}</label>
                                <input type="text"
                                       autocomplete="off"
                                       class="form-control"
                                       name="InsurancePayor"
                                       placeholder="{{ 'SELECTINSURANCEPLAN' | translate}}"
                                       ng-model="AddAppointmentPreAuthDataObj.PlanObj"
                                       typeahead-min-length="0"
                                       typeahead-on-select="onSelectPreAuthPlan(AddAppointmentPreAuthDataObj)"
                                       ng-change="ChangePreAuthPlan(AddAppointmentPreAuthDataObj)"
                                       uib-typeahead="item as '('+item.PlanCode+')'+ item.PlanName for item in GetOrganizationPayorPlansForPreAuth($viewValue,AddAppointmentPreAuthDataObj)" />

                            </div>
                        </td>
                        <td>
                            <div class="form-group">
                                <label>{{ 'CODE' | translate}}</label>
                                <input type="text" class="form-control" ng-model="AddAppointmentPreAuthDataObj.PreAuthorizationCode" maxlength="15" alpha-numeric/>
                            </div>
                        </td>
                        <td>
                            <div class="form-group">
                                <label>{{ 'SERVICEDATE' | translate}}</label>
                                <input type="text" class="form-control" ng-model="AddAppointmentPreAuthDataObj.ServiceDate" datepickerforinventoryus readonly />
                            </div>
                        </td>
                        <td>
                            <div class="form-group">
                                <label>{{ 'EXPIRYDATE' | translate}}</label>
                                <input type="text" class="form-control" ng-model="AddAppointmentPreAuthDataObj.ExpiryDate" datepickerforapplist readonly />
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td width="30%">
                            <div class="form-group">
                                <label>{{ 'AUTHORIZATIONNUMBER' | translate}} #1.</label><em>*</em>
                                <input type="text" class="form-control" ng-model="AddAppointmentPreAuthDataObj.PreAuthNumber1" placeholder="{{ 'ENTERNUMBER' | translate}} 1" alpha-numeric maxlength="16" />
                            </div>
                        </td>
                        <td>
                            <div class="form-group">
                                <label>{{ 'NUMBER' | translate}} #2.</label>
                                <input type="text" class="form-control" ng-model="AddAppointmentPreAuthDataObj.PreAuthNumber2" placeholder="{{ 'ENTERNUMBER' | translate}} 2" alpha-numeric />
                            </div>
                        </td>
                        <td>
                            <div class="form-group">
                                <label>{{ 'NUMBER' | translate}} #3.</label>
                                <input type="text" class="form-control" ng-model="AddAppointmentPreAuthDataObj.PreAuthNumber3" placeholder="{{ 'ENTERNUMBER' | translate}} 3" alpha-numeric />
                            </div>
                        </td>
                        <td>
                            <div class="form-group">
                                <label>{{ 'NUMBER' | translate}} #4.</label>
                                <input type="text" class="form-control" ng-model="AddAppointmentPreAuthDataObj.PreAuthNumber4" placeholder="{{ 'ENTERNUMBER' | translate}} 4" alpha-numeric />
                            </div>
                        </td>
                        <td>
                            <div class="form-group">
                                <label>{{ 'NUMBER' | translate}} #5.</label>
                                <input type="text" class="form-control" ng-model="AddAppointmentPreAuthDataObj.PreAuthNumber5" placeholder="{{ 'ENTERNUMBER' | translate}} 5" alpha-numeric />
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5">
                            <div class="form-group">
                                <label> {{ 'REMARKS' | translate}}</label>
                                <textarea type="text" rows="3" class="form-control" ng-model="AddAppointmentPreAuthDataObj.Remarks"></textarea>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td  colspan="5">
                            <ul class="flex-flow-ulli">
                                <li>
                                    <div class="ehr-input">
                                        <label class="text-black fs-13">{{ 'FILEUPLOAD' | translate}}</label>
                                        <input type="file" id="PreAuthorizationfileuploaad" class="docsfilechoose height-36" value="Upload"
                                               ngf-select="selectApptPreAuthimagelist($files);"
                                               name="file"
                                               ngf-pattern="'image/*,application/pdf'"
                                               ngf-accept="'image/*,application/pdf'"
                                               multiple="multiple" />
                                    </div>
                                </li>
                                <li class="m-t-20">
                                    -OR-
                                </li>
                                <li>
                                    <button class="btn-scan w-100 m-t-20" ng-click="scanApptPreAuthDocuments()">{{ 'SCAN' | translate}}</button>
                                </li>
                                <li>
                                    <div class="form-group m-t-0">
                                        <div class="table-responsive">
                                            <table class="table table-consultation b-0" image-viewer>
                                                <tbody>
                                                    <tr>
                                                        <td ng-repeat="titem in AddAppointmentPreAuthDataObj.PatientPreAuthDocuments">
                                                            <!--<button class="btn btn-link p-l-5 p-r-5 m-l-3 pos-absolute z-9999" style="top: 0px; right: 4px;" ng-click="RemoveApptPreAuthImage(titem, AddAppointmentPreAuthDataObj)"><i class="fas fa-times-circle text-danger fa-lg"></i></button>-->
                                                            <span class="text-danger pos-absolute text-underline cur-poiter" style="bottom:-10px;right:5px;font-size:10px;"
                                                                  ng-click="RemoveApptPreAuthImage(titem, AddAppointmentPreAuthDataObj)">Remove</span>
                                                            <img ngf-thumbnail="titem.file" ng-show="titem.DocumentID==0" class="img-thumbnail m-l-5" width="50" height="50" />
                                                            <!--<img ng-src="{{titem.S3URL}}" ng-hide="titem.DocumentID != 0" class="img-thumbnail m-l-5" width="50" height="50" />-->
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </li>
                            </ul> 
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
       </div>
</div>
<div class="modal-footer">
    <div class="row">
        <div class="col-lg-12 pull-right">
            <button type="button" class="btn btn-danger p-l-25 p-r-25" ng-click="ClearDetails();"> {{ 'CLOSE' | translate}}</button>
            <button class="btn btn-success m-r-20 m-l-10 w-150" ng-click="AppointmentPreAuthDataSave();">{{ 'SAVE' | translate}}</button>
        </div>
    </div>
</div>
