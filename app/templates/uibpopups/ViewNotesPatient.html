<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Patient Notes History</h1>
        <a class="btn__close--2" ng-click="uibclose()">
            <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
        </a>
    </div>
    <div class="modal__body--">
        <table class="table__style--20">
            <thead>
                <tr>
                    <th>S. No</th>
                    <th>Appointment date</th>
                    <th>Created date</th>
                    <th>Patient Notes</th>
                    <th>Created By</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="i in AppointmentsNotesArray track by $index">
                    <td>{{$index+1}}</td>
                    <td>{{i.AppointmentDate|date:'MM-dd-yyyy'}}</td>
                    <td>
                        {{i.ModifiedDate|date:'MM-dd-yyyy'}}
                        <p class="m-0"> {{i.ModifiedDate|date:'hh:mm a'}}</p>
                    </td>
                    <td>{{i.PatientNotes}}</td>
                    <td>{{i.UserName}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
