<div class="row">
    <div class="col-lg-12">
        <div class="fullcons-subhead">
            <ul class="autofill-list m-b-0" ng-show="cat.CategoryId==2 || cat.CategoryId==3||cat.CategoryId==4">
                <li>
                    <input type="checkbox" ng-model="selectAllObj.SelectAllChecked" ng-click="SelectAllSubcategories(cat)" />
                    <span>Select All</span>
                </li>
                <li ng-repeat="hitem in cat.CategoryDetails" ng-class="hitem.IsSubCategoryChecked ?'active' : ''" ng-if="hitem.SubCategoryId !== 62&&hitem.SubCategoryId !==10&&hitem.SubCategoryId !==5&&hitem.SubCategoryId !== 25&&hitem.SubCategoryId !== 78 && hitem.SubCategoryId !== 38 && hitem.SubCategoryId !== 23 && hitem.SubCategoryId !== 77 && hitem.SubCategoryId !== 41&& hitem.SubCategoryId !== 68">
                    <a href="javascript:;" ng-click="CheckSubCategory(cat, hitem)">
                        {{hitem.SubCategoryName}}
                    </a>
                </li>
            </ul>


            <ul class="autofill-list m-b-0" ng-repeat="hitem in cat.CategoryDetails" ng-show="cat.CategoryId== 9 ">
                <li>
                    <input type="checkbox" ng-model="selectAllCLObj.SelectAllChecked" ng-click="SelectAllSubcategories(hitem)" />
                    <span>Select All</span>
                </li>

                <li ng-repeat=" item in hitem.SubCategoryDetails" ng-class="item.IsSubChildCategoryChecked ?'active' : ''">
                    <a href="javascript:;" ng-click="CheckSubCategory(hitem,item.SubCategoryChildId)">
                        {{item.SubCategoryChildName}}
                    </a>
                </li>

            </ul>


        </div>
    </div>
</div>
