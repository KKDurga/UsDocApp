<div class="eh-header">
    <h1> Billing Note </h1>
    <div class="asc-patient-profile">
        <ul>
            <li>
                <img image-viewer ng-if="PatientImageS3URL != ''" src="{{PatientImageS3URL}}" />
                <img ng-if="PatientImageS3URL == ''" src="img/sprite-sheet/user-square.svg" />
                <p title="{{PatientName}}">{{PatientName}}</p>
            </li>
            <li>
                <span>MR No.:</span>
                <label>{{PatientDisplayId}}</label>
            </li>
            <li>
                <span>Sex:</span>
                <label>{{PatientGender}}</label>
            </li>
            <li>
                <span>Age:</span>
                <label>{{PatientAge}}</label>
            </li>
            <li>
                <span>DOB:</span>
                <label>{{PatientDOB | date:"MM-dd-yyyy"}}</label>
            </li>
        </ul>
    </div>
    <ul class="us-controls">
        <li>
            <a>
                <i class="fas fa-times fa-lg text-danger" ng-click="closeuibpopup();"></i>
            </a>

        </li>
    </ul>
</div>

<div class="modal-body">
    <div class="row">

        <div class="col-lg-12 m-t-10">
            <div class="row">
                <div class="col-lg-12">
                    <div class="form-group">
                        <textarea rows="2" ng-model="BillingNotes" class="form-control msd-elastic: \n" placeholder="{{ 'ENTERNOTES' | translate}}" maxlength="500"></textarea>
                    </div>
                </div>
                <div class="col-lg-12 text-right m-b-10">
                    <button class="btn btn-info" ng-click="addBillingNoteAppointment()">Save</button>
                    <button class="btn btn-danger" ng-click="clearBillingNotestoAppointment()">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <div class="row" ng-show="BillingNotesArray.length > 0">
        <div class="col-lg-12">
            <ul class="list-none">
                <li class="bookapt-textarea p-10" ng-repeat="item in BillingNotesArray | filter:{'DeleteInd':'N'} track by $index">
                    <p class="m-b-0"><b>{{item.Notes}}</b></p>
                    <span class="pull-right dis-flex">
                        <span>{{item.CreatedBy}}</span>
                        <span>,{{item.CreatedDt | date:'MM-dd-yyyy,HH:mm'}}</span>

                        <i class="fas fa-trash text-danger fa-lg m-l-15" ng-hide="item.UserId !== UserId" ng-click="DeleteApptNote(item,$index)"></i>
                    </span>
                </li>
            </ul>
        </div>
    </div>


</div>




<div class="modal-footer">
    <div class="row">
        <div class="col-lg-12 pull-right">
            <button type="button" class="etn btn-ehnote-outline p-l-25 p-r-25" ng-click="closeuibpopup();"> {{ 'CLOSE' | translate}}</button>
        </div>
    </div>
</div>
