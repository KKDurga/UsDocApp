<div class="modal__style--1">
    <div class="modal__header--">
        <h1 >Templates</h1>
        <button class="btn__lg-- btn__C71D27--o" ng-click="uibclose()">Close</button>
    </div>
    <div class="modal__body-- p__0--">
        <div class="position__relative-- height__100-- ">
            <div class="adjustable-position">
                <uib-accordion close-others="oneAtATime">
                    <div class="d__f-- fd__c-- gap__10--y p__10--">
                        <div ng-repeat="template in MedicalRxTemplateArrayDetails">


                            <div uib-accordion-group class="panel-default" is-open="status.open">
                                <uib-accordion-heading>
                                    <label class="cur-poiter">
                                        <input type="checkbox" value="" ng-model="template.SelectedTemplate" ng-change="ChangeMedicalRxTemplate(template,template.SelectedTemplate)" class="checkbox">
                                        <span class="lbl"></span>
                                        <span class="text-s12w500C068cb0 lh-2-0 fs-14 ng-binding">{{template.TemplateName }}</span>
                                    </label>
                                    <i class="pull-right glyphicon" ng-class="{'glyphicon-chevron-down': status.open, 'glyphicon-chevron-right': !status.open}"></i>
                                </uib-accordion-heading>
                                <ul class="list-eh-vertical referral-summary-list dis-block" >
                                    <!--<li>
                            CP OD Patient presents progressive painless loss of vision OD. He comes for cataract surgery to try improve his functional visual acuity on daily life activities OD. Also patient presents with Glaucoma treated with the economic and usage burden of multiple medications
                        </li>
                        <li>
                            Blepharoplasty Upper OU due to upper lids blocking vision. Patient sees better raising eyebrows.He comes for blepharoplasty OU Upper eyelids surgery to try improve his functional visual  on daily life activities.
                        </li>
                        <li>
                            1st Eye OS(LenSx/PanOptix) due to progressive loss of vision. Patient comes for cataract surgery to try to improve his functional visual acuity on daily life activities Left Eye. Also patient can’t see at near without glasses and wants surgical correction
                        </li>-->
                                    <li ng-repeat="complaint in template.MedicalRXTemplateArray.PrescriptionDetails">
                                        <div>
                                            <div>{{ complaint.MedicationName }}</div>
                                            <div>{{ complaint.Sig }}</div>
                                            <small ng-show="complaint.PatientInstructions"><b>Medication Instructions:</b> </small><small>{{complaint.PatientInstructions}}</small>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </uib-accordion>
            </div>
        </div>
    </div>
</div>
