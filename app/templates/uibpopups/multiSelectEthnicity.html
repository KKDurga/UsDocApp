<div class="dropdown" button-dropdown-direction>
    <button class="btn" ng-click="toggleSelect()" ng-disabled="disabled" ng-class="{'error': !valid()}">
        <span class="pull-left">{{headerEth}}</span>
        <span class="caret pull-right"></span>
    </button>
    <ul class="dropdown-menu over-scrol-y">
       
        <li>
            <input type="text" style="width:100%" class="form-control" placeholder="Search" ng-model="searchText.label" autofocus="autofocus"  ng-change="changeTextValue()"/>
        </li>
     
        <li ng-repeat="i in items | filter:searchText" style="padding: 2px 10px !important">
            <div class="checkbox cn">
                <label>
                    <input name="checkbox-11" type="checkbox" ng-model="i.checked" ng-click="select(i); focus()">
                    <span class="checkbox-material">
                        <span class="check" style="width: 15px; height: 15px;"></span>
                    </span>
                    <small ng-bind="i.label" style="font-size:11px !important"></small>
                </label>
            </div>
           
        </li>
    </ul>
</div>
