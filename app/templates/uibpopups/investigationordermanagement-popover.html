<div class="row">
    <div class="col-lg-12">
        <div class="panel-tabs">
            <ul>
                <li ng-class="activeInvTab== 1 ?'active':''" class="flex">
                    <a href="javascript:;" ng-click="switchtoActiveInvTab(1)">
                        Same Investigations
                    </a>
                </li>
                <li class="flex" ng-class="activeInvTab== 2 ?'active':''">
                    <a href="javascript:;" ng-click="switchtoActiveInvTab(2)">
                        All Investigation
                    </a>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane active in show">
                    <div class="row">
                        <div class="col-lg-12 text-center">
                            <fieldset class="pos-relative">
                                <div class="dis-inline-block">
                                    <input type="radio" class="radio-custom width-0" id="invAllId" name="invSearchTypes" ng-value="3" ng-model="mainViewerObj.invSearchType" ng-click="changeOrderData(mainViewerObj.invSearchType)" value="3">
                                    <label for="invAllId" class="radio-custom-label cur-poiter mb-0 text-label">All</label>
                                </div>
                                <div class="dis-inline-block ml-5">
                                    <input type="radio" class="radio-custom width-0" id="invODId" name="invSearchTypes" ng-value="1" ng-model="mainViewerObj.invSearchType" ng-click="changeOrderData(mainViewerObj.invSearchType)" value="1">
                                    <label for="invODId" class="radio-custom-label cur-poiter mb-0 text-label">OD</label>
                                </div>
                                <div class="dis-inline-block ml-5">
                                    <input type="radio" class="radio-custom width-0" id="invOSId" name="invSearchTypes" ng-value="2" ng-model="mainViewerObj.invSearchType" ng-click="changeOrderData(mainViewerObj.invSearchType)" value="2">
                                    <label for="invOSId" class="radio-custom-label cur-poiter mb-0 text-label">OS</label>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="list-group m-b-0 m-t-6 overflow-y-auto" style="max-height: calc(100vh - 250px);">
                                <a class="list-group-item" ng-repeat="item in OrdersObj.filteredinvestigations">
                                    <h6>{{ item.AppointmentDate | date: 'MM-dd-yyyy' }}</h6>
                                    <!-- List of Investigations -->
                                    <p class="text-s12w500c000" ng-click="selectInvestigationObj(item)">
                                        {{item.OrganName}} {{ item.ProcedureName }}
                                    </p>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>         
    </div>
    </div>
