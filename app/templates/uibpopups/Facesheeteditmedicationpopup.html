<div class="eh-panel b-0">
    <div class="eh-header bg-white p-5">
        <h1>Medications</h1>
        <ul class="us-controls">
            <li>
                <button class="btn btn-danger" ng-click="uibclose()">Close</button>
            </li>
        </ul>
    </div>
    <div class="eh-body">
        <ul class="asc-summary-list">
            <li>
                <span>Would you like to add the template to the existing medication or replace?</span>
            </li>
        </ul>
        <div class="form-group text-center">
            <button class="btn btn-primary" ng-click="ReplaceMedications(MedicationsArray,TemplateMedicationsArray)">Replace</button>
            <button class="btn btn-success" ng-click="AddMedications(MedicationsArray,TemplateMedicationsArray)">Add</button>
        </div>
    </div>
</div>
