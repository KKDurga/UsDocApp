<div class="row">
    <div class="col-lg-12">
        <table class="table tableno-bordered m-b-0">
            <tbody>
                <tr>
                    <td>Appointment</td>
                </tr>
                <tr ng-repeat="item in AppointmentDetails">
                    <td>
                        <div class="dis-flex align-items-center">
                            <div class="doctor-imgname">
                                <img src="img/sprite-sheet/user-square.svg" class="w-50">
                            </div>
                            <div class="m-l-10">
                                <p class="m-b-0 text-s14w600C15898f text-black">
                                    <span class="font-weight-400">With</span>
                                    <span class="text-068cb0">{{item.DoctorName}}</span>
                                </p>
                                <p class="m-b-0">
                                    <span>On</span>
                                    <span>{{item.AppointmentDate | date:"MM-dd-yyyy"}} &nbsp; ( {{item.NewStartTime}})</span>
                                </p>
                                <p class="m-b-0 text-068cb0 font-weight-700"><b class="font-weight-400">at &nbsp;</b>{{item.HospitalName}}</p>
                               
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
