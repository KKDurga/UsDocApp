<div class="modal-header">
    <h4 class="modal-title">Patient Photo Upload</h4>
    <button type="button" class="btn btn-link" ng-click="ClosepatientPhotoUpload()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <div class="upload-img-profile" ng-show="!isPatientImgAvail">
                <div class="row">
                    <div class="dis-flex align-items-center justify-content">
                        <div>
                             
                            <input type='file'
                                   class="hide"
                                   id="selectfileupload"
                                   ngf-select="selectPrintImgLogo1($file)"
                                   name="file"
                                   ng-model="file"
                                   ngf-pattern="'image/*,application/pdf'"
                                   ngf-accept="'image/*,application/pdf'" />
                            <label for="selectfileupload" class="cur-poiter">
                                <img src="img/register/upload-icon.svg" width="35" />
                            </label>
                        </div>
                        <div class="w-20">
                            /
                        </div>
                        <div>
                            <img src="img/register/camera-icon.svg" class="cur-poiter" width="35" ng-click="captureimage()"/>
                        </div>
                    </div>
                    <span class="text-upload-patient dis-block m-t-10">
                        Upload or Capture
                        Patient’s Photo Here
                    </span>
                </div>
                 
            </div>
            <!-- / -->
            <div class="upload-img-profile" ng-show="isPatientImgAvail">
                <button class="btn btn-link p-l-5 p-r-5 m-l-3 pos-absolute z-9999" style="float: right; top: 0px; right: 10px;" ng-show="patientinfo.S3URL!==''||patientinfo.TempImagesArray1[0].DeleteInd == false" ng-click="removeImage(patientinfo)"><i class="fas fa-times-circle text-danger fa-lg"></i></button>
                
                <img ngf-thumbnail="file" alt="..." class="showImg-profile" ng-if="IsModifedLogo&&patientinfo.S3URL== ''"  />
            </div>
        </div>
    </div>
    <div class="row m-t-10">
        <div class="col-lg-12 text-center">
            <button type="button" class="etn btn-ehnote-outline p-l-25 p-r-25" ng-click="ClearPatientProfileImg()">Clear</button>
            <button type="button" class="etn btn-ehnote p-l-25 p-r-25">Save</button>
        </div>
    </div>
</div>
