<div class="modal-header">
    <div class="dis-flex justify-space-between align-items-center">
        <h1 class="fs-18 text-ehnote font-weight-700 m-0">Create New Stamp</h1>
        <button class="btn btn-danger" ng-click="closeuib()">Close</button>
    </div>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12" ng-controller="UsfabricStampCreationCtrl">
            <div class="two-sections">
                <div class="p-6 bg-f2f2f2 bradius-6 flex">
                    <div>
                        <div class="pos-relative overflow__auto--y overflow__auto--x">

                            <div id="canvas-wrapper" class="w-800">
                                <canvas id="canvasStamp" width="800" height="500"></canvas>
                            </div>
                            <ul class="mb-0 button-drawpad pos-absolute right-10 bottom-10">
                                <li ng-click="zoomoutCanvas()">
                                    <i class="draw-zoom-out"></i>
                                </li>
                                <li ng-click="zoominCanvas()">
                                    <i class="draw-zoom-in"></i>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="p-6 bg-f2f2f2 bradius-6 width-30">
                    <div class="dis-flex align-items-center justify-space-between flex-direction-column overflow-y-scroll overflow-x-hidden" style="height: calc(100vh - 110px)">
                        <!-- Select Stamp -->
                        <div class="width-100 border-bottom p-b-6">

                            <ul class="anterior-posterior-drawing-menu-switch width-100 m-b-5">
                                <li ng-class="activeStampTab== 1 ?'active':''" class="flex">
                                    <a href="javascript:;" ng-click="switchtoActiveStampTab(1)">
                                        <label for="FindingsD">Create Stamp</label>
                                        <!--<input type="radio" class="dis-none" id="FindingsD">-->
                                    </a>
                                </li>
                                <li class="flex" ng-class="activeStampTab== 2 ?'active':''">
                                    <a href="javascript:;" ng-click="switchtoActiveStampTab(2)">
                                        <label for="StampsD">Set Position</label>
                                        <!--<input type="radio" class="dis-none" id="StampsD">-->
                                    </a>
                                </li>
                            </ul>

                            <div class="" ng-if="activeStampTab==1">
                                <div class="form-group">
                                    <label>Body Part</label>
                                    <select class="form-control" ng-model="newStampAddUpdateReqObj.FindingCategoryObj" ng-options="item as item.ExaminationCategoryName for item in mainExaminationArray" ng-change="changeStampExaminationCategory(newStampAddUpdateReqObj.FindingCategoryObj)">
                                        <option value="" disabled="disabled">Select</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Stamp Name <em>*</em></label>
                                    <input type="text" class="form-outline" ng-model="newStampAddUpdateReqObj.StampName" />
                                </div>
                                <div class="form-group">
                                    Add Image :
                                    <!--<input type="file" value="Upload BG Image" class="form-outline" />-->
                                    <input type="file" id="imageInput" ng-model="selectedImage" value="Add Image" class="form-outline" accept="image/*" ngf-select="addImageToCanvas(selectedImage)">
                                </div>

                                <div class="form-group m-t-10">
                                    <label class="cur-poiter">
                                        <input type="checkbox" class="checkbox" ng-model="newStampAddUpdateReqObj.ConnectFindingValue" ng-change="changeAssignFinding(newStampAddUpdateReqObj.ConnectFindingValue)">
                                        <span class="lbl"></span>
                                        <span class="text-s12w600C000 fs-12">Assign to Finding</span>
                                    </label>
                                </div>
                                <div class="form-group" ng-if="newStampAddUpdateReqObj.ConnectFindingValue">
                                    <label>Finding Values</label>
                                    <div class="search-2024">
                                        <input type="text" placeholder="Search"
                                               autocomplete="off"
                                               name="searchFindings"
                                               ng-model="newStampAddUpdateReqObj.FindingValueSearchObj"
                                               maxlength="100"
                                               typeahead-min-length="0"
                                               typeahead-focus-on-select="false"
                                               uib-typeahead="item as item.FindingValue+' ( '+item.FindingName+' )' for item in SearchExaminationCategoryFindingValues($viewValue)"
                                               typeahead-on-select="onSelectFindingValues(newStampAddUpdateReqObj.FindingValueSearchObj)" />
                                        <span class="search-2024-img">
                                        </span>
                                        <ul class="search-2024-ul" ng-show="newStampAddUpdateReqObj.FindingValueId!='' && newStampAddUpdateReqObj.FindingValueId!=0">
                                            <li>
                                                <label>{{newStampAddUpdateReqObj.FindingValue}} - {{newStampAddUpdateReqObj.InvestigationName}}</label>
                                                <a href="javascript:;">
                                                    <i class="fas fa-times" ng-click="deletefindingValueId(newStampAddUpdateReqObj)"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                                <div class="form-group">

                                    <fieldset class="pos-relative">
                                        <div class="dis-inline-block">
                                            <input type="radio" class="radio-custom width-0" id="organNameId" name="patSearchType" ng-value="1" ng-model="newStampAddUpdateReqObj.OrganId" value="1">
                                            <label for="organNameId" class="radio-custom-label cur-poiter mb-0 text-label">OD</label>
                                        </div>
                                        <div class="dis-inline-block ml-5">
                                            <input type="radio" class="radio-custom width-0" id="CalmrMobileId" name="patSearchType" ng-value="2" ng-model="newStampAddUpdateReqObj.OrganId" value="2">
                                            <label for="CalmrMobileId" class="radio-custom-label cur-poiter mb-0 text-label">OS</label>
                                        </div>


                                    </fieldset>
                                </div>


                                <div id="drawing-mode-options" ng-show="getFreeDrawingMode()">
                                    <label for="drawing-mode-selector">Mode:</label>
                                    <select id="drawing-mode-selector" bind-value-to="drawingMode">
                                        <option>Pencil</option>
                                        <option>Circle</option>
                                        <option>Spray</option>
                                        <option>Pattern</option>

                                        <option>hline</option>
                                        <option>vline</option>
                                        <option>square</option>
                                        <option>diamond</option>
                                        <option>texture</option>
                                    </select>
                                    <br>
                                    <label for="drawing-line-width">Line width:</label>
                                    <input type="range" value="30" min="0" max="150" bind-value-to="drawingLineWidth">
                                    <br>
                                    <label for="drawing-color">Line color:</label>
                                    <input type="color" value="#005E7A" bind-value-to="drawingLineColor">

                                </div>

                                <div ng-if="cursorActiveTab==7">
                                    <div>
                                        <label for="canvas-background-picker">Fill Background:</label>
                                        <input type="color" bind-value-to="canvasBgColor">
                                    </div>
                                    <div>
                                        <label>Fill Selected:</label>
                                        <input type="color" ng-model="selectedColor" ng-change="changeColor(selectedColor)" />
                                    </div>
                                </div>
                                <ul class="drawing-pad-actions">
                                    <li title="Cursor" ng-class="cursorActiveTab== 1 ?'active':''" ng-click="swiitchCursorActiveTab(1)" style="cursor:pointer">
