<div class="row">
    <div class="col-lg-12">
        <div class="eh-header dis-flex justify-space-between">
            <h1 class="text-068cb0">Evaluation</h1>
            <ul class="us-controls">
                <li>
                    <button class="btn btn-save-us m-r-5">Save</button>
                </li>
                <li>
                    <button class="btn btn-discard-us m-r-5" ng-click="uibclose()">Close</button>
                </li>
            </ul>
        </div>
        <div class="modal-body p-5">
            <div class="row">
                <div class="col-lg-12">
                    <div class="consultation-ros">
                        <section class="eh-panel width-47">
                            <div class="eh-header">
                                <h1>Lab</h1>
                                <ul class="us-controls">
                                    <li>
                                        <a href="javascript:;" ng-click="Labpopup()">
                                            <i class="plus-icon-us us-icon"></i>
                                        </a>
                                    </li>
                                    <li>
                                        <a href="javascript:;" ng-click="AddLabTest();">+Add</a>
                                    </li>
                                </ul>
                            </div>
                            <div class="eh-body">
                                <div class="row">
                                    <div class="col-lg-12">
                                        <div class="table-responsive">
                                            <table class="table tableno-bordered m-b-10 tableno-padding">
                                                <tbody>
                                                    <tr>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">HGB</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.HGB" />
                                                                    <button disabled>
                                                                        gm/dl
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">HCT</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.HCT" />
                                                                    <button disabled>
                                                                        %
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">WBC</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.WBC" />
                                                                    <button disabled>
                                                                        mcL
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">RBC</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.RBC" />
                                                                    <button disabled>
                                                                        mcL
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">A1 C</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.A1C" />
                                                                    <button disabled>
                                                                        mcL
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">Creatinine</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.Creatinine" />
                                                                    <button disabled>
                                                                        Mg/Dl
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                            <table class="table tableno-bordered m-b-0 tableno-padding">
                                                <tbody class="b-0">
                                                    <tr>
                                                        <td colspan="4">
                                                            <p class="m-b-0 fs-14 text-068cb0 font-weight-600">Diabetes</p>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">RBS</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.RBS" />
                                                                    <button disabled>
                                                                        gm/dl
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">FBS</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.FBS" />
                                                                    <button disabled>
                                                                        gm/dl
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">PBBS</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.PBBS" />
                                                                    <button disabled>
                                                                        gm/dl
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">PLBS</span>
                                                                    <input type="text" class="bleft-none" ng-model="LabObj.PBLS" />
                                                                    <button disabled>
                                                                        gm/dl
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                            <table class="table tableno-bordered m-b-0 tableno-padding m-t-10">
                                                <tbody class="b-0">
                                                    <tr ng-repeat="item in LabObj.LabTestArray track by $index">
                                                        <td>
                                                            <div ng-if="$index < 3"><b class="text-767575">{{item.Name}}</b></div>
                                                            <div ng-if="$index >= 3">
                                                                <div class="ehr-input  pop-ehr-input">
                                                                    <input type="text" class="width-60" placeholder="Add here" ng-model="item.Name">
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td width="40%">
                                                            <div class="checkbox cn m-r-0">
                                                                <label>
                                                                    <input name="checkbox-1" type="checkbox" ng-model="item.IsNormalLimitsChecked">
                                                                    <span class="checkbox-material">
                                                                        <span class="check"></span>
                                                                    </span>
                                                                    <small class="text-s14w500c000 m-l-5 fs-13">
                                                                        W.Normal Limits
                                                                    </small>
                                                                </label>
                                                                <label class="m-l-2">
                                                                    <input name="checkbox-1" type="checkbox" ng-model="item.IsAbnormalChecked">
                                                                    <span class="checkbox-material">
                                                                        <span class="check"></span>
                                                                    </span>
                                                                    <small class="text-s14w500c000 m-l-5 fs-13">
                                                                        Abnormal
                                                                    </small>
                                                                </label>
                                                            </div>
                                                        </td>
                                                        <td class="b-0">
                                                            <div class="ehr-input  pop-ehr-input">
                                                                <input type="text" ng-model="item.Notes">
                                                            </div>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <td colspan="3">
                                                            <div class="ehr-input  pop-ehr-input">
                                                                <textarea type="text" rows="2" placeholder="Notes" ng-model="LabObj.Notes"></textarea>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                        <section class="eh-panel width-23">
                            <div class="eh-header">
                                <h1>Cardiovascular</h1>
                            </div>
                            <div class="eh-body">
                                <div class="row">
                                    <div class="col-lg-12">
                                        <div class="table-responsive">
                                            <table class="table tableno-bordered m-b-0 tableno-padding">
                                                <tbody>
                                                    <tr>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">BP</span>
                                                                    <input type="text" class="bleft-none" ng-model="CardioVascularObj.Systolic">
                                                                    <input type="text" class="bleft-none" ng-model="CardioVascularObj.Diastolic">
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">PR</span>
                                                                    <input type="text" class="bleft-none" ng-model="CardioVascularObj.PR">
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <span class="text-068cb0">ECG</span>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="ehr-input pop-ehr-input">
                                                                <div class="ehr-input-group">
                                                                    <span class="lab-add-span">ECG</span>
                                                                    <input type="text" class="bleft-none" ng-model="CardioVascularObj.ECG">
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="ehr-input  pop-ehr-input">
                                                                <textarea type="text" rows="8" placeholder="Notes" ng-model="CardioVascularObj.Notes"></textarea>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <!--<tr>
                                    <td>
                                        <div class="ehr-input  pop-ehr-input">
                                            <textarea type="text" rows="5" placeholder="Notes"></textarea>
                                        </div>
                                    </td>
                                </tr>-->
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                        <section class="eh-panel width-28">
                            <div class="eh-header">
                                <h1>Airway</h1>
                            </div>
                            <div class="eh-body">
                                <div class="row">
                                    <div class="col-lg-12">
                                        <div class="table-responsive">
                                            <table class="table tableno-bordered m-b-0 apptFilterTable">
                                                <tbody>
                                                    <tr>
                                                        <td>
                                                            <div class="checkbox cn m-r-0">
                                                                <label>
                                                                    <input name="checkbox-1" type="checkbox" ng-model="AirwayObj.IsNormal" ng-change="OnClickNormal();">
                                                                    <span class="checkbox-material">
                                                                        <span class="check"></span>
                                                                    </span>
                                                                    <small class="text-s14w500c000 m-l-5">
                                                                        Normal
                                                                    </small>
                                                                </label>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="form-group dis-flex">
                                                                <label class="m-b-0 border-right-1 text-767575 w-75">ROM TMS</label>
                                                                <ul class="yesno-switch m-l-5">
                                                                    <li ng-class="(AirwayObj.ROMTMS == 'Full')?'active':''" ng-click="SelectTMS(1);">Full</li>
                                                                    <li ng-class="(AirwayObj.ROMTMS == 'Limited')?'active':''" ng-click="SelectTMS(2);">Limited</li>
                                                                </ul>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="form-group dis-flex">
                                                                <label class="m-b-0 border-right-1 w-75 text-767575">ROM Neck</label>
                                                                <div class="dis-flex m-l-5">
                                                                    <p class="m-b-0 m-t-10"> AP</p>
                                                                    <ul class="yesno-switch m-l-5">
                                                                        <li ng-class="(AirwayObj.ROMNECKAP == 'Full')?'active':''" ng-click="RomNeckAP(1);">Full</li>
                                                                        <li ng-class="(AirwayObj.ROMNECKAP == 'Limited')?'active':''" ng-click="RomNeckAP(2);">Limited</li>
                                                                    </ul>
                                                                </div>
                                                                <div class="dis-flex m-l-5">
                                                                    <p class="m-b-0 m-t-10 text-767575"> LAT</p>
                                                                    <ul class="yesno-switch m-l-5">
                                                                        <li ng-class="(AirwayObj.ROMNECKLAT == 'Full')?'active':''" ng-click="RomNeckLAT(1);">Full</li>
                                                                        <li ng-class="(AirwayObj.ROMNECKLAT == 'Limited')?'active':''" ng-click="RomNeckLAT(2);">Limited</li>
                                                                    </ul>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="form-group dis-flex">
                                                                <label class="m-b-0 border-right-1 text-767575 w-75">Class</label>
                                                                <ul class="yesno-switch m-l-5">
                                                                    <li ng-class="(AirwayObj.Class == '1')?'active':''" ng-click="SelectClass(1);">1</li>
                                                                    <li ng-class="(AirwayObj.Class == '2')?'active':''" ng-click="SelectClass(2);">2</li>
                                                                    <li ng-class="(AirwayObj.Class == '3')?'active':''" ng-click="SelectClass(3);">3</li>
                                                                    <li ng-class="(AirwayObj.Class == '4')?'active':''" ng-click="SelectClass(4);">4</li>
                                                                </ul>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="ehr-input  pop-ehr-input">
                                                                <textarea type="text" rows="6" placeholder="Notes" ng-model="AirwayObj.Notes"></textarea>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
