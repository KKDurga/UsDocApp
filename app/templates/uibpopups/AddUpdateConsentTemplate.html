<!--New Design Started-->
<div class="modal__style--1 height__100--">
    <div class="modal__header--">
        <h1>Create Template</h1>
        <ul class="flex-flow-list">
            <li>
                <button class="btn__lg-- btn__C71D27--o" ng-click="ClearDetails()">{{ 'CLEAR' | translate}}</button>
            </li>
            <li>
                <button class="btn__lg-- btn__1d5558--f" ng-hide="addUpdateConsentTemplateObj.ConsentTemplateId != 0" ng-click="SaveAddUpdateConsentTemplateDetails()">{{ 'SAVE' | translate}}</button>
                <button class="btn__lg-- btn__1d5558--f" ng-hide="addUpdateConsentTemplateObj.ConsentTemplateId == 0" ng-click="SaveAddUpdateConsentTemplateDetails()">{{ 'UPDATE' | translate}}</button>
            </li>
            <li>
                <a class="btn__close--" ng-click="cancelUib()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body-- height__100--">
        <div class="position__relative-- height__100--">
            <div class="adjustable-position slim-scroll">
                <div class="section__style--4">
                    <div class="section__header-- jc__e--">
                        <label class="cur-poiter d__f-- ai__c-- gap__5--">
                            <input type="checkbox" class="checkbox" ng-model="addUpdateConsentTemplateObj.IsPrimary" ng-true-value="'Y'" ng-false-value="'N'">
                            <span class="lbl"></span>
                            <span class="fs__lg-- fw__5-- tc__1D5558--">Primary</span>
                        </label>
                    </div>
                    <div class="section__body--">
                        <div class="d__f-- fd__c-- gap__5--">
                            <div class="row nocolpad">
                                <div class="col-lg-4 col-sm-4">
                                    <div class="form__group flex">
                                        <label>Location<em>*</em></label>
                                        <div class="dropdown cstm-dropdown width-100" button-dropdown-direction>
                                            <button class="form__control text-left pr__20--" id="dropdownMenu3" data-toggle="dropdown" ng-disabled="addUpdateConsentTemplateObj.ConsentTemplateId != 0">
                                                <i class="icons__w16-- arrowdown__w16--l pos-absolute right__6-- fs-11 top-8"></i>
                                                {{selectedLocationString}}
                                            </button>
                                            <div class="dropdown-menu dr-drop-app overflow-hidden" role="menu" aria-labelledby="dropdownMenu3" ng-click="stopClosingDropDown($event)">
                                                <div class="p-5">
                                                    <input type="text" class="form-control input-sm bg-inputy" placeholder="{{ 'SEARCH' | translate}}" ng-model="LocationTypeObj.Name" />
                                                </div>
                                                <div class="drop-menu-Scroll apptsearchdroplist">
                                                    <ul>
                                                        <li ng-repeat="item in allBranches | filter:{'BranchName':LocationTypeObj.Name} track by $index">
                                                            <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                                                <input type="checkbox" class="checkbox" ng-model="item.IsChecked" ng-click="changeAppointmentBranch(item)">
                                                                <span class="lbl"></span>
                                                                <span class="fs__lg-- fw__5-- tc__1D1D1D--" ng-bind="item.BranchName"></span>
                                                            </label>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-4 col-sm-4">
                                    <div class="form__group">
                                        <label>Template Form Name <em>*</em></label>
                                        <input type="text" maxlength="200"
                                               ng-model="addUpdateConsentTemplateObj.ConsentTemplateName"
                                               ng-disabled="addUpdateConsentTemplateObj.ConsentTemplateId !=0"
                                               placeholder="Enter Template Name"
                                               typeahead-min-length="0"
                                               quotes-restrict enter-directive />
                                    </div>
                                </div>
                                <div class="col-lg-4 col-sm-4">
                                    <div class="form__group">
                                        <label> Visit Reason <em>*</em></label>
                                        <!--<ui-select ng-disabled="addUpdateConsentTemplateObj.ConsentTemplateId !=0" ng-model="addUpdateConsentTemplateObj.ServiceTypeObj" theme="bootstrap" on-select="onSelectVisitReason(addUpdateConsentTemplateObj.ServiceTypeObj)" class="form__uiselect fd__c--">
                                        <ui-select-match placeholder="{{ 'SELECT' | translate}}">{{addUpdateConsentTemplateObj.ServiceTypeObj.Reason != "" ? addUpdateConsentTemplateObj.ServiceTypeObj.Reason : 'Select Visit Reason'}}</ui-select-match>
                                        <ui-select-choices repeat="item in AllVisitReasons | filter: $select.search" null-option="EmptySelect" loose-null>
                                            <span ng-bind-html="item.Reason | highlight: $select.search"></span>
                                        </ui-select-choices>
                                    </ui-select>-->
                                        <div class="dropdown cstm-dropdown width-100" button-dropdown-direction>
                                            <button class="form__control text-left pr__20--" id="dropdownMenu3" data-toggle="dropdown" ng-disabled="addUpdateConsentTemplateObj.ConsentTemplateId !=0">
                                                <i class="icons__w16-- arrowdown__w16--l pos-absolute right__6-- fs-11 top-9"></i>
                                                {{selectedVisitReason}}
                                            </button>
                                            <div class="dropdown-menu dr-drop-app" role="menu" aria-labelledby="dropdownMenu3" ng-click="stopClosingDropDown($event)">
                                                <div class="p-5">
                                                    <input type="text" class="form-control input-sm bg-inputy" placeholder="{{ 'SEARCH' | translate}}" ng-model="searchHospital.visitRsnName" />
                                                </div>
                                                <div class="apptsearchdroplist">
                                                    <ul>
                                                        <li>
                                                            <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                                                <input type="checkbox" ng-disabled="addUpdateConsentTemplateObj.ConsentTemplateId !=0" class="checkbox" ng-model="AllVisitReasonObj.AllVisitReasonsCheck" ng-click="checkAllVisitReasons(AllVisitReasonObj.AllVisitReasonsCheck)">
                                                                <span class="lbl"></span>
                                                                <span class="fs__lg-- fw__5-- tc__1D1D1D--">{{ 'ALLVISITREASONS' | translate}}</span>
                                                            </label>
                                                        </li>
                                                        <li ng-repeat="item in AllVisitReasons | filter:{'AppointmentVisitReason':searchHospital.visitRsnName}">
                                                            <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                                                <input ng-disabled="addUpdateConsentTemplateObj.ConsentTemplateId !=0"  type="checkbox" class="checkbox" ng-model="item.isChecked" ng-click="onSelectVisitReason(item);">
                                                                <span class="lbl"></span>
                                                                <span class="fs__lg-- fw__5-- tc__1D1D1D--" ng-bind="item.Reason"></span>
                                                            </label>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="form__group">
                                        <label>Consent Form Name <em>*</em></label>
                                        <input type="text" class="icons-search form-control" maxlength="200"
                                               ng-model="addUpdateConsentTemplateObj.ConsentFormObj"
                                               placeholder="Search Consent Form"
                                               ng-change="changesearchConsentForm(addUpdateConsentTemplateObj.ConsentFormObj)"
                                               quotes-restrict enter-directive />
                                    </div>
                                </div>
                            </div>
                            <ul class="d__f-- fd__c-- gap__6--y p__0-- m__0-- list__unstyled-- mt__10--">
                                <li class="br__5-- p__5--" ng-class="item.IsSelected ? 'border__1D5558-- bg__E8EEEE--' : 'border__E4E4E4--'" ng-repeat="item in Consentformlist">
                                    <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                        <input type="checkbox" class="checkbox" ng-model="item.IsSelected" ng-click="pushConsentItem(item)">
                                        <span class="lbl"></span>
                                        <span class="fs__lg-- fw__5--" ng-class="item.IsSelected ? 'tc__1D5558--' : 'tc__1D1D1D--'">{{item.DocumentName}}</span>
                                    </label>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="section__style--4">
                    <div class="section__header--">
                        <h1>Selected Consents</h1>
                    </div>
                    <div class="section__body--">
                        <table class="table__style--5" ng-if="selectedConsents.length > 0">
                            <tbody>
                                <tr ng-repeat="item in selectedConsents | filter:{DeleteInd:'N'}">
                                    <td>{{item.DocumentName}}</td>
                                    <td width="5%">
                                        <a data-tooltip="Delete" ng-click="removeConsentTemplateitem(item)"><i class="icons__w16-- delete__w16--o"></i></a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="row height__100-- d__f-- jc__c-- ai__c--" ng-if="selectedConsents.length == 0">
                            <div class="col-lg-12">
                                <div class="m__auto--">
                                    <p class="fs__lg-- fw__4-- tc__656565-- m__0-- d__f-- ai__c-- gap__5-- jc__c--">No Patient Document Selected</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--New Design Ended-->


<div ng-if="false">
    <div class="modal-header">
        <h4 class="modal-title"> Create Template</h4>
        <button type="button" class="btn btn-link" ng-click="cancelUib()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="modal-body p-5">
        <div class="row">
            <div class="col-lg-12">
                <div class="referal-container-main">
                    <div class="referal-container">
                        <div class="referal-body">
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <label>Template Form Name <em>*</em></label>
                                        <input type="text" class="form-control" maxlength="200"
                                               ng-model="addUpdateConsentTemplateObj.ConsentTemplateName"
                                               ng-disabled="addUpdateConsentTemplateObj.ConsentTemplateId !=0"
                                               placeholder="Enter Template Name"
                                               typeahead-min-length="0"
                                               quotes-restrict enter-directive />
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <label> Service Type <em>*</em></label>
                                        <ui-select ng-disabled="addUpdateConsentTemplateObj.ConsentTemplateId !=0" ng-model="addUpdateConsentTemplateObj.ServiceTypeObj" theme="bootstrap" on-select="onSelectVisitReason(addUpdateConsentTemplateObj.ServiceTypeObj)" class="uiselect-custom">
                                            <ui-select-match placeholder="{{ 'SELECT' | translate}}">{{addUpdateConsentTemplateObj.ServiceTypeObj.Reason != "" ? addUpdateConsentTemplateObj.ServiceTypeObj.Reason : 'Select Visit Reason'}}</ui-select-match>
                                            <ui-select-choices repeat="item in AllVisitReasons | filter: $select.search" null-option="EmptySelect" loose-null>
                                                <span ng-bind-html="item.Reason | highlight: $select.search"></span>
                                            </ui-select-choices>
                                        </ui-select>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <label>Consent Form Name <em>*</em></label>
                                        <input type="text" class="form-control" maxlength="200"
                                               ng-model="addUpdateConsentTemplateObj.ConsentFormObj"
                                               placeholder="Search Consent Form"
                                               ng-change="changesearchConsentForm(addUpdateConsentTemplateObj.ConsentFormObj)"
                                               quotes-restrict enter-directive />
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-lg-12">
                                    <table class="table table-border-bottom m-0">
                                        <tbody>
                                            <tr ng-repeat="item in Consentformlist">
                                                <td>
                                                    <div class="checkbox cn">
                                                        <label>
                                                            <input name="checkbox-1" type="checkbox" ng-model="item.IsSelected" ng-click="pushConsentItem(item)">
                                                            <span class="checkbox-material">
                                                                <span class="check"></span>
                                                            </span>
                                                            <small class="text-s14w500c000 m-l-5">
                                                                {{item.DocumentName}}
                                                            </small>
                                                        </label>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="referal-container">
                        <div class="referal-head referal-head-lb">
                            <h4>Selected Consents</h4>
                        </div>
                        <div class="referal-body">
                            <table class="table table-border-bottom m-0">
                                <tbody>
                                    <tr ng-repeat="item in selectedConsents | filter:{DeleteInd:'N'}">
                                        <td>
                                            {{item.DocumentName}}
                                        </td>
                                        <td class="text-center">
                                            <a class="cur-poiter"><i class="ehr-delete aside-icon-ros" data-tooltip="Delete" ng-click="removeConsentTemplateitem(item)"></i></a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6 text-right">
                        <div class="checkbox cn">
                            <label>
                                <input name="checkbox-1" type="checkbox" ng-model="addUpdateConsentTemplateObj.IsPrimary" ng-true-value="'Y'" ng-false-value="'N'">
                                <span class="checkbox-material">
                                    <span class="check"></span>
                                </span>
                                <small class="text-s14w500c000 m-l-5">
                                    Primary
                                </small>
                            </label>
                        </div>
                    </div>
                    <div class="col-lg-6 dis-flex align-items-center justify-content-end grid-gap-10">
                        <button class="btn__xl-- btn__C71D27--o" ng-click="ClearDetails()"><i class="action__icons--1 action__clear--"></i>{{ 'CLEAR' | translate}} </button>
                        <button class="btn__xl-- btn__1d5558--f" ng-hide="addUpdateConsentTemplateObj.ConsentTemplateId != 0" ng-click="SaveAddUpdateConsentTemplateDetails()"><i class="action__icons--1 action__save--"></i>{{ 'SAVE' | translate}}</button>
                        <button class="btn__xl-- btn__1d5558--f" ng-hide="addUpdateConsentTemplateObj.ConsentTemplateId == 0" ng-click="SaveAddUpdateConsentTemplateDetails()"><i class="action__icons--1 action__update--"></i>{{ 'UPDATE' | translate}}</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
