<div class="modal-body p-0 ng-scope">
    <div class="row p-10">
        <div class="col-lg-12">
            <div class="dis-flex align-items-center justify-space-between border-bottom">
                <div>
                    <h1 class="text-ocularhist">Add Study</h1>
                </div>
                <div class="dis-flex align-items-center m-l-10 m-b-10">
                    <button class="btn btn-discard-us m-r-5" ng-click="closeuib()">Close</button>
                    <button class="btn btn-lg btn-save-us" ng-click="addUpdatePatientImageStudy()">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-body p-5">
    <div class="row">
        <div class="col-lg-12">
            <table class="table table-bordered m-b-0">
                <thead>
                    <tr>
                        <th width="10%">Select</th>
                        <th width="10%">Date</th>
                        <th width="10%">Mod</th>
                        <th>Order Description</th>
                        <th>Provider</th>
                        <th>RP ID</th>
                        <th>Study UID</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in PatientOrdersArray">
                        <td>
                            <div class="checkbox cn">
                                <label>
                                    <input name="checkbox-po" type="checkbox" ng-model="item.IsSelected" ng-change="changeOrderSelected(item)">
                                    <span class="checkbox-material">
                                        <span class="check"></span>
                                    </span>
                                </label>
                            </div>
                        </td>
                        <td>
                            {{item.OrderDate | date:"MM-dd-yyyy" }}
                        </td>
                        <td>{{item.ModalityName}}</td>

                        <td>
                            <p class="m-b-0">
                                {{item.ProcedureName}} - {{item.OrganName}}
                            </p>
                        </td>
                        <td>
                            <p class="m-b-0">
                                Dr. {{item.AppointmentDoctor}}
                            </p>
                        </td>
                        <td>
                            <p class="m-b-0">

                            </p>
                        </td>
                        <td>
                            <p class="m-b-0">

                            </p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

        <div class="col-lg-12">
            <table class="table tableno-bordered m-b-0">
                <tbody>
                    <tr>
                        <td class="valign-top">
                            <div class="ehr-input  pop-ehr-input">
                                <label>Study Name</label>
                                <input type="text" class="form-control" ng-model="addupdateImgStudyReqObj.ImageStudyName" />
                            </div>
                        </td>
                        <td class="valign-top">
                            <div class="ehr-input  pop-ehr-input">
                                <label>Modality <em>*</em></label>
                                <select class="form-control" ng-model="addupdateImgStudyReqObj.ModalityId" ng-options="option.ModalityId as option.ModalityName+' ('+option.ModalityShortName+')' for option in ModalityArray">
                                    <option value="" disabled="disabled">select</option>
                                </select>
                            </div>
                        </td>
                        <!--<td class="valign-top">
                            <div class="ehr-input  pop-ehr-input">
                                <label>Investigation <em>*</em></label>-->
                                <!--<select class="form-control" ng-model="addupdateImgStudyReqObj.InvestigationId" ng-options="option.InvestigationId as option.InvestigationName for option in InvestigationMainsArray">
        <option value="">select</option>
    </select>-->

                                       ng-model="addupdateImgStudyReqObj.InvestigationObj"
                                       typeahead-min-length="0"

                                       typeahead-template-url="orgDfProceduresdf.html"
                                       ng-change="onInvProcedureChange(addupdateImgStudyReqObj.InvestigationObj)"

                                    </a>

                            </div>
                        </td>-->
                        <td class="valign-top">
                            <div class="ehr-input  pop-ehr-input">

                                <select class="form-control" ng-model="addupdateImgStudyReqObj.DoctorId" ng-options="option.DoctorID as option.FullName for option in DoctorListArray">
                                    <option value="">select</option>

                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4">
                            <div class="ehr-input  pop-ehr-input">
                                <label>Description</label>
                                <textarea class="form-control" rows="2" ng-model="addupdateImgStudyReqObj.ImageStudyDescription"></textarea>
