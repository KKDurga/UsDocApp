

    <div class="row">
        <div class="col-lg-12">
            <section class="eh-panel b-0">
                <div class="eh-header bg-white justify-space-between align-items-center">
                    <fieldset>
                        <div class="dis-inline-block">
                            <input type="radio" class="radio-custom width-0" id="NurseEyeDrops" value="EyeDrops" ng-model="IntraOpObj.Ordersobj.Type">
                            <label for="NurseEyeDrops" class="radio-custom-label cur-poiter text-s12w500C068cb0">Eye Drops</label>
                        </div>
                        <div class="dis-inline-block">
                            <input type="radio" class="radio-custom width-0" id="NurseInjections" value="Injections" ng-model="IntraOpObj.Ordersobj.Type">
                            <label for="NurseInjections" class="radio-custom-label cur-poiter text-s12w500C068cb0">Injections</label>
                        </div>
                    </fieldset>


                    <div class="width-40 m-l-10 pos-relative" ng-show="IntraOpObj.Ordersobj.Type =='EyeDrops'">
                        <input type="text" class="input-color icons-search form-control"
                               ng-model="IntraOpObj.Ordersobj.EyeDropsObj"
                               typeahead-focus-on-select="false"
                               typeahead-min-length="0"
                               typeahead-on-select="PushfreqMedicalItems(IntraOpObj.Ordersobj.EyeDropsObj,IntraOpObj.Ordersobj.Type)"
                               placeholder="Enter EyeDrops "
                               uib-typeahead="Medlist as Medlist.MedicineName for Medlist in getOrgMedicines($viewValue)" />
                    </div>
                    <div class="width-40 m-l-10 pos-relative" ng-show="IntraOpObj.Ordersobj.Type ==('Injections')">
                        <input type="text" class="input-color icons-search form-control"
                               ng-model="IntraOpObj.Ordersobj.Injectionsobj"
                               typeahead-focus-on-select="false"
                               typeahead-min-length="0"
                               typeahead-on-select="PushfreqMedicalItems(IntraOpObj.Ordersobj.Injectionsobj,IntraOpObj.Ordersobj.Type)"
                               placeholder="Enter Injections"
                               uib-typeahead="Medlist as Medlist.MedicineName for Medlist in getOrgMedicines($viewValue)" />
                    </div>
                    <div class="m-l-10">
                        <!--<button class="btn btn-ehnote-outline">Load from Previous</button>-->
                        <select class="form-control"
                                ng-options="Ditem as Ditem.TemplateName for Ditem in TemplatesArray"
                                ng-model="Orderstmpltobj.SelectedTemplateName"
                                ng-change="ChangesIntraOpMedicationTemp(Orderstmpltobj.SelectedTemplateName)">
                            <option value="" disabled>Template</option>
                        </select>
                    </div>
                    <ul class="us-controls m-l-10">
                        <li>
                            <!--<a href="javascript:;">Add as Template</a>-->
                            <div class="dis-flex pull-right">
                                <input type="text" class="bg-dbf6ff form-control btr-radius bbr-radius" ng-model="IntraOpObj.Ordersobj.TemplateName" placeholder="Template Name" />
                                <button class="btn-eh-dark btn m-r-10 btl-radius bbl-radius" ng-click="SaveMedicationTemplates()">Save</button>
                            </div>
                        </li>                       
                    </ul>
                    <ul class="us-controls">
                        <li>
                            <button class="btn btn-save-us" ng-click="SaveIntraMedication()">Save</button>
                        </li>
                        <li>
                            <button class="btn btn-discard-us m-r-5" ng-click="close()">Close</button>
                        </li>
                    </ul>
                </div>                
                <div class="eh-body">
                    <div class="row">
                        <div class="col-lg-12">

                            <table class="table tableno-bordered m-b-0 tableno-padding">
                                <thead ng-show="(IntraOpObj.Ordersobj.PatientAscEyeDrops|filter:{DeleteInd: 'N'}).length>0">
                                    <tr>
                                        <td colspan="11" class="bg-dfdfdf">
                                            <span class="dis-block text-s12w600C000 fs-16">Eye Drops</span>
                                        </td>
                                    </tr>
                                </thead>
                                <tbody ng-repeat="item in IntraOpObj.Ordersobj.PatientAscEyeDrops|filter:{DeleteInd: 'N'} track by $index">

                                    <tr>
                                        <td colspan="4">
                                            <span class="text-s14w500c000 ng-binding">{{item.MedicationName}}</span>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Dosage</label>
                                                <input type="text" ng-model="item.Dosage" maxlength="6" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Route</label>
                                                <select ng-model="item.RouteId"
                                                        ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in RouteArray"
                                                        ng-change="ChangeType(item.RouteId,item,'Route')">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Time</label>
                                                <div class="ehr-input-group">
                                                    <input type="text" ng-model="item.MedicationTime" />
                                                    <!--<select>
                                    <option>AM</option>
                                    <option>PM</option>
                                </select>-->
                                                    <button ng-click="Gettime(item,'Drops')"><i class="far fa-clock"></i></button>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Irrigation</label>
                                                <input type="text" ng-model="item.Irrigation" maxlength="10" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Equipment</label>
                                                <select ng-model="item.EquipmentId"
                                                        ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in Equipmentlist">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td class="valign-middle">
                                            <a class="actions-black" href="javascript:;" ng-click="AddEyeDropRemarks(item)" tooltip-placement="bottom-right" uib-tooltip="Notes">
                                                <i class="fas fa-lg fa-file-medical"></i>
                                            </a>
                                        </td>
                                        <td class="text-center valign-middle">
                                            <a href="javascript:;" ng-click="DelectMedicationitem(item)">
                                                <img src="img/close-red.svg" width="17" class="m-t-15" />
                                            </a>
                                        </td>
                                    </tr>
                                    <tr ng-show="item.IsShowNotes === true">
                                        <td colspan="7">
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Notes</label>
                                                <textarea class="msd-elastic: \n;" type="text" ng-model="item.Remarks" placeholder="Enter Notes" maxlength="500" />
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>

                            </table>
                            <table class="table tableno-bordered m-b-0 tableno-padding">
                                <thead ng-show="(IntraOpObj.Ordersobj.PatientAscInjections|filter:{DeleteInd: 'N'}).length>0">
                                    <tr>
                                        <td colspan="11">
                                            <span class="dis-block text-s12w600C000 fs-16">Injections</span>
                                        </td>
                                    </tr>
                                </thead>
                                <tbody ng-repeat="item in IntraOpObj.Ordersobj.PatientAscInjections|filter:{DeleteInd: 'N'} track by $index">
                                    <tr>
                                        <td colspan="4">
                                            <span class="text-s14w500c000 ng-binding">{{item.MedicationName}}</span>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Dosage</label>
                                                <input type="text" ng-model="item.Dosage" maxlength="6" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Route</label>
                                                <select ng-model="item.RouteId"
                                                        ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in RouteArray"
                                                        ng-change="ChangeType(item.RouteId,item,'Route')">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Time</label>
                                                <div class="ehr-input-group">
                                                    <input type="text" ng-model="item.MedicationTime" />
                                                    <!--<select>
                                    <option>AM</option>
                                    <option>PM</option>
                                </select>-->
                                                    <button ng-click="Gettime(item,'Injections')"><i class="far fa-clock"></i></button>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Irrigation</label>
                                                <input type="text" ng-model="item.Irrigation" maxlength="10" />
                                            </div>
                                        </td>
                                        <td>
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Equipment</label>
                                                <select ng-model="item.EquipmentId"
                                                        ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in Equipmentlist">
                                                    <option value="">Select</option>
                                                </select>
                                            </div>
                                        </td>
                                        <td>
                                            <a class="actions-black" href="javascript:;" ng-click="AddInjectionsRemarks(item)" tooltip-placement="bottom-right" uib-tooltip="Notes">
                                                <i class="fas fa-file-medical"></i>
                                            </a>
                                        </td>
                                        <td class="text-center">
                                            <a href="javascript:;" ng-click="DelectMedicationitem(item)">
                                                <img src="img/close-red.svg" width="17" class="m-t-15" />
                                            </a>
                                        </td>
                                    </tr>
                                    <tr ng-show="item.IsShowinjectionNotes === true">
                                        <td colspan="7">
                                            <div class="pop-ehr-input ehr-input">
                                                <label>Notes</label>
                                                <textarea class="msd-elastic: \n;" type="text" ng-model="item.Remarks" placeholder="Enter Notes" maxlength="500" />
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                        </div>
                        <div class="col-lg-12 text-center">
                            <div class="billing-cominsoon m-t-20"  ng-show="(IntraOpObj.Ordersobj.PatientAscInjections.length==0 && IntraOpObj.Ordersobj.PatientAscEyeDrops.length==0)">
                                <img src="img/no-data/no-data-icon.png">
                                <div class="msg m-t-20">
                                    <p class="nodata-txt-line2">
                                        No Data.
                                    </p>
                                </div>
                            </div>
                        </div>


                      


                    </div>
                </div>
            </section>
        </div>
    </div>
