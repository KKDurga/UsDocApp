<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Surgery  Staff</h1>
        <div class="asc-patient-profile" ng-if="false">
            <ul>
                <li>
                    <img image-viewer ng-if="cacheStorageItem.PatientImageS3URL != ''" src="{{cacheStorageItem.PatientImageS3URL}}" />
                    <img ng-if="cacheStorageItem.PatientImageS3URL == ''" src="img/sprite-sheet/user-square.svg" />
                    <p class="text-capitalize" title="{{cacheStorageItem.PatientName}}">{{cacheStorageItem.PatientName}}</p>
                </li>
                <li>
                    <span>MR No.:</span>
                    <label>{{cacheStorageItem.PatientDisplayId}}</label>
                </li>
                <li>
                    <span>Sex:</span>
                    <label>{{cacheStorageItem.Gender}}</label>
                </li>
                <li>
                    <span>Age:</span>
                    <label>{{cacheStorageItem.Age}}</label>
                </li>
                <li>
                    <span>DOB:</span>
                    <label>{{cacheStorageItem.PatientDOB | date:"MM-dd-yyyy"}}</label>
                </li>
            </ul>
        </div>
        <div class="d__f-- gap__10--x ai__c-- ml__10--">
            <div class="d__f-- ai__c-- gap__5-- bs__solid-- bw__1-- border__1D5558-- p__5-- bradius-5" popover-template="'templates/UIBPopovers/patientDetailsPopover.html'" popover-data="{detailsSummary : PaitentDetails, postalAddressSummary : PostalAddressSummaryObj, permanentAddressSummary : PermanentAddressSummaryObj,patientMobileNumber : PatientMobileNumber , patientOfficeNumber : PatientOfficeNumber,demographicSummary : DemographicSummaryObj}" popover-class="profile__popover" dynamic-click-popover-placement ng-click="patiendetilsopen()">
                <img ng-if="cacheStorageItem.PatientImageS3URL != ''" width="28" height="28" image-viewer src="{{cacheStorageItem.PatientImageS3URL}}" />
                <img ng-if="cacheStorageItem.PatientImageS3URL == ''" width="28" height="28" src="img/sprite-sheet/user-square.svg" />
                <div class="vs__list-- gap__0--">
                    <span>{{cacheStorageItem.PatientName}}</span>
                    <span><span class="fw__4-- tc__656565--">MR No : </span>{{cacheStorageItem.PatientDisplayId}}</span>
                </div>
                <span><i class="icons__w16-- info__w16--f"></i></span>
            </div>
            <button class="btn__lg-- btn__1d5558--f" ng-click="SaveSurgeryStaff()">Save</button>
            <a class="btn__close--" ng-click="closeuib()">
                <i class="close__w32--"></i>
            </a>
        </div>
    </div>
    <div class="modal__body--">
        <div class="row">
            <div class="col-lg-12">
                <table class="table tableno-bordered tableno-padding m-b-20">
                    <tbody>
                        <tr>
                            <td width="25%">
                                <div class="form__group">
                                    <label>Surgeon</label>
                                    <select ng-model="SurgerystaffObj.SurgeonId"
                                            ng-options="item.DoctorID as item.SecondUserFullName for item in AllDoctorList" disabled>
                                        <option value="">Select</option>
                                    </select>

                                </div>
                            </td>
                            <td width="25%">
                                <div class="form__group">
                                    <label>Additional Doctor</label>
                                    <select ng-model="SurgerystaffObj.CoSurgeonId"
                                            ng-options="item.DoctorID as item.FullName for item in AllAdditionalDoctorList">
                                        <option value="">Select</option>
                                    </select>

                                </div>
                            </td>
                            <td class="" width="25%">
                                <div class="form__group">
                                    <label>Technician</label>
                                    <select ng-model="SurgerystaffObj.TechnicianId"
                                            ng-options="item.DoctorID as item.FullName for item in AllTechnicianList">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </td>
                            <td width="25%">
                                <div class="form__group">
                                    <label>Anesthesiologist</label>
                                    <select ng-model="SurgerystaffObj.AnesthesistId"
                                            ng-options="item.DoctorID as item.FullName for item in AllAnesthesistsList">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </td>

                        </tr>
                        <tr>
                            <td>
                                <div class="form__group">
                                    <label>Circulating Nurse</label>
                                    <select ng-model="SurgerystaffObj.NurseId"
                                            ng-options="item.DoctorID as item.FullName for item in AllNurseList">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </td>
                            <td>
                                <div class="form__group">
                                    <label>Additional Staff</label>
                                    <select ng-model="SurgerystaffObj.AdditionalStaffId"
                                            ng-options="item.DoctorID as item.FullName for item in AllTechnicianNurseList">
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
