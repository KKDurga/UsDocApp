<div class="dis-flex flex-direction-column grid-gap-10 z-9999">
    <div class="dis-flex">
        <p class="text-s12w500c000 m-0">Booked Appointments for<span class="font-weight-600 text-ehnote"> {{SlotbasedPatientObj.slottime}}  &  {{SlotbasedPatientObj.AppointmentDate}}</span></p>
    </div>
    <div>
        <table class="table tableno-bordered m-0 tableno-padding">
            <tbody>
                <tr ng-repeat="item in SlotbasedPatientObj.patientlistbytimeslot">
                    <td>
                        <div class="dis-flex align-items-center grid-gap-10">
                            <img src="img/sprite-sheet/user-square.svg" width="36" height="36" class="bradius-20" ng-if="item.S3URL==''" />
                            <img src="{{item.S3URL}}" width="36" height="36" class="bradius-20" ng-if="item.S3URL!=''" />
                            <div class="vs__list--1 min-w-0">
                                <p class="font-weight-500">{{item.FullName}}</p>
                                <span>{{item.Mrno}}</span>
                            </div>
                        </div>
                    </td>
                    <td class="valign-middle text-center">
                        <div class="dis-flex flex-direction-column align-flex-start">
                            <span class="text-s13w5d1d1d1 font-weight-400 color-656565">{{item.DOB|date:'MM-dd-yyyy'}}</span>
                            <span class="status__green--">{{item.AppointmentStatusName}}</span>
                            <!--<span class="status__green--" ng-if="item.AppointmentStatus=='R'">Reschedule</span>
                            <span class="status__green--" ng-if="item.AppointmentStatus=='C'">Cancle</span>-->
                        </div>
                    </td>
                    <td class="valign-middle text-center">
                        <span class="text-s13w5d1d1d1 font-weight-400 color-656565">{{item.UsMobileNoFormate}}</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
