
<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Chat History</h1>
        <div class="asc-patient-profile" ng-if="false">
            <ul>
                <li>
                    <img src="img/sprite-sheet/user-square.svg">
                    <p title="{{PatientObj.PatientName}}">{{PatientObj.PatientName}}</p>
                </li>
                <li>
                    <span>MR No.:</span>
                    <label>{{PatientObj.PatientMrno}}</label>
                </li>
                <li>
                    <span>Sex:</span>
                    <label>{{PatientObj.Sex}}</label>
                </li>
                <li>
                    <span>Age:</span>
                    <label>{{PatientObj.Age}}</label>
                </li>
            </ul>
        </div>
        <ul class="us-controls">
            <li>
                <div class="d__f-- ai__c-- gap__5-- bs__solid-- bw__1-- border__1D5558-- p__5-- bradius-5" popover-template="'templates/UIBPopovers/patientDetailsPopover.html'" popover-data="{detailsSummary : PaitentDetails, postalAddressSummary : PostalAddressSummaryObj, permanentAddressSummary : PermanentAddressSummaryObj,patientMobileNumber : PatientMobileNumber , patientOfficeNumber : PatientOfficeNumber,demographicSummary : DemographicSummaryObj}" popover-class="profile__popover" dynamic-click-popover-placement ng-click="patiendetilsopen()">
                    <img ng-if="PatientObj.PatientImageS3URL != ''" width="28" height="28" image-viewer src="{{PatientObj.PatientImageS3URL}}" />
                    <img ng-if="PatientObj.PatientImageS3URL == ''" width="28" height="28" src="img/sprite-sheet/user-square.svg" />
                    <div class="vs__list-- gap__0--">
                        <span>{{PatientObj.PatientName}}</span>
                        <span><span class="fw__4-- tc__656565--">MR No : </span>{{PatientObj.PatientDisplayId}}</span>
                    </div>
                    <span><i class="icons__w16-- info__w16--f"></i></span>
                </div>
            </li>
            <li>
                <a class="btn__close--" ng-click="uibclose2()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body--">
        <div class="position__relative-- height__100--">
            <div class="adjustable-position">
                <div class="row" ng-if="ChatHistoryInfo.length > 0">
                    <div class="col-lg-12" ng-repeat="message in ChatHistoryInfo">
                        <div class="ehnote-messages m-l-auto" ng-hide="message.MsgBody === ''">
                            <p ng-bind-html="message.MsgBody | nl2br"></p>
                            <div class="message-info">
                                <!--<label>(No of Characters / Msg Count):</label>-->
                                <label class="info-value">{{message.MsgBody.length}} / {{message.MessageQuantity}}</label>
                                <label class="m-l-10"> {{ message.CreatedDt | date:'MM-dd-yyyy h:mm a' }} <span class="tick tick-sent">✓✓</span></label>
                            </div>
                        </div>
                        <div class="ehnote-messages" ng-hide="message.SMSRespondingData === '' ||message.SMSRespondingData === null|| message.SMSRespondingData === '5'">
                            <p ng-bind-html="message.SMSRespondingData | nl2br"></p>
                            <div  class="message-info">
                                <!--<label>(No of Characters / Msg Count):</label>-->
                                <label class="info-value">{{message.SMSRespondingData.length}} / {{message.MessageQuantity}}</label>
                                <label>{{ message.CreatedDt | date:'MM-dd-yyyy h:mm a' }}<span class="tick tick-sent">✓✓</span> </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div ng-if="ChatHistoryInfo.length === 0">
                    No chat history
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .ehnote-messages {
        display: flex;
        flex-direction: column;
        grid-gap: 6px;
        max-width: 60%;
        padding: 8px;
        border-radius: 6px;
        background-color: #cfe2f3;
        border: 1px solid #a7c4dd;
        margin-bottom: 6px;
       /* width: 500px;*/
    }
        .ehnote-messages > p {
            margin: 0;
            color: #525252;
            font-size: 12px;
            font-style: normal;
            font-weight: 600;
            line-height: normal;
        }
    .message-info {
        align-items: center;
        color: #333;
        text-align: right;
    }
    .info-value {
        background-color: #f0f0f0;
        border-radius: 4px;
        padding: 2px 6px;
        font-family: monospace;
        color: #555;
    }
</style>
