<div class="row">
    <div class="col-lg-12">
        <table class="table table-bordered tableno-padding m-b-0">
            <tbody>
                <tr ng-if="BasicInfoPoPUpData[0].Height!=''">
                    <td>
                        <span>Height</span>
                    </td>
                    <td>
                        <label>{{BasicInfoPoPUpData[0].Height}} <span ng-show="BasicInfoPoPUpData[0].HeightUnitName != ''">{{BasicInfoPoPUpData[0].HeightUnitName}}</span></label>
                    </td>
                </tr>
                <tr ng-if="BasicInfoPoPUpData[0].Weight!=''">
                    <td>
                        <span>Weight</span>
                    </td>
                    <td>
                        <label>{{BasicInfoPoPUpData[0].Weight}} <span ng-show="BasicInfoPoPUpData[0].WeightUnitName != ''">{{BasicInfoPoPUpData[0].WeightUnitName}}</span></label>
                    </td>
                </tr>
                <tr ng-if="cacheStorageItem.Gender!=''">
                    <td>
                        <span>Sex</span>
                    </td>
                    <td>
                        <label>{{cacheStorageItem.Gender}}</label>
                    </td>
                </tr>
                <tr ng-if="cacheStorageItem.Age!=''">
                    <td>
                        <span>Age</span>
                    </td>
                    <td>
                        <label>{{cacheStorageItem.Age}}</label>
                    </td>
                </tr>
                <tr ng-if="cacheStorageItem.RaceName!=''">
                    <td>
                        <span>Race</span>
                    </td>
                    <td>
                        <label>{{cacheStorageItem.RaceName}}</label>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
