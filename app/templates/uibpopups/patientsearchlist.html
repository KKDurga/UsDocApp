<div class="patientsearchclass-content">
    <ul>
        <!--ng-class="PatientsArray.length == 0 ? 'active' : ''"-->
        <li ng-show="PatientsArray.length == 0">
            <button ng-click="NewRegisterPatient(PatientSearch.SearchText);">Add New Patient</button>
        </li>
        <li ng-class="{ 'active': patSearchType === 1 || patSearchType === 2 || patSearchType === 3 || patSearchType === 4 || patSearchType === 5 }">
            <button>Search All Patients</button>
        </li>
    </ul>

    <ul>
        <li ng-class="patSearchType === 1 ? 'active' : ''">
            <button ng-model="patSearchType" ng-click="ChangePatientSearch(1);patSearchType=1">{{ 'NAME' | translate}}</button>
        </li>
        <li ng-class="patSearchType === 2 ? 'active' : ''">
            <button ng-click="ChangePatientSearch(2);patSearchType=2">{{ 'MOBILENO' | translate}}</button>
        </li>
        <li ng-class="patSearchType === 3 ? 'active' : ''">
            <button ng-click="ChangePatientSearch(3);patSearchType=3">{{ 'MRNO' | translate}}</button>
        </li>
        <!--<li ng-class="patSearchType === 4 ? 'active' : ''">
            <button ng-click="ChangePatientSearch(4);patSearchType=4">{{ 'OLDMRNO' | translate}}</button>
        </li>-->
        <li ng-class="patSearchType === 5 ? 'active' : ''">
            <button ng-click="ChangePatientSearch(5);patSearchType=5">{{ 'DOB' | translate}}</button>
        </li>
    </ul>
    <!--<input type="text" class="" placeholder="Search" />-->
    <!--<input type="text" class="" autocomplete="off" ng-if="patSearchType === 1" placeholder="{{ 'SEARCHBYNAME' | translate}}" ng-model="PatientSearch.SearchText" ng-change="SearchByTextOPHeader(PatientSearch.SearchText,patSearchType)" ng-model-options="{ debounce: 500 }"/>-->
    <input type="text" placeholder="Search Patient" class="" autocomplete="off" ng-if="patSearchType === 1" ng-model="PatientSearch.SearchText" ng-enter="ClickOPPatientSearchIcon();" ng-model-options="{ debounce: 500 }" ng-focus="patSearchType === 1" allowhyphen />
    <input type="text" placeholder="Search Patient" class="" autocomplete="off" ng-if="patSearchType === 2" ng-model="PatientSearch.SearchText" ng-enter="ClickOPPatientSearchIcon();" ng-focus="patSearchType === 2" allowhyphen />
    <input type="text" placeholder="Search Patient" class="" autocomplete="off" ng-if="patSearchType === 3" ng-model="PatientSearch.SearchText" numbers-only ng-enter="ClickOPPatientSearchIcon();" ng-focus="patSearchType === 3" />
    <!--<input type="text" class="" autocomplete="off" ng-if="patSearchType === 4" ng-model="PatientSearch.SearchText" ng-enter="ClickOPPatientSearchIcon();" ng-focus="patSearchType === 4" allowhyphen />-->
    <input type="text" class="" ng-model="PatientSearch.SearchText" autocomplete="off" ng-if="patSearchType === 5" dob-format placeholder="MM-DD-YYYY" maxlength="10" ng-enter="ClickOPPatientSearchIcon();" ng-focus="patSearchType === 5" />
    <ol ng-show="ShowPatientListDrop">
        <li ng-repeat="patientitem in patientpushval" ng-click="getPatientCaseHistoryItem(patientitem)" ng-show="PatientsArray.length > 0">
            <div class="border-right flex m-r-5 spaceellepies">
                <!--<span ng-show="patientitem.S3URL ==''" style="background:{{patientitem.colors}}">{{patientitem.FullName | limitTo:2}} </span>-->
                <p ng-bind="patientitem.FullName" title="{{patientitem.FullName}}"></p>
                <span ng-hide="patientitem.patientdisplayid == 0">{{ 'MRNO' | translate}}  : {{patientitem.patientdisplayid}}</span>
                <span ng-hide="patientitem.OldMrno ==''"> |  {{ 'OLDMRNO' | translate}} : {{patientitem.OldMrno}}</span>
                <span ng-hide="patientitem.DOB == 0 || patientitem.DOB == null" class="mb-0">{{ 'DATEBIRTH' | translate}} : {{patientitem.DOB | date:'MM-dd-yyyy'}}</span>
                <span> - {{patientitem.Gender}}</span>
            </div>
            <div class="w-70">
                <label>ASC Waiting</label>
            </div>
        </li>
        <li ng-show="PatientsArray.length == 0" class="text-center">
            <div class="billing-cominsoon dis-block m-auto">
                <img src="img/no-data/no-data-icon.png">
                <div class="msg">
                    <p class="nodata-text">{{ 'OOPS' | translate}}</p>
                    <p class="nodata-txt-line2">
                        {{ 'LOOKSLIKETHEREISNOPATIENTS' | translate}}
                    </p>
                </div>
            </div>
            <!--<button class="text-center btn-block btn-ehnote cur-poiter" ng-click="NewRegisterPatient(PatientSearch.SearchText);"> {{ 'ADDPATIENT' | translate}}</button>-->
        </li>
    </ol>
</div>
