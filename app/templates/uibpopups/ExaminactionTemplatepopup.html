<div class="modal-header">
    <h4 class="modal-title">Templates</h4>
    <button type="button" class="btn btn-link" ng-click="uibclose()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body overflow-x-hideen overflow-y-scroll" style="height: calc(100vh - 32px) ">
    <uib-accordion close-others="oneAtATime">
        <div ng-repeat="Item in TempExamTemplateArray">
            <div uib-accordion-group class="panel-default" is-open="status.open">
                <uib-accordion-heading>
                    <label class="cur-poiter">
                        <input type="checkbox" value="" ng-model="Item.IsChecked" ng-click="ChangesTempData(Item)" class="checkbox">
                        <span class="lbl"></span>
                        <span class="text-s12w500C068cb0 lh-2-0 fs-14 ng-binding">{{ Item.TemplateName }}</span>
                    </label>
                    <i class="pull-right glyphicon" ng-class="{'glyphicon-chevron-down': status.open, 'glyphicon-chevron-right': !status.open}"></i>
                </uib-accordion-heading>
                <table class="referral-table table-bordered" ng-if="subexaminationtab == 1">
                    <thead>
                        <tr>
                            <th colspan="2">
                                <label class="eh-od">OD</label>
                            </th>
                            <th colspan="2">
                                <label class="eh-os">OS</label>
                            </th>
                        </tr>
                    </thead>
                    <tbody ng-repeat="SubItem in Item.AnteriorArray">
                        <tr>
                            <td>
                                <label> {{ SubItem.InvestigationDesc }}</label>
                            </td>
                            <td>
                                <ul class="flex-flow-ulli-mb0">
                                    <li ng-repeat="ar in SubItem.AnteriorRemarks| filter:{'OrganId':1} track by $index">
                                        <span>
                                            {{ ar.Remarks }}
                                            <span ng-if="SubItem.AnteriorRemarks.length > 2">,</span>
                                        </span>
                                    </li>
                                </ul>
                            </td>
                            <!--<td ng-repeat="ar in SubItem.AnteriorRemarks| filter:{'OrganId':1} track by $index">
                                <span>
                                    {{ ar.Remarks }}
                                    <span ng-if="ar.Remarks.length > 2">,</span>
                                </span>
                            </td>-->
                            <td>
                                <label> {{ SubItem.InvestigationDesc }}</label>
                            </td>
                            <td>
                                <ul class="flex-flow-ulli-mb0">
                                    <li ng-repeat="arl in SubItem.AnteriorRemarks| filter:{'OrganId':2} track by $index">
                                        <span>
                                            {{ arl.Remarks }}
                                            <span ng-if="SubItem.AnteriorRemarks.length > 2">,</span>
                                        </span>
                                    </li>
                                </ul>
                            </td>
                            <!--<td ng-repeat="arl in SubItem.AnteriorRemarks| filter:{'OrganId':2} track by $index">
                                <span>
                                    {{ arl.Remarks }}
                                    <span ng-if="arl.Remarks.length > 2">,</span>
                                </span>
                            </td>-->
                        </tr>
                    </tbody>
                </table>
                <table class="referral-table table-bordered" ng-if="subexaminationtab == 2">
                    <thead>
                        <tr>
                            <th>
                                <label class="eh-od">OD</label>
                            </th>
                            <th>
                                <label class="eh-os">OS</label>
                            </th>
                        </tr>
                    </thead>
                    <tbody ng-repeat="SubItem in Item.PosteriorArray">
                        <tr>
                            <td>
                                <span> {{ SubItem.InvestigationDesc }}</span>
                            </td>
                            <td>
                                <span> {{ SubItem.InvestigationDesc }}</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </uib-accordion>
</div>
