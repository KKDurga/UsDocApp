<div class="modal-header">
    <h4 class="modal-title"> Confirm </h4>
    <button type="button" class="btn btn-link" ng-click="cancelmaxslotBookAppointment();"><i class="fas fa-times"></i></button>
</div>

<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <div class="alert alert-warning" role="alert">
                <span ng-if="type == 1">Max limit reached for the selected slot.Do you wish to continue?</span>
                <span ng-if="type == 2">This slot does not match appointment visit reason.Do you wish to continue?</span>
                <span ng-if="type !== 1 && type !== 2">Maximum Appoitnment Slots Reached For the Doctor.Do you wish to continue?</span>
            </div>
        </div>
        <div class="col-lg-12 m-t-20">
            <div class="form-group">
                <label>Enter Notes to Unblock <em>*</em></label>
                <textarea rows="4" ng-model="MaxSlotObj.Remarks" class="form-control bookapt-textarea bg-f6f6f6 notes-border msd-elastic: \n" placeholder="{{ 'ENTERNOTES' | translate}}" maxlength="500"></textarea>
            </div>
        </div>
    </div>
</div>

<div class="modal-footer">
    <div class="row">
        <!--<div class="col-lg-12 pull-right">
            <button type="button" class="etn btn-ehnote-outline p-l-25 p-r-25" ng-click="ClearDetails();"> {{ 'CLEAR' | translate}}</button>
            <button type="button" class="etn btn-ehnote p-l-25 p-r-25" ng-click="SaveProfiledetails();"> {{ 'SAVE' | translate}}</button>
        </div>-->

        <div class="col-lg-12 m-t-10">
            <div class="row">
                <div class="col-lg-12 text-right m-b-10">
                    <button class="btn btn-danger p-l-25 p-r-25" ng-click="cancelmaxslotBookAppointment()">No</button>
                    <button class="btn btn-lg btn-success p-l-25 p-r-25" ng-click="continuemaxslotbookappointment()">Yes</button>
                </div>
            </div>
        </div>
    </div>
</div>
