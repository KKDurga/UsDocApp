<div>
    <div class="modal-common-dialog w-600">
        <div class="model-popup-header">
            <h4 class="modal-title" id="myModalLabel">Cancel Appointment</h4>
            <a id="close_popup" ng-click="closeCancelPopup()" class="light-font pull-right fclosepopup m-t-0">x</a>
        </div>
        <form name="Cancelform" class="bg-white" novalidate>
            <div class="form_wrapper">
                <div class="row">
                    <div class="col-md-12">
                        <div class="alert alert-danger mt-10">
                            <p> Are you sure  you want to cancel this appointment for {{Patientname}} </p>
                            <!--<p> Are you sure you want to cancel the appointment?</p>-->
                        </div>
                        <div class="form-group">
                            <table class="table tableno-bordered m-b-0">
                                <tbody>
                                    <tr>
                                        <td>
                                            <div class="form-group br-1-000">
                                                <img src="img/consultation/cancel-profile.svg" class="height-20" />
                                                {{Patientname}}
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group br-1-000">
                                                <img src="img/consultation/cancel-date.svg" class="height-20" />
                                                {{AppointmentDate_Time | date:'MMM dd yyyy'}}
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group br-1-000">
                                                <img src="img/consultation/cancel-time.svg" class="height-20" />
                                                {{AppointmentDate_Time | date:'hh:mm a'}}
                                            </div>
                                        </td>
                                        <td>
                                            <div class="form-group">
                                                <img src="img/consultation/cancel-doctor.svg" class="height-20" />
                                                {{DoctorFullName}}
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="form-group">
                            <label for="recipient-name" class="control-label">Reason for cancellation</label>

                            <select class="form-control" ng-model="CancelReason"
                                    ng-options="item as item.CancelReason for item in CancelAppointmentobj.CancelAppReason">
                                <option value="" ng-selected="true">Select Cancel Reason</option>
                                <!--<option ng-repeat="item in CancelAppointmentobj.CancelAppReason" value="{{item.CancelReason}}">{{item.CancelReason}}</option>-->
                            </select>
                            <!--<input type="text" class="form-control mt-10" ng-model="OtherCancelReason" ng-show="CancelReason == 'Others'" />-->
                            <input type="text" class="form-control mt-10" ng-model="OtherCancelReason" placeholder="{{ 'ENTEROTHERCANCELREASON' | translate}}" ng-hide="CancelReason == ''" />
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6">
                        <p class="m-0"><label>Send SMS To</label></p>
                        <div class="form-group">
                            <div class="checkbox cn mr-10">
                                <label>
                                    <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.sendDocSms" />
                                    <span class="checkbox-material">
                                        <span class="check"></span>
                                    </span>
                                    <small>Doctor</small>
                                </label>
                            </div>
                            <!-- / -->
                            <div class="checkbox cn">
                                <label>
                                    <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.sendPatientSms" />
                                    <span class="checkbox-material">
                                        <span class="check"></span>
                                    </span>
                                    <small>Patient</small>
                                </label>
                            </div>
                            <div class="checkbox cn">
                                <label>
                                    <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.IsSmsLanguageIdInd" />
                                    <span class="checkbox-material">
                                        <span class="check"></span>
                                    </span>
                                    <small>English</small>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <p class="m-0"><label>Send Email To</label></p>
                        <div class="form-group">
                            <div class="checkbox cn mr-10">
                                <label>
                                    <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.sendDocEmail" />
                                    <span class="checkbox-material">
                                        <span class="check"></span>
                                    </span>
                                    <small>Doctor</small>
                                </label>
                            </div>
                            <!-- / -->
                            <div class="checkbox cn">
                                <label>
                                    <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.sendPatientEmail" />
                                    <span class="checkbox-material">
                                        <span class="check"></span>
                                    </span>
                                    <small>Patient</small>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row pull-right cancel-app">
                    <div class="col-md-12 col-sm-12 col-xs-12 mb-10 mt-5">
                        <button class="btn danger-btn light-font" ng-click="closeCancelPopup()"> NO</button>
                        <button class="btn primary-btn" ng-click="UpdatePopup(Cancelform,CancelReason,OtherCancelReason)">YES </button>
                    </div>
                </div>
            </div>
            <div class="clearfix"></div>
        </form>
    </div>
</div>
