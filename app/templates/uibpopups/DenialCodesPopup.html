<div class="dis-flex flex-direction-column h-100">
    <div class="bg-EBEEF3 border-bottom p-6">
        <div class="dis-flex align-items-center justify-space-between">
            <h1 class="m-0 fs-14 black-text">Denial Codes</h1>

            <button class="btn__lg-- btn__C71D27--o" ng-click="uibclose()">
                Close
            </button>
        </div>
    </div>
    <div class="dis-flex flex-direction-column grid-gap-10 h-100 p-15">
        <div class="dis-flex align-items-center justify-content-end">
            <div class="dis-inline-block">
                <input class="input__style--1 icons-search" placeholder="Search" ng-model="Searchtxt" ng-change="SearchDenialCodes(Searchtxt)"/>
            </div>
        </div>
        <div class="p-6 h-100 border pos-relative bradius-5">
            <div class="table__style--1 adjustable-position h-100 b-0">
                <table class="table__bordered--lasttd table-striped">
                    <thead>
                        <tr>
                            <th width="15%">
                                <p>
                                    Code
                                </p>
                            </th>
                            <th>
                                <p>
                                    Description
                                </p>
                            </th>
                        </tr>
                    </thead>
                    <tbody ng-show="DenialCodesArray.length > 0">
                        <tr ng-repeat="ditem in DenialCodesArray track by $index">
                            <td>
                                <div class="dis-flex align-items-center grid-gap-5">
                                    <div class="checkbox">
                                        <label class="lh-1-0">
                                            <input name="checkbox-1" type="checkbox" class="checkbox" ng-model="ditem.IsSelected">
                                            <span class="checkbox-material">
                                                <span class="check"></span>
                                            </span>
                                            <small class="text-s14w500c000 pos-relative top-3 fs-12">{{ditem.DenialCode}}</small>
                                        </label>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <p class="fs-12 font-weight-500 text-black m-0 white-space-normal">{{ditem.DenialCodeDescription}}</p>
                            </td>
                        </tr>
                    </tbody>
                    <tbody ng-show="DenialCodesArray.length === 0">
                        <tr>
                            <td class="text-center" colspan="9">
                                <div class="row">
                                    <div class="col-lg-12 text-center">
                                        <div class="billing-cominsoon">
                                            <img src="img/no-data/no-settings.png">
                                            <div class="msg">
                                                <p class="">No Search Data Added Yet!</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="row">
                <div class="col-lg-12">
                    
                  
                </div>
            </div>
        </div>

        <!--<div class="dis-flex flex-direction-column grid-gap-5">            
                <h4 class="fs-14 font-weight-500 color-eHnote m-0">Add New Denial Code</h4>
                <div class="dis-flex align-items-center grid-gap-10">
                    <input class="form-control width-20" placeholder="Add New"/>
                    <input class="form-control" placeholder="Description"/>
                    <button class="btn__sm-- btn__008087--f">+Add</button>
                </div>
        </div>-->
        <div class="dis-flex align-items-center justify-content-end grid-gap-10 p-10">
 
                    <div class="checkbox">
                        <label class="lh-1-0">

                            <input name="checkbox-1" type="checkbox" class="checkbox" ng-model="isApplyForAllLineItems" />
                            <span class="checkbox-material">
                                <span class="check"></span>
                            </span>
                            <small class="text-s14w500c000 pos-relative top-3 fs-12">Apply For All Line Items</small>
                        </label>
                    </div>
                    <button class="btn__1d5558--o btn__lg--" ng-click="clearDenialCode()">Clear</button>
                    <button class="btn__1d5558--f btn__lg--" ng-click="saveDenialCodes(isApplyForAllLineItems)">Save</button>
              
          

        </div>
    </div>
</div>
