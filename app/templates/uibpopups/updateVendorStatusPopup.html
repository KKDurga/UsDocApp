<div class="modal-header">
    <h4 class="modal-title">Update Vendor Status</h4>
    <button type="button" class="btn btn-link" ng-click="closeVendorPopup()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12" ng-if="vendorUpdateReq.VendorStatusId===2">
            <div class="form-group">
                <label>Accept Remarks <em>*</em></label>
                <textarea class="form-control" ng-model="vendorUpdateReq.ApprovedRemarks" rows="2"></textarea>
            </div>

        </div>

        <div class="col-lg-12" ng-if="vendorUpdateReq.VendorStatusId===3">
            <div class="form-group">
                <label>Reject Remarks <em>*</em></label>
                <textarea class="form-control" ng-model="vendorUpdateReq.RejectRemarks" rows="2"></textarea>
            </div>

        </div>
    </div>
</div>
<div class="modal-footer">
    <button class="betn btn-light-green" ng-click="saveVendorStatus(vendorUpdateReq)"> Save </button>
</div>
