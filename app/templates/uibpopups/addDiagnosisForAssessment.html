<div class="modal-header">
    <h4 class="modal-title">Advised ICD-10 Diagnosis for {{InvestigationObj.Investigation}} - {{InvestigationObj.Investigationvalue}}</h4>
    <button class="close" ng-click="CancelDiagnosis()">&times;</button>
</div>
 
<div class="modal-body bg-gray p-t-10 p-b-10">
    <div class="row" ng-if="SearchDiagnosisList.length>0">
        <div class="col-lg-12">
            <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
                <thead>
                    <tr>
                        <th class="w-130 text-center">
                            ICD-10 Code
                        </th>
                        <th>
                             Description
                        </th>
                        <th class="w-80 text-center">
                            Add
                        </th>
                      
                    </tr>
                </thead>
                <tbody>                    
                    <tr ng-repeat="item in SearchDiagnosisList track by $index" >
                        <td>
                            <input type="text" class="form-control"  ng-model="item.ICD10CODE" disabled="disabled"/>
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.ICD10DIAGNAME" disabled="disabled"/>
                        </td>
                        <td>
                            <button class="btn btn-success btn-block" ng-click="AddDiagnosis(item)">
                                <i class="fas fa-plus"></i>
                            </button>
                        </td>
                        
                    </tr>
                   
                </tbody>
            </table>
        </div>
    </div>
     
    <div class="row" ng-if="SearchDiagnosisList.length===0">
        <div class="col-lg-12">
            <div class="billing-cominsoon text-center ng-scope">
                <img src="img/no-data/no-results-appointment.png">
                <div class="msg">
                    <p class="goback-text">No items selected</p>

                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-header" ng-if="SelectedDiagnosisList.length>0">
    <h4 class="modal-title">Added ICD-10 Code List</h4>
</div>
<div class="modal-body p-t-10 p-b-10" >
    <div class="row">
        <div class="col-lg-12" ng-if="SelectedDiagnosisList.length>0">
            <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
                <thead>
                    <tr>
                        <th class="w-80">
                            S.no
                        </th>
                        <th class="w-150">
                            ICD-10 Code
                        </th>
                        <th>
                            Description
                        </th>
                       
                        <th class="w-80 text-center">
                            Remove
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="kitem in SelectedDiagnosisList track by $index">
                        <td>
                            <div class="bg-new-light text-acdcode p-5">
                                {{$index+1}}
                            </div>
                        </td>
                        <td>
                            <div class="bg-new-light text-acdcode p-5">
                                {{kitem.ICD10CODE}}
                            </div>
                        </td>
                        <td>
                            <div class="bg-new-light text-acdcode p-5">
                                {{kitem.ICD10DIAGDESCRIPTION}}
                            </div>
                        </td>
                        
                        <td>
                            <button class="btn btn-outline-danger btn-block" ng-click="RemoveDiagnosis(kitem)">
                                <i class="fas fa-backspace text-ldanger"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>


      
    </div>
    <div class="row m-t-10">
        <div class="col-lg-12 text-center">
            <button type="button" class="etn btn-ehnote-outline p-l-25 p-r-25" ng-click="CancelDiagnosis()">Clear</button>
            <button type="button" class="etn btn-ehnote p-l-25 p-r-25 p-0" ng-click="SaveDiagnosis()">Save</button>
        </div>
    </div>
</div>
