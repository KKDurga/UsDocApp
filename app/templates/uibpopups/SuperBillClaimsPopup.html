                            <div class="col-lg-12">
                                <table class="table billDiagnosis-table">
                                    <tbody>
                                        <tr ng-repeat="item in DiagnosisListArray track by $index">

                                                        {{item.Comments}}

                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="section-ehnote">
                    <div class="ehnote-header">
                        <h1>Procedures</h1>
                    </div>
                    <div class="ehnote-body">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="table-responsive">
                                    <table class="table rxmedicationTable">
                                        <tbody class="activeedit" ng-repeat="item in mainBillingObject.BillingDetail track by $index">
                                            <tr>
                                                <td width="10%">
                                                    <div class="dis-flex">
                                                        <div class="w-80 m-r-5">
                                                            <label class="text-gray" title="Service From">Service</label>
                                                            <input type="text" class="form-control icons-calendar" ng-model="item.Service" datepickerforusformat placeholder="MM-DD-YYYY" />
                                                        </div>
                                                        <div class="w-80 m-r-5">
                                                            <label class="text-gray" title="Service Thru">Thru</label>
                                                            <input type="text" class="form-control icons-calendar" ng-model="item.Thru" datepickerforusformat placeholder="MM-DD-YYYY" />
                                                        </div>
                                                    </div>
                                                </td>
                                                <td width="30%">
                                                    <p class="complaint-text m-b-0">
                                                        <span style="font-size: 14px; color: #bd6f6f;">  {{item.ProcedureCode}} :</span> {{item.ProcedureName}}
                                                    </p>
                                                </td>
                                                <td>
                                                    <div class="dis-flex">
                                                        <div class="w-80 m-r-5">

                                                        </div>
                                                        <div class="w-110 m-r-5">
                                                            <label class="text-gray">Fees</label>

                                                        <div class="w-110 m-r-5">

                                                        </div>
                                                        <div class="w-80 m-r-5">
                                                            <label class="text-gray">Discount</label>
                                                            <input type="text" class="form-control" ng-model="item.DiscountAmount" />
                                                        </div>
                                                        <div class="w-80 m-r-5">
                                                            <label class="text-gray">Tax</label>
                                                            <input type="text" class="form-control" ng-model="item.Tax" />
                                                        </div>

                                                        </div>
                                                    </div>

                                                                </div>

                                                            </select>

                                                        </div>

                                                            </select>
                                                        </div>

                                                            <input type="text" class="form-control" ng-model="item.Shipping" />

                                                            </select>
                                                        </div>
                                                        <div class="w-100 m-r-5">
                                                            <label class="text-gray">TOS</label>
                                                            <select class="form-control" ng-model="item.TOSObj"

                                                            </select>
                                                        </div>

                                                            <a uib-tooltip="" tooltip-append-to-body="true">
                                                                <i class="eh-notes eh-icon m-auto m-t-5"></i>
                                                            </a>
                                                        </div>
                                                    </div>
                                                    <div class="m-t-5">
                                                        <p class="mb-0">

                                                            <b class="complaint-text"> Remarks : </b>
                                                            <span class="complaint-remarks">
                                                                <input class="form-control" ng-model="item.Notes" />
                                                            </span>
                                                        </p>
                                                    </div>
                                                    <!--<table class="table rxmedicationinsidetable">
                        <tbody>

                        </tbody>
                    </table>-->
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
            
        </div>
    </div>
