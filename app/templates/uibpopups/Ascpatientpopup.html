<div class="row">
    <div class="col-lg-12">
        <section class="eh-panel b-0">
            <div class="eh-header bg-white p-10">
                <h1 class="font-weight-700 text-1d5558 fs-20 m-0">Patient</h1>
                <ul class="us-controls">
                    <li>
                        <button class="btn btn-discard-us" ng-click="closeuib()">Close</button>
                    </li>
                    <li>
                        <button class="btn btn-save-us" ng-click="SaveAscpatientpopup()">Save</button>
                    </li>
                </ul>
            </div>
            <div class="search-panel-body">
                <table class="table tableno-bordered tableno-padding m-b-0">
                    <tbody>
                        <tr>
                            <td width="20%">
                                <span class="text-s14w600c000">The patient is received for surgery</span>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.RecievedForSurgery =='Self'?'active':''" ng-click="PreopCheckinObj.RecievedForSurgery = 'Self'">Self</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.RecievedForSurgery =='Others'?'active':''" ng-click="PreopCheckinObj.RecievedForSurgery = 'Others'">Others</button>
                            </td>
                            <td colspan="3">
                                <div class="ehr-input  pop-ehr-input">
                                    <textarea rows="1" placeholder="Notes" maxlength="100" ng-model="PreopCheckinObj.RecievedForSurgeryNotes"></textarea>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td width="20%">
                                <span class="text-s14w600c000">Accompanied By</span>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.AccompainedBy =='Self'?'active':''" ng-click="PreopCheckinObj.AccompainedBy = 'Self'">Self</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.AccompainedBy =='Family'?'active':''" ng-click="PreopCheckinObj.AccompainedBy = 'Family'">Family/Relative</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.AccompainedBy =='Friend'?'active':''" ng-click="PreopCheckinObj.AccompainedBy = 'Friend'">Friend</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.AccompainedBy =='Others'?'active':''" ng-click="PreopCheckinObj.AccompainedBy = 'Others'">Others</button>
                            </td>
                            <td>
                                <div class="ehr-input  pop-ehr-input">
                                    <textarea rows="1" placeholder="Notes" maxlength="100" ng-model="PreopCheckinObj.AccompainedByNotes"></textarea>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <span class="text-s14w600c000">pre-operative orientation offered</span>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PreOperativeOrientationOffered =='AboutPremedicationEffects'?'active':''"
                                        ng-click="PreopCheckinObj.PreOperativeOrientationOffered ='AboutPremedicationEffects'">
                                    About-Premedication Effects
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PreOperativeOrientationOffered =='PreIntraPhase'?'active':''"
                                        ng-click="PreopCheckinObj.PreOperativeOrientationOffered ='PreIntraPhase'">
                                    Pre Intra Phase
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PreOperativeOrientationOffered =='PostSurgery'?'active':''"
                                        ng-click="PreopCheckinObj.PreOperativeOrientationOffered ='PostSurgery'">
                                    Post Surgery
                                </button>
                            </td>
                            <td colspan="2">
                                <div class="ehr-input pop-ehr-input">
                                    <textarea rows="1" placeholder="Notes" maxlength="100" ng-model="PreopCheckinObj.PreOperativeOrientationOfferedNotes"></textarea>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <span class="text-s14w600c000">Observed Behavior</span>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.ObservedBehavior =='CalmedDown'?'active':''"
                                        ng-click="PreopCheckinObj.ObservedBehavior ='CalmedDown'">
                                    Calmed Down
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.ObservedBehavior =='Anxious'?'active':''"
                                        ng-click="PreopCheckinObj.ObservedBehavior ='Anxious'">
                                    Anxious
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.ObservedBehavior =='RefersToFear'?'active':''"
                                        ng-click="PreopCheckinObj.ObservedBehavior ='RefersToFear'">
                                    Refers To Fear
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.ObservedBehavior =='Others'?'active':''"
                                        ng-click="PreopCheckinObj.ObservedBehavior ='Others'">
                                    Others
                                </button>
                            </td>
                            <td colspan="2">
                                <div class="ehr-input pop-ehr-input">
                                    <textarea rows="1" placeholder="Notes" maxlength="100" ng-model="PreopCheckinObj.ObservedBehaviorNotes"></textarea>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <span class="text-s14w600c000">Level Of Consciousness</span>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.LevelOfConsciousness =='Alert'?'active':''"
                                        ng-click="PreopCheckinObj.LevelOfConsciousness ='Alert'">
                                    Alert
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.LevelOfConsciousness =='Unconscious'?'active':''"
                                        ng-click="PreopCheckinObj.LevelOfConsciousness ='Unconscious'">
                                    Unconscious
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.LevelOfConsciousness =='Semiconcious'?'active':''"
                                        ng-click="PreopCheckinObj.LevelOfConsciousness ='Semiconcious'">
                                    Semiconcious
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.LevelOfConsciousness =='Oriented'?'active':''"
                                        ng-click="PreopCheckinObj.LevelOfConsciousness ='Oriented'">
                                    Oriented
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.LevelOfConsciousness =='Sedated'?'active':''"
                                        ng-click="PreopCheckinObj.LevelOfConsciousness ='Sedated'">
                                    Sedated
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.LevelOfConsciousness =='Disorientated'?'active':''"
                                        ng-click="PreopCheckinObj.LevelOfConsciousness ='Disorientated'">
                                    Disorientated
                                </button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.LevelOfConsciousness =='Others'?'active':''"
                                        ng-click="PreopCheckinObj.LevelOfConsciousness ='Others'">
                                    Others
                                </button>
                            </td>
                            <td colspan="2">
                                <div class="ehr-input pop-ehr-input">
                                    <textarea rows="1" placeholder="Notes" maxlength="100" ng-model="PreopCheckinObj.LevelOfConsciousnessNotes"></textarea>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td width="20%">
                                <span class="text-s14w600c000">Patient Transferred in</span>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PatientTransfferedIn =='Stretcher'?'active':''" ng-click="PreopCheckinObj.PatientTransfferedIn = 'Stretcher'">Stretcher</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PatientTransfferedIn =='Self'?'active':''" ng-click="PreopCheckinObj.PatientTransfferedIn = 'Self'">Self</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PatientTransfferedIn =='Others'?'active':''" ng-click="PreopCheckinObj.PatientTransfferedIn = 'Others'">Others</button>
                            </td>
                            <td colspan="2">
                                <div class="ehr-input  pop-ehr-input">
                                    <textarea rows="1" placeholder="Notes" maxlength="100" ng-model="PreopCheckinObj.PatientTransfferedNotes"></textarea>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td width="20%">
                                <span class="text-s14w600c000">Patient Destination</span>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PatientDestination =='LivingRoom'?'active':''" ng-click="PreopCheckinObj.PatientDestination = 'LivingRoom'">Living Room</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PatientDestination =='Others'?'active':''" ng-click="PreopCheckinObj.PatientDestination = 'Others'">Others</button>
                            </td>
                            <td colspan="3">
                                <div class="ehr-input  pop-ehr-input">
                                    <textarea rows="1" placeholder="Notes" maxlength="100" ng-model="PreopCheckinObj.PatientDestinationNotes"></textarea>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td width="20%">
                                <span class="text-s14w600c000">PTE Refers</span>
                            </td>
                            <td colspan="3">
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PTERefers =='Feeling good, there is no pain or Discomfort'?'active':''" ng-click="PreopCheckinObj.PTERefers = 'Feeling good, there is no pain or Discomfort';">Feeling good, there is no pain or Discomfort</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreopCheckinObj.PTERefers =='Others'?'active':''" ng-click="PreopCheckinObj.PTERefers = 'Others';">Others</button>
                            </td>
                            <td>
                                <div class="ehr-input  pop-ehr-input">
                                    <textarea rows="1" placeholder="Notes" maxlength="100" ng-model="PreopCheckinObj.PTEReferNotes"></textarea>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
