<div class="modal-header">
    <h4 class="modal-title">Diagnosis Finder</h4>
    <button type="button" class="btn btn-link" ng-click="closeDiagFinder()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body bg-gray p-t-10 p-b-10">
    <div class="row">
        <div class="col-lg-12">
            <div class="col-lg-12">
                <div class="dis-flex align-items-center">
                    <div class="p-r-5 border-right text-new">
                        Find By
                    </div>
                    <div class="m-l-5 m-r-5 p-l-5">
                        <fieldset class="pos-relative bottom-2 w-250">
                            <div class="dis-inline-block">
                                <input type="radio" class="radio-custom width-0" id="NamesId" ng-value="1" aria-invalid="false" ng-model="newobja.SearchType" ng-change="ChangeSearchType()">
                                <label for="NamesId" class="radio-custom-label cur-poiter mb-0 text-new">ICD-10 Code</label>
                            </div>
                            <div class="dis-inline-block ml-15">
                                <input type="radio" class="radio-custom width-0" id="NamesId1" ng-value="2" aria-invalid="false" ng-model="newobja.SearchType" ng-change="ChangeSearchType()">
                                <label for="NamesId1" class="radio-custom-label cur-poiter mb-0 text-new"> ICD-10 Description</label>
                            </div>
                        </fieldset>
                    </div>
                    <div class="text-clear-cons flex">
                        <input type="text" class="form-control radius-100 " placeholder="Select ICD code or enter description" ng-model="newobja.SearchText" ng-change="changeDiagnosis(newobja.SearchText,newobja.SearchType)" />

                        <input type="text" class="form-control radius-100"
                               name="DiagnosiseIcd"
                               placeholder="Enter Diagnosis"
                               ng-model="newAssessmentObj.DiagnosisObject"
                               maxlength="100"
                               typeahead-min-length="0"
                               typeahead-focus-on-select="false"
                               uib-typeahead="item as item.DiagnosisName + ' - ' + item.DiagnosisCode for item in GetDiagnosisEasyList($viewValue)"
                               typeahead-on-select="onSelectAssesmentDiagnosis(newAssessmentObj)" />



                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row" ng-if="SearchDiagnosisList.length>0">
        <div class="col-lg-12">
            <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
                <thead>
                    <tr>
                        <th class="text-center" width="15%">
                            ICD-10 Code
                        </th>
                        <th width="75%">
                            Description
                        </th>
                        <th class="text-center" width="10%">
                            Add
                        </th>

                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in SearchDiagnosisList track by $index">
                        <td>
                            <input type="text" class="form-control" ng-model="item.ICD10CODE" disabled="disabled" />
                        </td>
                        <td>
                            <input type="text" class="form-control" ng-model="item.ICD10DIAGDESCRIPTION" disabled="disabled" />
                        </td>
                        <td>
                            <button class="btn btn-success btn-block" ng-click="AddDiagnosis(item)">
                                <i class="fas fa-plus"></i>
                            </button>
                        </td>

                    </tr>

                </tbody>
            </table>
        </div>
    </div>
    <div class="row" ng-if="SearchDiagnosisList.length>0">
        <div class="col-lg-12">
            <div class="EH-pagination text-center">
                <uib-pagination total-items="newobja.count"
                                ng-model="newobja.PageNumber"
                                ng-change="changePageDiag(newobja.PageNumber)"
                                ng-show="SearchDiagnosisList.length > 0"
                                items-per-page="newobja.PageSize"
                                max-size="5"
                                class=""
                                boundary-link-numbers="true"
                                rotate="false"></uib-pagination>
            </div>
        </div>
    </div>
    <div class="row" ng-if="SearchDiagnosisList.length===0">
        <div class="col-lg-12">
            <div class="billing-cominsoon text-center ng-scope">
                <img src="img/no-data/no-results-appointment.png">
                <div class="msg">
                    <p class="goback-text">No Diagnosis Found</p>

                </div>
            </div>
        </div>
    </div>
     

    <div class="row">
        <div class="modal-header" ng-if="SelectedDiagnosisList.length>0">
            <h4 class="modal-title">Added ICD-10 Code List</h4>
        </div>
        <div class="row">
            <div class="col-lg-12" ng-if="SelectedDiagnosisList.length>0">
                <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
                    <thead>
                        <tr>
                            <th class="w-80">
                                Sequence
                            </th>
                            <th class="w-150">
                                ICD-10 Code
                            </th>
                            <th>
                                Description
                            </th>
                            
                            <th class="w-80 text-center">
                                Remove
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="kitem in SelectedDiagnosisList | orderBy : 'Type' track by $index">
                            <td>
                                <div class="bg-new-light text-acdcode p-5">
                                    {{kitem.Type}}
                                </div>
                            </td>
                            <td>
                                <div class="bg-new-light text-acdcode p-5">
                                    {{kitem.ICD10CODE}}
                                </div>
                            </td>
                            <td>
                                <div class="bg-new-light text-acdcode p-5">
                                    {{kitem.ICD10DIAGDESCRIPTION}}
                                </div>
                            </td>
                            
                            <td>
                                <button class="btn btn-outline-danger btn-block" ng-click="RemoveDiagnosis(kitem)">
                                    <i class="fas fa-backspace text-ldanger"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>



        </div>
    </div>

</div>
<div class="modal-footer">
    <div class="row m-t-10">
        <div class="col-lg-12 text-center">
            <button type="button" class="etn btn-ehnote-outline p-l-25 p-r-25" ng-click="ClearDiagnosis()">Clear</button>
            <button type="button" class="etn btn-ehnote p-l-25 p-r-25" ng-click="SaveDiagnosis()">Save</button>
        </div>
    </div>
</div>
