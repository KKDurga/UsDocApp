<div class="row">
    <div class="col-lg-12">
        <div class="eh-header dis-flex justify-space-between">
            <h1 class="text-068cb0">Evaluation</h1>
            <ul class="us-controls">
                <li>
                    <button class="btn btn-save-us m-r-5">Save</button>
                </li>
                <li>
                    <button class="btn btn-discard-us m-r-5" ng-click="uibclose()">Close</button>
                </li>
            </ul>
        </div>
        <div class="eh-body p-5">
            <div class="row">
                <div class="col-lg-12">
                    <table class="table tableno-bordered m-b-0">
                        <tr>
                            <td class="valign-top">
                                <b class="text-068cb0 fs-15">Respiratory</b>
                                <div class="checkbox cn m-r-0">
                                    <label>
                                        <input name="checkbox-1" type="checkbox" ng-model="cacheStorageItem.IsRespiratoryNormal" ng-change="OnClickRespiratoryNormal();">
                                        <span class="checkbox-material">
                                            <span class="check"></span>
                                        </span>
                                        <small class="text-s14w500c000 m-l-5">
                                            Normal
                                        </small>
                                    </label>
                                </div>
                                <div class="row">
                                    <div class="col-lg-12  m-b-10">
                                        <div class="checkbox cn m-r-0 dis-flex">
                                            <div class="m-l-10" ng-repeat="item in cacheStorageItem.HealthArray | filter: {'CategoryId':13} track by $index">
                                                <label>
                                                    <input name="checkbox-1" type="checkbox" ng-model="item.IsChecked">
                                                    <span class="checkbox-material">
                                                        <span class="check"></span>
                                                    </span>
                                                    <small class="text-s12w500c000 m-l-0">
                                                        {{item.Description}}
                                                    </small>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12">
                                        <div class="ehr-input  pop-ehr-input">
                                            <textarea type="text" rows="4" placeholder="Notes" ng-model="cacheStorageItem.RespiratoryNotes"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td width="25%" class="valign-top">
                                <b class="text-068cb0 fs-15">CNS</b>
                                <div class="row">
                                    <div class="col-lg-12 m-t-0">
                                        <table class="table tableno-bordered tableno-padding table-layout-fix">
                                            <tbody>
                                                <tr>
                                                    <td>
                                                        <ul class="ul-Aideret-score">
                                                            <li>
                                                                <button ng-class="(!cacheStorageItem.IsCNSHistory)?'active':''" ng-click="SelectCNSBtn(1);">No History</button>
                                                            </li>
                                                        </ul>
                                                    </td>
                                                    <td>
                                                        <ul class="ul-Aideret-score">
                                                            <li>
                                                                <button ng-class="(cacheStorageItem.IsCNSHistory)?'active':''" ng-click="SelectCNSBtn(2);">History Present</button>
                                                            </li>
                                                        </ul>
                                                    </td>

                                                </tr>
                                                <tr>
                                                    <td colspan="2">
                                                        <div class="ehr-input  pop-ehr-input">
                                                            <textarea type="text" rows="4" placeholder="Notes" ng-model="cacheStorageItem.CNSNotes"></textarea>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </td>
                            <td width="33%" class="valign-top">
                                <b class="text-068cb0 fs-15">Social</b>
                                <div class="row">
                                    <div class="col-lg-12 m-b-10">
                                        <div class="checkbox cn m-r-0 dis-flex">
                                            <div ng-class="($index == 0)?'':'m-l-10'" ng-repeat="item in cacheStorageItem.HealthArray | filter: {'CategoryId':15} track by $index">
                                                <label>
                                                    <input name="checkbox-1" type="checkbox" ng-model="item.IsChecked">
                                                    <span class="checkbox-material">
                                                        <span class="check"></span>
                                                    </span>
                                                    <small class="text-s12w500c000 m-l-0">
                                                        {{item.Description}}
                                                    </small>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 mb-10">
                                        <div class="ehr-input  pop-ehr-input">
                                            <textarea type="text" rows="4" placeholder="Notes" ng-model="cacheStorageItem.SocialNotes"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>

                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
