<div class="modal-body p-0">
    <!-- / -->
    <div class="row">
        <div class="col-lg-12">
            <section class="search-panel">     
                <div class="search-panel-header dis-block">
                    <div class="dis-flex align-items-center justify-space-between">
                        <div>
                            <h1 class="font-weight-700 text-1d5558 fs-20 m-0">Pre-Op Medications</h1>
                        </div>
                        <div class="dis-flex grid-gap-5">
                            <div class="dis-flex">
                                <input type="text" class="bg-dbf6ff form-control btr-radius bbr-radius" placeholder="Template Name" ng-model="PreOpTemplateName">
                                <button class="btn-eh-dark btn m-r-10 btl-radius bbl-radius" ng-click="SavePreOpMedicationTemplate();">Save</button>
                            </div>
                            <div class="search-panel-input flex">
                                <select ng-model="SelectedTemplate" ng-options="item as item.TemplateName for item in PreOpMedicationTemplates" ng-change="OnselectMedicationTemplate(SelectedTemplate);">
                                    <option value="" ng-disabled="true">Select template</option>
                                </select>
                            </div>
                            <div class="dis-flex align-items-center m-l-10">
                                <button class="btn btn-discard-us m-r-5" ng-click="closeuib()">Close</button>
                                <button class="btn btn-save-us" ng-click="closeuib()">Save</button>
                            </div>
                        </div>
                       
                    </div>
                </div>
                <div class="search-panel-body border">
                    <table class="search-table-list">
                        <tbody>
                            <tr>
                                <td width="20%">
                                    <!--<h1 class="font-weight-700 text-1d5558 fs-20 m-0">Pre-Op Medications</h1>-->
                                </td>
                                <td>
                                    <div class="search-panel-input flex m-t-15">
                                        <input type="text" ng-model="PreOpMedicationObj.MedicineObject" typeahead-focus-on-select="false" typeahead-min-length="0" typeahead-on-select="PushfreqMedicalItems(PreOpMedicationObj.MedicineObject)" placeholder="Enter Medications" uib-typeahead="Medlist as Medlist.MedicineNameWithStock for Medlist in getOrgMedicines($viewValue)">
                                    </div>
                                </td>
                                <td width="10%">
                                    <div class="pop-ehr-input ehr-input">
                                        <label>Dosage</label>
                                        <select ng-model="PreOpMedicationObj.DoseId" ng-options="item.MedicineDosaageFieldId as item.Description for item in DoseArray">
                                            <option value="">Select</option>
                                        </select>
                                    </div>
                                </td>
                                <td width="15%">
                                    <div class="pop-ehr-input ehr-input">
                                        <label>Dose Unit</label>
                                        <select ng-model="PreOpMedicationObj.DoseUnitId"
                                                ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in DoseUnitArray">
                                            <option value="">Select</option>
                                        </select>
                                    </div>
                                </td>
                                <!--<td width="15%">
                    <div class="pop-ehr-input ehr-input">
                        <label>Frequency</label>
                        <div class="ehr-input-group">
                         <input />
                            <button class="bg-eeee fs-10 text-black">/days</button>
                        </div>
                    </div>-->
                                <!--<div class="pop-ehr-input ehr-input">
                    <label>Frequency</label>
                    <select>
                        <option></option>
                    </select>
                </div>-->
                                <!--</td>-->
                                <td width="20%">
                                    <div class="pop-ehr-input ehr-input">
                                        <label>Dose Timing</label>
                                        <select ng-model="PreOpMedicationObj.FrequencyId" ng-options="item.MedicineDosaageFieldId as item.Description for item in FrequencyArray">
                                            <option value="">Select</option>
                                        </select>
                                    </div>
                                </td>
                                <td width="5%">
                                    <button class="btn btn-success m-t-18" ng-click="AddPreOpOrgMedication(PreOpMedicationObj);">Add</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class=" overflow-x-hideen overflow-y-scroll" style="height: calc(100vh - 110px)">
                        <table class="us-table">
                            <tbody>
                                <tr ng-repeat="item in PreOpObj.PreOpMedications track by $index">
                                    <td>
                                        <ul class="flex-flow-ulli justify-space-between align-items-center">
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-1" type="checkbox" ng-model="item.IsChecked">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small class="text-s14w500c000 m-l-5">
                                                            {{item.MedicationName}}
                                                        </small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li>
                                                <a href="javascript:;" ng-click="DeletePreOpMedication(item,$index)">
                                                    <img src="img/close-red.svg" width="17" height="17">
                                                </a>
                                            </li>
                                        </ul>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
