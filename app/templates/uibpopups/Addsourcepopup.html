<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Add Referral Source</h1>
        <ul class="list__unstyled-- d__f-- ai__c--">
            <li>
                <button class="btn__lg-- btn__1d5558--f"  ng-click="SaveOnDesignatedSource()">Save</button>
            </li>
            <li>
                <a class="btn__close--" ng-click="sourceclosePopUp()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body--">
        <div class="position__relative-- height__100--">
            <div class="adjustable-position">
                <div class="d__f-- fd__c-- gap__y--8">
                    <div class="row">
                        <div class="col-lg-12">
                            <table class="table tableno-bordered m-b-0 apptFilterTable">
                                <tbody>
                                    <tr>

                                        <td>
                                            <div class="col-lg-5">
                                                <div class="pop-ehr-input ehr-input">
                                                    <label for="inputEmail3" class="control-label"> {{ 'REFERRALSOURCE' | translate}} </label>
                                                    <select class="boxshadowbillAppointment"
                                                            ng-model="Refferral.referralSource"
                                                            ng-change="ChangeReferalid(item.MasterReferralSourceId)"
                                                            ng-options="item as item.MasterReferralSourceName for item in ReferralSouceMaster" ng-disabled="editReferral">
                                                        <option value="">{{ 'SELECT' | translate}}</option>
                                                    </select>
                                                    <div class="clearfix"></div>
                                                    <div class="error-mesg-wrap" ng-show="(referralform.$submitted || referralform.referralTitle.$touched) && referralform.referralTitle.$error.required">
                                                        <span class="list list-inset error-msg">{{ 'ENTERREFERRALSOURCETITLE' | translate}}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-5">
                                                <div class="pop-ehr-input ehr-input">
                                                    <label for="inputEmail3" class="control-label">{{ 'ENTERREFERRALSOURCETITLE' | translate}}</label>
                                                    <input type="text" class="l" id="referralTitle1" name="referralTitle1" placeholder="Enter title for Referral Source" maxlength="50" ng-model="Refferral.ReferralTitle" required>
                                                    <div class="clearfix"></div>
                                                    <div class="error-mesg-wrap" ng-show="(referralform.$submitted || referralform.referralTitle.$touched) && referralform.referralTitle.$error.required">
                                                        <span class="list list-inset error-msg">{{ 'ENTERREFERRALSOURCETITLE' | translate}}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-2">
                                                <button type="submit" class="btn btn-block m-t-20" ng-class="SaveReferral=='Save'?'btn-success':'btn-primary'" ng-click="submitClickForSourceInDesignated(referralform)">{{SaveReferralDesignated}}</button>
                                            </div>
                                        </td>
                                    </tr>

                                </tbody>
                            </table>
                        </div>
                    </div>
                    <section class="tile tile-shadow">
                        <div class="tile-header">
                            <h1>Referral Source List</h1>
                        </div>
                        <div class="tile-body">
                            <div class="row">
                                <div class="col-lg-12">
                                    <table class="table table-bordered m__0--">
                                        <thead>
                                            <tr>
                                                <th>{{ 'REFERRALSOURCE' | translate}}</th>
                                                <th>{{ 'REFERRALSOURCETITLES' | translate}}</th>
                                                <th class="text-center" width="5%">{{ 'EDIT' | translate}}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr ng-repeat="SourceData in ReferralList">
                                                <td>{{SourceData.masterReferralSourceName}}</td>
                                                <td>{{SourceData.ReferralTitle}}</td>
                                                <td class="text-center">
                                                    <a class="cur-poiter"><img width="17" src="img/ehnote-edit.svg" alt="edit" ng-click="EditClickOnDesignatedInfo(SourceData)" data-tooltip="Edit"></a>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
