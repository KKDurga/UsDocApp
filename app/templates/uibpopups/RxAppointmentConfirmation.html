<div class="modal-header">
    <h4 class="modal-title">Rx Appointment Confirmation </h4>
    <button type="button" class="btn btn-link" ng-click="closeuibpopup();"><i class="fas fa-times"></i></button>
</div>

<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <section class="tile tile-shadow">
                <div class="tile-body">
                    <div class="row">
                         <div class="col-lg-4">
                            Your Rx Appointment With :  
                         </div>
                         <div class="col-lg-6">
                             <div class="max-ehr-input flex">
                                 <label>{{ 'SELECTDOCTOR' | translate}}</label>
                                 <ui-select ng-model="addNewApptPrescriptionObj.DocObj" theme="bootstrap" on-select="changeAppointmentRxDoctor(addNewApptPrescriptionObj.DocObj)" class="uiselect-custom">
                                     <ui-select-match placeholder="{{ 'SELECT' | translate}}">{{addNewApptPrescriptionObj.DocObj.UserFullName?addNewApptPrescriptionObj.DocObj.UserFullName:"Select Doctors"}}</ui-select-match>
                                     <ui-select-choices repeat="item in ClincalRXDoctorsList | filter: $select.search" null-option="EmptySelect" loose-null>
                                         <span ng-bind-html="item.UserFullName | highlight: $select.search"></span>
                                     </ui-select-choices>
                                 </ui-select>
                             </div>
                         </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>




<div class="modal-footer">
    <div class="row">
        <div class="dis-flex align-items-center justify-content-end">
            <button type="button" class="btn btn-danger p-l-25 p-r-25" ng-click="ClearDetails();"> {{ 'CLOSE' | translate}}</button>
            <button class="btn btn-success m-r-20 m-l-10 w-150" ng-click="continuetoBookAppointment();">{{ 'SAVE' | translate}}</button>
        </div>
    </div>
</div>
