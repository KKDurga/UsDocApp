<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Errors</h1>
        <a class="btn__close--2" ng-click="discardProcedures()">
            <i class="icons__w16-- close__w16--s" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false" style=""></i>
        </a>
    </div>
    <div class="modal__body--">
        <table class="table__style--15">
            <thead>
                <tr>
                    <th><label>S.No</label></th>
                    <th><label>Field</label></th>
                    <th><label>Error Description</label></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="item in ErrorsList">
                    <td>{{$index+1}}</td>
                    <td class="bold-600">
                        {{item.field}}
                    </td>
                    <td>
                        <span class="text-red">{{item.description}}</span>
                    </td>
                </tr>
            </tbody>
        </table>
        <div>
            <label class="tc__C71D27-- fw__5--">Kindly modify all the changes and ReSubmit</label>
        </div>
    </div>
</div>
