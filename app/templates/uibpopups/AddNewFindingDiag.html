<div class="modal__style--1">
    <div class="modal__header--">
        <h1>{{ 'ADDCATEGORYANDINVESTIGATION' | translate}}</h1>
        <a class="btn__close--2" ng-click="closerCatInvAdd()">
            <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
        </a>
    </div>
    <div class="modal__body--">
        <div class="row">
            <div class="col-lg-12">
                <div class="col-lg-5">
                    <div class="form__group">
                        <label>{{ 'SELECTCATEGORYORADDCATEGORY' | translate}} <em>*</em></label>
                        <input type="text" name="InvCategorySearchBox" id="input_categoryobj"
                               autocomplete="off"
                               maxlength="100" placeholder="Enter Catergory" ng-model="newAddObj.CategoryObj"
                               typeahead-min-length="3"
                               uib-typeahead="catItem  as catItem.CategoryName for catItem in getMasterCategories($viewValue)"
                               typeahead-on-select="SelectCatFromAutoComplete(newAddObj.CategoryObj)">
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="row">
                        <div class="col-lg-8">
                            <div class="form__group">
                                <label for="usr">{{ 'FINDINGNAME' | translate}} :<em>*</em></label>
                                <input type="text" name="InvCategorySearchBox" maxlength="100"
                                       placeholder="Enter Finding" id="input_invesobj"
                                       ng-model="newAddObj.InvestigationObj"
                                       ng-change="changeInvAssessmentFind(newAddObj)"
                                       typeahead-min-length="3"
                                       uib-typeahead="InvItem as InvItem.InvestigationName for InvItem in getMasterInvestigations($viewValue)"
                                       typeahead-on-select="SelectInvFromAutoComplete(newAddObj.InvestigationObj)">
                            </div>
                        </div>
                        <div class="col-lg-4" ng-show="SpecializationId != 2">
                            <div class="form__group">
                                <label>{{ 'CODE' | translate}}</label>
                                <input type="text" name="InvCategorySearchBox" maxlength="10" id="input_code"
                                       placeholder="Enter Code" ng-model="newAddObj.InvestigationCode" quotes-restrict enter-directive>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="form__group">
                        <label>{{ 'FINDINGVALUE' | translate}}</label>
                        <input type="text" placeholder="Enter Finding values" id="input_fvalue" ng-model="newAddObj.InvFindingName" quotes-restrict enter-directive />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal__footer--">
        <button type="button" class="btn__xl-- btn__C71D27--o" ng-click="clearCatInvAdd()" id="btn_clear"><i class="action__icons--1 action__clear--"></i>{{ 'CLEAR' | translate}}</button>
        <button type="button" class="btn__xl-- btn__1d5558--f" ng-click="SaveCatInvestigation()" id="btn_save"><i class="action__icons--1 action__save--"></i>{{ 'SAVE' | translate}}</button>
    </div>
</div>
