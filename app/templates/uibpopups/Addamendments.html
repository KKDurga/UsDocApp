<section class="eh-panel">
    <div class="eh-header bg-f2f2f2">
        <h1 class="text-ocularhist">Amendments</h1>
        <ul class="us-controls">
            <li>
                <button class="btn btn-discard-us m-r-5" ng-click="uibclose()">Close</button>
            </li>
            <li>
                <button class="btn btn-save-us m-r-5" ng-click="SaveAmendment()">Save</button>
            </li>
        </ul>
    </div>
    <div class="eh-body">
        <div class="row">
            <div class="col-lg-12">
                <div class="overflow-x-hidden overflow-y-scroll" ng-style="heightABO()" resize>
                    <table class="referral-table b-0 m-b-0 tableno-bordered">
                        <tbody class="bg-white">
                            <tr>
                                <td colspan="4">
                                    <div class="form-group">
                                        <textarea class="form-control" rows="4" ng-model="Amendmentobj.AmendmentsNotes" placeholder="Add Amendments"></textarea>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td width="12%">
                                    <div class="form-group">
                                        <label>Scriber</label>
                                        <select class="form-control" ng-options="item.DoctorID as item.FullName for item in mainPatientProfileObj.AllUsersList| filter: { RoleId: 16 }"
                                                ng-model="Amendmentobj.ScribeId"
                                                ng-change="ChangeScribe(Amendmentobj.ScribeId,Amendmentobj)">
                                            <option value="">{{selectedDoctorAssitant|| 'Scriber'}}</option>
                                        </select>
                                    </div>
                                </td>
                                <td width="15%">
                                    <div class="form-group">
                                        <label>Doctor Name</label>
                                        <select class="form-control" ng-options="item.DoctorID as item.FullName for item in mainPatientProfileObj.AllUsersList"
                                                ng-model="Amendmentobj.DoctorId"
                                                ng-change="ChangeDcotor(Amendmentobj.DoctorId,Amendmentobj)">
                                            <option value="">{{SelectedDoctor|| 'Doctor'}}</option>
                                        </select>
                                    </div>
                                </td>
                                <td></td>
                                <td></td>
                            </tr>
                        </tbody>
                        <tbody ng-show="treatmentArray.length>0">
                            <tr>
                                <th colspan="4">
                                    <label class="text-068cb0 fs-18">History</label>
                                </th>
                            </tr>
                            <tr>
                                <td colspan="4">
                                    <table class="referral-table table-text-left">
                                        <tbody>
                                            <tr>
                                                <td>
                                                    <table class="referral-table table-text-left tablebg-body-summary b-0">
                                                        <tbody ng-repeat="item in treatmentArray[0].PatientAmendments">
                                                            <tr >
                                                                <td>
                                                                    <ul class="p-l-5">
                                                                        <li>                                                                           
                                                                            <span>
                                                                                {{item.AmendmentsNotes}}
                                                                            </span>
                                                                        </li>
                                                                     
                                                                    </ul>
                                                                    <ul class="referral-summary-list bg-fff9e2">
                                                                        <li>
                                                                            <label>Scriber :</label>
                                                                            <span>{{item.ScribeName}}</span>
                                                                        </li>
                                                                        <li>
                                                                            <label>Doctor Name :</label>
                                                                            <span>{{item.DoctorName}}</span>
                                                                           
                                                                        </li>
                                                                        <li>
                                                                            <label>Date :</label>
                                                                            <span ng-bind="item.DateTime | date:'dd MMM yyyy'"></span>
                                                                    
                                                                            
                                                                        </li>
                                                                        <li>
                                                                            <label>Time :</label>
                                                                            <span ng-bind="item.DateTime |amPm">11:30 AM</span>
                                                                        </li>
                                                                    </ul>
                                                                </td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
            </div>
        </div>
    </div>
</section>
