<div class="p-10 p-b-0">
    <div class="eh-header">
        <h1>Chief Complaints</h1>        
        <ul class="us-controls">
            <li>
                <button class="btn btn-discard-us" ng-click="closechiefcomplaintsuibpopup()">Discard</button>
            </li>
            <li>
                <button class="btn btn-save-us">Save</button>
            </li>
        </ul>
    </div>
</div>
<div class="eh-body p-10">
    <div class="row">
        <div class="col-lg-12">
            <div class="">
                <div class="m-r-10 m-l-10">
                    <fieldset>
                        <div class="dis-inline-block m-r-10">
                            <input type="radio" class="radio-custom width-0" id="selectedEyeChief1" ng-model="newChiefCompaintObj.SelectedEye" value="1">
                            <label for="selectedEyeChief1" class="radio-custom-label cur-poiter mb-0" tooltip-append-to-body="true"> OD</label>
                        </div>
                        <div class="dis-inline-block m-r-10">
                            <input type="radio" class="radio-custom width-0" id="selectedEyeChief2" ng-model="newChiefCompaintObj.SelectedEye" value="2">
                            <label for="selectedEyeChief2" class="radio-custom-label cur-poiter mb-0" tooltip-append-to-body="true">OS</label>
                        </div>
                        <div class="dis-inline-block m-r-10">
                            <input type="radio" class="radio-custom width-0" id="selectedEyeChief3" ng-model="newChiefCompaintObj.SelectedEye" value="3">
                            <label for="selectedEyeChief3" class="radio-custom-label cur-poiter mb-0" tooltip-append-to-body="true">OU</label>
                        </div>
                        <div class="dis-inline-block m-r-10">
                            <input type="radio" class="radio-custom width-0" id="selectedEyeChief4" ng-model="newChiefCompaintObj.SelectedEye" value="4">
                            <label for="selectedEyeChief4" class="radio-custom-label cur-poiter mb-0" tooltip-append-to-body="true">Gen.</label>
                        </div>
                    </fieldset>
                </div>
                <div class="flex m-t-10">
                    <input type="text" class="form-control input-color icons-search" />
                </div>
            </div>
        </div>
    </div>
    <!-- / -->
    <div class="row">
        <div class="col-lg-12">
            <table class="eh-table ros-table">
                <tbody class="b-0" ng-repeat="i in [1,2,3,4,5]">
                    <tr>
                        <td colspan="2">
                            <span class="eh-value ng-binding">
                                General - C/o burning sensation in both eyes since 1 month.
                            </span>
                        </td>
                        <td>
                            <ul class="heading-conticn">
                                <li>
                                    <a href="javascript:;" ng-click="RemoveOccularHistory(Occudhis)">
                                        <i class="eh-close eh-icon"></i>
                                    </a>
                                </li>
                            </ul>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="ng-binding">
                            <b> Remarks :</b>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
