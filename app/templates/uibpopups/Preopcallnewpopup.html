<div class="row">
    <div class="col-lg-12">
        <section class="eh-panel b-0">
            <div class="eh-header bg-white p-10">
                <h1 class="font-weight-700 text-1d5558 fs-20 m-0">Pre-Op Call</h1>
                <ul class="us-controls">
                    <li>
                        <button class="btn btn-discard-us" ng-click="closeuib()">Close</button>
                    </li>
                    <li>
                        <button class="btn btn-save-us" ng-click="savePreOpcallpopup()">Save</button>
                    </li>
                </ul>
            </div>
            <div class="eh-body">
                <table class="table tableno-bordered tableno-padding table-layout-fix">
                    <tbody>
                        <tr>
                            <td>
                                <div class="ehr-input  pop-ehr-input">
                                    <label>Contact Type</label>
                                    <select ng-model="PreOpCallObj.ContactType" ng-options="item.value as item.value for item in ContactList">
                                        <option value="" disabled>Contact Number</option>
                                    </select>
                                </div>
                            </td>
                            <td class="dis-flex" colspan="3">
                                <div class="ehr-input pop-ehr-input">
                                    <label>Date</label>
                                    <div class="ehr-input-group preopcal-btn">
                                        <input ng-focus="IsContactStartDate" type="text" ng-model="PreOpCallObj.ContactStartDate" placeholder="MM-DD-YYYY" datepickerforapplist readonly />
                                        <button class="bg-c2dfd9" ng-click="IsContactStartDate = !IsContactStartDate"> <i class="far fa-calendar"></i> </button>
                                    </div>
                                </div>
                                <div class="ehr-input m-l-5 pop-ehr-input">
                                    <label>Time</label>
                                    <div class="ehr-input-group">
                                        <input type="text" ng-model="PreOpCallObj.ContactStartTime">
                                        <button ng-click="newclicktime(PreOpCallObj,'StartTime')" class="bg-c2dfd9">
                                            <i class="far fa-clock"></i>
                                        </button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsConnectedWithPatient?'active':''" ng-click="PreOpConnectedWithPatient(PreOpCallObj)">Connected with Patient</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsConnectedWithFamilyOrFriend?'active':''" ng-click="PreOpConnectedWithFamilyOrFriend(PreOpCallObj)">Connected with Family/Friend</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsLeftMsgWithPatient?'active':''" ng-click="PreOpLeftMsgWithPatient(PreOpCallObj)">Left Message with Patient</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsLeftMsgWithFamilyOrFriend?'active':''" ng-click="PreLeftMsgWithFamilyOrFriend(PreOpCallObj)">Left Message with Family/Friend</button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsNoResponse?'active':''"
                                        ng-click="PreOpNoResponse(PreOpCallObj)">
                                    No Response
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="4">
                                <b class="text-068cb0">Instructions Shared With Patient</b>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsArrivalTimeShared?'active':''" ng-click="PreOpCallObj.IsArrivalTimeShared = !PreOpCallObj.IsArrivalTimeShared;">Arrival Time</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsAccompanyShared?'active':''" ng-click="PreOpCallObj.IsAccompanyShared = !PreOpCallObj.IsAccompanyShared;">Accompany</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsDrinkPlentyWaterShared?'active':''" ng-click="PreOpCallObj.IsDrinkPlentyWaterShared = !PreOpCallObj.IsDrinkPlentyWaterShared;">Drink Plenty of water</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsNpoAfterMidnightShared?'active':''" ng-click="PreOpCallObj.IsNpoAfterMidnightShared = !PreOpCallObj.IsNpoAfterMidnightShared;">NPO after Midnight</button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsTakeBpHeartMedShared?'active':''" ng-click="PreOpCallObj.IsTakeBpHeartMedShared = !PreOpCallObj.IsTakeBpHeartMedShared;">Take BP/Heart Medication</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsDoNotTakeBpMedShared?'active':''" ng-click="PreOpCallObj.IsDoNotTakeBpMedShared = !PreOpCallObj.IsDoNotTakeBpMedShared;">Do not take Diabetic Medication</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsNoMakeupJewelMoistShared?'active':''" ng-click="PreOpCallObj.IsNoMakeupJewelMoistShared = !PreOpCallObj.IsNoMakeupJewelMoistShared;">No Makeup/Jewelry/Moisturizers</button>
                            </td>
                            <td>
                                <button class="alderete-score-inactive" ng-class="PreOpCallObj.IsCoPay?'active':''" ng-click="PreOpCallObj.IsCoPay = !PreOpCallObj.IsCoPay;">Co-Pay</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="dis-flex">
                                <div class="ehr-input pop-ehr-input">
                                    <label>Start Drops</label>
                                    <div class="ehr-input-group">

                                        <input type="text" ng-focus="IsDropStartDate" ng-model="PreOpCallObj.DropStartDate" placeholder="MM-DD-YYYY" datepickerforapplist readonly />
                                        <button ng-click="IsDropStartDate = !IsDropStartDate">
                                            <i class="far fa-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="ehr-input m-l-5 pop-ehr-input">
                                    <label>&nbsp;</label>
                                    <div class="ehr-input-group">
                                        <input type="text" ng-model="PreOpCallObj.DropsStartTime">
                                        <button ng-click="newclicktime(PreOpCallObj,'DropsTime')">
                                            <i class="far fa-clock"></i>
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td colspan="3">
                                <div class="ehr-input pop-ehr-input">
                                    <textarea rows="2" class="msd-elastic: \n" placeholder="Notes" maxlength="500" ng-model="PreOpCallObj.CoPayNotes" spellcheck="false"></textarea>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="4">
                                <div class="ehr-input">
                                    <textarea rows="2" placeholder="Enter Notes" maxlength="500" class="msd-elastic: \n" ng-model="PreOpCallObj.Remarks" spellcheck="false"></textarea>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
