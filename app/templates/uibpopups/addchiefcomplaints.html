    <div class="">
        <div class="flex">
            <div class="chief-complaints-fixed">
                <h1 class="text-ocularhist">{{ 'CHIEFCOMPLAINTS' | translate}}</h1>
                <div class="pos-relative flex m-l-20 m-r-20" typehead-dropdown-direction>
                    <input type="text" class="form-control icons-search input-color" placeholder="Enter Chief Complaints"
                           autocomplete="off"
                           name="Complaint"
                           ng-model="newChiefCompaintObj.ChiefComplaintObj"
                           maxlength="100"
                           typeahead-min-length="0"
                           typeahead-focus-on-select="false"
                           uib-typeahead="item as item.ChiefComplaintName for item in getNewComplaints($viewValue)"
                           typeahead-on-select="ComplaintsBlurChangenew(newChiefCompaintObj.ChiefComplaintObj)"
                           ng-blur="changefocusOption();" />
                    <!--<i class="fas fa-times-circle" ng-click="newChiefCompaintObj.ChiefComplaintObj='';newChiefCompaintObj.AddComplaints=false;" ng-hide="newChiefCompaintObj.ChiefComplaintObj==''"></i>-->
                    <ul class="dropdown-menu pos-absolute" ng-show="newChiefCompaintObj.AddComplaints" uib-dropdown uib-dropdown-toggle auto-close="disabled">
                        <li><a ng-click="AddNewComplaints(newChiefCompaintObj.ChiefComplaintObj)">Add new</a></li>
                    </ul>
                </div>
                <div class="dis-flex align-items-center">
                    <button class="btn btn-save-us m-r-10" ng-click="SaveCheifComplaintsData()">Save</button>
                    <button class="btn btn-discard-us" ng-click="uibclose()">Close</button>
                </div>
            </div>
        </div>
    </div>
    <div class="chief-complaints-fixed-body" ng-show="(cacheStorageItem.ChiefComplaints| filter:{'ActiveInd':'Y'}).length>0">
        <div class="overflow-x-hideen overflow-y-scroll" ng-style="heightBOO()">
            <div class="chief-complaints-textarea">

                <div  class="pos-relative" ng-repeat="citem in cacheStorageItem.ChiefComplaints | filter:{'ActiveInd':'Y'} track by $index">
                  
                    <textarea class="form-control" rows="7" ng-focus="citem.IsSelected" placeholder="Enter Chief Complaints" ng-change="changeChiefComplaint(citem)" ng-model="citem.Description" maxlength="1000"></textarea>
                    <a href="javascript:;" ng-click="DeleteCheifComplaints(citem, $index)">
                        <img src="img/close-red.svg" width="16" />
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
