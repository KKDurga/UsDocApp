<div class="modal-header">
    <h4 class="modal-title">Appointments List</h4>
    <button type="button" class="btn btn-link" ng-click="uibclose()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body p-0">
    <div class="row">
        <div class="col-lg-12">
            <ul class="appointment-vsts-list h-scroll" ng-style="heightIO()" resize>
                <li ng-repeat="item in CaseHistory" ng-class="SelectedAppointment.AppointmentId ==item.AppointmentId?'active':''"
                    ng-click="ChangesConsultation(item)">
                    <div class="flex m-l-10 ng-scope">
                        <span class="date-bg-visits" ng-bind="item.AppointmentDate | date:'dd MMM yyyy'"></span>
                        <span class="time-bg-visits" ng-bind="item.StartTime |amPm">11:30 AM</span>
                        <span class="text-s12w500c000 dis-block m-t-4">Dr. {{item.DoctorName}}</span>
                        <span class="text-s12w500c000 dis-block m-t-4"> {{item.AppointmentTypeName}} | {{item.VisitReason}}</span>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
