<!--New Design started-->
<div class="modal__style--1 height__100--">
    <div class="modal__header--">
        <h1>{{ 'CANCELAPPOINTMNT' | translate}}</h1>

        <ul class="us-controls">
            <li>
                <div class="d__f-- ai__c-- gap__5-- bs__solid-- bw__1-- border__1D5558-- p__5-- bradius-5" popover-template="'templates/UIBPopovers/patientDetailsPopover.html'" popover-data="{detailsSummary : PaitentDetails, postalAddressSummary : PostalAddressSummaryObj, permanentAddressSummary : PermanentAddressSummaryObj,patientMobileNumber : PatientMobileNumber , patientOfficeNumber : PatientOfficeNumber,demographicSummary : DemographicSummaryObj}" popover-class="profile__popover" dynamic-click-popover-placement ng-click="patiendetilsopen()">
                    <img ng-if="CancelAppointmentobj.S3URL != ''" width="28" height="28" image-viewer src="{{CancelAppointmentobj.S3URL}}" />
                    <img ng-if="CancelAppointmentobj.S3URL == ''" width="28" height="28" src="img/sprite-sheet/user-square.svg" />
                    <div class="vs__list-- gap__0--">
                        <span>{{CancelAppointmentobj.PatientName}}</span>
                        <span><span class="fw__4-- tc__656565--">MR No : </span>{{CancelAppointmentobj.PatientDisplayId}}</span>
                    </div>
                    <span><i class="icons__w16-- info__w16--f"></i></span>
                </div>
            </li>
            <li>
                <a class="fs__lg-- fw__5-- tc__C71D27--" ng-click="CancelclosePopup()">{{ 'NO' | translate}}</a>
            </li>
            <li>
                <button class="btn__lg-- btn__1d5558--f px__20--" ng-click="UpdateAppt(Cancelform,CancelAppointmentobj.CancelReasonId,CancelAppointmentobj.OtherCancelReason)">{{ 'YES' | translate}}</button>
            </li>
            <li>
                <a class="btn__close--2" ng-click="CancelclosePopup()">
                    <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
                </a>
            </li>
        </ul>
    </div>

    <div class="modal__body-- height__100--">
        <div class="d__f-- fd__c-- gap__10-- p__10--">
            <div class="border__E4E4E4-- bg__F9F9F9-- bradius__5-- p__5-- d__f-- ai__c-- gap__10--">
                <img image-viewer ng-if="CancelAppointmentobj.S3URL != ''" src="{{CancelAppointmentobj.S3URL}}" width="48" height="48" class="bradius__15--" />
                <img ng-if="CancelAppointmentobj.S3URL == ''" src="img/sprite-sheet/user-square.svg" width="48" height="48" class="bradius__15--" />
                <div class="d__f-- fd__c--">
                    <label class="fs__xl-- fw__6-- tc__000--">{{Patientname}}</label>
                    <div class="d__f-- ai__c-- gap__10--">
                        <label class="fs__lg-- fw__5-- tc__1D1D1D--"><span class="tc__656565--">Appt. Date : </span>{{CancelAppointmentobj.AppointmentDate_Time | date:'MM-dd-yyyy'}}</label>
                        <label class="fs__lg-- fw__5-- tc__1D1D1D--"><span class="tc__656565--">Appt. Time : </span>{{CancelAppointmentobj.AppointmentDate_Time | date:'hh:mm a'}}</label>
                        <label class="fs__lg-- fw__5-- tc__1D1D1D--"><span class="tc__656565--">Doctor : </span>{{CancelAppointmentobj.Doctor_Name}}</label>
                    </div>
                </div>
            </div>
            <div class="p__10-- bg__F9E8E9-- bradius__5-- d__f-- fd__c-- gap__10--">
                <label class="fs__xl-- fw__6-- tc__3C3C3C--">{{ 'AREYOUSUREYOUWANTTOCANCELTHISAPPOINTMENTFOR' | translate}}</label>
                <div class="row nocolpad">
                    <div class="col-lg-3">
                        <div class="form__group">
                            <label>{{ 'REASONFORCANCELLATION' | translate}}</label>
                            <select ng-model="CancelAppointmentobj.CancelReasonId"
                                    ng-options="item.CancelVisitReasonId as item.CancelReason for item in CancelAppointmentobj.CancelAppReason"
                                    ng-change="ChnageCancelReasion(CancelAppointmentobj.CancelReasonId);">
                                <option value="" ng-selected="true" disabled>{{ 'SELECTCANCELREASON' | translate}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-lg-6" ng-show="CancelAppointmentobj.CancelReasonId != 0">
                        <div class="form__group">
                            <label>{{ 'OTHERS' | translate}}</label>
                            <textarea rows="1" ng-model="CancelAppointmentobj.OtherCancelReason" placeholder="{{ 'ENTEROTHERCANCELREASON' | translate}}" />
                        </div>
                    </div>
                    <div class="col-lg-3" ng-show="CancelAppointmentobj.CancelReasonId!=11&&CancelAppointmentobj.CancelReasonId != 0&&ReminderDate==''">
                        <button class="btn__lg-- btn__C71D27--o" ng-click="ClickRemindersPopup('',2)">Add to Recall</button>
                    </div>
                    <div class="col-lg-3" ng-show="CancelAppointmentobj.CancelReasonId!=11&&CancelAppointmentobj.CancelReasonId != 0&&ReminderDate != ''">
                        <span>ReminderDate: {{ReminderDate| date:"MM-dd-yyyy"}}</span>
                    </div>
                    <div class="col-lg-3" ng-show="CancelAppointmentobj.CancelReasonId!=11&&CancelAppointmentobj.CancelReasonId != 0&&ReminderDate != ''">
                        <button class="btn__lg-- btn__C71D27--o" ng-click="ClickRemindersPopup(ReminderDate,2)">Edit</button>
                    </div>
                </div>
            </div>
            <div class="row nocolpad">
                <div class="col-lg-6">
                    <div class="d__f-- fd__c--">
                        <label class="fs__lg-- fw__5-- tc__5E6366--">{{ 'SENDSMSTO' | translate}}</label>
                        <div class="d__f-- ai__c-- gap__10--">
                            <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                <input type="checkbox" class="checkbox" ng-model="CancelAppointmentobj.sendDocSms">
                                <span class="lbl"></span>
                                <span class="fs__lg-- fw__4-- tc__5E6366--">{{ 'DOCTOR' | translate}}</span>
                            </label>
                            <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                <input type="checkbox" class="checkbox" ng-model="CancelAppointmentobj.sendPatientSms">
                                <span class="lbl"></span>
                                <span class="fs__lg-- fw__4-- tc__5E6366--">{{ 'PATIENT' | translate}}</span>
                            </label>
                            <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                <input type="checkbox" class="checkbox" ng-model="CancelAppointmentobj.IsSmsLanguageIdInd">
                                <span class="lbl"></span>
                                <span class="fs__lg-- fw__4-- tc__5E6366--">English</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="d__f-- fd__c--">
                        <label class="fs__lg-- fw__5-- tc__5E6366--">{{ 'SENDEMAILTO' | translate}}</label>
                        <div class="d__f-- ai__c-- gap__10--">
                            <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                <input type="checkbox" class="checkbox" ng-model="CancelAppointmentobj.sendDocEmail">
                                <span class="lbl"></span>
                                <span class="fs__lg-- fw__4-- tc__5E6366--">{{ 'DOCTOR' | translate}}</span>
                            </label>
                            <label class="cur-poiter d__f-- ai__c-- gap__5--">
                                <input type="checkbox" class="checkbox" ng-model="CancelAppointmentobj.sendPatientEmail">
                                <span class="lbl"></span>
                                <span class="fs__lg-- fw__4-- tc__5E6366--">{{ 'PATIENT' | translate}}</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--New design ended-->

<div class="modal-common-dialog" ng-if="false">
    <div class="dis-flex flex-direction-column bg-white bradius-5">
        <div class="dis-flex align-items-center justify-space-between p-10 bg-EBEEF3 bradius-top-5 ">
            <h1 class="m-0 fs-16 font-weight-600 text-black">{{ 'CANCELAPPOINTMNT' | translate}}</h1>
            <a class="btn__close--" ng-click="CancelclosePopup()">
                <i class="close__w32--"></i>
            </a>
        </div>
        <div class="p-10 dis-flex flex-direction-column grid-gap-10">

                </div>
                <div class="dis-flex grid-gap-10 flex-direction-column">

                    <div class="div__list">

                            <span>Appt. Date:</span>

                            <span>Doctor:</span>

                        </div>
                    </div>
                </div>
            </div>
            <div>
                <hr class="m-0 border-dashed-7A7A7A" />
            </div>
            <div class="bg-FCE9EA p-10 bradius-5 dis-flex flex-direction-column grid-gap-10">
                <div class="row nocolpad">

                    </div>
                </div>
                <div class="row nocolpad">

                            <label>{{ 'REASONFORCANCELLATION' | translate}}</label>

                            <select ng-model="CancelAppointmentobj.CancelReasonId"
                                    ng-options="item.CancelVisitReasonId as item.CancelReason for item in CancelAppointmentobj.CancelAppReason"
                                    ng-change="ChnageCancelReasion(CancelAppointmentobj.CancelReasonId);">
                                <option value="" ng-selected="true" disabled>{{ 'SELECTCANCELREASON' | translate}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-lg-5 col-md-6">
                        <div class="form__group" ng-show="CancelAppointmentobj.CancelReasonId != 0">
                            <label>{{ 'OTHERS' | translate}}</label>
                            <textarea rows="1" class="form__control" ng-model="CancelAppointmentobj.OtherCancelReason" placeholder="{{ 'ENTEROTHERCANCELREASON' | translate}}" />
                        </div>
                    </div>
                    <!--<div class="col-lg-2 col-md-2">
                        <input type="checkbox" class="checkbox" ng-model="CancelAppointmentobj.IsAddtoRecall"
                             ng-change="Changerecall(CancelAppointmentobj.IsAddtoRecall)" />
                        <span class="lbl"></span>
                        <span class="list-opt-text-new">Add to Recall</span>
                    </div>-->
                    <div class="col-lg-2 col-md-2" ng-show="CancelAppointmentobj.IsAddtoRecall==true">
                        <div class="form__group">
                            <label>Re-Call</label>
                            <!--<input type="text" class="icons-calendar" class="form-outline"/>  datepickeruniversaldate-->
                            <input type="text" placeholder="MM-DD-YYYY" ng-model="CancelAppointmentobj.RecallDate" datepickerforapplist readonly
                                   ng-change="ChangeFormatDate()" class="icons-calendar" />


                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div class="row nocolpad">
                    <div class="col-lg-9">
                        <div class="dis-flex">
                            <div class="form-group">
                                <div class="checkbox cn mr-10">
                                    <label><b>{{ 'SENDSMSTO' | translate}} </b></label>
                                    <label>
                                        <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.sendDocSms" />
                                        <span class="checkbox-material">
                                            <span class="check"></span>
                                        </span>
                                        <small>{{ 'DOCTOR' | translate}}</small>
                                    </label>
                                    <label>
                                        <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.sendPatientSms" />
                                        <span class="checkbox-material">
                                            <span class="check"></span>
                                        </span>
                                        <small>{{ 'PATIENT' | translate}}</small>
                                    </label>
                                    <label>
                                        <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.IsSmsLanguageIdInd" />
                                        <span class="checkbox-material">
                                            <span class="check"></span>
                                        </span>
                                        <small>English</small>
                                    </label>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="checkbox cn mr-10">
                                    <label><b>{{ 'SENDEMAILTO' | translate}}</b></label>
                                    <label>
                                        <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.sendDocEmail" />
                                        <span class="checkbox-material">
                                            <span class="check"></span>
                                        </span>
                                        <small>{{ 'DOCTOR' | translate}}</small>
                                    </label>
                                    <label>
                                        <input name="checkbox-1" type="checkbox" ng-model="CancelAppointmentobj.sendPatientEmail" />
                                        <span class="checkbox-material">
                                            <span class="check"></span>
                                        </span>
                                        <small>{{ 'PATIENT' | translate}}</small>
                                    </label>
                                </div>
                                <!-- / -->

                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="dis-flex align-items-center grid-gap-10 justify-content-end">
                            <button class="btn__lg-- btn__C71D27--o" ng-click="CancelclosePopup()"> {{ 'NO' | translate}}</button>
                            <button class="btn__lg-- btn__1d5558--f" ng-click="UpdateAppt(Cancelform,CancelAppointmentobj.CancelReasonId,CancelAppointmentobj.OtherCancelReason)">{{ 'YES' | translate}}</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
