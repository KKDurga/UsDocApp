<div class="modal-header dis-flex justify-space-between">
    <h4 class="modal-title">Intervention</h4>
    <div class="dis-flex align-items-center">
        <button class="btn btn-discard-us m-r-5" ng-click="uibclose()">Close</button>
    </div>
</div>
 
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12 p-l-0 p-r-0 m-b-5">
            <table class="table tableno-bordered m-b-0" ng-if="CDAinventionNotificationArray.length>0">
                <thead ng-repeat="item in CDAinventionNotificationArray track by $index">
                    <tr>
                        <th class="bg-dbf6ff">
                            <label class="fs-14"> {{item.CDAIntreventionName}}</label>
                        </th>
                    </tr>
                    <tr>
                        <td ng-repeat="ritem in item.RuleData" ng-if="item.RuleData.length>0">


                            <spann ng-show="ritem.RuleName !=''">{{ritem.RuleName}}</spann>
                            <spann ng-show="ritem.RuleName ==''">-</spann>
                        </td>
                        <td ng-if="item.RuleData.length==0">
                            <spann>-</spann>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5" class="bg-fff9e2">
                            <table class="table tableno-bordered m-b-0" ng-if="sitem.RuleDetails.length>0" ng-repeat="sitem in item.RuleData">
                                <thead class="coloured">
                                    <tr class="text-underline">
                                        <td> Intervention Name</td>
                                        <td> Condition  </td>
                                        <td> Value  </td>
                                    </tr>
                                </thead>
                                <tbody ng-repeat="nitem in item.RuleData">
                                    <tr ng-repeat="sitem in nitem.RuleDetails">
                                        <td>
                                            {{sitem.IntreventionTypeName}}
                                            <span ng-if="sitem.CategoryName!=''">
                                                ({{sitem.CategoryName}})
                                            </span>
                                        </td>
                                        <td>
                                            {{sitem.ConditionName}}
                                            <span ng-hide="sitem.VitalBpValueCodition==''||sitem.VitalBpValueCodition==null"> -  {{sitem.VitalBpValueCodition}}</span>
                                        </td>
                                        <td>
                                            {{sitem.ValueName}}
                                            <span ng-hide="sitem.VitalBpValue==''||sitem.VitalBpValue==null"> - {{sitem.VitalBpValue}}</span>
                                            <span ng-hide="sitem.VitalValueUnit==''||sitem.VitalValueUnit==null">({{sitem.VitalValueUnit}})</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</div>
