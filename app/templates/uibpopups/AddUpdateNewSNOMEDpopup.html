<div>
    <div class="modal-header">
        <button type="button" class="close m-t-0" ng-click="close();">
            <i class="fas fa-times text-danger"></i>
        </button>
    </div>
    <div class="modal-body p-10">
        <div class="row">
            <div class="col-lg-12">
                <div class="table-responsive">
                    <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
                        <tbody>
                            <tr>
                                <td>
                                    <div class="form-group">
                                        <label>Concept Id <em>*</em></label>
                                        <input type="text" class="form-control" ng-model="SnomedCodesObj.ConceptId" numbers-only="numbers-only" />

                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <label>Description</label>
                                        <input type="text" class="form-control" ng-model="SnomedCodesObj.Description" />
                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <label>Type</label>
                                        <select class="form-control" ng-model="SnomedCodesObj.TypeObj"
                                                ng-options="item as item.Value for item in ProcedureTypes" ng-change="ChangeSnomedProcedureType(SnomedCodesObj)">
                                            <option value="" selected>Select</option>
                                        </select>
                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <label>Effective Date</label>
                                        <input type="text" class="form-control icons-calendar" ng-model="SnomedCodesObj.EffectiveTime" datepickerforusformat />
                                    </div>
                                </td>

                            </tr>
                            <tr>
                                <td>
                                    <div class="form-group">
                                        <label>Entered By</label>
                                        <input type="text" class="form-control" ng-model="SnomedCodesObj.EnterBy" disabled />
                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <label>Entered Date</label>
                                        <input type="text" class="form-control icons-calendar" ng-model="SnomedCodesObj.EnteredDate" datepickerforusformat />
                                    </div>
                                </td>
                                <td>
                                    <div class="form-group">
                                        <label>Modified Staff</label>
                                        <input type="text" class="form-control" ng-model="SnomedCodesObj.ModifiedName" disabled />
                                    </div>
                                </td>

                                <td class="valign-bottom">
                                    <div class="form-group dis-flex">
                                        <button class="btn btn-warning flex m-l-5" ng-click="ClearSnomedCodes()">Clear</button>
                                        <button class="btn btn-success flex m-l-5" ng-click="AddUpdateSnomedCodes()">Save</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>



</div>
