<div class="row">
    <div class="col-lg-12">
        <table class="table table-bordered m-b-0 tableno-padding referral-table">
            <thead>
                <tr>
                    <th><label>User</label></th>
                    <th><label>Date & Time</label></th>
                    <th><label>Appt.Status</label></th>
                    <th><label>Appt Doctor</label></th>
                    <th><label>Visit Reason</label></th>
                    <th><label>Appt Time</label></th>
                    <th><label>Status</label></th>
                    <!--<th>Modified By</th>-->
                </tr>
            </thead>
            <tbody ng-repeat="item in CreateModifyApptsUserlist track by $index">
                <tr ng-repeat="eitem in item.ModifyedByUserArray track by $index">
                    <td>
                        <span>{{eitem.CreatedBy}}</span>
                    </td>
                    <td>
                        <span>{{eitem.ModifiedDt | date:'MM-dd-yyyy,hh:mm a'}}</span>
                    </td>
                    <td>
                        <span ng-hide="eitem.AppointmentStatusId ==1">{{eitem.AppointmentStatusName}} - </span>
                        <span>{{eitem.BookingStatus}}  </span>
                    </td>
                    <td><span>{{eitem.UserName}}</span></td>
                    <td><span>{{eitem.VisitReason}}</span></td>
                    <td><span>{{convertTo12HourFormat(eitem.AppointmentTime)}}</span></td>
                    <td> 
                        <span ng-show="$first">Created </span>
                        <span ng-show="!$first">Modified</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
