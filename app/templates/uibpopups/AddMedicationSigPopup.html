
<div class="modal__style--1" ng-if="false">
    <div class="modal__header--">
        <h1>
            Add Sig Template
        </h1>
        <ul class="list__unstyled-- d__f-- ai__c-- gap__x--8 m__0--">
            <li>
                <button class="btn__lg-- btn__C71D27--" ng-click="clearOrganizationSiginput(addNewOrganizationSigObj)">Clear</button>
            </li>
            <li>
                <button class="btn__lg-- btn__1d5558--f" ng-click="SaveOrganizationSig()">Save</button>
            </li>
            <li>
                <button class="btn__lg-- btn__1d5558--f" ng-click="SaveOrganizationSig('Close')">Save & Close</button>
            </li>
            <li>
                <a class="btn__close--" ng-click="closeSigPopup()">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body-- d__f-- fd__c-- gap__y--8">
        <section class="consultation-summary-container">
            <div class="consultation-summary-body">
                <div class="row">
                    <div class="col-lg-12">
                        <table class="table tableno-bordered m-b-0 tableno-padding">
                            <tbody>
                                <tr>
                                    <td>
                                        <ul class="flex-flow-ulli pull-right">
                                            <li>Sig -</li>
                                        </ul>
                                    </td>
                                    <td colspan="5"><input type="text" class="form-control" placeholder="Search " ng-model="addNewOrganizationSigObj.Sig" /></td>
                                </tr>
                                <tr>
                                    <td>
                                        <div class="ehr-input">
                                            <label> Action</label>
                                            <select class="form-control" ng-model="addNewOrganizationSigObj.ActionId"
                                                    ng-change="changePopupPrescAction(addNewOrganizationSigObj)"
                                                    ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in actionArray">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="ehr-input">
                                            <label>Dose</label>
                                            <select class="form-control" ng-model="addNewOrganizationSigObj.DoseId" ng-change="changePopupPrescDose(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in doseArray">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="ehr-input">
                                            <label>Dose Unit</label>
                                            <select class="form-control" ng-model="addNewOrganizationSigObj.DoseUnitId" ng-change="changePopupPrescDoseUnit(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in doseUnitArray">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="ehr-input">
                                            <label>Route</label>
                                            <select class="form-control" ng-model="addNewOrganizationSigObj.RouteId" ng-change="changePopupPrescRoute(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in routeArray">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td colspan="2">
                                        <div class="ehr-input">
                                            <label>Dose Timing</label>
                                            <select class="form-control" ng-model="addNewOrganizationSigObj.FrequencyId" ng-change="changePopupPrescFrequency(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in frequencyArray">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <div class="ehr-input">
                                            <label>Other</label>
                                            <select class="form-control" ng-model="addNewOrganizationSigObj.DoseOtherId" ng-change="changePopupPrescDoseOther(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in doseOtherArray">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="ehr-input">
                                            <label>Days Supply</label>
                                            <select class="form-control" ng-model="addNewOrganizationSigObj.DaysSupplyId" ng-change="changePopupPrescDaysSupply(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in durationArray">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="ehr-input">
                                            <label>Quantity<em>*</em></label>
                                            <input type="text" class="form-control" ng-model="addNewOrganizationSigObj.Quantity" placeholder="1" />
                                        </div>
                                    </td>
                                    <td>
                                        <div class="ehr-input">
                                            <label>Quantity Unit</label>
                                            <select class="form-control" ng-model="addNewOrganizationSigObj.QuantityUnitId" ng-change="changePopupPrescQuantityUnit(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in quantityUnitArray">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="ehr-input">
                                            <label>Refills</label>
                                            <select class="form-control" ng-model="addNewOrganizationSigObj.RefillId" ng-change="changePopupPrescRefill(addNewOrganizationSigObj)" ng-options="aitem.MedicineDosaageFieldId as aitem.Description for aitem in refillsArray">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="ehr-input">
                                            <label>Substitution</label>
                                            <select class="form-control" ng-model="presc.SubstitutionPermitted" ng-change="changePrescSubmission(presc)">
                                                <option value="">Select</option>
                                                <option value="y">Yes</option>
                                                <option value="n">No</option>
                                            </select>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="6">
                                        <div class="border-right">
                                            <label class="cur-poiter">
                                                <input type="checkbox" id="1" value="Latent" class="checkbox ng-pristine ng-valid ng-touched" ng-model="addNewOrganizationSigObj.IsFrequent" aria-invalid="false" style="">
                                                <span class="lbl"></span>
                                                <span class="list-opt-text-new">FrequentlyAdded</span>
                                            </label>
                                        </div>
                                    </td>

                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
        <div class="row">
            <div class="col-lg-12">
                <table class="table table-striped table-bordered m-b-0 tableno-padding">
                    <thead ng-show="GetOrganizationMedicationSigArrayList.length != 0">
                        <tr>
                            <th>S.No</th>
                            <th class="dis-flex">
                                Sig
                            </th>
                            <th>FrequentlyAdded</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in GetOrganizationMedicationSigArrayList track by $index">
                            <td class="text-center">
                                <span class="text-s12w500c000">
                                    {{$index+1}}
                                </span>
                            </td>
                            <td>
                                <span class="text-s12w500c000">
                                    {{item.Sig}}
                                </span>
                            </td>
                            <td>
                                <span class="text-s12w500c000">
                                    <input type="checkbox" id="1" value="Latent" class="checkbox ng-pristine ng-valid ng-touched" disabled="disabled" ng-model="item.IsFrequent" aria-invalid="false" style=""><span class="lbl"></span>
                                </span>
                            </td>
                            <td width="6%">
                                <div class="ehr-input dis-flex">
                                    <a class="cur-poiter m-l-10" alt="delete" uib-tooltip="Delete" ng-click="DeleteSig(item)">
                                        <img width="17" src="img/ico-delete-red.svg">
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="row m-t-10" ng-show="GetOrganizationMedicationSigArrayList.length > 0">
            <div class="col-lg-12 EH-pagination text-center">
                <uib-pagination total-items="totalSigCount"
                                ng-model="addNewOrganizationSigObj.PageNumber"
                                ng-change="allSigPagechanged(addNewOrganizationSigObj.PageNumber)"
                                ng-show="GetOrganizationMedicationSigArrayList.length > 0"
                                max-size="addNewOrganizationSigObj.PageSize"
                                class=""
                                boundary-link-numbers="true"
                                rotate="false"></uib-pagination>
            </div>
        </div>
    </div>
</div>
