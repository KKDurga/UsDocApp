<div class="row">
    <div class="col-lg-12">
        <table class="table__style--5">
            <thead>
                <tr>
                    <th width="20%"><label class="fs__lg-- fw__5-- tc__1D1D1D--">User Role & Name</label></th>
                    <th width="20%"><label class="fs__lg-- fw__5-- tc__1D1D1D--">Date & Time</label></th>
                    <th width="20%"><label class="fs__lg-- fw__5-- tc__1D1D1D--">Audit Status</label></th>
                    <th><label class="fs__lg-- fw__5-- tc__1D1D1D--">Details/Remarks</label></th>
                </tr>
            </thead>
            
            <tbody ng-if="ASCAuditLogArray.length>0">
                <tr ng-repeat="eitem in ASCAuditLogArray track by $index">
                    <td>
                        <div class="d__f-- fd__c-- gap__5--">
                            <label class="fs__lg-- fw__6-- tc__4A4A4A--">Auditor</label>
                            <span class="fs__lg-- fw__5-- tc__656565--">{{eitem.ModifiedByName}}</span>
                        </div>        
                    </td>
                    <td>
                        <div class="d__f-- fd__c-- gap__5--">
                            <label class="fs__lg-- fw__5-- tc__4A4A4A--">{{eitem.ModifiedDt | date:"MM-dd-yyyy"}}</label>
                            <span class="fs__lg-- fw__5-- tc__656565--">{{eitem.ModifiedDt | date:"hh:mm a"}}</span>
                        </div>                        
                    </td>
                    <td>
                        <label class="fs__lg-- fw__5-- tc__4A4A4A-- d__f-- ai__c-- gap__5--" ng-if="eitem.AddReportStatusId==2"><i class="icons__w16-- completed__w16--f"></i>Completed</label>
                        <!--<label class="fs__lg-- fw__5-- tc__4A4A4A-- d__f-- ai__c-- gap__5--" ng-if="false"><i class="icons__w16-- sendtoPreview__w16--f"></i>Sent to review</label>-->
                        <label class="fs__lg-- fw__5-- tc__4A4A4A-- d__f-- ai__c-- gap__5--" ng-if="eitem.AddReportStatusId==1"><i class="icons__w16-- cancel__w16--f"></i>Failed</label>
                    </td>
                    <td><label class="fs__lg-- fw__5-- tc__4A4A4A-- text-left">{{eitem.AddReportRemarks}}</label></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
