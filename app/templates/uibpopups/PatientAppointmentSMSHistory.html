<div class="modal-header">
    <h4 class="modal-title">Patient Name : {{PatientApptObj.PatientName}}</h4>
    <button type="button" class="btn btn-link" ng-click="CloseviewPopup()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table tableno-bordered m-b-0 regsiter-tablespan bg-white">
                    <thead>
                        <tr>
                            <th style="width:8%">SNo</th>
                            <th style="width:15%">Date</th>
                            <th style="width:12%">status</th>
                            <th style="width:65%">message</th>
                          
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in PatientApptObj.SMSHistory track by $index">
                            <td> {{$index+1}}</td>
                            <td>{{item.SMSDate | date:'dd-MM-yyyy HH:mm:ss'}} </td>
                            <td>
                                 
                                <span ng-show="item.Direction=='outbound-api'">Sent <i class="fa fa-arrow-right" aria-hidden="true"></i></span>
                                <span ng-show="item.Direction=='outbound-reply'">Sent   <i class="fa fa-arrow-right" aria-hidden="true"></i></span>
                                <span ng-show="item.Direction=='inbound-msg'">Received <i class="fa fa-arrow-left" aria-hidden="true"></i></span>
                            </td>
                            <td>{{item.SMSContent}} </td>

                       
                          

                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
<div class="modal-footer">
    <div class="row">
        <div class="col-lg-12 text-right">
            <button type="submit" class="betn btn-light-border" ng-click="CloseviewPopup()">Close</button>

        </div>
    </div>
</div>
