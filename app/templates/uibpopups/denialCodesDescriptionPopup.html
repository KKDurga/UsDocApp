<div class="modal__content--">
    <div class="modal__header--">
        <div class="d__f-- ai__c-- gap__10--">
            <div class="w__28-- h__28-- bradius__6-- bg__FFFFFF1A-- d__f-- ai__c-- jc__c--">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <circle cx="7" cy="7" r="5.5" stroke="#fca5a5" stroke-width="1.4"></circle>
                    <path d="M7 6v4" stroke="#fca5a5" stroke-width="1.4" stroke-linecap="round"></path>
                    <circle cx="7" cy="4.5" r="0.75" fill="#fca5a5"></circle>
                </svg>
            </div>
            <div>
                <span class="fs__lg-- fw__7-- tc__F9FAFB--">Denial Code Reference</span><br />
                <span class="fs__sm-- tc__9CA3AF--">{{uniqueCount}} denial codes · {{totalCount}} total</span>
            </div>
        </div>
        <a class="btn__close--3" ng-click="uibclose()">
            <i class="icons__w16-- close__w16--w"></i>
        </a>
    </div>

    <div class="modal__body--">
        <div class="py__8-- px__18-- bg__FFFFFF0A-- bb__FFFFFF1A-- d__b--" ng-if="item.PatientClaimNumber !== '' || item.PatientFullName !== '' || item.PayorName !== '' || item.DOSFrom !== ''">
            <div class="d__f-- ai__c-- gap__16-- fw__w--">
                <div class="d__f-- ai__c-- gap__6--" ng-if="item.PatientClaimNumber !== ''">
                    <span class="fs__xs-- fw__6-- tc__FFFFFF59-- tt__u--">Claim No.</span>
                    <span class="fs__md-- fw__7-- tc__F9FAFB--">{{item.PatientClaimNumber}}</span>
                </div>
                <div class="d__f-- ai__c-- gap__6--" ng-if="item.PatientFullName !== ''">
                    <span class="fs__xs-- fw__6-- tc__FFFFFF59-- tt__u--">Patient</span>
                    <span class="fs__md-- fw__7-- tc__F9FAFB--">{{item.PatientFullName}}</span>
                </div>
                <div class="d__f-- ai__c-- gap__6--" ng-if="item.PayorName !== ''">
                    <span class="fs__xs-- fw__6-- tc__FFFFFF59-- tt__u--">Payer</span>
                    <span class="fs__md-- fw__5-- tc__9CA3AF--">{{item.PayorName}}</span>
                </div>
                <div class="d__f-- ai__c-- gap__6--" ng-if="item.DOSFrom !== ''">
                    <span class="fs__xs-- fw__6-- tc__FFFFFF59-- tt__u--">DOS</span>
                    <span class="fs__md-- fw__5-- tc__9CA3AF--">{{item.DOSFrom | date:'MM/dd/yyyy'}}</span>
                </div>
            </div>
        </div>

        <table class="table__style--32 mt__5-- slim-scroll">
            <tbody>
                <tr ng-repeat="denial in denialCodes track by $index">
                    <td>{{$index + 1}}</td>
                    <td><span class="tc__FCA5A5--">{{denial.DenialCode}}</span></td>
                    <td>{{denial.DenialCodeDescription}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
