<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Add New</h1>
        <ul class="us-controls">
            <li>
               <a class="btn__close--" ng-click="closeuibpopup();">
                    <i class="close__w32--"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body--">
        <div class="form__group">
            <label>
                Finding <em>*</em>
            </label>
            <select ng-options="item.InvestigationId as item.InvestigationDesc for item in AnteriorPosteriorObj.FindingValuesArray"
                    ng-model="AnteriorPosteriorObj.InvestigationId"
                    ng-change="onSelectFindingValue(AnteriorPosteriorObj.InvestigationId,AnteriorPosteriorObj)">
                <option value="" disabled>Select</option>
            </select>
        </div>
        <div class="form__group">
            <label>Finding Value<em>*</em></label>
            <input type="text" ng-model="AnteriorPosteriorObj.FindingValue " placeholder="Enter Finding Value" />
        </div>
    </div>
    <div class="modal__footer--">
        <button class="btn__xl-- btn__1d5558--f" ng-click="SaveFindingValues()">Save</button>
    </div>
</div>
