<div class="modal-header">
    <h4 class="modal-title">Sign Off Details</h4>
    <button type="button" class="btn btn-link" ng-click="CloseCosultPop()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <table class="table-eh">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Doctor Name</th>
                        <th>Visit Reason</th>
                        <th ng-show="RoleId === 16">Scriber Name</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in cacheStorageItem.ConsultationLogArray">
                        <td ng-bind="item.ModifiedDate| date : 'MM-dd-y HH:mm:ss' "></td>
                        <td>Dr.{{item.DoctorName}}</td>
                        <td>Dr.{{item.VisitReasonName}}</td>
                        <td ng-show="RoleId === 16">Dr.{{item.ModifiedUserName}}</td>
                        <!--<td>lorem ipsum dolor sit amet</td>
                        <td>Santhosh Reddy</td>-->
                        <td>
                            <span ng-if="item.Status == 'B'" class="text-profile-booked">Booked</span>
                            <span ng-if="item.Status == 'C'" class="text-profile-completed">Completed</span>
                            <span ng-if="item.Status == 'S'" class="text-profile-reschedule">Started</span>
                            <span ng-if="item.Status == 'O'" class="text-profile-ongoing">Ongoing</span>
                            <span ng-if="item.Status == 'D'" class="text-profile-saved">Saved</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
