<div class="row">

            <h1 class="text-068cb0">Evaluation</h1>
            <ul class="us-controls">
                <li>
                    <button class="btn btn-save-us m-r-5">Save</button>
                </li>
                <li>
                    <button class="btn btn-discard-us m-r-5" ng-click="uibclose()">Close</button>
                </li>
            </ul>
        </div>
        <div class="modal-body p-5">
            <div class="row">
                <div class="col-lg-12">
                    <div class="consultation-ros">
                        <section class="eh-panel">
                            <div class="eh-header justify-flex-start">
                                <h1>Previous Anesthetics</h1>
                                <ul class="yesno-switch m-l-5">
                                    <li ng-class="(cacheStorageItem.PrevAnestheticsObj.IsPrevAnesthesia== true)?'active':''" ng-click="OnSelectPrevAnesthesiaBtn(1);">Yes</li>
                                    <li ng-class="(cacheStorageItem.PrevAnestheticsObj.IsPrevAnesthesia == false)?'active':''" ng-click="OnSelectPrevAnesthesiaBtn(2);">No</li>
                                </ul>
                            </div>
                            <div class="eh-body">
                                <div class="row">
                                    <div class="col-lg-12 m-t-5">
                                        <div class="table-responsive">
                                            <table class="table tableno-bordered m-b-0">
                                                <tbody>
                                                    <tr>
                                                        <td>
                                                            <div class="form-group dis-flex">
                                                                <label class="m-b-0  w-120 text-767575">Complications</label>
                                                                <ul class="yesno-switch m-l-5">
                                                                    <li ng-class="(cacheStorageItem.PrevAnestheticsObj.IsComplications== true)?'active':''" ng-click="OnSelectPrevAnesthesiaBtn(3);">Yes</li>
                                                                    <li ng-class="(cacheStorageItem.PrevAnestheticsObj.IsComplications== false)?'active':''" ng-click="OnSelectPrevAnesthesiaBtn(4);">No</li>

                                                            </div>
                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="ehr-input  pop-ehr-input">
                                                                <textarea type="text" rows="4" placeholder="Notes" ng-model="cacheStorageItem.PrevAnestheticsObj.Notes"></textarea>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <div class="col-lg-12">
                                        <ul class="flex-flow-ulli">
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-1" type="checkbox" ng-model="cacheStorageItem.PrevAnestheticsObj.IsFamilyHistory">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small class="text-s14w500c000 m-l-5">
                                                            Family/pt History
                                                        </small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-1" type="checkbox" ng-model="cacheStorageItem.PrevAnestheticsObj.IsDifficultAirway">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small class="text-s14w500c000 m-l-5">
                                                            Difficult airway
                                                        </small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-1" type="checkbox" ng-model="cacheStorageItem.PrevAnestheticsObj.IsPONV">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small class="text-s14w500c000 m-l-5">
                                                            PONV
                                                        </small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-1" type="checkbox" ng-model="cacheStorageItem.PrevAnestheticsObj.IsPatientDNR">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small class="text-s14w500c000 m-l-5">
                                                            Patient is DNR
                                                        </small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-1" type="checkbox" ng-model="cacheStorageItem.PrevAnestheticsObj.IsSuspend">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small class="text-s14w500c000 m-l-5">
                                                            Suspend
                                                        </small>
                                                    </label>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-1" type="checkbox" ng-model="cacheStorageItem.PrevAnestheticsObj.IsContinue">
                                                        <span class="checkbox-material">
                                                            <span class="check"></span>
                                                        </span>
                                                        <small class="text-s14w500c000 m-l-5">
                                                            Continue
                                                        </small>
                                                    </label>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </section>

                                                <div class="m-t-5">
                                                    <label>
                                                        <input type="radio" class="radio-custom" ng-model="cacheStorageItem.ASAObj.Value" value="1">
                                                        <b class="text-s14w600c000 radio-custom-label">1 &nbsp;</b> A Normal Healthy Patient
                                                    </label><br />
                                                    <label>
                                                        <input type="radio" class="radio-custom" ng-model="cacheStorageItem.ASAObj.Value" value="2">
                                                        <b class="text-s14w600c000 radio-custom-label">2 &nbsp;</b> A Patient with Mild Systemic Disease
                                                    </label><br />

                                                        <input type="radio" class="radio-custom" ng-model="cacheStorageItem.ASAObj.Value" value="3">

                                                    <textarea type="text" rows="4" placeholder="Notes" ng-model="cacheStorageItem.ASAObj.Notes"></textarea>

                                        </div>
                                    </div>

                        <section class="eh-panel">
                            <div class="eh-header">
                                <h1>Anesthetic Plan</h1>
                            </div>
                            <div class="eh-body">
                                <div class="row">
                                    <div class="col-lg-12">
                                        <table class="table tableno-bordered tableno-padding table-layout-fix">
                                            <tbody>
                                                <tr>
                                                    <td>
                                                        <ul class="ul-Aideret-score">
                                                            <li>
                                                                <button ng-class="(cacheStorageItem.APAnesthesiaOptionsObj.IsTopicalAnesthesia)?'active':''" ng-click="OnSelectAssessPlanOption(1);">Topical Anesthesia</button>
                                                            </li>
                                                        </ul>
                                                    </td>
                                                    <td>
                                                        <ul class="ul-Aideret-score">
                                                            <li>
                                                                <button ng-class="(cacheStorageItem.APAnesthesiaOptionsObj.IsLocalAnesthesia)?'active':''" ng-click="OnSelectAssessPlanOption(2);">Local Anesthesia</button>
                                                            </li>
                                                        </ul>
                                                    </td>

                                                </tr>
                                                <tr>
                                                    <td>
                                                        <ul class="ul-Aideret-score">
                                                            <li>
                                                                <button ng-class="(cacheStorageItem.APAnesthesiaOptionsObj.IsGeneralAnesthesia)?'active':''" ng-click="OnSelectAssessPlanOption(3);">General Anesthesia</button>
                                                            </li>
                                                        </ul>
                                                    </td>
                                                    <td>
                                                        <ul class="ul-Aideret-score">
                                                            <li>
                                                                <button ng-class="(cacheStorageItem.APAnesthesiaOptionsObj.IsRegionalAnesthesia)?'active':''" ng-click="OnSelectAssessPlanOption(4);">Regional Anesthesia</button>
                                                            </li>
                                                        </ul>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td>
                                                        <ul class="ul-Aideret-score">
                                                            <li>
                                                                <button ng-class="(cacheStorageItem.APAnesthesiaOptionsObj.IsPeriBulbarAnesthesia)?'active':''" ng-click="OnSelectAssessPlanOption(5);">Peri-bulbar Anesthesia</button>
                                                            </li>
                                                        </ul>
                                                    </td>
                                                    <td>
                                                        <ul class="ul-Aideret-score">
                                                            <li>
                                                                <button ng-class="(cacheStorageItem.APAnesthesiaOptionsObj.IsSubtenonAnesthesia)?'active':''" ng-click="OnSelectAssessPlanOption(6);">SubTenon's Anesthesia</button>

                                                </tr>

                                                        <div class="ehr-input  pop-ehr-input">

                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="ehr-input  pop-ehr-input">
                                                            <select ng-model="cacheStorageItem.APAnesthesiaOptionsObj.AnesthetistId" ng-options="item.DoctorID as item.FullName for item in AnesthetistArray">

                                                            </select>

                                                        </div>

                                        </table>
