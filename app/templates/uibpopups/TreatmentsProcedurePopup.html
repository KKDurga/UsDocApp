<div class="modal-header">
    <h4 class="modal-title"> {{newObject.OrderType}}</h4>
     
    <!--<button type="button" class="btn btn-link" ng-click="closeConsultationCharges"><i class="fas fa-times"></i></button>-->
</div>
<div class="modal-body p-b-0">
    <div class="row">
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table assessment-table">
                    <tbody>
                         
                        <!-- / -->
                        <tr >
                            <td width="8%" class="valign-top">
                                <span class="img-code-text font-weight-600">
                                    <!--{{newObject.CPTCode}}-->
                                    {{newObject.BillingCode}}
                                </span>
                            </td>
                            <td class="valign-top">
                                <span class="list-text-codde">
                                    {{newObject.Description}}
                                </span>
                                <div class="dis-flex align-flex-end m-t-5">
                                    <div>
                                        <span class="img-code-text">
                                            Eye Location
                                        </span>
                                        <div class="eye-severity m-r-5">
                                            <fieldset class="dis-block">
                                                <div class="dis-inline-block">
                                                    <input type="radio" class="radio-custom width-0" id="dEye_1" name="dEye" ng-value="1" ng-model="newObject.OrganId">
                                                    <label for="dEye_1" class="radio-custom-label cur-poiter mb-0">OD</label>
                                                </div>
                                                <div class="dis-inline-block ml-15">
                                                    <input type="radio" class="radio-custom width-0" id="dEye_2" name="dEye" ng-value="2" ng-model="newObject.OrganId">
                                                    <label for="dEye_2" class="radio-custom-label cur-poiter mb-0">OS</label>
                                                </div>
                                                <div class="dis-inline-block ml-15">
                                                    <input type="radio" class="radio-custom width-0" id="dEye_3" name="dEye" ng-value="3" ng-model="newObject.OrganId">
                                                    <label for="dEye_3" class="radio-custom-label cur-poiter mb-0">OU</label>
                                                </div>
                                            </fieldset>
                                        </div>
                                    </div>
                                    <div>
                                        <fieldset>
                                            <!--<div class="dis-inline-block">
                                                <input type="radio" class="radio-custom width-0" id="Advised1" name="Advised" ng-value="1" ng-model="newInvestigationObject.StatusId">
                                                <label for="Advised1" class="radio-custom-label cur-poiter mb-0 text-muted fs-12">Advised </label>
                                            </div>-->
                                            <div class="dis-inline-block ml-15">
                                                <input type="radio" class="radio-custom width-0" id="Urgent1" name="Urgent" ng-value="1" ng-model="newObject.BookingStatusId">
                                                <label for="Urgent1" class="radio-custom-label cur-poiter mb-0 text-muted fs-12">Urgent (Today)</label>
                                            </div>
                                            <div class="dis-inline-block ml-15">
                                                <input type="radio" class="radio-custom width-0" id="Schedule1" name="Schedule" ng-value="2" ng-model="newObject.BookingStatusId">

                                                <label for="Schedule1" class="radio-custom-label cur-poiter mb-0 text-muted fs-12">Schedule</label>
                                            </div>
                                            <div class="dis-inline-block ml-15">
                                                <input type="radio" class="radio-custom width-0" id="Followup1" name="Followup" ng-value="3" ng-model="newObject.BookingStatusId">
                                                <label for="Followup1" class="radio-custom-label cur-poiter mb-0 text-muted fs-12">Follow Up</label>
                                            </div>
                                        </fieldset>
                                    </div>
                                    <div class="w-150 m-r-5 m-l-10">
                                        <input type="text" class="form-control icons-calendar" ng-model="newObject.newOrderDate" datepickerapnl readonly value="24 Nov 2021" ng-disabled="newObject.BookingStatusId === 1"/>
                                    </div>
                                    <div class="time-ampm w-170">
                                        <input type="text" class="form-control" ng-model="newObject.OrderTime" />
                                        <div class="ampm-buttons">
                                            <button class="" ng-model="newObject.TimeType" ng-click="changeType('AM');" ng-class="newObject.TimeType==='AM'?'Time-active time-btn':'Time-Inactive time-btn'" >AM</button>
                                            <button class=" "ng-model="newObject.TimeType" ng-click="changeType('PM');" ng-class="newObject.TimeType==='PM'?'Time-active time-btn':'Time-Inactive time-btn'">PM</button>
                                            <span ng-click="clicktime(newObject.OrderTime)">
                                                <i class="eh-time-icon eh-icon"></i>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn-light-border betn" ng-click="closeTreatmentsProcedurePopup()">Close</button>
    <button type="button" class="btn-light-green betn" ng-click="tempsaveInvestigation();">Save</button>
</div>
