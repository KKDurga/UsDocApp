<div class="modal-header dis-flex justify-space-between align-items-center">
    <h4 class="modal-title font-weight-700 text-1d5558 fs-20 m-0">Pre Add</h4>
    <div class="w-100">
        <button type="button" class="btn btn-sm bg-c2dfd9 text-black" ng-click="SaveHealthandPhysical()">Save</button>
        <button type="button" class="btn btn-link" ng-click="uibclose()"><i class="fas fa-times text-danger fs-20"></i></button>
    </div>
</div>
<div class="modal-body p-6">
    <div class=" overflow-y-scroll overflow-x-hidden paper-consultation" style="height: calc(100vh - 37px)">
        <div class="asc-panel">
            <div class="asc-panel-header">
                <h1>Lab</h1>
                <ul class="us-controls">
                    <li>
                        <a href="javascript:;" ng-click="AddLabTest1();">+Add</a>
                    </li>
                </ul>
            </div>
            <div class="asc-panel-body">
                <table class="table tableno-bordered tableno-padding m-0">
                    <tbody>
                        <tr>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            HGB
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.HGB" maxlength="5" valid-number>
                                        <button disabled>
                                            gm/dl
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            HCT
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.HCT" maxlength="5" valid-number>
                                        <button disabled>
                                            %
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            WBC
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.WBC" maxlength="5" valid-number>
                                        <button disabled>
                                            mcL
                                        </button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            RBC
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.RBC" maxlength="5" valid-number>
                                        <button disabled>
                                            mcL
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled class="w-80">
                                            A1-C
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.A1C" maxlength="5" valid-number>
                                        <button disabled>
                                            mcL
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            Creatinine
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.Creatinine" maxlength="5" valid-number>
                                        <button disabled>
                                            Mg/Dl
                                        </button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <table class="table tableno-bordered tableno-padding m-0">
                    <tbody>
                        <tr>
                            <td>Diabetes</td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            RBS
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.RBS" maxlength="5" valid-number>
                                        <button disabled>
                                            gm/dl
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            FBS
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.FBS" maxlength="5" valid-number>
                                        <button disabled>
                                            gm/dl
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            PBBS
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.PBBS" maxlength="5" valid-number>
                                        <button disabled>
                                            gm/dl
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            PBLS
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.LabObj.PBLS" maxlength="5" valid-number>
                                        <button disabled>
                                            gm/dl
                                        </button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            U/A
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <ul class="checklist-actions">
                                    <li>
                                        <button ng-class="(HealthPhysicalModal.LabObj.UrineAnalysis == 'POSITIVE')?'active':''" ng-click="SelectUrineAnalysis(1);">Positive</button>
                                    </li>
                                    <li>
                                        <button ng-class="(HealthPhysicalModal.LabObj.UrineAnalysis == 'NEGATIVE')?'active':''" ng-click="SelectUrineAnalysis(2);">Negative</button>
                                    </li>
                                </ul>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            Blood Available
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <ul class="checklist-actions">
                                    <li>
                                        <button ng-class="(HealthPhysicalModal.LabObj.IsBloodAvailable == 'Yes')?'active':''" ng-click="SelectBloodAvailability(1);">Yes</button>
                                    </li>
                                    <li>
                                        <button ng-class="(HealthPhysicalModal.LabObj.IsBloodAvailable == 'No')?'active':''" ng-click="SelectBloodAvailability(2);">No</button>
                                    </li>
                                </ul>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            Pre-transfusion
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <ul class="checklist-actions">
                                    <li>
                                        <button ng-class="(HealthPhysicalModal.LabObj.IsPretransfusion == 'Yes')?'active':''" ng-click="SelectPreTransfusion(1);">Yes</button>
                                    </li>
                                    <li>
                                        <button ng-class="(HealthPhysicalModal.LabObj.IsPretransfusion == 'No')?'active':''" ng-click="SelectPreTransfusion(2);">No</button>
                                    </li>
                                </ul>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <!-- / -->
                <table class="table tableno-bordered tableno-padding m-0">
                    <tbody>
                        <tr ng-repeat="item in HealthPhysicalModal.LabObj.LabTestArray track by $index">
                            <td width="20%" ng-if="$index < 3">{{item.Name}}</td>
                            <td ng-if="$index >= 3">
                                <div class="ehr-input  pop-ehr-input">
                                    <input type="text" class="width-60" placeholder="Add Remarks" ng-model="item.Name" maxlength="50">
                                </div>
                            </td>
                            <td width="28%">
                                <ul class="flex-flow-ulli-mb0">
                                    <li>
                                        <label class="cur-poiter dis-flex align-items-center grid-gap-5">
                                            <input type="checkbox" class="checkbox" ng-model="item.IsNormalLimitsChecked" ng-change="ChangeNormalLimit(item,'Anesthesia')">
                                            <span class="lbl"></span>
                                            <span class="black-check-text">W.Normal Limits</span>
                                        </label>
                                    </li>
                                    <li>
                                        <label class="cur-poiter dis-flex align-items-center grid-gap-5">
                                            <input type="checkbox" class="checkbox" ng-model="item.IsAbnormalChecked" ng-change="ChangeAbnormal(item,'Anesthesia')">
                                            <span class="lbl"></span>
                                            <span class="black-check-text">Abnormal</span>
                                        </label>
                                    </li>
                                </ul>
                            </td>
                            <td>
                                <input type="text" class="form-outline" placeholder="Add Remarks" ng-model="item.Notes" maxlength="50" />
                            </td>
                        </tr>
                        <tr>
                            <td colspan="4">
                                <textarea class="form-outline" placeholder="Notes" rows="4" ng-model="HealthPhysicalModal.LabObj.Notes" maxlength="200"></textarea>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- / -->
        <div class="asc-panel">
            <div class="asc-panel-header">
                <h1>Cardiovascular</h1>
            </div>
            <div class="asc-panel-body">
                <table class="table tableno-bordered tableno-padding m-0">
                    <tbody>
                        <tr>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            B/P
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.CardioVascularObj.Systolic" maxlength="5" valid-number>
                                        <input type="text" ng-model="HealthPhysicalModal.CardioVascularObj.Diastolic" maxlength="5" valid-number>
                                        <button disabled="">
                                            Mm[Hg]
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            PR
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.CardioVascularObj.PR" maxlength="5" valid-number>
                                        <button disabled="">
                                            BPM
                                        </button>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="ehr-input pop-ehr-input">
                                    <div class="ehr-input-group">
                                        <button disabled>
                                            ECG
                                        </button>
                                        <input type="text" ng-model="HealthPhysicalModal.CardioVascularObj.ECG" maxlength="5" valid-number>
                                        <select class="us-form bg-f2f2f2 width-50" ng-model="HealthPhysicalModal.CardioVascularObj.ECGUnits">
                                            <option value="">select</option>
                                            <option value="mV">mV</option>
                                            <option value="sec">sec</option>
                                            <option value="ms">ms</option>
                                            <option value="Hz">Hz</option>
                                        </select>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="3">
                                <textarea class="form-outline" placeholder="Notes" rows="4" ng-model="HealthPhysicalModal.CardioVascularObj.Notes" maxlength="200"></textarea>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="3">
                                <ul class="flex-flow-ulli-mb0">
                                    <li>
                                        <div class="ehr-input">
                                            <input type="file" class="docsfilechoose height-36" name="upload" ng-model="files" ngf-select="CardiologistselectedImgsHandP($files)" ngf-pattern="'image/*,application/pdf'" ngf-accept="'image/*,application/pdf'" id="chooseFile" multiple="multiple" title="Choose a file to upload" accept="image/*,application/pdf">

                                        </div>
                                    </li>
                                    <li>
                                        <span>-OR-</span>
                                    </li>
                                    <li>
                                        <button class="btn-scan w-100 m-t-20 ng-binding" ng-click="CardiologyScanFiles(2);">Scan</button>
                                    </li>
                                </ul>
                            </td>
                        </tr>
                    </tbody>

                    <tbody>
                        <tr>
                            <td>
                                <ul class="flex-flow-ulli drawingpad-img-show">
                                    <li ng-repeat="imgitem in CardiologistFilesObj.TempImagesArray | filter: {'FileTypeId':28} track by $index">
                                        <div>
                                            <img ngf-thumbnail="imgitem.file" class="img-thumbnail w-60 height-60 bradius-6 p-5" ng-if="(imgitem.FileExt !== 'application/pdf' && imgitem.FileExt !== 'pdf')&&imgitem.DocumentID==0" />
                                            <img ng-src="{{imgitem.DocURL}}" class="img-thumbnail w-60 height-60 bradius-6 p-5" image-viewer ng-if="(imgitem.FileExt !== 'application/pdf' && imgitem.FileExt !== 'pdf')&&imgitem.DocumentID!=0" />
                                            <a class="pos-absolute top-0 right-0 bg-white p-1 radius-100" href="javascript:;" ng-click="DeleteUploadedCardiologistFileNew(imgitem,$index,FilesObj);">
                                                <img src="img/close-round.svg" width="17" />
                                            </a>
                                            <a href="{{imgitem.DocURL}}" target="_blank" ng-if="(imgitem.FileExt == 'application/pdf' || imgitem.FileExt == 'pdf') && imgitem.DocumentID!=0">
                                                <img src="img/pdf.png" class="p-5 img-thumbnail w-60 height-60" />
                                            </a>
                                            <a ng-if="(imgitem.FileExt == 'application/pdf' || imgitem.FileExt == 'pdf') && imgitem.DocumentID==0">
                                                <img src="img/pdf.png" class="p-5 img-thumbnail w-60 height-60" />
                                            </a>
                                            <a href="{{imgitem.DocURL}}" target="_blank" ng-if="imgitem.FileExt == 'tiff' || imgitem.FileExt == 'tif' || imgitem.FileExt=='image/tiff'">
                                                <img class="p-5 img-thumbnail w-60 height-60" src="img/appt-list/tifficon.png" />
                                            </a>
                                        </div>
                                    </li>
                                </ul>
                            </td>

                            <td>
                                <ul class="flex-flow-ulli-mb0" ng-if="(PreAdmCardioObj.DocumentDetails|filter:{'FileTypeId': 28}).length > 0">
                                    <li ng-repeat="img in PreAdmCardioObj.DocumentDetails|filter:{'FileTypeId': 28} track by $index">
                                        <img ngf-thumbnail="img.S3URL" ng-if="img.DocumentID != 0 && img.FileExt != 'pdf' && img.FileExt !== 'application/pdf'" class="img-thumbnail height-60 w-60 p-5 bradius-6" ng-src="{{img.S3URL}}" image-viewer>
                                        <a href="{{img.S3URL}}" target="_blank">
                                            <img src="img/billing/pdf-img.png" ng-if="img.DocumentID != 0 && (img.FileExt == 'pdf'|| img.FileExt == 'application/pdf')" class="img-thumbnail height-60 w-60 p-5 bradius-6">
                                        </a>
                                        <a href="javascript:;" ng-click="DeletePreAdmCardiologistDocumentlist(img,$index,PreAdmCardioObj);">
                                            <img src="img/close-round.svg" width="10" />
                                        </a>
                                    </li>
                                </ul>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="asc-panel">
            <div class="asc-panel-header">
                <h1>Respiratory</h1>
            </div>
            <div class="asc-panel-body">
                <div class="row">
                    <div class="col-lg-12">
                        <ul class="checklist-actions">
                            <li>
                                <b>CXR</b>
                            </li>
                            <li>
                                <ul class="checklist-actions">
                                    <li>
                                        <button ng-class="(HealthPhysicalModal.IsCXR == 'Yes')?'active':''" ng-click="SelectCXR(1);">Yes</button>
                                    </li>
                                    <li>
                                        <button ng-class="(HealthPhysicalModal.IsCXR == 'No')?'active':''" ng-click="SelectCXR(2);">No</button>
                                    </li>
                                </ul>
                            </li>
                            <li ng-repeat="item in HealthPhysicalModal.HealthArray | filter: {'CategoryId':13} track by $index">
                                <label class="cur-poiter dis-flex align-items-center grid-gap-5" ng-if="item.Description!='History'">
                                    <input type="checkbox" class="checkbox" ng-model="item.IsChecked">
                                    <span class="lbl"></span>
                                    <span class="black-check-text">{{item.Description}}</span>
                                </label>
                            </li>
                        </ul>
                        <div class="form-group">
                            <textarea class="form-outline m-y-10" rows="3" placeholder="Notes" ng-model="HealthPhysicalModal.RespiratoryNotes" maxlength="200"></textarea>
                        </div>
                        <ul class="checklist-actions">
                            <li>
                                <b>CNS</b>
                            </li>
                            <li>
                                <button ng-class="(HealthPhysicalModal.IsCNSHistory == false && HealthPhysicalModal.IsCNSHistory != null)?'active':''" ng-click="SelectCNSBtn1(1);">No History</button>
                            </li>
                            <li>
                                <button ng-class="HealthPhysicalModal.IsCNSHistory?'active':''" ng-click="SelectCNSBtn1(2);">History Present</button>
                            </li>
                        </ul>
                        <div class="form-group">
                            <textarea class="form-outline m-y-10" rows="3" placeholder="Notes" ng-model="HealthPhysicalModal.CNSNotes" maxlength="200"></textarea>
                        </div>
                        <ul class="checklist-actions">
                            <li>
                                <b>Social</b>
                            </li>
                            <li ng-class="($index == 0)?'':'m-l-10'" ng-repeat="item in HealthPhysicalModal.HealthArray | filter: {'CategoryId':15} track by $index">
                                <label class="cur-poiter dis-flex align-items-center grid-gap-5">
                                    <input type="checkbox" class="checkbox" ng-model="item.IsChecked">
                                    <span class="lbl"></span>
                                    <span class="black-check-text">{{item.Description}}</span>
                                </label>
                            </li>
                        </ul>
                        <div class="form-group">
                            <textarea class="form-outline m-y-10" rows="3" placeholder="Notes" ng-model="HealthPhysicalModal.SocialNotes" maxlength="200"></textarea>
                        </div>
                    </div>
                </div>                
            </div>
        </div>
    </div>
</div>
