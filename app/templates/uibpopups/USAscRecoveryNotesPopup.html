<div class="modal__style--1">
    <div class="modal__header--">
        <h1>{{screenName}}</h1>
        <ul class="us-controls">
            <li>
                <button class="btn__lg-- btn__C71D27--f" ng-click="SignOffFunction('SignOff');">SignOff</button>
            </li>
            <li>
                <button class="btn__lg-- btn__1d5558--f" ng-click="SaveNotes('Save');">Save</button>
            </li>
            <li>
                <a class="btn__close--2" ng-click="close()">
                    <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body--">
        <div class="d__f-- fd__c-- gap__5-- overflow__auto--y min__h150-- max__h535-- slim-scroll">
            <ul>
                <li class="flex">
                    <textarea class="asc-remarks-input msd-elastic: \n; pre-line" placeholder="Enter Notes" maxlength="4000" rows="3" ng-model="RecoveryNotes"></textarea>
                </li>

            </ul>
            <!--class="asc-summary-list align-items-center"-->
            <ul>
                <li class="flex">
                    <div class="section__style--5" id="summarymain3POS8" ng-if="UserAccessRights.AllAccessRights.PostOpDoctorReviewedByAccess || UserAccessRights.AllAccessRights.PostOpAnesthesiologistReviewdByAccess">

                        <div class="section__header--">
                            <h1>Reviewed by</h1>
                        </div>
                        <div class="section__body--">
                            <table class="asc-summary-table">
                                <tbody>
                                    <tr>
                                        <td class="w-120">
                                            <label>Reviewed by</label>
                                        </td>
                                        <td>
                                            <div class="row">

                                                <!--<div class="col-lg-4 col-sm-6" ng-if="UserAccessRights.AllAccessRights.PostOpNurseReviewdByAccess">
                                        <div class="form-group">
                                            <label>Nurse :</label>
                                            <select class="form-outline" ng-model="PostOpObj.ReviewNurseId" ng-options="item.DoctorID as item.FullName for item in NurseArray" ng-change="ChangePostOpNurseReviewedBy(PostOpObj.ReviewNurseId)">
                                                <option value="">Select</option>
                                            </select>-->
                                                <!--<p>Signature</p>-->
                                                <!--</div>
                                        </div>-->
                                                <div class="col-sm-6" ng-if="UserAccessRights.AllAccessRights.PostOpAnesthesiologistReviewdByAccess">

                                                    <div class="form-group" ng-if="Screen=='PostOp-R1'">
                                                        <label class="text-s12w400C000">Anesthesiologist  :</label>
                                                        <select class="form-outline" ng-model="PostOpObj.ReviewAnesthetistId" ng-options="item.DoctorID as item.FullName for item in AnesthesiologistArray" ng-change="ChangePostOpAnesthesiaReviewedBy(PostOpObj.ReviewAnesthetistId)">
                                                            <option value="">Select</option>
                                                        </select>
                                                        <!--<p>Signature</p>-->
                                                    </div>
                                                    <div class="form-group" ng-if="Screen=='PostOp-R2'">
                                                        <label class="text-s12w400C000">Anesthesiologist  :</label>
                                                        <select class="form-outline" ng-model="PostOpObj.R2ReviewAnesthetistId" ng-options="item.DoctorID as item.FullName for item in AnesthesiologistArray" ng-change="ChangeRecovery2AnesthesiaReviewedBy(PostOpObj.R2ReviewAnesthetistId)">
                                                            <option value="">Select</option>
                                                        </select>
                                                        <!--<p>Signature</p>-->
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </li>
            </ul>
            <div class="d__f-- fd__c-- gap__5-- bg__FFF-- position__sticky-- bottom__0-- py__5--" ng-if="signoffUserObj.NurseAccess || signoffUserObj.IsNurseUnSign || signoffUserObj.AnesthesiaAccess || signoffUserObj.IsAnesthesiaUnSign">
                <div class="row nocolpad" ng-show="signoffUserObj.NurseAccess">
                    <div class="col-lg-4">
                        <div class="form__group">
                            <label>Nurse</label>
                            <select class="form-outline" ng-disabled="signoffUserObj.IsNurseUnSign" ng-model="signoffUserObj.NurseUserId"
                                    ng-options="item.DoctorID as item.FullName for item in NurseArray">
                                <option value="">Select</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="form__group">
                            <label>Password</label>
                            <input type="password" class="form-outline"
                                   ng-disabled="signoffUserObj.NurseUserId==null||IsNurseSignValid"
                                   ng-model="signoffUserObj.NursePassword"
                                   placeholder="Enter Sign Off Password" maxlength="30">
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="form__group">
                            <label></label>
                            <button class="btn__xl-- btn__2D2D47--f m-t-20" ng-if="SignOffPasswordObj.Screen!='PostOp-R1'&&SignOffPasswordObj.Screen!='PostOp-R2'" ng-click="ValidateUserSignOff('Nurse')">Validate & Save</button>
                            <button class="btn__xl-- btn__2D2D47--f m-t-20" ng-if="(SignOffPasswordObj.Screen=='PostOp-R1'||SignOffPasswordObj.Screen=='PostOp-R2')&&!IsNurseSignValid" ng-click="ValidateUserSignOff('Nurse')">Validate & Save</button>
                        </div>
                    </div>
                </div>
                <div class="row" ng-show="signoffUserObj.IsNurseUnSign">
                    <div class="col-lg-12">
                        <div class="form-group ehr-input pop-ehr-input">
                            <label>Remarks</label>
                            <textarea class="register-input msd-elastic: \n;"
                                      quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                                      ng-model="signoffUserObj.NurseUnSignRemarks" maxlength="500"></textarea>
                        </div>
                    </div>
                </div>

                <div class="row nocolpad" ng-show="signoffUserObj.AnesthesiaAccess">
                    <div class="col-lg-4">
                        <div class="form__group">
                            <label>Anesthetist</label>
                            <select ng-disabled="signoffUserObj.IsAnesthesiaUnSign||IsAnesthesiaSignValid" ng-model="signoffUserObj.AnesthesiaUserId"
                                    ng-options="item.DoctorID as item.FullName for item in AllAnesthetistList">
                                <option value="">Select</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="form__group">
                            <label>Password</label>
                            <input type="password" ng-disabled="signoffUserObj.AnesthesiaUserId==null" ng-model="signoffUserObj.AnesthesiaPassword" placeholder="Enter Sign Off Password" maxlength="30">
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="form__group">
                            <label></label>
                            <button class="btn__xl-- btn__2D2D47--f" ng-if="SignOffPasswordObj.Screen!='PostOp-R1'&&SignOffPasswordObj.Screen!='PostOp-R2'" ng-click="ValidateUserSignOff('Anesthesia')">Validate & Save </button>
                            <button class="btn__xl-- btn__2D2D47--f" ng-if="(SignOffPasswordObj.Screen=='PostOp-R1'||SignOffPasswordObj.Screen=='PostOp-R2')&&!IsAnesthesiaSignValid" ng-click="ValidateUserSignOff('Anesthesia')">Validate & Save </button>
                        </div>
                    </div>
                </div>
                <div class="row" ng-show="signoffUserObj.IsAnesthesiaUnSign">
                    <div class="col-lg-12">
                        <div class="form__group">
                            <label>Remarks</label>
                            <textarea class="msd-elastic: \n;"
                                      quotes-restrict placeholder="{{ 'REMARKS' | translate}}"
                                      ng-model="signoffUserObj.AnesthesiaUnSignRemarks" maxlength="500"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>                
    </div>
</div>
