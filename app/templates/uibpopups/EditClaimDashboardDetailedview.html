<div class="modal-header">
    <h2 class="modal-title">
        Update Claim Status
    </h2>
    <button type="button" class="close m-r-10 m-b-3" ng-click="CloseEditClaimPopup()">
        <i class="fas fa-times"></i>
    </button>
</div>
<div class="modal-body">
    <div class="modal-body">

        <div class="row">
            <div class="col-lg-4">
                <div>
                    <label>Status</label>
                    <select class="form-control"
                            ng-model="SearchEditClaimObj.ClaimStatusId"
                            ng-change="ChnageClaimstatus(SearchEditClaimObj)"
                            ng-options="list.ClaimStatusId as list.ClaimStatusName for list in ClaimStatusList">
                    </select>
                </div>
            </div>
            <div class="col-lg-2">
                <div>
                    <label for="Controlno">ClearingHouse Control No.</label>
                    <input class="form-control" ng-model="SearchEditClaimObj.ClearingHouseControlNumber" type="text" id="Controlno" name="Controlno" maxlength="12" required quotes-restrict enter-directive numbers-only="numbers-only"/>
                </div>
            </div>
            <div class="col-lg-2">
                <div>
                    <label for="Payorno">Payer Control No</label>
                    <input class="form-control" ng-model="SearchEditClaimObj.PayerClaimControlNo" type="text" name="Payorno" id="Payorno" maxlength="15" required quotes-restrict enter-directive numbers-only="numbers-only"/>
                </div>
            </div>
            <div class="col-lg-2">
                <div>
                    <label>Claim Amount</label>
                    <input class="form-control" ng-model="SearchEditClaimObj.ClaimAmount" ng-disabled="true" />
                </div>
            </div>
            <div class="col-lg-2">
                <div>
                    <label>Approved Amount</label>
                    <input class="form-control" placeholder="0" ng-model="SearchEditClaimObj.ClaimApprovedAmount" ng-change="ChangeAmount(SearchEditClaimObj)" />
                </div>
            </div>
        </div>
        <div class="row m-t-10">

            <div class="col-lg-3">
                <div>
                    <label>Files</label>
                    <input type="file" class="form-control" value="Upload"
                           ngf-select="selectedFiles($files);"
                           name="file"
                           ngf-pattern="'image/*,application/pdf'"
                           ngf-accept="'image/*,application/pdf'"
                           multiple="multiple" />
                </div>
            </div>

            <div class="col-lg-9">
                <div>
                    <label>Remarks <em ng-show="SearchEditClaimObj.ClearingHouseStatusId == 2 ||SearchEditClaimObj.PayorStatusId == 2">*</em></label>
                    <input class="form-control" ng-model="SearchEditClaimObj.Remarks" maxlength="200" />
                </div>
            </div>
        </div>
        <div class="row  m-t-10">
            <div class="col-lg-12">
                <div class="form-group">
                    <div class="table-responsive">
                        <table class="table table-consultation" image-viewer>
                            <tbody>
                                <tr>
                                    <td ng-repeat="titem in SearchEditClaimObj.TempDocuments">
                                        <button class="btn btn-link p-l-5 p-r-5 m-l-3 pos-initial z-9999" style="top: 0px; right: 4px;" ng-click="removeImage(titem, SearchEditClaimObj)"><i class="fas fa-times-circle text-danger fa-lg"></i></button>
                                        <img ngf-thumbnail="titem.file" class="img-thumbnail" width="50" height="50" />
                                    </td>
                                    <td ng-repeat="pitem in SearchEditClaimObj.patientDocumentDetails | filter : {DeleteInd : false}">
                                        <button class="btn btn-link p-l-5 p-r-5 m-l-3 pos-initial z-9999" style="top: 0px; right: 4px;" ng-click="removeImage(pitem, SearchEditClaimObj)"><i class="fas fa-times-circle text-danger fa-lg"></i></button>
                                        <img ng-src="{{pitem.S3URL}}" class="img-thumbnail" width="50" height="50" />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    
         
         
    </div>

</div>
<div class="modal-footer">
    <button type="button" class="btn btn-danger" ng-click="CloseEditClaimPopup()">Close</button>
    <button type="button" class="btn primary-btn w-100" ng-click="SaveEditClaim()">Save</button>
</div>
