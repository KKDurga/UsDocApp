 

<div class="mini-popup">

<div class="mini-pop-body">

<!--<div class="modal-body pt-0 p-7">-->
    <div class="row">
        <div class="col-lg-12">
            <div class="consultation-subheading p-t-0">
                <div>
                    <h1 class="consultation-heading text-068cb0">Important Notes</h1>
                </div>
                <div class="dis-flex align-items-center">
                    <!--<button class="btn-history btn-consultation btn m-r-5"><i class="eh-print-white eh-icon"></i> Print</button>-->
                    <button class="btn-autofill btn-consultation btn m-r-5" ng-click="closequicknotespopscons()">Save</button>
                    <!--<button class="btn-autofill btn-consultation btn"><i class="eh-print-white eh-icon"></i> Save & Print</button>-->
                    <button class="btn-dangerhover btn-consultation btn" ng-click="closequicknotespopscons();">Close</button>
                </div>
            </div>
        </div>
    </div>
    <!-- / -->
    <div class="row">
        <div class="col-lg-12">
            <div class="dis-flex">
                <section class="section-ehnote flex p-0">
                    <div class="ehnote-header gray-heading border-radiusH p-t-5 p-b-5">
                        <h1 class="text-068cb0">
                            Doctor’s Note
                        </h1>
                        <ul class="controls-cons">
                            <li>
                                <a href="" class="copy-notes-ion" ng-click="CopyOptomNotes()">
                                    <i class="copy-cion"></i> Copy Optom Notes
                                </a>
                            </li>
                        </ul>
                    </div>
                    <div class="ehnote-body">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="bottom-margin-dis">
                                    <div class="m-b-10">
                                        <input class="form-control bbl-radius bbr-radius bg-inputy b-b-0"
                                               ng-model="Noteobj.Title"
                                               ng-show="Noteobj.IsFavoriteInd ==true"
                                               placeholder="+Add Title Here" />


                                        <textarea class="form-control m-b-5 bg-inputy b-t-0 btl-radius btr-radius" rows="3"
                                                  ng-model="Noteobj.SelectedDoctorNotesObj"
                                                  autocomplete="on"
                                                  maxlength="1000"
                                                  placeholder="Type Doctor’s Note Here"
                                                  typeahead-on-select="onIDoctorNotesSelect(Noteobj)"
                                                  uib-typeahead="List as List.Notes for List in GetFavouriteNotes($viewValue,1)"
                                                  typeahead-focus-first=" false"
                                                  typeahead-min-length="0"
                                                  typeahead-focus-on-select="false"></textarea>

                                        <div class="dis-flex align-items-center justify-content-end" ng-show="Noteobj.SelectedDoctorNotesObj !=''">
                                            <button class="btn-dangerhover btn-consultation btn m-r-5" ng-click="ClearDoctorComments()">Clear</button>
                                            <button class="btn-history btn btn-consultation" ng-show="Noteobj.IsFavoriteInd ==false" ng-click="SaveFavorites()">
                                                <i class="add-favorites-icon eh-icon"></i>Favorites
                                            </button>
                                            <button class="btn-history btn btn-consultation" ng-show="Noteobj.IsFavoriteInd ==true" ng-click="SaveFavorites()">
                                                <i class="add-favorites-icon eh-icon"></i>Remove
                                            </button>
                                            <button class="btn-autofill btn btn-consultation m-r-5" ng-click="SaveDoctorNotes()">Save</button>
                                        </div>
                                    </div>
                                    <div class="pos-relative h-100">
                                        <ul class="thumbfileuploadsulli h-scroll" ng-style="heightBOE()" resize>
                                            <li ng-repeat="item in cacheStorageItem.DoctorNotesArray">
                                                <p>
                                                    <b> {{item.Title}}</b>
                                                </p><p>
                                                    {{item.Notes}}
                                                </p>
                                                <div class="buttons-hoverview">
                                                    <div class="dis-flex">
                                                        <button class="btn-history btn btn-consultation m-r-5"><i class="add-favorites-icon eh-icon"></i>Favorites</button>
                                                        <button class="btn-dangerhover btn-consultation btn m-r-5" ng-click="RemoveDoctorsNotes(item, 'Doctor');"><i class="upload-ehn-cons eh-icon"></i>Remove</button>
                                                    </div>
                                                </div>
                                            </li>
                                             
                                </div>
                            </div>
                        </div>
                    </div>
                        </div>
                </section>
                <!-- / -->
                <section class="section-ehnote flex m-l-5 p-0">

                                                    </div>
                                                </div>
                                            </li>
                                             
                                </div>
                            </div>
                        </div>
                    </div>
                        </div>
