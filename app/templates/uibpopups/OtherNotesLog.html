<div class="row">
    <div class="col-lg-12">
        <ul class="list-group">
            <li class="list-group-item" ng-repeat="item in OtherNotesLogArray track by $index">
                <h4 class="list-group-item-heading text-s12w500c3f5fb0">{{item.ModifiedName}} - <small class="text-s10w500c767575">{{item.ModifiedDt | date:'MM-dd-yyyy,hh:mm a'}}</small></h4>
                <p class="list-group-item-text text-s12w500c000">{{item.OtherNotes }}</p>
            </li>
        </ul>

        
    </div>
</div>
