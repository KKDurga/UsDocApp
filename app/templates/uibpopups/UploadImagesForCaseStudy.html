
<div class="modal-header">
    <label>Upload Images</label>
    <button type="button" class="btn btn-link" ng-click="closeImagePopup()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body p-10">
    <section class="tile tile-shadow">

        <div class="tile-body">
            <div class="row">
                <div class="col-lg-12">
                    <div class="table-responsive">
                        <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
                            <tbody>
                                <tr>
                                    <td width="40%">
                                        <div class="form-group">
                                            <label>Appointment <em>*</em></label>
                                            <select class="form-control" ng-model="imguploadReqObj.AppointmentId" ng-options="aitem.AppointmentId as aitem.NewAppointmentDate +' '+aitem.DoctorName for aitem in previousAppointmentsList">
                                                <option value="">Select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td width="20%">
                                        <div class="form-group">
                                            <label>Modality <em>*</em></label>
                                            <select class="form-control" ng-model="imguploadReqObj.ModalityId" ng-options="option.ModalityId as option.ModalityName+' ('+option.ModalityShortName+')' for option in ModalityArray">
                                                <option value="" disabled="disabled">select</option>
                                            </select>
                                        </div>
                                    </td>
                                    <td width="40%">
                                        <div class="form-group">
                                            <label>Investigation Name <em>*</em></label>
                                            <input type="text" class="register-input" placeholder="Enter CPT code"
                                                   autocomplete="off"
                                                   maxlength="100"
                                                   name="treatment"
                                                   ng-model="imguploadReqObj.ProcedureObj"
                                                   typeahead-min-length="0"
                                                   typeahead-focus-on-select="false"
                                                   typeahead-template-url="orgDfProceduresdf.html"
                                                   ng-change="onInvProcedureChange(imguploadReqObj.ProcedureObj)"
                                                   uib-typeahead="treatitem as treatitem.ProcedureName for treatitem in GetOrganizationProcedure($viewValue)"
                                                   typeahead-on-select="onSelectProcedureInv(imguploadReqObj.ProcedureObj)" />
                                            <script type="text/ng-template" id="orgDfProceduresdf.html">
                                                <a tabindex="-1" class="m-w-350 fs-10">
                                                    <span>{{match.model.ProcedureCode}} - {{match.model.ProcedureName}}</span>
                                                </a>
                                            </script>
                                        </div>
                                    </td>
                                </tr>

                                
                                <tr>
                                    <td colspan="2">
                                        <div class="row">
                                            <div class="col-lg-2">
                                                <div class="form-group">
                                                    <label>Right Eye</label>
                                                </div>
                                            </div>
                                            <div class="col-lg-4">
                                                <div class="form-group">
                                                    <input type="file" id="ImageMgmtOD" value="Upload"
                                                           ngf-select="selectedEyeFiles($files,'OD');"
                                                           name="Rfile"
                                                           ngf-pattern="'image/*'"
                                                           ngf-accept="'image/*'"
                                                           multiple="multiple" />
                                                </div>
                                            </div>
                                            <div class="col-lg-6">
                                                <div class="form-group">
                                                    <div class="table-responsive">
                                                        <table class="table table-consultation" image-viewer style="border:0px !important;">
                                                            <tbody>
                                                                <tr>
                                                                    <td ng-repeat="titem in tempODImagesArray" style="width:20%;">
                                                                        <img ngf-thumbnail="titem.file" class="img-thumbnail" style="height:50px !important;width:50px !important" />  <button class="btn btn-link p-l-5 p-r-5 m-l-3" style="top: -15px; right: 4px;" ng-click="removeImage(titem, 'OD')"><i class="fas fa-times-circle text-danger fa-lg"></i></button>

                                                                    </td>
                                                                    
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <div class="row">
                                            <div class="col-lg-2">
                                                <div class="form-group">
                                                    <label>Left Eye</label>
                                                </div>
                                            </div>
                                            <div class="col-lg-4">
                                                <div class="form-group">
                                                    <input type="file"  id="ImageMgmtOS"  value="Upload"
                                                           ngf-select="selectedEyeFiles($files,'OS');"
                                                           name="Lfile"
                                                           ngf-pattern="'image/*'"
                                                           ngf-accept="'image/*'"
                                                           multiple="multiple" />
                                                </div>
                                            </div>
                                            <div class="col-lg-6">
                                                <div class="form-group">
                                                    <div class="table-responsive">
                                                        <table class="table table-consultation" image-viewer style="border:0px !important;">
                                                            <tbody>
                                                                <tr>
                                                                    <td ng-repeat="titem in tempOSImagesArray" style="width:20%;">
                                                                        <img ngf-thumbnail="titem.file" class="img-thumbnail" style="height:50px !important;width:50px !important" /> <button class="btn btn-link p-l-5 p-r-5 m-l-3 " style="top:-15px; right: 4px;" ng-click="removeImage(titem, 'OS')"><i class="fas fa-times-circle text-danger fa-lg"></i></button>
                                                                    </td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<div class="modal-footer">
    <div class="row">
        <div class="col-lg-12 text-right">
            <button type="button" class="etn btn-ehnote-outline p-l-25 p-r-25" ng-click="clearImagePopup()">Clear</button>
            <button type="button" class="etn btn-ehnote p-l-25 p-r-25" ng-click="SaveImagePopup()">Save</button>
        </div>
    </div>
</div>
