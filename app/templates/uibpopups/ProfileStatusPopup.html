<div class="modal__style--1 height__100--">
    <div class="modal__header--">
        <h1  ng-show="ProfileStatusType == 'Edit'"> {{ 'PROFILESTATUS' | translate}}</h1>
        <h1   ng-show="ProfileStatusType == 'View'"> {{ 'PROFILESTATUSVIEW' | translate}}</h1>
        <h1 ng-show="ProfileStatusType == 'AllHistory'"> {{ 'PATIENTHISTORY' | translate}}</h1>
        <ul class="us-controls">
            <li ng-show="ProfileStatusType == 'Edit'">
                <button type="button" class="btn__lg-- btn__C71D27--" ng-click="ClearDetails();"> {{ 'CLEAR' | translate}}</button>
            </li>
            <li ng-show="ProfileStatusType == 'Edit'">
                <button type="button" class="btn__lg-- btn__1d5558--f" ng-click="SaveProfiledetails();"> {{ 'SAVE' | translate}}</button>
            </li>
            <li>
                <a class="btn__close--2" ng-click="closeuibpopup()">
                    <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body-- height__100--" ng-show="ProfileStatusType == 'AllHistory'">
        <div class="position__relative-- height__100--">
            <div class="adjustable-position slim-scroll">
                <table class="table__style--5" ng-show="PatientAllHistoryArray.length > 0">
                    <thead>
                        <tr>
                            <th><label>{{ 'SNO' | translate}}</label></th>
                            <th><label>Date</label></th>
                            <th><label>{{ 'UPDATEDDETAILS' | translate}}</label></th>
                            <th><label>{{ 'CREATEDBY' | translate}}</label></th>
                            <th><label>{{ 'MODIFYTIME' | translate}}</label></th>
                        </tr>
                    </thead>
                    <tbody ng-repeat="pitem in PatientAllHistoryArray track by $index">
                        <tr ng-repeat="sitem in pitem.ArrayList | orderBy:'-ModifiedDateTime' track by $index">
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{$index + 1}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--"> {{sitem.ModifiedDt | date:'MMM-dd-yyyy'}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{sitem.logName}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{sitem.ModifiedByName}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{sitem.ModifiedDateTime | date:'h:mm a'}}</label></td>
                        </tr>
                    </tbody>
                </table>
                <div class="row height__100-- d__f-- jc__c-- ai__c-- ng-scope" ng-show="PatientAllHistoryArray.length === 0">
                    <div class="col-lg-12">
                        <div class="m__auto--">
                            <p class="fs__lg-- fw__4-- tc__656565-- m__0-- d__f-- ai__c-- gap__5-- jc__c--">{{ 'NODATAADDED' | translate}}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal__body--" ng-show="ProfileStatusType == 'View'">
        <div class="position__relative-- height__100--">
            <div class="adjustable-position slim-scroll">
                <table class="table__style--5" ng-show="ProfilestatusArray.length > 0">
                    <thead>
                        <tr>
                            <th><label>{{ 'SNO' | translate}}</label></th>
                            <th><label>{{ 'STATUS' | translate}}</label></th>
                            <th><label>{{ 'REMARKS' | translate}}</label></th>
                            <th><label>{{ 'INCOMPLETEDETAILS' | translate}}</label></th>
                            <th width="15%"><label>{{ 'CREATEDBY' | translate}}</label></th>
                            <th width="13%"><label> {{ 'MODIFYDATE' | translate}}</label></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="pitem in ProfilestatusArray track by $index">
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{$index + 1}}p</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{pitem.ProfileStatusName}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{pitem.Remarks}}</label></td>
                            <td>
                                <label class="fs__lg-- fw__5-- tc__1D1D1D--" ng-repeat="sitem in pitem.StatusDetails track by $index">
                                    <span>{{sitem.IncompleteStatusName}}</span><span ng-hide="$last">,</span>
                                </label>
                            </td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{pitem.Createdby}}</label></td>
                            <td><label class="fs__lg-- fw__5-- tc__1D1D1D--">{{pitem.Modifydate | date:'MM-dd-yyyy'}}</label></td>
                        </tr>
                    </tbody>
                </table>
                <div class="row height__100-- d__f-- jc__c-- ai__c-- ng-scope" ng-show="ProfilestatusArray.length === 0">
                    <div class="col-lg-12">
                        <div class="m__auto--">
                            <p class="fs__lg-- fw__4-- tc__656565-- m__0-- d__f-- ai__c-- gap__5-- jc__c--">{{ 'NODATAADDED' | translate}}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
