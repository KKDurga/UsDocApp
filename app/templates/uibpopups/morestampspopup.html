<div>
    <div class="eh-header bg-white">
        <h1>Stamps</h1>
        <ul class="us-controls">
            <li>
                <button class="btn-scan w-100" ng-disabled="(OrgStampsArray | filter:{'isChecked': true}).length === 0" ng-click="AddSelectedFindingValues()">Add</button>
            </li>
            <li>
                <a  ng-click="Uibclose()">
                    <i class="fas fa-times fa-lg text-danger"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="eh-body">
        <div class="form-group">
            <input type="text" ng-model="searchText" ng-change="changeOrgStamps(searchText)" class="form-outline icons-search bradius-10" />
        </div>
        <div class="paper-consultation overflow-y-auto overflow-x-hidden" style="height: calc(100vh - 130px)">
            <table class="tableno-bordered referral-table referral-table-ros m-b-0 b-0 tableno-padding">
                <tbody ng-repeat="st in OrgStampsArray| filter:searchText">
                    <tr>
                        <td>
                            <span>{{st.StampName}}({{st.InvestigationName}})</span>
                        </td>
                        <td width="4%">
                            <label class="cur-poiter">
                                <input type="checkbox" ng-disabled="!isFindingMatch(st.InvestigationId)" ng-model="st.isChecked" ng-change="Checktoaddstamp(st)" class="checkbox">
                                <span class="lbl"></span>
                            </label>
                        </td>
                        <td width="4%">
                            <a class="actions-black" ng-model="st.IsFavoriteInd" ng-click="saveAddUpdateUserStampData(st)">
                                <i class="far fa-star fa-lg" ng-if="!st.IsFavoriteInd" title="Add to Favorites"></i>
                                <i class="fas fa-star fa-lg" ng-if="st.IsFavoriteInd" title="Remove from Favorites"></i>
                            </a>
                        </td>
                        <td width="4%">
                            <a class="actions-black" ng-click="RemoveOrgStampData(st,$index)">
                                <i class="fas fa-times fa-lg"></i>
                            </a>
                        </td>
                    </tr>
                    <!--<tr>
                    <td>
                        <span>No bumbps no chalazium no hordeolu noted on lid evertion</span>
                    </td>
                    <td width="4%">
                        <label class="cur-poiter">
                            <input type="checkbox" class="checkbox">
                            <span class="lbl"></span>
                        </label>
                    </td>
                    <td width="4%">
                        <a class="actions-black">
                            <i class="fas fa-star"></i>
                        </a>
                    </td>
                    <td width="4%">
                        <a class="actions-black">
                            <i class="fas fa-times fa-lg"></i>
                        </a>
                    </td>
                </tr>-->
                </tbody>
            </table>
        </div>
        <div class="col-lg-12 text-center EH-pagination">
            <uib-pagination total-items="totalItems"
                            ng-model="OrgFindStampsPage"
                            ng-change="OrgStamppageChanged(OrgFindStampsPage)"
                            force-ellipses="true"
                            boundary-links="true"
                            max-size="maxSize">
            </uib-pagination>
        </div>
    </div>
</div>
