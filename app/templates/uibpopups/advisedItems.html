<div class="modal-header">
    <h4 class="modal-title">Advised Procedures</h4>
    <button type="button" class="btn btn-link" ng-click="closeadvisedItems()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body p-8">
    <div class="row">
        <div class="col-lg-12">
            <div class="section-ehnote p-0">
                <div class="consultation-header b-0 bg-f6f6f6 bradius-9 bbl-radius bbr-radius border-bottom">
                    <h1 class="fs-15">Investigation</h1>
                </div>
                <!--<div class="consultation-body" ng-repeat="item in advisedItemsList | filter: {'ProcedureTypeId': 5}">-->
                <div class="consultation-body" ng-repeat="item in advisedItemsList | filter: {'OrderTypeId': 1}">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-response">
                                <table class="table consultation-bordered m-b-0">
                                    <tbody>
                                        <tr>
                                            <td class="w-40 text-center valign-top">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-2" type="checkbox" ng-model="item.IsSelected">
                                                        <span class="checkbox-material">
                                                            <span class="check Checkbox-Label"></span>
                                                        </span>
                                                    </label>
                                                </div>
                                            </td>
                                            <td class="valign-top" width="8%">
                                                <b class="complaint-text fs-14">{{item.ProcedureId}}</b>
                                            </td>
                                            <td class="valign-top">
                                                <span class="complaint-remarks">
                                                    {{item.ProcedureName}}
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-ehnote p-0">
                <div class="consultation-header b-0 bg-f6f6f6 bradius-9 bbl-radius bbr-radius border-bottom">
                    <h1 class="fs-15">Surgery</h1>
                </div>
                <!--<div class="consultation-body" ng-repeat="item in advisedItemsList | filter: {'ProcedureTypeId': 6}">-->

                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-response">
                                <table class="table consultation-bordered m-b-0">
                                    <tbody>
                                        <tr>
                                            <td class="w-40 text-center valign-top">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-2" type="checkbox" ng-model="item.IsSelected">
                                                        <span class="checkbox-material">
                                                            <span class="check Checkbox-Label"></span>
                                                        </span>
                                                    </label>
                                                </div>
                                            </td>
                                            <td class="valign-top" width="8%">
                                                <b class="complaint-text fs-14">{{item.ProcedureId}}</b>
                                            </td>
                                            <td class="valign-top">
                                                <span class="complaint-remarks">
                                                    {{item.ProcedureName}}
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-ehnote p-0">
                <div class="consultation-header b-0 bg-f6f6f6 bradius-9 bbl-radius bbr-radius border-bottom">
                    <h1 class="fs-15">Procedure</h1>
                </div>
                <!--<div class="consultation-body" ng-repeat="item in advisedItemsList | filter: {'ProcedureTypeId': 1}">-->
                <div class="consultation-body" ng-repeat="item in advisedItemsList | filter: {'OrderTypeId': 2}">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-response">
                                <table class="table consultation-bordered m-b-0">
                                    <tbody>
                                        <tr>
                                            <td class="w-40 text-center valign-top">
                                                <div class="checkbox cn">
                                                    <label>
                                                        <input name="checkbox-2" type="checkbox" ng-model="item.IsSelected">
                                                        <span class="checkbox-material">
                                                            <span class="check Checkbox-Label"></span>
                                                        </span>
                                                    </label>
                                                </div>
                                            </td>
                                            <td class="valign-top" width="8%">
                                                <b class="complaint-text fs-14">{{item.ProcedureId}}</b>
                                            </td>
                                            <td class="valign-top">
                                                <span class="complaint-remarks">
                                                    {{item.ProcedureName}}
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

<div class="modal-footer">

        <div class="col-lg-12 text-right">
            <button type="submit" class="betn btn-light-border" ng-click="discardProcedures()">Discard</button>

        </div>
    </div>
</div>
