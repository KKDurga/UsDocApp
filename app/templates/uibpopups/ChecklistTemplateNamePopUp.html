<div>
    <div class="modal-common-dialog">
        <div class="model-popup-header">
            <h4 class="modal-title" id="myModalLabel">Template Name</h4>
            <a id="close_popup" ng-click="closePopup()" class="light-font pull-right fclosepopup m-t-0">x</a>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="form-group m-10">
                    <label class="control-label">Enter Template Name</label>
                    <input type="text" class="form-control mt-10" ng-model="TemplateName" />
                </div>
            </div>
        </div>
        <div class="row pull-right">
            <div class="col-md-12 col-sm-12 col-xs-12 mb-10 mt-5 mr-10">
                <button class="btn danger-btn light-font" ng-click="closePopup()"> Close</button>
                <button class="btn primary-btn" ng-click="SaveTemplateName();">Save </button>
            </div>
        </div>
        <div class="clearfix"></div>


    </div>
</div>
