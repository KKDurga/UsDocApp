<div class="modal__style--1">
    <div class="modal__header--">
        <h1 >Add New Logs</h1>
        <ul class="us-controls">
            <li>
                <button class="btn__lg-- btn__1d5558--f" ng-click="SaveNewlog()" id="btn_savelog">Save Log</button>
            </li>
            <li>
                <a class="btn__close--2" ng-click="ClosePopup()" id="btn_close">
                    <i class="icons__w16--" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false"></i>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal__body--">
        <div class="row nocolpad">
            <div class="col-lg-4 col-md-6">
                <div class="input__group">
                    <label>Date of Interaction *</label>
                    
                    <div class="form-group width-100">
                        <input type="text"
                               id="dateofinteraction"
                               class="icons-calendar width-100"
                               placeholder="MM-DD-YYYY"
                               ng-model="Newlogobj.CommunicationDate"
                               datepickerregpatientus
                               datepicker-options="jscalendaroptions"
                               readonly>
                    </div>

                    <!--<input placeholder="Select Date "  ng-model="Newlogobj.CommunicationDate" datepickerforapplist readonly  class="icons-calendar" />-->
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="form__group">
                    <label>Time *</label>
                    <input placeholder="Pick Time" id="input_time" ng-model="Newlogobj.CommunicationTime" ng-click="GetCommunicationTime()" class="icons-time" />
                </div>
            </div>
        </div>
        <div class="row nocolpad">
            <div class="col-lg-4 col-md-6">
                <div class="form__group">
                    <label>Mode of Interaction</label>
                    <select ng-model="Newlogobj.ModeOfInteractionId" id="select_moi" ng-options="item.ModeOfInteractionId as item.ModeOfInteraction for item in ModeOfInteractionsArray" ng-change="ChangeModeOfInteractions(Newlogobj.ModeOfInteractionId)">
                        <option value="" disabled="disabled">Select</option>
                    </select>
                </div>
            </div>
            <div class="col-lg-4 col-md-6" ng-if="false">
                <div class="form__group">
                    <label>Status</label>
                    <select id="select_status">
                        <option value="" disabled="disabled">Select</option>
                    </select>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="form__group">
                    <label>Reason</label>
                    <select ng-model="Newlogobj.ReasonId" id="select_reason" ng-options="item.ReasonId as item.ReasonName for item in CommunicationReasonsArray" ng-change="ChangeCommunicationReasons(Newlogobj.ReasonId)">
                        <option value="" disabled="disabled">Select</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="row nocolpad">
            <div class="col-lg-6 col-md-12">
                <div class="form__group">
                    <label>Follow-UP</label>
                    <div class="dis-flex align-items-center grid-gap-15">
                        <div class="dis-inline-block">
                            <input type="radio" class="radio-custom" id="Required" name="patSearchTyp" ng-value="true" ng-model="Newlogobj.IsFollowUpRequired">
                            <label for="Required" class="radio-custom-label cur-poiter mb-0 text-label">Required</label>
                        </div>
                        <div class="dis-inline-block">
                            <input type="radio" class="radio-custom" id="notrequired" name="patSearchType" ng-value="false" ng-model="Newlogobj.IsFollowUpRequired">
                            <label for="notrequired" class="radio-custom-label cur-poiter mb-0 text-label">Not Required</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row nocolpad">
            <div class="col-12">
                <div class="form__group">
                    <label>Remarks</label>
                    <textarea class="register-input msd-elastic: \n;" id="textarea_remarks" placeholder="Start Typing..." rows="3" ng-model="Newlogobj.Notes"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>
