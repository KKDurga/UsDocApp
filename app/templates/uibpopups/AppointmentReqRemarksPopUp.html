<div class="modal-header">
    <h4 class="modal-title">{{ 'UPDATESTATUS' | translate}}</h4>
    <button type="button" class="btn btn-link" ng-click="closeuib()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <div class="ehr-input">
                <label>{{ 'STATUS' | translate}}</label>
                <select ng-model="RequestStatusId" ng-options="item.Id as item.Name for item in RequestStatusList" ng-change="ChangeRequestStatus()">
                </select>
            </div>
            <div class="ehr-input m-t-20">
                <label>{{ 'REMARKS' | translate}}</label>
                <textarea rows="5" ng-model="Remarks" quotes-restrict maxlength="200"></textarea>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <div class="row">
        <div class="col-lg-12">
            <button class="btn btn-save-us btn-block" ng-click="AddUpdateAppointmentRequest();">{{ 'SUBMIT' | translate}}</button>
        </div>
    </div>
</div>
