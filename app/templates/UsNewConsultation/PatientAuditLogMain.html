<div ng-controller="EhnotePatientParentCtrl">
    <section class="tile tile-shadow" >
        <div class="tile-header">
            <div class="row">
                <div class="col-lg-6 justify-space-around">
                    <h1>All Users Log List</h1>
                </div>
            </div>
        </div>
        <div>
            <div class="panel panel-default mb-5">
                <div class="panel-body p-t-0 p-b-0">
                    <div class="row appintment_view_pane">
                        <div class="col-lg-4 p-r-0">
                            <div class="row">

                                <div class="col-lg-6">
                                    <label>From Date</label>
                                    <input type="text" class="form-control icons-calendar" ng-model="PatientLevelLogsObj.FromDate" datepickerforinventoryfulldtsdash readonly />
                                </div>
                                <div class="col-lg-6">
                                    <label>To Date</label>
                                    <input type="text" class="form-control icons-calendar" ng-model="PatientLevelLogsObj.ToDate" datepickerforinventoryfulldtsdash readonly />

                                </div>
                            </div>
                        </div>
                        <div class="col-lg-3 ">
                            <div class="form-group ">
                                <div class="dropdown cstm-dropdown width-100">
                                    <label>Users</label>
                                    <button class="form-control select-dropdown boxshadowbill text-left" id="dropdownMenu3" data-toggle="dropdown" title="{{searchUserInLogs}}">
                                        {{searchUserInLogs}}
                                    </button>
                                    <div class="dropdown-menu dr-drop-app right-0" role="menu" aria-labelledby="dropdownMenu3" ng-click="stopClosingDropDown($event)">
                                        <div class="p-5">
                                            <input type="text" class="form-control input-sm bg-inputy" placeholder="{{ 'SEARCH' | translate}}" ng-model="searchUserInLogstab.txt1" />
                                        </div>
                                        <div class="drop-menu-Scroll apptsearchdroplist">
                                            <ul>
                                                <li>
                                                    <div class="checkbox cn">
                                                        <label>
                                                            <input name="checkbox-11" type="checkbox" ng-model="PatientLevelLogsObj.AllUsersCheck" ng-click="LogsCheckAllUsers(PatientLevelLogsObj.AllUsersCheck)">
                                                            <span class="checkbox-material">
                                                                <span class="check"></span>
                                                            </span>
                                                            <small>All Users</small>
                                                        </label>
                                                    </div>
                                                </li>
                                                <li ng-repeat="item in LogMaintainAllUsersList | filter:{'FullName':searchUserInLogstab.txt1}">
                                                    <div class="checkbox cn">
                                                        <label>
                                                            <input name="checkbox-11" type="checkbox" ng-model="item.isChecked" ng-click="LogsMaintainToggle(item);">
                                                            <span class="checkbox-material">
                                                                <span class="check"></span>
                                                            </span>
                                                            <small ng-bind="item.UserFullName + '-' + item.NPI"></small>
                                                        </label>
                                                    </div>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-2">
                            <button class="btn btn-success mt-25 width-100" ng-click="searchMainLogsReports()">Search</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="tile-body overflow-y-scroll" ng-hide="MainTainPatientAuditLogArray.length === 0">
            <div class="row overflow-y-scroll">
                <div class="col-lg-12">
                    <div class="table-responsive overflow-y-scroll">
                        <table class="table table-bordered m-b-10">
                            <thead>
                                <tr>
                                    <th width="2%">S.No</th>
                                    <th width="4%">Date</th>
                                    <th width="2%">Time</th>
                                    <th>User Name</th>
                                    <th>Action Type</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody ng-repeat="item in MainTainPatientAuditLogArray track by $index">
                                <tr>
                                    <td width="2%">{{$index + 1}}</td>
                                    <td width="4%">{{item.ActionDate | date:'MM/dd/yyyy'}}</td>
                                    <td width="2%">{{item.ModifiedTime | date:'HH:mm'}}</td>
                                    <td>{{item.UserName}}</td>
                                    <td>{{item.ActionType}}</td>
                                    <td>{{item.ActionDescription}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div class="row" ng-show="MainTainPatientAuditLogArray.length === 0">
        <div class="col-lg-12">
            <div class="billing-cominsoon m-t-20">
                <img src="img/no-data/no-data-icon.png">
                <div class="msg m-t-20">
                    <p class="nodata-text">  {{ 'OOPS' | translate}}</p>
                    <p class="nodata-txt-line2">
                        There is No Audit logs for This Patient
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
