<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Copy Plan</h1>
        <a class="btn__close--" ng-click="uibclose()">
            <i class="close__w32--"></i>
        </a>
    </div>
    <div class="modal__body--">
        <table class="table tableno-bordered m__0--">
            <thead>
                <tr>
                    <th><label class="fs__lg-- fw__6-- tc__1D1D1D--">Payor Name</label></th>
                    <th><label class="fs__lg-- fw__6-- tc__1D1D1D--">Plan</label></th>
                    <th><label class="fs__lg-- fw__6-- tc__1D1D1D--">Status</label></th>
                    <th><label class="fs__lg-- fw__6-- tc__1D1D1D--">Coverage Type</label></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="pitem in PatientInsuranceSummaryList | filter:{StatusId:1}">
                    <td ng-if="false">
                        <div class="dis-inline-block">

                            <input type="radio"
                                   class="radio-custom width-0"
                                   name="selectedInsurance"
                                   ng-model="pitem.selectedInsurance"
                                   ng-value="true"
                                   id="ins{{$index}}"
                                   ng-change="ChangeSelectedInsurance(pitem)">
                            <label for="ins{{$index}}" class="radio-custom-label cur-poiter mb-0 text-label">
                                {{pitem.PayorName}}
                            </label>


                            <!--<input type="radio" class="radio-custom width-0" id="ins1" name="ins1">
                        <label for="ins1" class="radio-custom-label cur-poiter mb-0 text-label">{{pitem.PayorName}}</label>-->
                        </div>
                    </td>
                    <td>
                        <div class="dis-inline-block">
                            <input type="radio"
                                   class="radio-custom width-0"
                                   name="selectedInsurance"
                                   ng-model="selectedInsuranceIndex"
                                   ng-value="$index"
                                   id="ins{{$index}}"
                                   ng-change="ChangeSelectedInsurance(pitem, $index)">
                            <label for="ins{{$index}}" class="radio-custom-label cur-poiter mb-0 text-label">
                                {{pitem.PayorName}}
                            </label>
                        </div>
                    </td>

                    <td>
                        <label class="fs__lg-- fw__5-- tc__1D1D1D--">{{pitem.PlanName}}</label>
                    </td>
                    <td>
                        <label class="fs__lg-- fw__5-- tc__2DAA2D--" ng-if="pitem.StatusId==1">Active</label>
                    </td>
                    <td>
                        <!--<label class="fs__lg-- fw__5-- tc__1D1D1D--">{{pitem.IdentifierName}}</label>-->
                        <div>
                            <p>
                                {{pitem.IdentifierId == 1 ? 'Primary' :pitem.IdentifierId == 2 ? 'Secondary' :(pitem.IdentifierId == 3 || pitem.IdentifierId == 5) ? 'Others' :(pitem.IdentifierId == 0 || pitem.IdentifierId == null) ? '-' : ''}}
                            </p>

                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="modal__footer--">
        <button class="btn__lg-- btn__1d5558--f" ng-click="confirmSelectedInsurance()">Confirm</button>
    </div>
</div>
