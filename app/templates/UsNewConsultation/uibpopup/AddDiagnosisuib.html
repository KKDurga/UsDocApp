<div class="row">
    <div class="col-lg-12">
        <table class="eh-table ros-table">
            <tbody>

                <tr>
                    <th width="30%" class="valign-top bg-assplans">
                        <h2 class="text-assesplan">Adviced Diagnosis</h2>
                        <ul class="list-none dis-flex m-l-10" ng-repeat="item in cacheStorageItem.AssessmentPlan| filter: { ActiveInd: 'Y' } track by $index">
                            <li class="dis-flex border-top p-5">
                                <span class="w-250">
                                    {{item.ICD10DIAGNAME}}
                                </span>
                                <span class="pull-right">
                                    <i class="adviced-arrow care-icons" ng-click="onClickaddDiagnosis(item);"></i>
                                </span>
                            </li>
                        </ul>
                    </th>
                    <td class="valign-top">
                        <div class="row p-8">
                            <div class="col-lg-12">
                                <div class="table-responsive">
                                    <div class="dis-flex align-items-center justify-space-between m-l-10 m-r-10">
                                        <!--<div>
        <fieldset>
            <div class="dis-inline-block">
                <input type="radio" class="radio-custom width-0">
                <label for="" class="radio-custom-label cur-poiter mb-0">ICD 9</label>
            </div>
            <div class="dis-inline-block ml-15 mr-15">
                <input type="radio" class="radio-custom width-0">
                <label for="" class="radio-custom-label cur-poiter mb-0">ICD 10</label>
            </div>
        </fieldset>
    </div>-->
                                        <div class="flex">
                                            <!--<input type="text" class="form-control icons-search input-color">-->
                                            <input ng-focus="addDiagnosis.FocusDiagnosis === true" type="text" class="form-control icons-search input-color"
                                                   name="Diagnosise"
                                                   autocomplete="off"
                                                   placeholder="Enter Diagnosis"
                                                   ng-model="addDiagnosis.SelectObj"
                                                   maxlength="100"
                                                   typeahead-min-length="0"
                                                   typeahead-focus-on-select="false"
                                                   uib-typeahead="item as item.DiagnosisName + ' - ' + item.DiagnosisCode for item in GetDiagnosisEasyList($viewValue)"
                                                   typeahead-on-select="onSelectDiagnosis(addDiagnosis.SelectObj)"
                                                   ng-blur="addDiagnosis.FocusDiagnosis = false;" />
                                        </div>
                                        <div class="w-40 text-center">
                                            <i class="close-red care-icons m-auto" ng-click="closeDiagnosisUibpopup();"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row p-10">
                            <div class="col-lg-12">
                                <table class="eh-table">
                                    <tbody ng-show="addDiagnosis.DiagnosisArray.length > 0">
                                        <tr ng-repeat="ditem in addDiagnosis.DiagnosisArray| filter: { ActiveInd: 'Y' } track by $index">
                                            <td>
                                                <span>{{ditem.ICDCode}}</span>
                                                <span> | </span>
                                                <span>{{ditem.DiagnosisName}}</span>                                                
                                            </td>
                                            <td width="5%">
                                                <div class="dis-flex">
                                                    <a ng-click="RemoveDiagnsis(ditem, $index)" class="">
                                                        <i class="eh-close eh-icon"></i>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                    <tbody ng-show="(addDiagnosis.DiagnosisArray| filter: { ActiveInd: 'Y' }).length === 0">
                                        <tr>
                                            <td class="text-center">
                                                <div class="billing-cominsoon">
                                                    <img src="img/no-data/no-reports.png">
                                                    <div class="msg">
                                                        <span>No Diagnosis added.</span>
                                                        <a href="" ng-click="addDiagnosis.FocusDiagnosis = true;">Click here</a>
                                                        <span>or on search box to add Diagnosis.</span>
                                                    </div>
                                                </div>

                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="dis-flex m-t-10 p-5 pull-right" ng-show="addDiagnosis.DiagnosisArray.length > 0">
                            <div>
                                <button class="btn btn-discard-us" ng-click="closeDiagnosisUibpopup()">Discard</button>
                                <button class="btn btn-save-us" ng-click="SaveDiagnosisUibpopup()">Save</button>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
