<style>

    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    table, td, th {
        border: 1px solid #aaa;
    }

    table {
        border-collapse: collapse;
    }

    td, th {
        padding: 10px;
    }

    progress {
        width: 40%;
    }

    span {
        font-size: small;
        font-style: italic;
    }

    .input {
        margin-bottom: 10px;
        padding: 5px;
        background-color: gainsboro;
    }

    #fileinput {
        width: 50%;
        border: 1px dotted gray;
    }

    .layerGroup {
        display: inline-block;
        height: 350px;
        width: max(30%, 350px);
        margin: 5px;
        background-color: #000000;
        /* allow child centering */
        position: relative;
    }

    .layer {
        /* needed for overlay */
        position: absolute;
        /* center */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    canvas {
        /* avoid parent auto-resize */
        vertical-align: middle;
    }

    .line {
        padding: 5px;
    }
    /** tooltip */
    .layerGroup span {
        display: none;
        background-color: palegreen;
        padding: 2px;
    }

    .layerGroup:hover span {
        display: inline-block;
        position: absolute;
        overflow: hidden;
    }
    /** crossshair */
    .layerGroup hr {
        pointer-events: none;
        border: none;
        position: absolute;
        margin: 0;
    }

    hr.horizontal {
        border-top: 2px dashed lime;
    }

    hr.vertical {
        border-top: 2px dashed lime;
        transform-origin: left;
        transform: rotate(90deg);
    }
</style>
