<div class="modal-header">
    <h1 class="modal-title">Gonioscopy</h1>
</div>
<!--<div class="modal-body" ng-if="inv.InvestigationId === 2127" ng-repeat="inv in cacheStorageItem.GonioscopyDetails track by $index">-->
<div class="modal-body" ng-if="inv.InvestigationId === 2127" ng-repeat="inv in GonioscopyDetailsList track by $index">
    <div class="row">
        <div class="col-lg-12">
            <table class="us-table table-layout-fix">
                <tbody>
                    <tr>
                        <td>
                            <div class="us-od pos-absolute left-0 top-0 p-t-5 p-b-5 p-l-8 p-r-8">OD</div>
                            <div class="gynoscopy-img">
                                <div class="gynoscopy-flex">

                                    <div class="gyno-top">
                                        <select class="register-select m-b-5" ng-model="inv.RightEye.DepthTopValueObj" ng-change="changeGonioscopyValue(inv,inv.RightEye.DepthTopValueObj,'depthtop','Right')" ng-options="item as item.Name for item in DepthArrayList">
                                            <option value="">select</option>
                                        </select>
                                        <select class="register-select" ng-model="inv.RightEye.TopValueObj"
                                                ng-options="item as item.Name for item in GonioscopyStructuresdropdown"
                                                ng-change="changeGonioscopyValue(inv,inv.RightEye.TopValueObj,'top','Right')">
                                            <option value="">select</option>
                                        </select>
                                    </div>
                                    
                                    <div class="gyno-left">
                                        <select class="register-select m-b-5" ng-model="inv.RightEye.DepthLeftValueObj" ng-change="changeGonioscopyValue(inv,inv.RightEye.DepthLeftValueObj,'depthleft','Right')" ng-options="item as item.Name for item in DepthArrayList">
                                            <option value="">select</option>
                                        </select>
                                        <select class="register-select" ng-model="inv.RightEye.LeftValueObj"
                                                ng-options="item as item.Name for item in GonioscopyStructuresdropdown"
                                                ng-change="changeGonioscopyValue(inv,inv.RightEye.LeftValueObj,'left','Right')">
                                            <option value="">select</option>
                                        </select>
                                    </div>
                                    
                                    <div class="gyno-right">
                                        <select class="register-select m-b-5" ng-model="inv.RightEye.DepthRightValueObj" ng-change="changeGonioscopyValue(inv,inv.RightEye.DepthRightValueObj,'depthright','Right')"  ng-options="item as item.Name for item in DepthArrayList">
                                            <option value="">select</option>
                                        </select>
                                        <select class="register-select" ng-model="inv.RightEye.RightValueObj"
                                                ng-options="item as item.Name for item in GonioscopyStructuresdropdown"
                                                ng-change="changeGonioscopyValue(inv,inv.RightEye.RightValueObj,'right','Right')">
                                            <option value="">select</option>
                                        </select>
                                    </div>
                                    
                                    <div class="gyno-bottom">
                                        <select class="register-select m-b-5" ng-model="inv.RightEye.DepthBottomValueObj" ng-change="changeGonioscopyValue(inv,inv.RightEye.DepthBottomValueObj,'depthbottom','Right')" ng-options="item as item.Name for item in DepthArrayList">
                                            <option value="">select</option>
                                        </select>
                                        <select class="register-select" ng-model="inv.RightEye.BottomValueObj"
                                                ng-options="item as item.Name for item in GonioscopyStructuresdropdown"
                                                ng-change="changeGonioscopyValue(inv,inv.RightEye.BottomValueObj,'bottom','Right')">
                                            <option value="">select</option>
                                        </select>
                                    </div>
                                    
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="us-os pos-absolute left-0 top-0 p-t-5 p-b-5 p-l-8 p-r-8">OS</div>
                            <div class="gynoscopy-img">
                                <div class="gynoscopy-flex">
                                    <div class="gyno-top">
                                        <select class="register-select m-b-5"  ng-model="inv.LeftEye.DepthTopValueObj"  ng-change="changeGonioscopyValue(inv,inv.LeftEye.DepthTopValueObj,'depthtop','Left')" ng-options="item as item.Name for item in DepthArrayList">
                                            <option value="">select</option>
                                        </select>
                                        <select class="register-select" ng-model="inv.LeftEye.TopValueObj"
                                                ng-options="item as item.Name for item in GonioscopyStructuresdropdown"
                                                ng-change="changeGonioscopyValue(inv,inv.LeftEye.TopValueObj,'top','Left')">
                                            <option value="">select</option>
                                        </select>
                                    </div>
                                    
                                    <div class="gyno-left">
                                        <select class="register-select m-b-5" ng-model="inv.LeftEye.DepthLeftValueObj" ng-change="changeGonioscopyValue(inv,inv.LeftEye.DepthLeftValueObj,'depthleft','Left')" ng-options="item as item.Name for item in DepthArrayList">
                                            <option value="">select</option>
                                        </select>
                                        <select class="register-select" ng-model="inv.LeftEye.LeftValueObj"
                                                ng-options="item as item.Name for item in GonioscopyStructuresdropdown"
                                                ng-change="changeGonioscopyValue(inv,inv.LeftEye.LeftValueObj,'left','Left')">
                                            <option value="">select</option>
                                        </select>
                                    </div>
                                    
                                    <div class="gyno-right">
                                        <select class="register-select m-b-5"  ng-model="inv.LeftEye.DepthRightValueObj" ng-change="changeGonioscopyValue(inv,inv.LeftEye.DepthRightValueObj,'depthright','Left')"  ng-options="item as item.Name for item in DepthArrayList">
                                            <option value="">select</option>
                                        </select>
                                        <select class="register-select" ng-model="inv.LeftEye.RightValueObj"
                                                ng-options="item as item.Name for item in GonioscopyStructuresdropdown"
                                                ng-change="changeGonioscopyValue(inv,inv.LeftEye.RightValueObj,'right','Left')">
                                            <option value="">select</option>
                                        </select>
                                    </div>
                                    
                                    <div class="gyno-bottom">
                                        <select class="register-select m-b-5" ng-model="inv.LeftEye.DepthBottomValueObj" ng-change="changeGonioscopyValue(inv,inv.LeftEye.DepthBottomValueObj,'depthbottom','Left')" ng-options="item as item.Name for item in DepthArrayList">
                                            <option value="">select</option>
                                        </select>
                                        <select class="register-select" ng-model="inv.LeftEye.BottomValueObj"
                                                ng-options="item as item.Name for item in GonioscopyStructuresdropdown"
                                                ng-change="changeGonioscopyValue(inv,inv.LeftEye.BottomValueObj,'bottom','Left')">
                                            <option value="">select</option>
                                        </select>
                                    </div>
                                    
                                </div>
                            </div>
                        </td>
                    </tr>                   
                    <tr>
                        <td>
                            <table class="table tableno-bordered m-b-0 m-t-20">
                                <tbody>
                                    <tr>
                                        <td width="10%">
                                            <div class="text-s12w600c000">
                                                Pigment
                                            </div>
                                        </td>
                                        <td width="25%">
                                            <select class="register-select m-l-5" ng-model="inv.RightEye.PigmentValueObj"
                                                    ng-options="item as item.Name for item in PigmentArrayList"
                                                    ng-change="changeGonioscopyValue(inv,inv.RightEye.PigmentValueObj,'Pigment','Right')">
                                                <option value="">select</option>
                                            </select>
                                        </td>
                                        <td width="25%">
                                            <div class="text-s12w600c000">
                                                Possible Diagnosis
                                            </div>
                                        </td>
                                        <td>
                                            <select class="register-select m-l-5" ng-model="inv.RightEye.PossibleDiagnosisObject" 
                                                    ng-change="changePossibleDiagnosisright(inv,inv.RightEye.PossibleDiagnosisObject)" 
                                                    ng-options="item as item.PossibleDiagnosis for item in PossibleDiagnosisArray">
                                                <option value="">select</option>
                                            </select>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>                      
                        <td>
                            <table class="table tableno-bordered m-b-0 m-t-20">
                                <tbody>
                                    <tr>
                                        <td width="10%">
                                            <div class="text-s12w600c000">
                                                Pigment
                                            </div>
                                        </td>
                                        <td width="25%">
                                            <select class="register-select m-l-5" ng-model="inv.LeftEye.PigmentValueObj"
                                                    ng-options="item as item.Name for item in PigmentArrayList"
                                                    ng-change="changeGonioscopyValue(inv,inv.LeftEye.PigmentValueObj,'Pigment','Left')">
                                                <option value="">select</option>
                                            </select>
                                        </td>
                                        <td width="25%">
                                            <div class="text-s12w600c000">                                  
                                                Possible Diagnosis
                                            </div>
                                        </td>
                                        <td>
                                            <select class="register-select m-l-5" ng-model="inv.LeftEye.PossibleDiagnosisObject" 
                                                 ng-change="changePossibleDiagnosisleft(inv,inv.LeftEye.PossibleDiagnosisObject)"
                                                 ng-options="item as item.PossibleDiagnosis for item in PossibleDiagnosisArray">
                                                <option value="">select</option>
                                            </select>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                </tbody>
                <tr>
                    <td>
                        <textarea class="us-form" rows="2" placeholder="Add Notes Here" ng-model="inv.RightEyeRemarks" maxlength="500"></textarea>
                    </td>
                    <td>
                        <textarea class="us-form" rows="2" placeholder="Add Notes Here" ng-model="inv.LeftEyeRemarks" maxlength="500"></textarea>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12 text-right">
            <button class="btn btn-discard-us" ng-click="gonioscopyuibclose(inv)">Close</button>
            <button class="btn btn-save-us" ng-click="gonioscopySave();">Save</button>
        </div>
    </div>
</div>
