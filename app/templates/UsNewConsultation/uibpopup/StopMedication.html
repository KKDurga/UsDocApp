<div class="modal__style--1">
    <div class="modal__header--">
        <h1>Stop Medications</h1>
        <button class="btn__lg-- btn__C71D27--o" ng-click="closeStopmedicationPopup()">Close</button>
    </div>
    <div class="modal__body--">
        <div class="d__f-- fd__c-- gap__10--">
            <div class="row nocolpad">
                <div class="col-lg-6">
                    <div class="form__group">
                        <label>Date Stopped <em>*</em></label>
                        <input type="text" placeholder="Select Date" ng-model="StopMedication.StopDate" datepicker-manual-and-cal-selection />
                        <i class="icons__w16-- calender__w16--o position__absolute-- top-30 right-5"></i>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="form__group">
                        <label>Common Reason <em>*</em></label>
                        <select ng-model="StopMedication.StopReasonId" ng-change="changeStopMedication(StopMedication.StopReasonId)" ng-options="aitem.StopReasonId as aitem.StopReason for aitem in MedicationStopReasons">
                            <option selected>Select</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row nocolpad">
                <div class="col-lg-12">
                    <div class="form__group">
                        <label>Notes</label>
                        <textarea placeholder="Instructions" ng-model="StopMedication.StopMedicationNotes" maxlength="500" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal__footer--">
        <div class="d__f-- jc__e--">
            <button class="btn__lg-- btn__1d5558--f" ng-click="StopmedicatioSave()">Save</button>
        </div>
    </div>
</div>
