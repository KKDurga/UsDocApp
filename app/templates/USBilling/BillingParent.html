<div class="m-t-10">
    <div class="col-lg-12">
        <div class="text-center">
            <ul class="nav nav-tabs invent-tabs">
                <li ng-show="SpecializationId !== 2 && SpecializationId !== 16" ng-class="(ClaimSubTab == 1)?'active':''">
                    <a href="javascript:;" style="cursor:pointer" ng-click="SwitchBillingPage(1,'')">
                        <i class="allbilling-hicn a-icon"></i>
                        New Claim
                    </a>
                </li>
                <li ng-class="(ClaimSubTab == 2)?'active':''">
                    <a href="javascript:;" style="cursor:pointer" ng-click="SwitchBillingPage(2,'')" ng-hide="showPatientWiseBillling">
                        <i class="previous-billing-hicn a-icon"></i>
                        Ledger
                    </a>
                </li>
            </ul>
        </div>
        <div class="tab-content">
            <div class="" ng-if="ClaimSubTab===1">
                <addupdatebilling-directive main-billing-object="currentBillingObject" doctorinfo="doctorinfo"></addupdatebilling-directive>



            </div>
            <div class="" ng-if="ClaimSubTab===2">
                <addupdatebilling-directive main-billing-object="currentBillingObject" doctorinfo="doctorinfo"></addupdatebilling-directive>
            </div>
        </div>
    </div>
</div>
