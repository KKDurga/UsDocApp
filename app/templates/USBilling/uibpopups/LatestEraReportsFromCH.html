<div class="modal-header">
    <h2 class="modal-title">
        Reports List
    </h2>
    <button type="button" class="close m-r-10 m-b-3 m-t-0" ng-click="ClosePopup()">
        <i class="fas fa-times"></i>
    </button>
</div>
<div class="modal-body">
    <div class="row">

        <div class="col-lg-12">
            <section class="tile tile-shadow br-1">

                <div class="tile-body">

                    <div class="row">
                        <div class="col-lg-12">
                            <section class="tile tile-shadow">
                                <div class="tile-header">

                                    <div class="row">
                                        <div class="col-lg-8"></div>
                                        <div class="col-lg-2">
                                            <div class="form-group dis-flex">
                                                <label class="w-200" style="font-size:10px;">Report Name :</label>
                                                <input type="text" class="form-control" />
                                            </div>
                                        </div>
                                        <div class="col-lg-2">
                                            <div class="form-group">
                                                <button class="btn btn-info" ng-click="getlatestERAReports()">Get Latest Reports</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="tile-body" ng-show="convertedRemittanceReportsList.length !==0">
                                    <div class="table-responsive">
                                        <table class="table tableAccordion">
                                            <thead>
                                                <tr>
                                                    <th>S.No.</th>
                                                    <th>Report Date.</th>
                                                    <th>Report Name</th>
                                                    <th>Submitter</th>
                                                    <th>Status</th>
                                                    <th>Action</th>
                                                    <th class="text-center" width="65">
                                                        <a href="javascript:;">
                                                            <img src="img/new-icons/more-icon.svg" width="18" />
                                                        </a>
                                                    </th>

                                                </tr>
                                            </thead>
                                            <tbody ng-repeat="mitem in convertedRemittanceReportsList">
                                                <tr class="accotab-head">
                                                    <td>{{$index+1}}</td>
                                                    <td> {{mitem.ReportDate | date:'dd-MM-yyyy'}} </td>
                                                    <td>
                                                        <label>{{mitem.ReportName}}</label>
                                                    </td>
                                                    <td> {{mitem.SubmitterId}} </td>
                                                    <td>
                                                        <span ng-if="!mitem.IsConverted">Not Converted</span>
                                                        <span ng-if="mitem.IsConverted">Converted</span>
                                                    </td>
                                                    <td>

                                                        <button class="btn btn-danger" ng-if="!mitem.IsConverted" ng-click="convertReport(mitem)">Convert</button>
                                                        <!--<button class="btn btn-danger" ng-if="mitem.IsConverted" ng-click="convertReport(mitem)">Approve</button>-->
                                                    </td>
                                                    <!--<td>
                                                        <button class="btn btn-new" ng-click="ShowContent(mitem)">
                                                            <i class="fas fa-chevron-down" ng-if="!mitem.ContentShow"></i>
                                                            <i class="fas fa-chevron-up" ng-if="mitem.ContentShow"></i>
                                                        </button>
                                                    </td>-->

                                                </tr>

                                            
                                            </tbody>
                                        </table>
                                    </div>

                                    <div class="row mb-10">
                                        <div class="col-lg-12 text-center EH-pagination">
                                            <uib-pagination ng-if="convertedRemittanceReportsList.length > 0"
                                                            total-items="getEraReportsObj.TotalCount"
                                                            ng-model="getEraReportsObj.PageNumber"
                                                            ng-change="changeEraReportsListPage(getEraReportsObj.PageNumber)"
                                                            items-per-page="getEraReportsObj.PageSize"
                                                            class=""
                                                            boundary-link-numbers="true"
                                                            boundary-links="true"
                                                            max-size="maxSize"
                                                            rotate="false"></uib-pagination>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            <section class="tile tile-shadow" ng-show="convertedRemittanceReportsList.length ===0">

                                <div class="tile-body">
                                    <div class="row">
                                        <div class="col-lg-12">
                                            <div class="billing-cominsoon text-center">
                                                <img src="img/no-data/no-results.png">
                                                <div class="msg">
                                                    <p class="goback-text">No Data Found</p>

                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>




                </div>
            </section>
        </div>
         
    </div>
   

</div>
<div class="modal-footer">
    <button type="button" class="btn btn-danger" ng-click="ClosePopup()">Close</button>
    <!--<button type="button" class="btn btn-success" ng-click="SavePopup()">Save</button>-->
</div>
