<div class="modal-header">
    <h4 class="modal-title">Modifiers List</h4>
</div>
<div class="modal-body p-t-10 p-b-10">
    <div class="row">
        <div class="col-lg-12" >
            <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
               
                <tbody>                   
                    <tr ng-repeat="Aitem in SelectedModifiersList track by $index">
                        <td>
                            <div class="bg-new-light text-acdcode p-5">
                                {{Aitem.ModifierName}}                              
                            </div>
                        </td>
                      

                        <td width="20%">
                            <button class="btn btn-outline-danger btn-block" ng-click="RemoveModifiers(Aitem)">
                                <i class="fas fa-backspace text-ldanger"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>



    </div>
    <div class="row m-t-10">
        <div class="col-lg-12 text-center">
            <button class="btn btn-discard-us" ng-click="closeItems()">Close</button>
            <button type="button" class="btn btn-save-us" ng-click="SaveModifiers()">Save</button>
        </div>
    </div>
</div>
