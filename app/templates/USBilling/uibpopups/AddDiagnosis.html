<div class="row">
    <div class="col-lg-12">
        <table class="eh-table  ros-table">
            <tbody>              
                <tr>
                    <th width="30%" class="valign-top bg-assplans">
                        <h2 class="text-assesplan">Adviced Diagnosis</h2>
                        <ul class="list-none dis-flex m-l-10"  ng-repeat="Ditem in AdvicedDiagnosisList track by $index">
                            <li class="dis-flex border-top p-5">                                
                                <span>
                                    {{Ditem.ICD10DIAGDESCRIPTION}}
                                </span>
                                <span class="pull-right">
                                    <a href="javascript:;" ng-click="SelectedAdviceditem(Ditem)">
                                        <i class="adviced-arrow care-icons"></i>
                                    </a>                              
                                </span>
                            </li>                            
                        </ul>
                    </th>
                    <td class="valign-top">
                        <div class="row p-8">
                            <div class="col-lg-12">
                                <div class="dis-flex align-items-center">
                                    <div class="table-responsive flex">
                                        <div class="dis-flex align-items-center justify-space-between m-l-10 m-r-10">
                                            <div>
                                                <fieldset>
                                                    <div class="dis-inline-block">
                                                        <input type="radio" class="radio-custom width-0" id="DiagNameId" ng-value="1" aria-invalid="false" ng-model="SearchType" ng-change="ChangeSearchType()">
                                                        <label for="DiagNameId" class="radio-custom-label cur-poiter mb-0 text-new">ICD-10 Code</label>
                                                    </div>
                                                    <div class="dis-inline-block ml-15">
                                                        <input type="radio" class="radio-custom width-0" id="DiagNameId1" ng-value="2" aria-invalid="false" ng-model="SearchType" ng-change="ChangeSearchType()">
                                                        <label for="DiagNameId1" class="radio-custom-label cur-poiter mb-0 text-new"> ICD-10 Description</label>
                                                    </div>
                                                </fieldset>
                                            </div>
                                            <div class="flex m-l-10">
                                                <input type="text" class="form-control icons-search input-color"
                                                       placeholder="Select ICD code or enter description"
                                                       ng-model="obj.SelectedDiagnosis" ng-change="changeDiagnosis(obj.SelectedDiagnosis,SearchType)" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="w-30 text-center">
                                        <a href="javascript:;" ng-click="closeItems()">
                                            <i class="close-red care-icons w-10"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="">
                            <div class="row" ng-if="SearchDiagnosisList.length>0">
                                <div class="col-lg-12">
                                    <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
                                        <thead>
                                            <tr>
                                                <th class="w-130 text-center">
                                                    ICD-10 Code
                                                </th>
                                                <th>
                                                    Description
                                                </th>
                                                <th class="w-80 text-center">
                                                    Add
                                                </th>                                               
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr ng-repeat="item in SearchDiagnosisList track by $index">
                                                <td>
                                                    <input type="text" class="form-control" ng-model="item.ICD10CODE" disabled="disabled" />
                                                </td>
                                                <td>
                                                    <input type="text" class="form-control" ng-model="item.ICD10DIAGDESCRIPTION" disabled="disabled" />
                                                </td>
                                                <td>
                                                    <button class="btn btn-success btn-block" ng-click="AddDiagnosis(item)">
                                                        <i class="fas fa-plus"></i>
                                                    </button>
                                                </td>                                              
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="row" ng-if="SearchDiagnosisList.length>0">
                                <div class="col-lg-12">
                                    <div class="EH-pagination text-center">
                                        <uib-pagination total-items="newobja.count"
                                                        ng-model="newobja.PageNumber"
                                                        ng-change="changePageDiag(newobja.PageNumber)"
                                                        ng-show="SearchDiagnosisList.length > 0"
                                                        items-per-page="newobja.PageSize"
                                                        max-size="5"
                                                        class=""
                                                        boundary-link-numbers="true"
                                                        rotate="false"></uib-pagination>
                                    </div>
                                </div>
                            </div>
                            <div class="row" ng-show="SearchDiagnosisList.length===0 && SelectedDiagnosisList.length==0">
                                <div class="col-lg-12">
                                    <div class="billing-cominsoon text-center ng-scope">
                                        <img src="img/no-data/no-results-appointment.png">
                                        <div class="msg">
                                            <p class="goback-text">No items selected</p>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row p-10" ng-if="SelectedDiagnosisList.length>0">
                            <div class="col-lg-12">
                                <table class="table tableno-bordered m-b-0 apptFilterTable bg-white">
                                    <thead>
                                        <tr>                                         
                                            <th class="w-150">
                                                ICD-10 Code
                                            </th>
                                            <th>
                                                Description
                                            </th>
                                        
                                            <th class="w-80 text-center">
                                                Remove
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="kitem in SelectedDiagnosisList | orderBy : 'Type' track by $index">                                          
                                            <td>
                                                <div class="bg-new-light text-acdcode p-5">
                                                    {{kitem.ICD10CODE}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="bg-new-light text-acdcode p-5">
                                                    {{kitem.ICD10DIAGDESCRIPTION}}
                                                </div>
                                            </td>                                        
                                            <td>
                                                <button class="btn btn-outline-danger btn-block" ng-click="RemoveDiagnosis(kitem)">
                                                    <i class="fas fa-backspace text-ldanger"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="dis-flex m-t-10 p-5 pull-right">
                            <div>
                                <button class="btn btn-discard-us" ng-click="closeItems()">Close</button>
                                <button class="btn btn-save-us" ng-click="SaveDiagnosis()">Save</button>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
