<div class="modal__style--1">
    <div class="modal__header-- px__15--">
        <h6 class="fs__xl-- fw__6--">Excel Exports - <span class="fs__lg-- fw__5--">{{ExcelReportsObj.ReportName}}</span></h6>
        <a class="btn__close--2" ng-click="uibclose()">
            <i class="icons__w16-- close__w16--s" ng-class="hovered ? 'close__w16--o' : 'close__w16--s'" ng-mouseenter="hovered = true" ng-mouseleave="hovered = false" style=""></i>
        </a>
    </div>
    <div class="modal__body--">
        <div class="section__style--4 height__100--">
            <div class="section__body-- height__100-- bradius__4-- p__0--">
                <div class="position__relative-- height__100--">
                    <div class="adjustable-position slim-scroll">
                        <table class="table__style--5 border__none-- text-left" ng-if="ExportSummarylist.length > 0">
                            <thead>
                                <tr>
                                    <th class="px__12-- py__6-- bg__F0F0F0--" width="15%"><label class="fs__lg-- fw__6-- tc__1D1D1D--">Created Date</label></th>
                                    <th class="px__12-- py__6-- bg__F0F0F0--"><label class="fs__lg-- fw__6-- tc__1D1D1D--">User</label></th>
                                    <!--Unhide this column only for Aging excel popup in claims-->
                                    <th class="px__12-- py__6-- bg__F0F0F0--" width="26%"><label class="fs__lg-- fw__6-- tc__1D1D1D--">Report type</label></th>
                                    <th class="px__12-- py__6-- bg__F0F0F0--"><label class="fs__lg-- fw__6-- tc__1D1D1D--">Status</label></th>
                                    <th class="px__12-- py__6-- bg__F0F0F0--" width="13%"><label class="fs__lg-- fw__6-- tc__1D1D1D--">Action</label></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in ExportSummarylist track by $index">
                                    <td class="px__12-- py__15--"><label class="fs__lg-- fw__5-- tc__656565-- text-left">{{item.CreatedDt | date:'MM-dd-yyyy hh:mm:ss a'}}</label></td>
                                    <td class="px__12-- py__15--">
                                        <div>
                                            <label class="text-left fs__lg-- fw__5-- tc__1D1D1D-- overflow-hidden to__ellipsis-- ws__nowrap--" title="Michelle K">{{item.RequestedByUserName}}</label>
                                        </div>
                                    </td>
                                    <!--Unhide this column only for Aging excel popup in claims-->
                                    <!--ReportTypeName names the period that was exported - "OD Daily Report Custom". Only the dashboard exports carry it, the rest fall back to the master report name-->
                                    <td class="px__12-- py__15--"><label class="fs__lg-- fw__5-- tc__1D1D1D-- text-left">{{item.ReportTypeName || item.MasterReportName}}</label></td>
                                    <td class="px__12-- py__15--"><label class="fs__lg-- fw__5-- tc__1D1D1D-- text-left">{{item.StatusName}}</label></td>
                                    <td>
                                        <a class="fs__lg-- fw__6-- tc__1D5558-- text-underline"
                                           ng-if="item.CSVFileUrl"
                                           ng-href="{{item.CSVFileUrl}}"
                                           target="_blank"
                                           download>
                                            Download
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="text-center py__20--" ng-if="ExportSummarylist.length === 0">
                            <label class="fs__lg-- fw__5-- tc__656565--">No Data Found</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
