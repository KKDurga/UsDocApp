<div class="row">
    <div class="model-popup-header">
        <h4 class="modal-title" id="myModalLabel">Patient List</h4>
    </div>
    <div class="modal-body bg-white text-right col-lg-12">
        <div class="row">
            <section class="tile text-shadow">
                <div class="col-xs-12 o-style col-sm-6 col-md-3 col-lg-3" ng-class="patientinfo.Gender == 'Male' ? 'col  app-box male': 'col   app-box female'" ng-repeat="patientinfo in patients" ng-click="consultationEntry(patientinfo)">
                    <div class="card patient-card start-con-ho">
                        <div class="start-book-plist">
                            
                            <button class="btn btn-sbhover top-25"><i class="far fa-calendar-alt"></i> Book Appointment</button>
                        </div>
                        <canvas class="header-bg" width="250" height="70" id="header-blur"></canvas>
                        <div class="avatar">
                            <img src="img/icon-male-new.png" ng-if="patientinfo.Gender == 'Male' || patientinfo.Gender == 'M'" alt="" />
                            <img src="img/icon-female-new.png" ng-if="patientinfo.Gender == 'Female'|| patientinfo.Gender == 'F'" alt="" />


                            <div class="Patient-ltst" ng-if="patientinfo.Gender === undefined || patientinfo.Gender == ''">

                                <span>{{patientinfo.PatientFullName | limitTo:2}} </span>
                            </div>



                        </div>
                        <div class="content patient-content" title="{{patientinfo.PatientFullName}}">
                            <h5>
                                <span ng-bind="(patientinfo.Title) ? (patientinfo.Title + '.'):''"></span>
                                <p class="mb-0 no-patiwid" ng-bind="patientinfo.PatientFullName"></p>
                            </h5>

                            <h4 class="font-h4">

                                <b>Gender: </b>

                                <span ng-if="patientinfo.Gender == 'Male'|| patientinfo.Gender == 'M'">Male</span>
                                <span ng-if="patientinfo.Gender == 'Female'|| patientinfo.Gender == 'F'">Female</span>
                                <span ng-if="(patientinfo.Gender == undefined || patientinfo.Gender == '')">N/A</span>


                            </h4>

                            <p>
                                <b>Age:</b><span ng-bind="patientinfo.Age | limitTo:2"></span>
                                <!--<span ng-bind="((patientinfo.CurrentAge === undefined) ? patientinfo.Age :(((patientinfo.CurrentAge.year > 0) ?patientinfo.CurrentAge.year + ' y' : '' )+ ' ' + (((patientinfo.CurrentAge.month > 0) ? patientinfo..CurrentAge.month + ' m' : ''))))"></span>-->
                            </p>
                        </div>
                    </div>
                </div>


            </section>
            <div class="col-lg-12 col-md-12 text-right">
                <button href="" class="add-more-btn  btn primary-btn mb-20" ng-disabled="addnew ===true" ng-click="AddPatient(1)">Add New Patient</button>
            </div>
        </div>
        
    </div>
    <div class="modal-footer bg-white text-right col-lg-12">
        <button class="btn danger-btn" ng-click="cancel()">Cancel</button>
        <!--<button class="btn primary-btn" ng-click="BookAppointment()">
       
        </button>-->
    </div>
</div>
