    <script type="text/ng-template" id="ntpserverpopover.html" ng-show="isntp">
        <label class="text-s12w500c1caf71 fs-16 bg-new-light m-b-10 p-2 width-100">Config NTP Server</label>
        <div class="ehr-input pop-ehr-input p-6 bradius-6 bg-e5e5e5">
            <div class="ehr-input-group">
                <label>Enter URL</label>
                <input type="text" class="flex m-l-6" ng-model="ntpServer.url" />
                <button ng-click="configureNtpServer()">Configure</button>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <table class="table fs-12 table-layout-fix m-t-10 table-bordered">
                    <tbody>
                        <tr>
                            <th>ITS Server Name:</th>
                            <th>{{ntpServer.LocalServerName}}</th>
                            <th>IP Address:</th>
                            <th>{{ntpServer.LocalIpAddress}}</th>
                        </tr>
                        <tr>
                            <th>Time:</th>
                            <th colspan="3">{{ntpServer.LocalTime}}</th>
                        </tr>
                        <tr>
                            <th>NTP Server Name:</th>
                            <th>{{ ntpServer.NtpServerName }}</th>
                            <th>IP Address:</th>
                            <th>{{ ntpServer.NtpIpAddress }}</th>
                        </tr>
                        <tr>
                            <th>Time:</th>
                            <th>{{ntpServer.NtpTime}}</th>
                            <th>Version:</th>
                            <th>{{ntpServer.version}}</th>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </script>
