
<link rel="stylesheet" href="Resources/Style/ds.demo.css">
<div ng-controller="DocumentScannerCtrl">

    <div class="row">
        <div id="main">
            <div class="container">
                <div class="ct-lt clearfix">
                    <!--<div id="dwtcontrolContainer"></div>-->
                </div>
                <div class="ct-rt">
                    <div class="content clearfix">
                        <div class="section">
                            <input type="button" value="Scan" ng-click="AcquireImage();" class="btn mr20" />
                            <input type="button" value="Open a local file" ng-click="LoadImages();" class="btn" />
                            <div class="item mt10 radioGroup">
                                Upload file format:
                                <label for="jpeg" style="margin-right: 12px;">
                                    <input type="radio" value="jpg" name="ImageType" id="jpeg" checked="checked" /> JPG
                                </label>
                                <label for="tiff" style="margin-right: 12px;">
                                    <input type="radio" value="tif" name="ImageType" id="tiff" /> TIF
                                </label>
                                <label for="pdf">
                                    <input type="radio" value="pdf" name="ImageType" id="pdf" /> PDF
                                </label>
                            </div>
                            <div class="mt10">
                                <div>
                                    <label>Script Language :</label>
                                    <select size="1" id="ddlLanguages" class="w60p fr" onchange="languageSelected();"></select>
                                    <div id="tipInfo">
                                        <p>Make sure your servrer supports the language you choose!</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="extra-fields-div-id" class="section">
                            <div>
                                <label>HTTP Form Fields: </label>
                                <div type="text" class="addBtn w60p fr" onclick="addAField()">&plus;</div>
                            </div>
                            <br />
                            <div id="div-extra-fields" class="" style="display:none; max-height:70px;">
                                <div class="div-fields-item">
                                    <input type="text" class="w47p mb15" placeholder="Field Name" /> :
                                    <input type="text" class="w47p mb15" placeholder="Field Value" />
                                </div>
                            </div>
                        </div>
                        <div class="section" style="width:100%; float:left;">
                            <div style="width:32%;float:left; border-right: solid 1px #e7e7e7;">
                                <input type="button" value="Upload" ng-click="UploadImage();" class="mt10 mb10 btn bgBlue" style="width:100px;" />
                            </div>
                            <!--<div style="width:32%;float:left; border-right: solid 1px #e7e7e7;">
                                <input type="button" value="Save JPG" ng-click="saveFileAsJPG();" class="mt10 mb10 btn bgBlue" style="width:100px;" />
                            </div>
                            <div style="width:32%;float:left; border-right: solid 1px #e7e7e7;">
                                <input type="button" value="Save PDF" ng-click="saveFileAsPDF();" class="mt10 mb10 btn bgBlue" style="width:100px;" />
                            </div>-->
                            <!--<div style="width:67%;float:left; padding-left:5%;">
                                <label>
                                    <input type="checkbox" value="quiet" id="quietScan" />Hide progress bar on uploading
                                </label>
                                <br />
                                <label>
                                    <input type="checkbox" value="directly" id="uploadDirectly" />Direct upload from file system
                                </label>
                            </div>-->
                        </div>
                        <div class="section" style="width:100%; float:left;">
                            <div>Uploaded Files</div>
                            <div id="resultWrap">
                                <table id='div-uploadedFile'>
                                </table>
                            </div>
                        </div>
                        <div>
                            <img src="{{mainResult.S3URL}}" width="50" height="50" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
