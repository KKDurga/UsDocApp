
<div class="app-row mt-0">
    <div class="form-inline new-call-design m-0">
        <div class="container-fluid">
            <div class="row ">
                <div class="cal_top month-calendar">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="tabs-header new-tabs">
                                <ul class="nav nav-tabs apptlist-left apptlist-calendar">
                                    <li ng-class="{active: activeEvent === 'day'}">
                                        <a href="javascript:;" class="appList" ng-model="calendarView" ng-click="loadCalenderEvent('day')">Day</a>
                                    </li>
                                    <li ng-class="{active: activeEvent === 'week'}">
                                        <a href="javascript:;" class="appList" ng-model="calendarView" ng-click="loadCalenderEvent('week')">Week</a>
                                    </li>
                                    <li ng-class="{active: activeEvent === 'month'}">
                                        <a href="javascript:;" class="appList" ng-model="calendarView" ng-click="loadCalenderEvent('month')">Month</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="col-md-6 app-r-row">
                            <div class="eHnote_appointmentDoc">
                                <div class="appointment-for mt-0">Appointments for <b>{{appointmentDocName=="All Doctors"?"":"Dr. "}}{{selectedDoctor.FullName}}</b> </div>
                            </div>
                            <ul class="claender-status clearfix">
                                <li>
                                    <p ng-bind="appCount.bookedCount"></p>
                                    <span>Booked</span>
                                </li>

                                <li>
                                    <p class="green" ng-bind="appCount.OngoingCount"></p>
                                    <span>OnGoing</span>
                                </li>
                                <li>
                                    <p class="orange" ng-bind="appCount.completedCount"></p>
                                    <span>Completed</span>
                                </li>
                                <li>
                                    <p ng-bind="appCount.SavedCount"></p>
                                    <span>Saved</span>
                                </li>
                                {{appCount.eventsCount}}
                            </ul>
                        </div>
                    </div>

                    <div class="row ">
                        <div class="col-lg-12">
                            <div class="table-responsive patient-table mt-10">
                                <table class="table table-bordered">
                                    <!--<tbody>
                                        <tr id="myTr">
                                           <td></td>
                                        <tr>

                                    <tbody>-->
                                    <tbody>
                                        <tr style="background-color: #f2f2f2;">
                                            <td></td>
                                            <td ng-repeat="doc in Calendardoctorlist">
                                                <table>
                                                    <tr>
                                                        <td>
                                                            {{doc.DoctorName}}
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>

                                        </tr>

                                        <tr ng-repeat="item in TimeSlotsList track by $index">
                                            <td style="background-color: #f8f8eb;">{{item.StartTime}}</td>
                                            <td ng-repeat="Ditem in Calendardoctorlist" class="Calendartb" ng-click="Booknewappointment(item,Ditem)">
                                                <table ng-repeat="sub in Ditem.SlotsList track by $index" ng-click="sub.DoctorId !==''?showPatientPopupClick(sub,$index):''"
                                                       ng-class="sub.DoctorId !==''? 'apptcolor':'apptcolor1'">
                                                    <!--ng-click="sub.DoctorId !==''?showPatientPopupClick(sub,$index):Booknewappointment(item,Ditem)"-->
                                                    <tr ng-if="sub.StartTime ==item.StartTime && Ditem.DoctorId==sub.DoctorId">
                                                        <td>
                                                            <b class="m-l-10">{{sub.PatientName}}</b>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>

                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>

                    
                </div>
            </div>

        </div>
    </div>
</div>

<script type="text/ng-template" id="Patienttemplatepopup.html">
    <div class="modal-header">
        <h4 class="modal-title">Patient Details</h4>
        <button type="button" class="btn btn-link" ng-click="Closetemplate()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
        <div class="row">
            <div class="col-lg-6">
                <label><b>Patient :</b>{{selectpatient.patientInfo.fullName}}</label>
            </div>
            <div class="col-lg-6">
                <label>
                    Allen Dennis
                </label>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-6">
                <label>{{selectpatient.patientInfo.Sex}} - {{selectpatient.patientInfo.AgeInYears}}Y</label>
            </div>
            <div class="col-lg-6">
                <label>{{selectpatient.StartTime}}</label>
            </div>
        </div>
        
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-danger" ng-click="CloseEditClaimPopup()">Cancel Appointment</button>
        <button type="button" class="btn primary-btn" ng-click="SaveEditClaim()">Reschedule Appointment</button>

    </div>

</script>
<style>
    .apptcolor {
        background-color: rgb(117, 126, 248);
        width: 100%;
    }

    .apptcolor1 {
        background-color: #ffffff;
        width: 100%;
    }
    /*    .Calendartb {
        padding: 0px !important;
    }*/
</style>
