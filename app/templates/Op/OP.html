
<div class="container-fluid optha-input h-100" ng-controller="EhnoteOpCtrl">
    
    <div class="row h-100" ng-show="UserAccessRights.SubAccessCategories.OPPatientDynamicStatus || UserAccessRights.SubAccessCategories.OPAppointmentsList||UserAccessRights.SubAccessCategories.OPInvestigationsList||UserAccessRights.SubAccessCategories.OPAllPatientsList||UserAccessRights.SubAccessCategories.OPDilationList||UserAccessRights.SubAccessCategories.OPFollowUpAppointmentsList">

        <div class="tab-content h-100">
            <div class="h-100" ng-if="Tab == 'appointments'">
                <!--<div ng-include="'templates/Op/appointments.html'"></div>-->
                <div class="h-100" ng-include="'templates/Op/Newappointments.html'"></div>
            </div>
            <div class="h-100" ng-if="Tab == 'AUDIT'">               
                <div class="h-100" ng-include="'templates/Op/UsOpAudit.html'"></div>
            </div>
            <div class="container-fluid height__100--" ng-if="Tab == 'GETCCDA'">
                <div class="height__100--">
                    <div ng-include="'templates/Op/CCDA.html'" class="height__100--"></div>
                </div>
            </div>
            <div class="container-fluid height__100-- bg__FFFFFF--" ng-if="Tab == 'AllTransactions'">
                <div class="height__100--">
                    <div ng-include="'templates/Op/allTransactions.html'" class="height__100--"></div>
                </div>
            </div>
            <div class="container-fluid" ng-if="Tab == 'teleappointments'">
                <div>
                    <div ng-include="'templates/Op/TeleAppointments.html'"></div>
                </div>
            </div>
            <div class="container-fluid h-100" ng-if="Tab == 'InsEligibility'">
                <div class="h-100 dis-flex flex-direction-column">
                    <div class="mt-10 h-100 dis-flex flex-direction-column" ng-include="'templates/consultation/Claims/PatientInsuranceList.html'"></div>
                </div>
            </div>
            <div class="container-fluid" ng-if="Tab == 'QManagement'">
                <div>
                    <div class="mt-10" ng-include="'templates/Op/QManagement.html'"></div>
                </div>
            </div>
            <div class="container-fluid" ng-if="Tab == 'AllPatients'">
                <div>
                    <div ng-include="'templates/Op/search.html'"></div>
                </div>
            </div>

            <div class="container-fluid" ng-if="Tab == 'DynamicStatus'">
                <div>
                    <div ng-include="'templates/Op/dynamicstatus.html'"></div>
                </div>
            </div>

            <div class="container-fluid" ng-if="Tab == 'dilation'" ng-controller="EhnoteNewAppointmentListCtrl as appControl">
                <div class="m-1-10" ng-include="'templates/Op/dilation.html'">
                    <div></div>
                </div>
            </div>




            <div class="col-lg-12" ng-if="Tab == 'investigations'" ng-include="'templates/Op/investigations.html'" ng-controller="EhnoteInvestigationsListCtrl">

            </div>

            <div class="container-fluid" ng-if="Tab == 'followup'" ng-controller="EhnoteFollowUpAppointmentListCtrl">
                <div>
                    <div ng-include="'templates/Op/followupappointmentlist.html'"></div>
                </div>
            </div>

            <div class="container-fluid height__100--" ng-if="Tab == 'PatientTracker'">
                <div class="height__100--">
                    <div class="height__100--" ng-include="'templates/Op/PatientTracker.html'"></div>
                </div>
            </div>

            <div class="container-fluid" ng-if="Tab == 'PreAuthorization'">
                <div>
                    <div ng-include="'templates/Op/OpPreAuthorization.html'"></div>
                </div>

            </div>
            <div class="container-fluid" ng-if="Tab == 'Rx'">
                <div>
                    <div class="mt-10" ng-include="'templates/Op/PatientRx.html'"></div>
                </div>
            </div>
            <div class="container-fluid" ng-if="Tab == 'Reminders'">
                <div>
                    <div class="mt-10" ng-include="'templates/Coordinator/CoordinatorFollowUp.html'"></div>
                </div>
            </div>

            <div class="container-fluid" ng-if="Tab == 'Scanner'">
                <div>
                    <div class="mt-10" ng-include="'templates/Op/DocumentScanner.html'"></div>
                </div>
            </div>
            <div class="container-fluid" ng-if="Tab == 'appointmentRequests'">
                <div>
                    <div ng-include="'templates/Op/AppointmentRequests.html'"></div>
                </div>
            </div>
            <div class="container-fluid" ng-if="Tab == 'QueueManagement'">
                <div>
                    <div ng-include="'templates/Op/QManagement.html'"></div>
                </div>
            </div>
            <div class="container-fluid h-100" ng-if="Tab == 'advancesearch'">
                <div class="h-100">
                    <div ng-include="'templates/ASC/AdvanceSearch.html'" class="h-100"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="row" ng-show="!UserAccessRights.SubAccessCategories.OPPatientDynamicStatus &&  !UserAccessRights.SubAccessCategories.OPAppointmentsList && !UserAccessRights.SubAccessCategories.OPInvestigationsList && !UserAccessRights.SubAccessCategories.OPAllPatientsList && !UserAccessRights.SubAccessCategories.OPDilationList && !UserAccessRights.SubAccessCategories.OPFollowUpAppointmentsList">
        <div class="billing-cominsoon text-center" style="margin: 80px 0px; color: rgb(179, 179, 179); font-size: 15px;">
            <img src="img/no-data/no-results-appointment.png">
            <div class="msg">
                <p class="goback-text">Access Denined</p>
                <p class="goback-text">
                    Please contact your administrator.
                </p>
            </div>
        </div>
    </div>

    <div class="p-5 p-t-0 p-r-0" ng-if="ShowNewPatientAdd">
        <div ng-include="'templates/UsNewConsultation/uibpopup/NewPatientRegisterPopup.html'" ng-controller="USNewPatientRegisterPopupCtrl"></div>
    </div>
</div>
