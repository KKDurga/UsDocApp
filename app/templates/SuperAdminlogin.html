
<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
<title>EHNOTE | Login</title>
<link rel="stylesheet" href="bower_components/bootstrap/dist/css/bootstrap.css">
<link rel="stylesheet" href="bower_components/bootstrap/dist/css/ui-bootstrap-0.14.3-csp.css">
<link type="text/css" rel="stylesheet" href="css/layout.css" />
<link href="css/login.css" rel="stylesheet" />
<div class="login-page authentication wrapper webapp-login" ng-controller="EhnoteSuperAdminLoginCtrl">
    <div class="login-section container-fluid p-0">
        <div class="">
            <div class="limiter">
                <div class="container-login100">
                    <div class="wrap-login100 bounceIn animated">
                        <div class="login100-form-title" style="background-image: url('img/bg-01.jpg');">
                            <span class="login100-form-title-1">
                                EHNOTE
                            </span>
                            <p><small class="text-white fs-15 let-space-3">LOGIN</small></p>
                        </div>
                        <form class="login100-form validate-form" name="validateUserForm" ng-submit="ValidateUser(validateUserForm,validateInfo)" novalidate>
                            <div class="wrap-input100 validate-input m-b-26" ng-class="{'has-error': validateUserForm.emailid.$invalid && validateUserForm.emailid.$dirty, 'has-success': validateUserForm.emailid.$valid }">
                                <span class="label-input100">Email ID</span>
                                <input class="input100 form-control" ng-pattern="emailpattern" name="emailid" ng-model="validateInfo.userName" type="email" placeholder="Email ID" required />
                                <span ng-show="validateUserForm.emailid.$invalid && !validateUserForm.emailid.$error.required" class="help-block">Enter a Valid Email Id</span>
                                <span ng-show="validateUserForm.emailid.$dirty && validateUserForm.emailid.$error.required" class="help-block">Email ID is required</span>
                            </div>
                            <div class="wrap-input100 validate-input m-b-18" ng-class="{'has-error': validateUserForm.password.$invalid && validateUserForm.password.$dirty, 'has-success': validateUserForm.password.$valid}" data-validate="Enter a Password">
                                <span class="label-input100">Password</span>
                                <input class="input100 form-control" name="password" ng-model="validateInfo.passWord" type="password" placeholder="Password" required />
                                <span ng-show="validateUserForm.password.$dirty && validateUserForm.password.$error.required" class="help-block">Password is required</span>
                            </div>
                            <div class="flex-sb-m w-full p-b-30 mt-10">
                                <div class="contact100-form-checkbox">
                                    <input class="input-checkbox100" id="ckb1" type="checkbox" name="remember-me" ng-true-value="'sure'" ng-false-value="'false'" ng-model="validateInfo.rememberMe">
                                    <label class="label-checkbox100" for="ckb1">
                                        Remember me
                                    </label>
                                </div>
                            </div>
                            <div class="container-login100-form-btn">

                                <button class="login100-form-btn btn" ng-disabled="validateUserForm.$invalid">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <footer class="login-footer-bottom">
                <div class="container-fluid clearfix login-footer-section">
                    <ul class="footer-copy text-center m-0">
                        <li><span>@ 2025 EHNOTE SOFTLABS (P) LTD. © Copyright | All Rights Reserved | </span></li>
                        <li><a href="https://ehnote.com/terms-of-services" target="_blank">Term and Conditions</a></li>
                        <li><a href="https://ehnote.com/privacy-policy" target="_blank">Privacy Policy</a></li>
                        <li><a href="mailto:info@ehnote.com">info@ehnote.com</a></li>
                        <li><span>Support: +1 (747) 222 6099</span></li>
                    </ul>
                </div>
            </footer>
        </div>
    </div>

    <script type="text/javascript">document.getElementById("year").textContent = new Date().getFullYear();</script>
</div>
